<script>
(function () {
  const { esc, md, api, laGAS, getLocation, linkTrang, ICONS, ganNutTheme, renderSlogan, ganThanhDieuHuongHS, ganNutLenDau } = window.H10;
  const boDau = window.H10.boDau || (s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase());
  function chuanTK(s) {
    return String(boDau(s) || '').toLowerCase();
  }
  const GH_LABS3D_BASE = 'https://hoangchu54.github.io/hoa10/labs3d/';
  document.getElementById('brand-ic').innerHTML = ICONS.lab;
  ganNutTheme(document.getElementById('btn-theme'));
  ganNutLenDau();

  const CHUONGS = [
    { id: '', ten: 'Tất cả (14 bài 3D)' },
    { id: 'C1', ten: 'C1 · Nguyên tử' },
    { id: 'C2', ten: 'C2 · Bảng tuần hoàn' },
    { id: 'C3', ten: 'C3 · Liên kết hóa học' },
    { id: 'C4', ten: 'C4 · Oxi hóa – Khử' },
    { id: 'C5', ten: 'C5 · Năng lượng' },
    { id: 'C6', ten: 'C6 · Tốc độ PƯ' },
    { id: 'C7', ten: 'C7 · Nhóm Halogen' }
  ];

  const LABS_3D = [
    { id: 'rutherford', file: 'rutherford3d.html', ch: 'C1', bai: 'Bài 1', ic: '🎯',
      ten: 'Bắn tia α của Rutherford 3D',
      moTa: 'Bắn chùm hạt α qua lá vàng mỏng, quan sát chớp huỳnh quang ZnS 360° và lực đẩy Coulomb ở góc phóng đại nguyên tử; đối chứng mô hình Thomson.' },
    { id: 'orbital', file: 'orbital3d.html', ch: 'C1', bai: 'Bài 3, 12', ic: '⚛️',
      ten: 'Orbital s, p, d & Xen phủ σ, π 3D',
      moTa: 'Đám mây xác suất lượng tử 5.200 hạt + mặt biên 90% cho 1s, 2s, 2p, 3d (cắt lát thấy nút 2s) và kéo 2 hạt nhân xem xen phủ trục σ / xen phủ bên π.' },
    { id: 'ngon-lua', file: 'ngonlua3d.html', ch: 'C1', bai: 'Bài 3, 4', ic: '🔥',
      ten: 'Thử màu Ngọn lửa & Quang phổ 3D',
      moTa: 'Đèn Bunsen 3D lửa GLSL, đốt 6 muối Li⁺, Na⁺, K⁺, Ca²⁺, Ba²⁺, Cu²⁺ + kính xanh Cobalt lọc ánh vàng Na⁺ + quang phổ vạch & chế độ đoán mẫu X.' },
    { id: 'kiem', file: 'kiem3d.html', ch: 'C2', bai: 'Bài 6, 9', ic: '💧',
      ten: 'Kim loại kiềm & kiềm thổ + Nước 3D',
      moTa: 'Gắp Li, Na, K từ lọ dầu hỏa, Mg, Ca thả chậu nước có sóng 3D, vệt hồng phenolphthalein đuổi đuôi, lửa tím hoa cà của K, bếp 80 °C & giải mã 3 mẫu ẩn.' },
    { id: 'luong-tinh', file: 'luongtinh3d.html', ch: 'C2', bai: 'Bài 7', ic: '🧪',
      ten: 'Tính lưỡng tính Al(OH)₃ & Mg(OH)₂ 3D',
      moTa: 'Pipet nhỏ giọt NaOH/HCl vào 2 ống AlCl₃ & MgCl₂ theo tỉ lệ mol thực: keo trắng Al(OH)₃ tan hết trong kiềm dư tạo Na[Al(OH)₄], còn Mg(OH)₂ không tan.' },
    { id: 'nacl', file: 'nacl3d.html', ch: 'C3', bai: 'Bài 11', ic: '💎',
      ten: 'Mạng tinh thể NaCl 3D (Rắn · Nóng chảy · Tan)',
      moTa: 'Khám phá số phối trí 6:6 hình bát diện, đun nóng chảy vượt 801 °C phá vỡ mạng và thả vào nước xem phân tử H₂O phân cực bóc tách tan hết tinh thể.' },
    { id: 'dan-dien', file: 'dandien3d.html', ch: 'C3', bai: 'Bài 11, 12', ic: '💡',
      ten: 'Thử tính dẫn điện (Ion vs Cộng hóa trị) 3D',
      moTa: 'Mạch điện 3D có công tắc, ampe kế kim quay, bóng đèn dây tóc sáng theo mẫu (nước cất, đường, NaCl rắn/dd, HCl, CH₃COOH) + chế độ soi dòng ion vi mô.' },
    { id: 'hydrogen', file: 'hydrogen3d.html', ch: 'C3', bai: 'Bài 13', ic: '❄️',
      ten: 'Liên kết Hydrogen & Nước đá nổi 3D',
      moTa: '54 phân tử H₂O định hướng mạng lục giác rỗng Ice Iₕ (D = 0,92 g/cm³) khi hạ về 0 °C, sụp đặc khi tan lỏng và bay tự do lúc sôi + cốc băng nổi.' },
    { id: 'oxh', file: 'oxh3d.html', ch: 'C4', bai: 'Bài 15, 16', ic: '✨',
      ten: 'Phản ứng Oxi hóa – Khử 3D (Cây bạc & Zn)',
      moTa: 'Nhúng dây Cu xoắn vào AgNO₃ mọc tinh thể bạc óng ánh & dd hóa xanh lam; nhúng lá Zn vào CuSO₄ lá kẽm mòn phủ đồng đỏ & dd mất màu xanh.' },
    { id: 'nhiet-luong-ke', file: 'enthalpy3d.html', ch: 'C5', bai: 'Bài 17, 18', ic: '🌡️',
      ten: 'Nhiệt lượng kế Tỏa nhiệt & Thu nhiệt 3D',
      moTa: 'Nhiệt kế điện tử 3D + đồ thị T(t): CaO + H₂O sôi 76 °C, HCl + NaOH tỏa nhiệt và Ba(OH)₂·8H₂O + NH₄Cl tụt −18 °C đóng băng dính chặt khối gỗ.' },
    { id: 'toc-do', file: 'tocdo3d.html', ch: 'C6', bai: 'Bài 19, 20', ic: '🎈',
      ten: 'Tốc độ phản ứng 3D (Bóng bay · Dấu X · MnO₂)',
      moTa: '3 phòng thực hành: CaCO₃ cục/bột & nồng độ HCl làm phồng 2 bóng bay, thí nghiệm dấu X biến mất ở 20 °C vs 60 °C, xúc tác MnO₂ phân hủy H₂O₂.' },
    { id: 'cl2-tay', file: 'cl2tay3d.html', ch: 'C7', bai: 'Bài 21', ic: '☁️',
      ten: 'Tính tẩy màu của khí Cl₂ ẩm (Tủ hút) 3D',
      moTa: 'Tủ hút khí độc có quạt quay thật, tự xịt nước làm ẩm giấy đỏ / quỳ tím / cánh hoa hồng / lá xanh đối chứng mẫu khô, xả sạch khí Cl₂ vàng lục vào ống hút.' },
    { id: 'iodine', file: 'iodine3d.html', ch: 'C7', bai: 'Bài 21', ic: '🔮',
      ten: 'Thăng hoa & Ngưng kết tinh thể Iodine (I₂) 3D',
      moTa: 'Đun tinh thể I₂ tím đen thăng hoa trực tiếp thành khói tím sang trọng, gặp bát đá lạnh kết tinh ngược thành chùm mũi kim ánh kim; nhấc bát soi cận.' },
    { id: 'halide', file: 'halide3d.html', ch: 'C7', bai: 'Bài 21, 22, 23', ic: '🧬',
      ten: 'Ống nghiệm Halide, Chiết 2 lớp & Giải mã 3D',
      moTa: '4 chế độ: AgNO₃ nhận biết F⁻/Cl⁻/Br⁻/I⁻ (hòa tan AgCl bằng NH₃, chiếu sáng UV), thế halogen & chiết tách 2 lớp Hexane, muối rắn + H₂SO₄ đặc, giải mã 4 lọ.' }
  ];

  LABS_3D.forEach(function (lb) {
    const raw = lb.id + ' ' + lb.ch + ' ' + lb.bai + ' ' + lb.ten + ' ' + lb.moTa;
    lb._search = raw.toLowerCase() + ' ' + chuanTK(raw);
  });

  const ALIAS = {
    'kiem-luong-tinh': 'kiem',
    'orbital-ms': 'orbital',
    'ong-nghiem': 'halide'
  };

  function urlFile3D(file) {
    return laGAS ? (GH_LABS3D_BASE + file) : ('labs3d/' + file);
  }

  function timLab(rawId, sub) {
    const clean = String(rawId || '').split('?')[0].trim().toLowerCase();
    if (!clean) return null;
    if (clean === 'kiem-luong-tinh' && sub === 'luong-tinh') {
      return LABS_3D.find(function (x) { return x.id === 'luong-tinh'; }) || null;
    }
    const mapped = ALIAS[clean] || clean;
    return LABS_3D.find(function (x) { return x.id === mapped; }) || null;
  }

  let curCh = '';
  let curTk = '';
  let curLab = null;
  let isEmbed = false;
  let pushedFromHub = false;
  let webUrl = laGAS ? (window.H10.GAS_EXEC_URL || '') : '';
  let caiDatTrang = {};
  let laFull = !document.documentElement.classList.contains('in-iframe');
  let loaderTimer = null;

  function parseRoute(locObj) {
    const p = (locObj && locObj.parameter) || {};
    if (p.full) laFull = true;
    const rawHash = (locObj && typeof locObj.hash === 'string' ? locObj.hash : (location.hash || '')).replace(/^#/, '');
    const qi = rawHash.indexOf('?');
    const hashId = qi >= 0 ? rawHash.slice(0, qi) : rawHash;
    const hashSub = qi >= 0 ? (new URLSearchParams(rawHash.slice(qi + 1)).get('sub') || '') : '';
    isEmbed = p.embed === '1' || new URLSearchParams(location.search).get('embed') === '1';
    document.body.classList.toggle('lab-embed', isEmbed);
    const id = hashId || p.id || new URLSearchParams(location.search).get('id') || '';
    const sub = hashSub || p.sub || new URLSearchParams(location.search).get('sub') || '';
    curLab = timLab(id, sub);
  }

  function veTopLinks() {
    const opt = {
      cfg: caiDatTrang,
      webUrl: laGAS ? (webUrl || window.H10.GAS_EXEC_URL || '') : '',
      laFull: laFull
    };
    ganThanhDieuHuongHS('thinghiem', opt);
    const map = [
      ['btn-home', linkTrang('home', opt)],
      ['btn-btvn', linkTrang('btvn', opt)],
      ['btn-tailieu', linkTrang('tailieu', opt)],
      ['btn-tn', linkTrang('thinghiem', opt)],
      ['btn-game', linkTrang('trochoi', opt)]
    ];
    map.forEach(function (pair) {
      const el = document.getElementById(pair[0]);
      if (!el) return;
      el.href = pair[1].href;
      el.target = pair[1].target;
      el.classList.remove('an');
    });
  }

  let isHubFs = false;

  function setHubFs(on, fromChild) {
    isHubFs = !!on;
    const wrap = document.getElementById('lab3d-wrap');
    if (wrap) wrap.classList.toggle('is-fs', isHubFs);
    if (isHubFs && wrap) {
      const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
      if (req) { try { req.call(wrap); } catch (_) {} }
    } else {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex && (document.fullscreenElement || document.webkitFullscreenElement)) {
        try { ex.call(document); } catch (_) {}
      }
    }
    const frame = document.getElementById('lab3d-iframe');
    if (!fromChild && frame && frame.contentWindow) {
      try { frame.contentWindow.postMessage({ type: 'h10-lab-fs-state', on: isHubFs }, '*'); } catch (_) {}
    }
  }

  function moLab(id) {
    const lab = timLab(id, '');
    if (!lab) return;
    if (isHubFs || document.fullscreenElement || document.webkitFullscreenElement) {
      setHubFs(false, false);
    }
    const wasAtHub = !curLab;
    curLab = lab;
    if (wasAtHub) {
      pushedFromHub = true;
      try {
        history.pushState({ h10Lab: lab.id, fromHub: true }, '', '#' + lab.id);
      } catch (_) {
        location.hash = lab.id;
      }
    } else {
      try {
        history.replaceState({ h10Lab: lab.id, fromHub: pushedFromHub }, '', '#' + lab.id);
      } catch (_) {
        location.hash = lab.id;
      }
    }
    ve();
  }

  function veSanh() {
    if (isHubFs || document.fullscreenElement || document.webkitFullscreenElement) {
      setHubFs(false, false);
    }
    if (pushedFromHub) {
      pushedFromHub = false;
      history.back();
      return;
    }
    curLab = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { location.hash = ''; }
    ve();
  }

  window.addEventListener('message', function (ev) {
    if (!ev || !ev.data || ev.data.type !== 'h10-lab-fs') return;
    const frame = document.getElementById('lab3d-iframe');
    if (!frame || ev.source !== frame.contentWindow) return;
    setHubFs(ev.data.on, true);
  });

  function onHubFsChange() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && isHubFs) {
      setHubFs(false, false);
    }
  }
  document.addEventListener('fullscreenchange', onHubFsChange);
  document.addEventListener('webkitfullscreenchange', onHubFsChange);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isHubFs) setHubFs(false, false);
  });

  function capNhatLuoiSanh() {
    const gridWrap = document.getElementById('hub3d-grid-wrap');
    if (!gridWrap) return;
    const qRaw = curTk.trim();
    const qNorm = chuanTK(qRaw);

    const xoaBtn = document.getElementById('hub3d-xoa-loc');
    if (xoaBtn) xoaBtn.classList.toggle('an', !(curCh || qRaw));

    document.querySelectorAll('[data-ch]').forEach(function (b) {
      b.classList.toggle('chinh', b.getAttribute('data-ch') === curCh);
    });

    const ds = LABS_3D.filter(function (x) {
      if (curCh && x.ch !== curCh) return false;
      if (qNorm && x._search.indexOf(qNorm) < 0) return false;
      return true;
    });

    if (!ds.length) {
      gridWrap.innerHTML = '<div class="the" style="margin-bottom:18px"><p class="phu" style="margin:0;text-align:center">Không tìm thấy phòng Lab 3D phù hợp với từ khóa.</p></div>';
      return;
    }

    gridWrap.innerHTML = '<div class="hub3d-grid">' +
      ds.map(function (lb) {
        const src = urlFile3D(lb.file);
        return '<article class="hub3d-card">' +
          '<div class="hub3d-top">' +
            '<div class="hub3d-ic" aria-hidden="true">' + lb.ic + '</div>' +
            '<div class="hub3d-meta">' +
              '<b>' + esc(lb.ten) + '</b>' +
              '<span class="phu" style="font-size:12px">🧊 3D Real-time · ' + esc(lb.bai) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="hub3d-desc">' + md(lb.moTa) + '</div>' +
          '<div class="hub3d-actions">' +
            '<button type="button" class="nut nho chinh" style="flex:1" data-open="' + esc(lb.id) + '">▶ Mở Phòng Lab 3D</button>' +
            '<a class="nut nho" href="' + esc(src) + '" target="h10_ngoai" rel="noopener" title="Mở riêng trên tab mới">↗</a>' +
          '</div>' +
        '</article>';
      }).join('') +
    '</div>';
  }

  function ve() {
    const app = document.getElementById('app');
    if (loaderTimer) { clearTimeout(loaderTimer); loaderTimer = null; }

    if (curLab) {
      isHubFs = false;
      document.body.classList.add('lab-viewing');
      const src = urlFile3D(curLab.file);
      app.className = 'lab3d-view';
      app.innerHTML =
        '<div class="lab3d-frame-wrap" id="lab3d-wrap">' +
          '<button type="button" class="lab3d-fs-exit" id="btn-exit-fs">✕ Thu nhỏ</button>' +
          '<div class="lab3d-bar">' +
            '<div class="lab3d-bar-l">' +
              '<button type="button" class="nut nho" id="btn-back-hub">← Sảnh</button>' +
              '<select id="sel-lab3d" aria-label="Chuyển nhanh phòng lab 3D">' +
                LABS_3D.map(function (lb, idx) {
                  return '<option value="' + esc(lb.id) + '"' + (lb.id === curLab.id ? ' selected' : '') + '>' +
                    (idx + 1) + '. ' + esc(lb.bai) + ' · ' + esc(lb.ten) + '</option>';
                }).join('') +
              '</select>' +
            '</div>' +
            '<div class="hang-nut" style="gap:5px;flex-shrink:0">' +
              '<a class="nut nho" href="' + esc(src) + '" target="h10_ngoai" rel="noopener" title="Mở riêng file Lab 3D trên tab mới">↗ <span class="fs-lbl">Tab riêng</span></a>' +
              '<button type="button" class="nut nho chinh" id="btn-hub-fs" title="Mở toàn màn hình tại chỗ">⛶ <span class="fs-lbl">Toàn màn hình</span></button>' +
            '</div>' +
          '</div>' +
          '<div class="lab3d-stage">' +
            '<div class="lab3d-loader" id="lab3d-loader" aria-hidden="true"><span class="cho" style="width:24px;height:24px;border-width:2.5px;color:#A78BFA"></span><span>Đang nạp không gian 3D...</span></div>' +
            '<iframe class="lab3d-iframe" id="lab3d-iframe" src="' + esc(src) + '" title="' + esc(curLab.ten) + '" allowfullscreen allow="fullscreen; autoplay"></iframe>' +
          '</div>' +
        '</div>';
      document.title = curLab.ten + ' – Hóa 10';
      const loaderEl = document.getElementById('lab3d-loader');
      const frameEl = document.getElementById('lab3d-iframe');
      const anLoader = function () { if (loaderEl) loaderEl.classList.add('xong'); };
      loaderTimer = setTimeout(anLoader, 3500);
      if (frameEl) frameEl.addEventListener('load', anLoader);

      const backBtn = document.getElementById('btn-back-hub');
      if (backBtn) backBtn.onclick = veSanh;
      const sel = document.getElementById('sel-lab3d');
      if (sel) sel.onchange = function () { moLab(this.value); };
      const fsBtn = document.getElementById('btn-hub-fs');
      if (fsBtn) fsBtn.onclick = function () { setHubFs(!isHubFs, false); };
      const exitBtn = document.getElementById('btn-exit-fs');
      if (exitBtn) exitBtn.onclick = function () { setHubFs(false, false); };
      return;
    }

    document.body.classList.remove('lab-viewing');
    document.title = '14 Phòng Lab 3D Hóa 10 – Thầy Hoàng';
    app.className = 'khung-chinh';
    app.innerHTML =
      '<div class="hero-box art-flask" style="margin-bottom:14px">' +
        '<span class="chip chinh">🧊 14 PHÒNG THÍ NGHIỆM 3D REAL-TIME · TIẾNG VIỆT</span>' +
        '<h1>Sảnh Phòng Lab 3D Hóa Học 10</h1>' +
        '<p class="phu" style="margin:0">Xoay 360°, trực tiếp nhỏ giọt, gắp hóa chất, bật bếp, chiếu sáng và quan sát hiện tượng chuẩn SGK Kết nối tri thức.</p>' +
      '</div>' +
      '<div class="hub3d-toolbar">' +
        '<div class="hub3d-search-row">' +
          '<input id="hub3d-tk" type="search" aria-label="Tìm phòng Lab 3D" placeholder="Tìm nhanh Lab 3D (gõ có dấu hoặc không dấu: ngọn lửa, NaCl, AgCl, tốc độ, orbital...)..." value="' + esc(curTk) + '">' +
          '<button type="button" class="nut nho xoa' + ((curCh || curTk.trim()) ? '' : ' an') + '" id="hub3d-xoa-loc">Xóa lọc</button>' +
        '</div>' +
        '<div class="hub3d-chips chip-scroll">' +
          CHUONGS.map(function (c) {
            return '<button type="button" class="nut nho ' + (curCh === c.id ? 'chinh' : '') + '" data-ch="' + esc(c.id) + '">' + esc(c.ten) + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div id="hub3d-grid-wrap"></div>' +
      '<div id="slogan-slot"></div>';

    capNhatLuoiSanh();
    renderSlogan(document.getElementById('slogan-slot'));

    const inp = document.getElementById('hub3d-tk');
    if (inp) {
      inp.addEventListener('input', function () {
        curTk = this.value;
        capNhatLuoiSanh();
      });
    }
    const xoaBtn = document.getElementById('hub3d-xoa-loc');
    if (xoaBtn) {
      xoaBtn.onclick = function () {
        curCh = '';
        curTk = '';
        if (inp) inp.value = '';
        capNhatLuoiSanh();
      };
    }
  }

  document.getElementById('app').addEventListener('click', function (e) {
    const chBtn = e.target.closest('[data-ch]');
    if (chBtn) {
      curCh = chBtn.getAttribute('data-ch') || '';
      capNhatLuoiSanh();
      return;
    }
    const openBtn = e.target.closest('[data-open]');
    if (openBtn) {
      moLab(openBtn.getAttribute('data-open'));
    }
  });

  function dongBoLichSu(ev) {
    const prevId = curLab ? curLab.id : '';
    parseRoute({ parameter: {}, hash: location.hash });
    if (!curLab) {
      pushedFromHub = false;
    } else if (ev && ev.state && ev.state.fromHub) {
      pushedFromHub = true;
    }
    const nextId = curLab ? curLab.id : '';
    if (prevId !== nextId) {
      if (isHubFs || document.fullscreenElement || document.webkitFullscreenElement) {
        setHubFs(false, false);
      }
      ve();
    }
  }

  window.addEventListener('popstate', dongBoLichSu);
  window.addEventListener('hashchange', function () { dongBoLichSu(null); });

  veTopLinks();
  getLocation(function (locObj) {
    parseRoute(locObj);
    veTopLinks();
    ve();
  });
  if (laGAS) {
    api('tnKhoiDong').then(function (r) {
      if (!r) return;
      if (r.webUrl) webUrl = r.webUrl;
      if (r.caiDatTrang) caiDatTrang = r.caiDatTrang;
      veTopLinks();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
