      { key: 'CaCl2', ion: 'Ca²⁺', ten: 'Calcium chloride', mauTen: 'Đỏ cam', col: '#F97316', core: '#FED7AA', lam: '622 nm', lines: [423, 559, 622] },
      { key: 'BaCl2', ion: 'Ba²⁺', ten: 'Barium chloride', mauTen: 'Lục vàng', col: '#84CC16', core: '#ECFCCB', lam: '524 nm', lines: [514, 524, 553] },
      { key: 'CuCl2', ion: 'Cu²⁺', ten: 'Copper(II) chloride', mauTen: 'Xanh lục', col: '#10B981', core: '#A7F3D0', lam: '510 nm', lines: [510, 522, 578] }
    ];
    let airOpen = true, activeSalt = SALTS[0], burning = true, mystery = SALTS[Math.floor(Math.random() * SALTS.length)], tAnim = 0;

    buildToolbar(mainEl, meta, curSub, {
      hasMicro: true,
      onSub: function (ns) { window.location.hash = '#ngon-lua?sub=' + ns; },
      onMicro: function (b) {
        microOn = !microOn; b.classList.toggle('tim', microOn);
        const ml = document.getElementById('lh-nl-micro');
        if (ml) ml.classList.toggle('on', microOn);
      },
      onReset: function () { mountLab('ngon-lua', curSub); }
    });

    const host = document.createElement('div');
    mainEl.appendChild(host);
    host.innerHTML =
      '<div class="lh-stage-grid">' +
        '<div>' +
          '<div class="lh-viewport" style="height:350px">' +
            '<div class="lh-hud-top">' +
              '<div class="lh-hud-badge" id="lh-nl-hud">Màu ngọn lửa: Đỏ tía (Li⁺)</div>' +
              '<div class="hang-nut" style="pointer-events:auto">' +
                '<button type="button" class="nut nho tim" id="lh-nl-air">🌀 Lỗ gió: MỞ (lửa chuẩn)</button>' +
                '<button type="button" class="nut nho" id="lh-nl-clean">🧼 Rửa dây Pt (HCl)</button>' +
              '</div>' +
            '</div>' +
            '<canvas id="lh-nl-cv" style="width:100%;height:100%"></canvas>' +
            '<div class="lh-micro-lens" id="lh-nl-micro"><canvas id="lh-nl-mcv"></canvas><div class="lh-micro-cap">Bước nhảy electron</div></div>' +
          '</div>' +
          '<div class="lh-card" style="margin-top:10px">' +
            '<h3>🌈 Dải vạch Quang phổ phát xạ (380 – 780 nm)</h3>' +
            '<canvas id="lh-nl-spec" style="width:100%;height:46px;border-radius:8px;background:#090D16;display:block"></canvas>' +
          '</div>' +
        '</div>' +
        '<div class="lh-panel">' +
          '<div class="lh-card">' +
            (curSub === 'thu'
              ? '<h3>🔥 Chọn muối kim loại đưa lên ngọn lửa Bunsen</h3><div class="lh-pills" id="lh-nl-salts"></div>'
              : '<h3>🎯 Thử thách: Đoán muối bí ẩn từ màu ngọn lửa</h3>' +
                '<div class="phu" style="margin-bottom:8px">Quan sát ngọn lửa đang đốt mẫu <b>X</b> ở bên trái rồi chọn đúng ion kim loại:</div>' +
                '<div class="lh-pills" id="lh-nl-guess"></div>' +
                '<div id="lh-nl-gres" style="margin-top:8px"></div>') +
          '</div>' +
          '<div class="lh-card">' +
            '<h3>⚛️ Bản chất phát xạ (Bài 3 – Lớp vỏ electron)</h3>' +
            '<div class="lh-eq" id="lh-nl-info"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    function drawSpectrum() {
      const sCv = host.querySelector('#lh-nl-spec');
      const b = fitCanvas(sCv, 40);
      const ctx = b.ctx; if (!ctx) return;
      ctx.fillStyle = '#090D16'; ctx.fillRect(0, 0, b.w, b.h);
      const s = curSub === 'bi-an' ? mystery : activeSalt;
      if (burning && airOpen && s) {
        s.lines.forEach(function (nm) {
          const x = ((nm - 380) / 400) * (b.w - 30) + 15;
          ctx.strokeStyle = s.col; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(x, 6); ctx.lineTo(x, b.h - 14); ctx.stroke();
          ctx.fillStyle = '#E2E8F0'; ctx.font = '700 10px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(nm + 'nm', x, b.h - 3);
        });
      }
    }

    function updateFlameInfo() {
      const s = curSub === 'bi-an' ? mystery : activeSalt;
      const hud = host.querySelector('#lh-nl-hud');
      const info = host.querySelector('#lh-nl-info');
      if (!airOpen) {
        hud.textContent = '⚠️ Lỗ gió ĐÓNG: ngọn lửa vàng cháy không hoàn toàn — hãy mở lỗ gió!';
      } else if (!burning) {
        hud.textContent = 'Đã rửa sạch dây Platinum trong HCl · Ngọn lửa nền xanh nhạt';
      } else if (curSub === 'bi-an') {
        hud.textContent = 'Đang đốt mẫu muối bí ẩn X — màu: ' + s.mauTen;
      } else {
        hud.textContent = s.key + ' (' + s.ion + ') → Ngọn lửa màu ' + s.mauTen + ' (λ ≈ ' + s.lam + ')';
      }
      info.innerHTML = curSub === 'bi-an'
        ? 'Khi đốt nóng, electron nhảy lên mức năng lượng cao rồi trở về trạng thái cơ bản, phát ra photon có bước sóng đặc trưng (<b>' + esc(s.lam) + '</b>).'
        : '<b>' + esc(s.key) + ' (' + esc(s.ten) + '):</b> Ion <b>' + esc(s.ion) + '</b> cho ngọn lửa màu <b>' + esc(s.mauTen) + '</b> (λ ≈ ' + esc(s.lam) + ').';
      drawSpectrum();
    }

    if (curSub === 'thu') {
      host.querySelector('#lh-nl-salts').innerHTML = SALTS.map(function (s) {
        return '<button type="button" class="lh-pill-btn' + (s.key === activeSalt.key ? ' on' : '') + '" data-s="' + s.key + '">' + esc(s.key) + ' (' + esc(s.ion) + ')</button>';
      }).join('');
      host.querySelectorAll('[data-s]').forEach(function (b) {
        b.onclick = function () {
          SoundFX.ignite(); burning = true;
          activeSalt = SALTS.find(function (x) { return x.key === b.getAttribute('data-s'); });
          host.querySelectorAll('[data-s]').forEach(function (x) { x.classList.toggle('on', x === b); });
          updateFlameInfo();
        };
      });
    } else {
      host.querySelector('#lh-nl-guess').innerHTML = SALTS.map(function (s) {
        return '<button type="button" class="lh-pill-btn" data-g="' + s.key + '">' + esc(s.ion) + ' (' + esc(s.key) + ')</button>';
      }).join('') + '<button type="button" class="nut nho" id="lh-nl-next">🔀 Mẫu khác</button>';
      host.querySelectorAll('[data-g]').forEach(function (b) {
        b.onclick = function () {
          const g = b.getAttribute('data-g');
          const res = host.querySelector('#lh-nl-gres');
          if (g === mystery.key) {
            SoundFX.win(); phaoGiay(50);
            res.innerHTML = '<div class="thongbao ok" style="margin:0"><b>Chính xác!</b> Mẫu X là <b>' + esc(mystery.key) + '</b> (' + esc(mystery.mauTen) + ').</div>';
          } else {
            SoundFX.error();
            res.innerHTML = '<div class="thongbao canh" style="margin:0">Chưa đúng! Ngọn lửa này có màu <b>' + esc(mystery.mauTen) + '</b> (λ ≈ ' + esc(mystery.lam) + ').</div>';
          }
        };
      });
      host.querySelector('#lh-nl-next').onclick = function () {
        SoundFX.ignite(); burning = true;
        mystery = SALTS[Math.floor(Math.random() * SALTS.length)];
        host.querySelector('#lh-nl-gres').innerHTML = '';
        updateFlameInfo();
      };
    }

    host.querySelector('#lh-nl-air').onclick = function () {
      airOpen = !airOpen; SoundFX.click();
      this.textContent = airOpen ? '🌀 Lỗ gió: MỞ (lửa chuẩn)' : '⚠️ Lỗ gió: ĐÓNG (lửa vàng)';
      this.classList.toggle('tim', airOpen);
      updateFlameInfo();
    };
    host.querySelector('#lh-nl-clean').onclick = function () {
      SoundFX.drop(); burning = false; updateFlameInfo();
    };
    updateFlameInfo();

    scope.loop(function (dt) {
      tAnim += dt * (REDUCED_MOTION ? 0.5 : 4);
      const b = fitCanvas(host.querySelector('#lh-nl-cv'));
      const ctx = b.ctx; if (!ctx) return;
      ctx.clearRect(0, 0, b.w, b.h);
      const bx = b.w * 0.5, baseY = b.h - 46;
      // Đèn khí Bunsen
      ctx.fillStyle = '#64748B'; ctx.fillRect(bx - 42, baseY + 12, 84, 14);
      ctx.fillStyle = '#94A3B8'; ctx.fillRect(bx - 12, baseY - 96, 24, 108);
      ctx.fillStyle = airOpen ? '#38BDF8' : '#475569';
      ctx.fillRect(bx - 14, baseY - 24, 28, 12);

      // Ngọn lửa bập bùng 3 lớp
      const fTop = baseY - 96;
      const sway = Math.sin(tAnim * 2.2) * 5;
      const s = curSub === 'bi-an' ? mystery : activeSalt;
      let outerCol = airOpen ? 'rgba(56,189,248,0.45)' : 'rgba(245,158,11,0.85)';
      let innerCol = airOpen ? 'rgba(147,197,253,0.9)' : 'rgba(253,224,71,0.95)';
      if (airOpen && burning && s) {
        outerCol = hexToRgba(s.col, 0.85);
        innerCol = s.core;
      }
      ctx.save();
      ctx.shadowColor = outerCol; ctx.shadowBlur = 24;
      ctx.fillStyle = outerCol;
      ctx.beginPath();
      ctx.moveTo(bx - 22, fTop);
      ctx.bezierCurveTo(bx - 34, fTop - 65, bx + sway, fTop - 135, bx + sway, fTop - 155);
      ctx.bezierCurveTo(bx + sway, fTop - 135, bx + 34, fTop - 65, bx + 22, fTop);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = innerCol;
      ctx.beginPath();
      ctx.moveTo(bx - 10, fTop);
      ctx.bezierCurveTo(bx - 14, fTop - 42, bx + sway * 0.5, fTop - 85, bx + sway * 0.5, fTop - 98);
      ctx.bezierCurveTo(bx + sway * 0.5, fTop - 85, bx + 14, fTop - 42, bx + 10, fTop);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      // Dây Platinum nhúng vào vùng nóng nhất
      ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(bx - 130, fTop - 10); ctx.lineTo(bx - 4, fTop - 65); ctx.stroke();
      ctx.beginPath(); ctx.arc(bx, fTop - 67, 5, 0, Math.PI * 2); ctx.stroke();

      if (microOn) {
        const mb = fitCanvas(host.querySelector('#lh-nl-mcv'));
        const mx = mb.ctx; if (!mx) return;
        mx.clearRect(0, 0, mb.w, mb.h);
        const cx = mb.w / 2, cy = mb.h / 2 - 4;
        [18, 36, 52].forEach(function (r) {
          mx.strokeStyle = 'rgba(148,163,184,0.35)'; mx.lineWidth = 1.4;
          mx.beginPath(); mx.arc(cx, cy, r, 0, Math.PI * 2); mx.stroke();
        });
        mx.fillStyle = '#EF4444'; mx.beginPath(); mx.arc(cx, cy, 6, 0, Math.PI * 2); mx.fill();
        const phase = (tAnim * 0.45) % 2;
        const rE = phase < 1 ? 18 + phase * 34 : 52 - (phase - 1) * 34;
        const ang = tAnim * 0.8;
        mx.fillStyle = (phase > 1 && burning && s) ? s.col : '#38BDF8';
        mx.beginPath(); mx.arc(cx + Math.cos(ang) * rE, cy + Math.sin(ang) * rE, 5, 0, Math.PI * 2); mx.fill();
      }
    });
  }

  /* ============================================================================
   * LAB 6: THỬ ĐÈN LED DẪN ĐIỆN HỢP CHẤT ION VS CỘNG HÓA TRỊ (dan-dien · Bài 11, 14)
   * ============================================================================ */
  function mountDanDienLab(mainEl, scope) {
    const meta = LAB_LIST[5];
    let microOn = true;
    const SAMPLES = [
      { id: 'nacl_s', ten: 'NaCl rắn khan', state: 'solid', conduct: false, ma: 0, pt: 'NaCl(s): Ion Na⁺, Cl⁻ bị khóa chặt trong mạng tinh thể (6:6)', desc: 'Ở trạng thái rắn khan, các ion Na⁺ và Cl⁻ chỉ dao động tại chỗ nên **không dẫn điện (Đèn TẮT)**.', mode: 'lattice' },
      { id: 'nacl_l', ten: 'NaCl nóng chảy (> 801 °C)', state: 'molten', conduct: true, ma: 480, pt: 'NaCl(l) → Na⁺ + Cl⁻ (tự do chuyển động)', desc: 'Khi đun nóng chảy (> 801 °C), mạng tinh thể bị phá vỡ, các ion **Na⁺ và Cl⁻ tự do di chuyển** → **Đèn SÁNG RỰC**!', mode: 'ions' },
      { id: 'nacl_aq', ten: 'Dung dịch NaCl (aq)', state: 'aq', conduct: true, ma: 420, pt: 'NaCl(s) --(H2O)--> Na⁺(aq) + Cl⁻(aq) (sự điện li)', desc: 'Các phân tử nước tách ion Na⁺, Cl⁻ khỏi tinh thể giúp ion bơi tự do → **Đèn SÁNG RỰC**!', mode: 'ions' },
      { id: 'h2o', ten: 'Nước cất nguyên chất H₂O', state: 'aq', conduct: false, ma: 0, pt: 'H2O(l) — phân tử trung hòa', desc: 'Nước cất hầu như không chứa ion tự do → **Đèn TẮT**.', mode: 'neutral' },
      { id: 'sugar', ten: 'Dung dịch Đường C₁₂H₂₂O₁₁', state: 'aq', conduct: false, ma: 0, pt: 'C12H22O11(s) + H2O → C12H22O11(aq) (phân tử)', desc: 'Đường tan nhưng **không phân li thành ion**, chỉ tạo các phân tử trung hòa → **Đèn TẮT**!', mode: 'neutral' },
      { id: 'eth', ten: 'Dung dịch Ethanol C₂H₅OH', state: 'aq', conduct: false, ma: 0, pt: 'C2H5OH(l) + H2O → C2H5OH(aq)', desc: 'Liên kết CHT bền, không điện li thành ion → **Đèn TẮT**.', mode: 'neutral' },
      { id: 'hcl', ten: 'Dung dịch HCl (aq)', state: 'aq', conduct: true, ma: 450, pt: 'HCl(g) + H2O → H⁺(aq) + Cl⁻(aq)', desc: 'HCl là hợp chất CHT phân cực mạnh, khi tan vào nước phân li hoàn toàn thành ion H⁺ và Cl⁻ → **Đèn SÁNG RỰC**!', mode: 'ions' }
    ];
    let sel = SAMPLES[0], swOn = true, tPhase = 0;

    buildToolbar(mainEl, meta, '', {
      hasMicro: true, microOn: true,
      onMicro: function (b) {
        microOn = !microOn; b.classList.toggle('tim', microOn);
        const ml = document.getElementById('lh-dd-micro');
        if (ml) ml.classList.toggle('on', microOn);
      },
      onReset: function () { mountLab('dan-dien', ''); }
    });

    const host = document.createElement('div');
    mainEl.appendChild(host);
    host.innerHTML =
      '<div class="lh-stage-grid">' +
        '<div class="lh-viewport" style="height:375px">' +
          '<div class="lh-hud-top">' +
            '<div class="lh-hud-badge" id="lh-dd-hud">Ampe kế: 0 mA · Đèn TẮT</div>' +
            '<div class="hang-nut" style="pointer-events:auto">' +
              '<button type="button" class="nut nho chinh" id="lh-dd-sw">⚡ Công tắc: ĐÓNG</button>' +
              '<button type="button" class="nut nho an" id="lh-dd-melt">🔥 Đun nóng chảy (&gt; 801 °C)</button>' +
            '</div>' +
          '</div>' +
          '<canvas id="lh-dd-cv" style="width:100%;height:100%"></canvas>' +
          '<div class="lh-micro-lens on" id="lh-dd-micro"><canvas id="lh-dd-mcv"></canvas><div class="lh-micro-cap" id="lh-dd-mcap">Cấp độ ion/phân tử</div></div>' +
        '</div>' +
        '<div class="lh-panel">' +
          '<div class="lh-card">' +
            '<h3>🔌 Chọn mẫu thử cắm vào điện cực</h3>' +
            '<div class="lh-pills" id="lh-dd-list"></div>' +
          '</div>' +
          '<div class="lh-card">' +
            '<h3>💡 Kết quả &amp; Giải thích bản chất (Bài 11)</h3>' +
            '<div class="lh-metrics" style="margin-bottom:8px">' +
              '<div class="lh-stat"><span>Đèn LED</span><b id="lh-dd-led">TẮT</b></div>' +
              '<div class="lh-stat"><span>Cường độ I</span><b id="lh-dd-ma">0 mA</b></div>' +
            '</div>' +
            '<div class="lh-eq" id="lh-dd-eq"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    const mPts = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        mPts.push({ r: r, c: c, x: 0.24 + c * 0.17, y: 0.24 + r * 0.16, vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2, kind: (r + c) % 2 });
      }
    }

    function syncDd() {
      host.querySelector('#lh-dd-list').innerHTML = SAMPLES.map(function (s) {
        return '<button type="button" class="lh-pill-btn' + (s.id === sel.id ? ' on' : '') + '" data-s="' + s.id + '">' + esc(s.ten) + '</button>';
      }).join('');
      host.querySelectorAll('#lh-dd-list [data-s]').forEach(function (b) {
        b.onclick = function () { SoundFX.click(); sel = SAMPLES.find(function (x) { return x.id === b.getAttribute('data-s'); }); syncDd(); };
      });
      const meltBtn = host.querySelector('#lh-dd-melt');
      meltBtn.classList.toggle('an', sel.id !== 'nacl_s' && sel.id !== 'nacl_l');
      meltBtn.textContent = sel.id === 'nacl_l' ? '❄️ Làm nguội về NaCl rắn' : '🔥 Đun nóng chảy (> 801 °C)';

      const lit = swOn && sel.conduct;
      host.querySelector('#lh-dd-hud').textContent = 'Ampe kế: ' + (lit ? sel.ma : 0) + ' mA · ' + (lit ? 'Đèn SÁNG RỰC' : 'Đèn TẮT');
      host.querySelector('#lh-dd-led').textContent = lit ? '💡 SÁNG RỰC' : 'TẮT';
      host.querySelector('#lh-dd-ma').textContent = (lit ? sel.ma : 0) + ' mA';
      host.querySelector('#lh-dd-eq').innerHTML = '<b>' + md(sel.pt) + '</b><div style="margin-top:4px">' + md(sel.desc) + '</div>';
      host.querySelector('#lh-dd-mcap').textContent = sel.mode === 'lattice' ? 'Ion khóa cứng 6:6' : sel.mode === 'ions' ? 'Ion dịch chuyển có hướng' : 'Phân tử trung hòa';
    }

    host.querySelector('#lh-dd-sw').onclick = function () {
      swOn = !swOn; SoundFX.click();
      this.textContent = swOn ? '⚡ Công tắc: ĐÓNG' : '⚡ Công tắc: MỞ';
      this.classList.toggle('chinh', swOn);
      syncDd();
    };
    host.querySelector('#lh-dd-melt').onclick = function () {
      SoundFX.ignite();
      sel = SAMPLES.find(function (x) { return x.id === (sel.id === 'nacl_l' ? 'nacl_s' : 'nacl_l'); });
      syncDd();
    };
    syncDd();

    scope.loop(function (dt) {
      tPhase += dt;
      const lit = swOn && sel.conduct;
      const b = fitCanvas(host.querySelector('#lh-dd-cv'));
      const ctx = b.ctx; if (!ctx) return;
      ctx.clearRect(0, 0, b.w, b.h);
      const sc = Math.min(b.w / 520, b.h / 350);
      ctx.save();
      ctx.translate((b.w - 520 * sc) / 2, (b.h - 350 * sc) / 2);
      ctx.scale(sc, sc);
      const cx = microOn ? 205 : 260;
      const cy = 222;
      // Nguồn 6V & bóng đèn LED
      ctx.fillStyle = '#334155'; ctx.fillRect(cx - 135, 76, 62, 42);
      ctx.fillStyle = '#F8FAFC'; ctx.font = '800 12px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('DC 6V', cx - 104, 101);
      // Dây dẫn
      ctx.strokeStyle = lit ? '#FACC15' : '#94A3B8'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - 73, 94); ctx.lineTo(cx - 26, 94);
      ctx.moveTo(cx + 26, 94); ctx.lineTo(cx + 42, 94); ctx.lineTo(cx + 42, cy - 34);
      ctx.moveTo(cx - 104, 118); ctx.lineTo(cx - 104, 146); ctx.lineTo(cx - 42, 146); ctx.lineTo(cx - 42, cy - 34);
      ctx.stroke();

      // Bóng đèn LED
      ctx.save();
      if (lit) { ctx.shadowColor = '#FACC15'; ctx.shadowBlur = 32; }
      ctx.fillStyle = lit ? '#FDE047' : 'rgba(226,232,240,0.22)';
      ctx.beginPath(); ctx.arc(cx, 94, 24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();

      // Cốc / Chén nung & chất lỏng
      ctx.fillStyle = sel.state === 'solid' ? 'rgba(248,250,252,0.75)' : sel.state === 'molten' ? 'rgba(251,146,60,0.45)' : 'rgba(186,230,253,0.34)';
      ctx.fillRect(cx - 78, cy - 10, 156, 78);
      ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx - 80, cy - 36); ctx.lineTo(cx - 80, cy + 70); ctx.lineTo(cx + 80, cy + 70); ctx.lineTo(cx + 80, cy - 36); ctx.stroke();

      // 2 điện cực than chì
      ctx.fillStyle = '#1E293B';
      ctx.fillRect(cx - 48, cy - 36, 12, 84);
      ctx.fillRect(cx + 36, cy - 36, 12, 84);
      ctx.fillStyle = '#F8FAFC'; ctx.font = '800 12px "Be Vietnam Pro",sans-serif';
      ctx.fillText('−', cx - 42, cy - 42); ctx.fillText('+', cx + 42, cy - 42);

      // Đèn đun nóng chảy nếu ở trạng thái molten
      if (sel.state === 'molten') {
        ctx.fillStyle = 'rgba(249,115,22,0.88)';
        ctx.beginPath(); ctx.moveTo(cx - 18, cy + 94); ctx.quadraticCurveTo(cx, cy + 62, cx + 18, cy + 94); ctx.fill();
      }
      ctx.restore();

      if (microOn) {
        const mb = fitCanvas(host.querySelector('#lh-dd-mcv'));
        const mx = mb.ctx; if (!mx) return;
        mx.clearRect(0, 0, mb.w, mb.h);
        mPts.forEach(function (pt) {
          let px, py;
          if (sel.mode === 'lattice') {
            px = (0.24 + pt.c * 0.17) * mb.w + (REDUCED_MOTION ? 0 : Math.sin(tPhase * 12 + pt.c) * 1.6);
            py = (0.24 + pt.r * 0.16) * mb.h + (REDUCED_MOTION ? 0 : Math.cos(tPhase * 12 + pt.r) * 1.6);
          } else {
            const drift = (lit && sel.mode === 'ions') ? (pt.kind ? -0.18 : 0.18) : 0;
            pt.x += (pt.vx + drift) * dt; pt.y += pt.vy * dt;
            if (pt.x < 0.1) pt.x = 0.88; if (pt.x > 0.9) pt.x = 0.12;
            if (pt.y < 0.14 || pt.y > 0.78) pt.vy *= -1;
            px = pt.x * mb.w; py = pt.y * mb.h;
          }
          if (sel.mode === 'neutral') {
            mx.fillStyle = '#94A3B8';
            mx.beginPath(); mx.arc(px, py, 7, 0, Math.PI * 2); mx.fill();
          } else {
            mx.fillStyle = pt.kind ? '#A855F7' : '#22C55E';
            mx.beginPath(); mx.arc(px, py, 8, 0, Math.PI * 2); mx.fill();
            mx.fillStyle = '#fff'; mx.font = '800 9px sans-serif'; mx.textAlign = 'center'; mx.textBaseline = 'middle';
            mx.fillText(pt.kind ? '+' : '−', px, py);
          }
        });
      }
    });
  }

  /* ============================================================================
   * LAB 7: ĐIỀN Ô ORBITAL (↑↓) & MÁY PHỔ KHỐI LƯỢNG MS (orbital-ms · Bài 2, 3, 4)
   * ============================================================================ */
  function mountOrbitalMsLab(mainEl, scope, sub) {
    const meta = LAB_LIST[6];
    let curSub = sub === 'ms' ? 'ms' : 'orbital';
    buildToolbar(mainEl, meta, curSub, {
      onSub: function (ns) { window.location.hash = '#orbital-ms?sub=' + ns; },
      onReset: function () { mountLab('orbital-ms', curSub); }
    });
    const host = document.createElement('div');
    mainEl.appendChild(host);

    if (curSub === 'orbital') {
      const ELS = [
        [1,'H','pk'],[2,'He','kh'],[3,'Li','kl'],[4,'Be','kl'],[5,'B','pk'],[6,'C','pk'],[7,'N','pk'],[8,'O','pk'],[9,'F','pk'],[10,'Ne','kh'],
        [11,'Na','kl'],[12,'Mg','kl'],[13,'Al','kl'],[14,'Si','pk'],[15,'P','pk'],[16,'S','pk'],[17,'Cl','pk'],[18,'Ar','kh'],[19,'K','kl'],[20,'Ca','kl'],
        [21,'Sc','kl'],[22,'Ti','kl'],[23,'V','kl'],[24,'Cr','kl'],[25,'Mn','kl'],[26,'Fe','kl'],[27,'Co','kl'],[28,'Ni','kl'],[29,'Cu','kl'],[30,'Zn','kl']
      ];
      const SHELLS = [
        { ten: '1s', boxes: 1 }, { ten: '2s', boxes: 1 }, { ten: '2p', boxes: 3 },
        { ten: '3s', boxes: 1 }, { ten: '3p', boxes: 3 }, { ten: '4s', boxes: 1 }, { ten: '3d', boxes: 5 }
      ];
      let Z = 7, aoKind = 's';
      // state[shIdx][boxIdx] = '' | 'u' | 'ud'
      let state = SHELLS.map(function (sh) { return new Array(sh.boxes).fill(''); });

      function totalPlaced() {
        let n = 0;
        state.forEach(function (arr) { arr.forEach(function (v) { n += v.length; }); });
        return n;
      }

      function expectedConfig(z) {
        const order = [['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10]];
        const map = {};
        let rem = z;
        order.forEach(function (kv) {
          const take = Math.min(rem, kv[1]);
          if (take > 0) map[kv[0]] = take;
          rem -= take;
        });
        if (z === 24) { map['4s'] = 1; map['3d'] = 5; }
        if (z === 29) { map['4s'] = 1; map['3d'] = 10; }
        return map;
      }

      function formatConfig(z) {
        const m = expectedConfig(z);
        const sup = { '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '10': '¹⁰' };
        const dispOrder = ['1s','2s','2p','3s','3p','3d','4s'];
        return dispOrder.filter(function (k) { return m[k]; }).map(function (k) { return k + (sup[m[k]] || m[k]); }).join(' ');
      }

      host.innerHTML =
        '<div class="lh-stage-grid">' +
          '<div class="lh-panel">' +
            '<div class="lh-card">' +
              '<h3>⚛️ Chọn nguyên tố (Z = 1–20 chuẩn Thông tư 32 · mở rộng 21–30)</h3>' +
              '<div class="lh-el-grid" id="lh-or-els"></div>' +
            '</div>' +
            '<div class="lh-card">' +
              '<h3>🧩 Bấm vào ô orbital để điền electron (↑ trước, ↓ sau)</h3>' +
              '<div class="lh-orb-shells" id="lh-or-boxes"></div>' +
              '<div id="lh-or-msg" style="margin-top:10px"></div>' +
              '<div class="hang-nut" style="margin-top:10px">' +
                '<button type="button" class="nut chinh" id="lh-or-auto">⚡ Điền mẫu tự động</button>' +
                '<button type="button" class="nut" id="lh-or-clr">↺ Làm rỗng</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="lh-panel">' +
            '<div class="lh-card">' +
              '<h3>📊 Kết quả cấu hình electron</h3>' +
              '<div class="lh-metrics" id="lh-or-stats"></div>' +
              '<div class="lh-eq" id="lh-or-cfg" style="margin-top:8px"></div>' +
            '</div>' +
            '<div class="lh-card">' +

      function clearBoxes() {
        state = SHELLS.map(function (sh) { return new Array(sh.boxes).fill(''); });

      }

      function setMsg(txt, loai) {
        const el = host.querySelector('#lh-or-msg');
        if (!txt) { el.innerHTML = ''; return; }

      function tryClickBox(si, bi) {
        const cur = state[si][bi];
        if (cur === 'ud') {
          SoundFX.error();
          setMsg('<b>Vi phạm nguyên lí Pauli:</b> Mỗi ô orbital chỉ chứa tối đa 2 electron có chiều tự quay ngược nhau (↑↓)!', 'canh');
          return;
        }
        const placed = totalPlaced();
        if (placed >= Z) {
          SoundFX.error();
          setMsg('Đã điền đủ <b>' + Z + ' electron</b> cho nguyên tử này rồi!', 'info');
          return;
        }
        // Kiểm tra nguyên lí vững bền (các phân lớp thấp hơn phải đầy, trừ ngoại lệ 4s của Cr/Cu)
        const isExc = (Z === 24 || Z === 29) && si === 6;
        for (let k = 0; k < si; k++) {
          const cap = SHELLS[k].boxes * 2;
          const has = state[k].reduce(function (s, v) { return s + v.length; }, 0);
          if (has < cap && !(isExc && k === 5 && has === 1)) {
            SoundFX.error();
            setMsg('<b>Vi phạm nguyên lí Vững bền:</b> Hãy điền đầy phân lớp <b>' + SHELLS[k].ten + '</b> có mức năng lượng thấp hơn trước!', 'canh');
            return;
          }
        }
        // Kiểm tra quy tắc Hund: trong cùng phân lớp, nếu chưa có spin ↑ ở ô khác thì không được ghép đôi ↓
        if (cur === 'u') {
          if ((Z === 24 || Z === 29) && si === 5) {
            SoundFX.error();
            setMsg('<b>Ngoại lệ bền vững (' + (Z === 24 ? 'Cr: 3d⁵4s¹' : 'Cu: 3d¹⁰4s¹') + '):</b> Phân lớp 4s chỉ nhận <b>1 electron (↑)</b> để nhường 1e sang 3d đạt cấu hình bền!', 'canh');
            return;
          }
          const hasEmpty = state[si].some(function (v) { return v === ''; });
          if (hasEmpty) {
            SoundFX.error();
            setMsg('<b>Vi phạm quy tắc Hund:</b> Trong phân lớp <b>' + SHELLS[si].ten + '</b>, hãy điền mỗi ô 1 electron độc thân (↑) trước khi ghép đôi (↓)!', 'canh');
            return;
          }
          state[si][bi] = 'ud';
        } else {
          state[si][bi] = 'u';
        }
        SoundFX.click();
        if (totalPlaced() === Z) {
          SoundFX.win();
          setMsg('<b>Hoàn thành chuẩn xác!</b>' + (Z === 24 || Z === 29 ? ' (Ghi nhớ ngoại lệ bán bão hòa / bão hòa phân lớp d bền vững!)' : ''), 'ok');
        } else {
          setMsg('Đang điền: <b>' + totalPlaced() + '/' + Z + ' electron</b>.', 'info');
        }
        renderOrb();
      }

      function renderAoShape() {
        const sv = host.querySelector('#lh-or-ao');
        if (aoKind === 's') {
          sv.innerHTML =
            '<defs><radialGradient id="aoS" cx="40%" cy="35%"><stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0.3"/></radialGradient></defs>' +
            '<line x1="80" y1="75" x2="240" y2="75" stroke="rgba(255,255,255,0.28)"/><line x1="160" y1="15" x2="160" y2="135" stroke="rgba(255,255,255,0.28)"/>' +
            '<circle cx="160" cy="75" r="46" fill="url(#aoS)" stroke="#60A5FA" stroke-width="2"/>' +

        } else {
          sv.innerHTML =

            '<g transform="translate(160,70)"><ellipse cx="-24" cy="0" rx="24" ry="14" fill="rgba(244,114,182,0.55)" stroke="#F472B6" stroke-width="1.6"/><ellipse cx="24" cy="0" rx="24" ry="14" fill="rgba(56,189,248,0.55)" stroke="#38BDF8" stroke-width="1.6"/><text y="64" fill="#E2E8F0" font-size="11" font-weight="800" text-anchor="middle">px</text></g>' +
            '<g transform="translate(260,70) rotate(35)"><ellipse cx="0" cy="-24" rx="14" ry="24" fill="rgba(167,139,250,0.55)" stroke="#A78BFA" stroke-width="1.6"/><ellipse cx="0" cy="24" rx="14" ry="24" fill="rgba(45,212,191,0.55)" stroke="#2DD4BF" stroke-width="1.6"/></g><text x="260" y="134" fill="#E2E8F0" font-size="11" font-weight="800" text-anchor="middle">py</text>';
        }
      }

      function renderOrb() {
        host.querySelector('#lh-or-els').innerHTML = ELS.map(function (e) {
          const isExc = e[0] === 24 || e[0] === 29;
          return '<button type="button" class="lh-el-btn' + (e[0] === Z ? ' on' : '') + (isExc ? ' exc' : '') + '" data-z="' + e[0] + '"><small>' + e[0] + '</small><b>' + e[1] + '</b></button>';
        }).join('');
        host.querySelectorAll('[data-z]').forEach(function (b) {
          b.onclick = function () { SoundFX.click(); Z = Number(b.getAttribute('data-z')); clearBoxes(); setMsg('Đã chọn <b>' + ELS[Z - 1][1] + ' (Z = ' + Z + ')</b>. Hãy điền đủ ' + Z + ' electron vào các ô orbital!', 'info'); };
        });

        host.querySelector('#lh-or-boxes').innerHTML = SHELLS.map(function (sh, si) {
          return '<div class="lh-subshell"><span class="lh-subshell-lbl">' + sh.ten + '</span><div class="lh-orb-row">' +
            state[si].map(function (v, bi) {
              const cls = v === 'ud' ? ' full' : v === 'u' ? ' half' : '';
              const inner = v === 'ud' ? '<span class="up">↑</span><span class="dn">↓</span>' : v === 'u' ? '<span class="up">↑</span>' : '';
              return '<button type="button" class="lh-obox' + cls + '" data-si="' + si + '" data-bi="' + bi + '" aria-label="Ô ' + sh.ten + '">' + inner + '</button>';
            }).join('') +
          '</div></div>';
        }).join('');
        host.querySelectorAll('.lh-obox').forEach(function (b) {
          b.onclick = function () { tryClickBox(Number(b.getAttribute('data-si')), Number(b.getAttribute('data-bi'))); };
        });

        const placed = totalPlaced();
        const unpaired = state.reduce(function (s, arr) { return s + arr.filter(function (v) { return v === 'u'; }).length; }, 0);
        const elInfo = ELS[Z - 1];
        const loaiTen = elInfo[2] === 'kl' ? 'Kim loại' : elInfo[2] === 'kh' ? 'Khí hiếm' : 'Phi kim';
        host.querySelector('#lh-or-stats').innerHTML =
          '<div class="lh-stat"><span>Electron đã điền</span><b>' + placed + ' / ' + Z + '</b></div>' +
          '<div class="lh-stat"><span>Số e độc thân</span><b>' + unpaired + '</b></div>' +
          '<div class="lh-stat"><span>Loại nguyên tố</span><b>' + loaiTen + '</b></div>';
        host.querySelector('#lh-or-cfg').innerHTML = '<b>Cấu hình chuẩn (' + elInfo[1] + '):</b> ' + esc(formatConfig(Z)) +
          (Z <= 20 ? ' <span class="chip ok">Trong chuẩn Z ≤ 20</span>' : ' <span class="chip canh">Mở rộng Z = 21–30</span>');
      }

      host.querySelector('#lh-or-clr').onclick = function () { SoundFX.click(); clearBoxes(); setMsg('Đã xóa hết electron để điền lại.', 'info'); };
      host.querySelector('#lh-or-auto').onclick = function () {
        clearBoxes();
        const seq = [];
        const cfgMap = expectedConfig(Z);
        SHELLS.forEach(function (sh, si) {
          const n = cfgMap[sh.ten] || 0;
          for (let k = 0; k < Math.min(n, sh.boxes); k++) seq.push([si, k, 'u']);
          for (let k = sh.boxes; k < n; k++) seq.push([si, k - sh.boxes, 'ud']);
        });
        seq.forEach(function (step, idx) {
          scope.timeout(function () {
            state[step[0]][step[1]] = step[2];
            if (idx === seq.length - 1) { SoundFX.win(); setMsg('Đã hoàn thành cấu hình <b>' + formatConfig(Z) + '</b>.', 'ok'); }
            renderOrb();
          }, idx * (REDUCED_MOTION ? 15 : 85));
        });
      };
      host.querySelectorAll('[data-ao]').forEach(function (b) {
        b.onclick = function () {
          SoundFX.click(); aoKind = b.getAttribute('data-ao');
          host.querySelectorAll('[data-ao]').forEach(function (x) { x.classList.toggle('on', x === b); });
          renderAoShape();
        };
      });
      renderOrb(); renderAoShape();
    } else {
      // Sub-mode 2: Máy phổ khối lượng MS & Tính nguyên tử khối trung bình Ā
      const SAMPLES = [
        { id: 'Cl', ten: 'Chlorine (Cl)', peaks: [[35, 75.77], [37, 24.23]] },
        { id: 'Cu', ten: 'Copper (Cu)', peaks: [[63, 69.15], [65, 30.85]], note: 'Tính theo số khối nguyên (63 và 65) cho Ā = 63,62; bảng tuần hoàn ghi 63,55 do khối lượng nuclide thực tế là 62,93 và 64,93 amu.' },
        { id: 'Br', ten: 'Bromine (Br)', peaks: [[79, 50.69], [81, 49.31]] },
        { id: 'B', ten: 'Boron (B)', peaks: [[10, 19.9], [11, 80.1]] },
        { id: 'Mg', ten: 'Magnesium (Mg)', peaks: [[24, 78.99], [25, 10.00], [26, 11.01]] },
        { id: 'Ne', ten: 'Neon (Ne)', peaks: [[20, 90.48], [21, 0.27], [22, 9.25]] }
      ];
      let sel = SAMPLES[0], customMode = false, a1 = 35, a2 = 37, p1 = 75.77;

      host.innerHTML =
        '<div class="lh-stage-grid">' +
          '<div class="lh-panel">' +
            '<div class="lh-viewport" style="height:210px;min-height:210px">' +
              '<div class="lh-hud-top"><div class="lh-hud-badge">Sơ đồ buồng tách đồng vị trong từ trường</div></div>' +
              '<svg class="lh-svg" viewBox="0 0 560 200">' +
                '<rect x="28" y="82" width="76" height="36" rx="8" fill="#334155" stroke="#94A3B8" stroke-width="2"/>' +
                '<text x="66" y="104" fill="#F8FAFC" font-size="11" font-weight="800" text-anchor="middle">Ion hóa</text>' +
                '<path d="M104 100 H220" stroke="#FACC15" stroke-width="3"/>' +
                '<path d="M220 40 Q320 40 340 160 H260 Q255 88 220 88 Z" fill="rgba(56,189,248,0.16)" stroke="#38BDF8" stroke-width="2"/>' +
                '<text x="278" y="32" fill="#BAE6FD" font-size="11" font-weight="800" text-anchor="middle">Từ trường B</text>' +
                '<path d="M220 100 Q300 100 326 168" fill="none" stroke="#F472B6" stroke-width="2.5" stroke-dasharray="6 4"/>' +
                '<path d="M220 100 Q324 94 384 168" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 4"/>' +
                '<rect x="295" y="168" width="125" height="14" rx="4" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5"/>' +
                '<text x="326" y="194" fill="#FBCFE8" font-size="10.5" font-weight="800" text-anchor="middle">Nhẹ (lệch nhiều)</text>' +
                '<text x="394" y="194" fill="#BAE6FD" font-size="10.5" font-weight="800" text-anchor="middle">Nặng (lệch ít)</text>' +
              '</svg>' +
            '</div>' +
            '<div class="lh-card">' +
              '<h3>📊 Phổ khối lượng MS (m/z vs % số nguyên tử)</h3>' +
              '<div class="lh-chart-box"><canvas id="lh-ms-chart" style="height:200px"></canvas></div>' +
            '</div>' +
          '</div>' +
          '<div class="lh-panel">' +
            '<div class="lh-card">' +
              '<h3>🔬 Chọn mẫu nguyên tố (Bài 2)</h3>' +
              '<div class="lh-pills" id="lh-ms-els" style="margin-bottom:8px"></div>' +
              '<button type="button" class="nut nho tim" id="lh-ms-cust">🎛️ Tự chỉnh số khối &amp; % đồng vị</button>' +
              '<div id="lh-ms-sliders" class="an" style="margin-top:10px;display:flex;flex-direction:column;gap:8px">' +
                '<div class="truong"><label>Đồng vị 1: A₁ = <b id="lh-ms-a1v">35</b> · Chiếm <b id="lh-ms-p1v">75,8%</b></label>' +
                  '<div style="display:flex;gap:8px"><input type="range" id="lh-ms-a1" min="1" max="120" value="35"><input type="range" id="lh-ms-p1" min="1" max="99" step="0.5" value="75.5"></div></div>' +
                '<div class="truong"><label>Đồng vị 2: A₂ = <b id="lh-ms-a2v">37</b> · Chiếm <b id="lh-ms-p2v">24,2%</b></label>' +
                  '<input type="range" id="lh-ms-a2" min="1" max="120" value="37"></div>' +
              '</div>' +
            '</div>' +
            '<div class="lh-card">' +
              '<h3>🧮 Công thức tính Nguyên tử khối trung bình Ā</h3>' +
              '<div class="lh-eq" id="lh-ms-calc"></div>' +
            '</div>' +
          '</div>' +
        '</div>';

      function renderMs() {
        const peaks = customMode ? [[a1, p1], [a2, 100 - p1]] : sel.peaks;
        const avg = peaks.reduce(function (s, kv) { return s + kv[0] * kv[1]; }, 0) / 100;
        const b = fitCanvas(host.querySelector('#lh-ms-chart'));
        const ctx = b.ctx; if (!ctx) return;
        ctx.clearRect(0, 0, b.w, b.h);
        const pad = { l: 42, r: 22, t: 18, b: 30 };
        const pw = b.w - pad.l - pad.r, ph = b.h - pad.t - pad.b;
        ctx.strokeStyle = 'rgba(148,163,184,0.28)'; ctx.lineWidth = 1;
        [0, 25, 50, 75, 100].forEach(function (pct) {
          const y = pad.t + ph - (pct / 105) * ph;
          ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + pw, y); ctx.stroke();
          ctx.fillStyle = '#64748B'; ctx.font = '600 10px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'right';
          ctx.fillText(pct + '%', pad.l - 5, y + 3);
        });
        const minA = Math.min.apply(null, peaks.map(function (p) { return p[0]; })) - 1;
        const maxA = Math.max.apply(null, peaks.map(function (p) { return p[0]; })) + 1;
        const cols = ['#0284C7', '#EC4899', '#10B981'];
        peaks.forEach(function (pk, i) {
          const x = pad.l + ((pk[0] - minA) / Math.max(1, maxA - minA)) * pw;
          const barH = (pk[1] / 105) * ph;
          ctx.fillStyle = cols[i % cols.length];
          ctx.fillRect(x - 13, pad.t + ph - barH, 26, barH);
          ctx.fillStyle = cssVar('--chu', '#334155'); ctx.font = '800 11px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(fmtNum(pk[1], 2) + '%', x, pad.t + ph - barH - 5);
          ctx.fillText('m/z=' + pk[0], x, b.h - 8);
        });

        const expr = peaks.map(function (pk) { return pk[0] + '·' + fmtNum(pk[1], 2); }).join(' + ');
        host.querySelector('#lh-ms-calc').innerHTML =
          '<div><b>Ā = (' + expr + ') / 100 = <span style="font-size:18px;color:var(--do)">' + fmtNum(avg, 2) + '</span></b></div>' +
          '<div class="phu" style="margin-top:4px">' + (customMode ? 'Chế độ tự chỉnh 2 đồng vị' : 'Số liệu chuẩn SGK Hóa 10 KNTT cho ' + esc(sel.ten)) + '</div>' +
          (!customMode && sel.note ? '<div class="phu" style="margin-top:4px;font-size:11.5px">💡 ' + esc(sel.note) + '</div>' : '');
      }

      host.querySelector('#lh-ms-els').innerHTML = SAMPLES.map(function (s) {
        return '<button type="button" class="lh-pill-btn' + (s.id === sel.id ? ' on' : '') + '" data-s="' + s.id + '">' + esc(s.ten) + '</button>';
      }).join('');
      host.querySelectorAll('#lh-ms-els [data-s]').forEach(function (b) {
        b.onclick = function () {
          SoundFX.click(); customMode = false;
          host.querySelector('#lh-ms-sliders').classList.add('an');
          sel = SAMPLES.find(function (x) { return x.id === b.getAttribute('data-s'); });
          host.querySelectorAll('#lh-ms-els [data-s]').forEach(function (x) { x.classList.toggle('on', x === b); });
          renderMs();
        };
      });
      host.querySelector('#lh-ms-cust').onclick = function () {
        customMode = !customMode; SoundFX.click();
        host.querySelector('#lh-ms-sliders').classList.toggle('an', !customMode);
        renderMs();
      };
      ['lh-ms-a1', 'lh-ms-a2', 'lh-ms-p1'].forEach(function (id) {
        host.querySelector('#' + id).oninput = function () {
          a1 = Number(host.querySelector('#lh-ms-a1').value);
          a2 = Number(host.querySelector('#lh-ms-a2').value);
          p1 = Number(host.querySelector('#lh-ms-p1').value);
          host.querySelector('#lh-ms-a1v').textContent = a1;
          host.querySelector('#lh-ms-a2v').textContent = a2;
          host.querySelector('#lh-ms-p1v').textContent = fmtNum(p1, 1) + '%';
          host.querySelector('#lh-ms-p2v').textContent = fmtNum(100 - p1, 1) + '%';
          renderMs();
        };
      });
      renderMs();
      watchTheme(scope, renderMs);
      const onMsResize = function () { renderMs(); };
      window.addEventListener('resize', onMsResize);
      scope.onCleanup(function () { window.removeEventListener('resize', onMsResize); });
    }
  }

  /* ============================================================================
   * SẢNH 7 PHÒNG LAB TỰ LÀM + ROUTER CHÍNH
   * ============================================================================ */
  function renderLobby(mainEl) {
    let h =
      '<div class="hero-box art-flask" style="margin-bottom:14px">' +
        '<span class="chip chinh">🇻🇳 PHÒNG THÍ NGHIỆM ẢO TIẾNG VIỆT · KHÔNG CẦN MẠNG MẠNH</span>' +
        '<h1>7 Phòng Lab Hóa 10 Tương tác Trực quan</h1>' +
        '<p class="phu" style="margin:0">Mô phỏng chuẩn số liệu SGK <b>Kết nối tri thức</b> (đkc 24,79 L/mol, danh pháp IUPAC) kèm kính lúp soi cấp độ hạt/ion. Chọn 1 thí nghiệm để bắt đầu ngay!</p>' +
      '</div>' +
      '<div class="lh-lobby-grid">';
    LAB_LIST.forEach(function (l, i) {
      h += '<button type="button" class="lh-lobby-card" data-open="' + esc(l.id) + '">' +
        '<div class="lh-lobby-art">' + l.art + '<span class="gal-tag">' + esc(l.bai) + '</span></div>' +
        '<div class="lh-lobby-body">' +
          '<b>' + (i + 1) + '. ' + esc(l.ten) + '</b>' +
          '<span class="phu">' + md(l.moTa) + '</span>' +
          '<span class="hub-go" style="color:var(--do);margin-top:auto">▶ Mở phòng Lab →</span>' +
        '</div></button>';
    });
    h += '</div>' +
      '<div class="the" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">' +
        '<div><b>🧪 Bàn thí nghiệm Ống nghiệm Cơ bản (Bài Mở đầu)</b><div class="phu">Thử nhanh các phản ứng cơ bản CaCO₃ + HCl, Zn + HCl, CuSO₄ + NaOH, Phenolphthalein.</div></div>' +
        '<button type="button" class="nut tim" data-open="ong-nghiem">▶ Mở Bàn ống nghiệm</button>' +
      '</div>';
    mainEl.innerHTML = h;
    mainEl.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () {
        SoundFX.click();
        window.location.hash = '#' + b.getAttribute('data-open');
      };
    });
  }

  function mountLab(id, sub) {
    if (activeScope) { activeScope.destroy(); activeScope = null; }
    const resolved = resolveAlias(id, sub);
    const curId = resolved.id;
    const curSub = resolved.sub;
    renderNavBar(curId);
    const mainEl = document.getElementById('lh-main');
    mainEl.innerHTML = '';
    activeScope = createScope();

    if (curId === 'halide') mountHalideLab(mainEl, activeScope, curSub, false);
    else if (curId === 'ong-nghiem') mountHalideLab(mainEl, activeScope, curSub, true);
    else if (curId === 'toc-do') mountTocDoLab(mainEl, activeScope, curSub);
    else if (curId === 'nhiet-luong-ke') mountNhietLuongKeLab(mainEl, activeScope, curSub);
    else if (curId === 'kiem-luong-tinh') mountKiemLuongTinhLab(mainEl, activeScope, curSub);
    else if (curId === 'ngon-lua') mountNgonLuaLab(mainEl, activeScope, curSub);
    else if (curId === 'dan-dien') mountDanDienLab(mainEl, activeScope);
    else if (curId === 'orbital-ms') mountOrbitalMsLab(mainEl, activeScope, curSub);
    else renderLobby(mainEl);
  }

  window.addEventListener('hashchange', function () {
    const r = parseRoute();
    mountLab(r.id, r.sub);
  });

  if (laGAS) {
    getLocation(function (loc) {
      const r = parseRoute();
      const p = (loc && loc.parameter) || {};
      apEmbed(p.embed === '1');
      const id = r.id || p.id || '';
      const sub = r.sub || p.sub || '';
      mountLab(id, sub);
    });
  } else {
    const r = parseRoute();
    mountLab(r.id, r.sub);
  }
})();
</script>
</body>
</html>
