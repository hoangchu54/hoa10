<script>
(function () {
  'use strict';
  const H10 = window.H10;
  const { esc, md, phaoGiay, laGAS, getLocation, linkTrang, ganNutTheme, renderSlogan, ICONS } = H10;

  /* ============================================================================
   * NGUỒN SỐ LIỆU CHUẨN SGK HÓA HỌC 10 – KẾT NỐI TRI THỨC (BGDĐT / TT32-2018)
   * - Điều kiện chuẩn (đkc): 25 °C (298 K), 1 bar => V_m = 24,79 L/mol.
   * - Danh pháp chuẩn IUPAC tiếng Anh theo SGK mới (Sodium, Potassium, Chlorine...).
   * - Bài 3: Cấu hình e 20 nguyên tố đầu + ngoại lệ Cr (Z=24), Cu (Z=29).
   * - Bài 2: Đồng vị Cl (35: 75,77%; 37: 24,23%), Cu (63: 69,15%; 65: 30,85%),
   *   Br (79: 50,69%; 81: 49,31%), B (10: 19,9%; 11: 80,1%), Mg (24: 78,99%; 25: 10%; 26: 11,01%).
   * - Bài 17: ΔfH°298 & ΔrH°298 chuẩn (CH4 -74,87; CO2 -393,50; H2O(l) -285,84; H2O(g) -241,8;
   *   CaCO3(s) -1207,6; CaO(s) -634,9; HCl(g) -92,3; NH3(g) -45,9 kJ/mol).
   * - Bài 19: Van't Hoff v2/v1 = γ^((T2 - T1)/10); phản ứng Na2S2O3 + H2SO4 tạo kết tủa S↓.
   * - Bài 21-22: Nhận biết halide bằng AgNO3 (AgF tan; AgCl trắng; AgBr vàng nhạt; AgI vàng),
   *   tính oxi hóa Cl2 > Br2 > I2, tính khử muối halide với H2SO4 đặc.
   * ============================================================================ */

  const REDUCED_MOTION = (function () {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
    catch (e) { return false; }
  })();

  // Chỉ coi là "nhúng" khi có tham số embed=1 (do ThiNghiem.html gắn vào khung).
  // Không dùng self !== top: trong GAS trang luôn nằm trong iframe, và GitHub Pages có thể nằm trong Google Sites.
  let LA_EMBED = false;
  function apEmbed(on) {
    LA_EMBED = !!on;
    document.body.classList.toggle('lh-embed', LA_EMBED);
  }
  if (!laGAS) {
    try { apEmbed(new URLSearchParams(window.location.search).get('embed') === '1'); } catch (e) {}
  }

  const brandIc = document.getElementById('lh-brand-ic');
  if (brandIc) brandIc.innerHTML = ICONS.lab;
  ganNutTheme(document.getElementById('lh-btn-theme'));
  renderSlogan(document.getElementById('lh-slogan'));

  // Đồng bộ theme khi tab cha thay đổi localStorage
  window.addEventListener('storage', function (e) {
    if (e.key === 'hoa10_theme' && e.newValue) H10.apTheme(e.newValue);
  });

  // Cập nhật link quay về trang Thí nghiệm
  (function setupBackLink() {
    const opt = { cfg: {}, webUrl: '', laFull: false };
    const setLinks = function (wUrl, full) {
      const l = linkTrang('thinghiem', { cfg: {}, webUrl: wUrl || '', laFull: !!full });
      ['lh-brand-home', 'lh-btn-back'].forEach(function (id) {
        const a = document.getElementById(id);
        if (a) { a.href = l.href; a.target = l.target; }
      });
    };
    setLinks('', false);
    if (laGAS) {
      getLocation(function (loc) {
        const full = !!(loc && loc.parameter && loc.parameter.full);
        H10.api('tnKhoiDong').then(function (r) {
          setLinks((r && r.webUrl) || '', full);
        }).catch(function () {});
      });
    }
  })();

  // ---- Âm thanh WebAudio nhẹ (tắt mở tùy chọn, không tự phát trước chạm) ----
  const SoundFX = (function () {
    let ctx = null;
    let on = true;
    try { on = localStorage.getItem('h10_lab_sfx') !== '0'; } catch (e) {}
    function ensure() {
      if (!on) return null;
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      } catch (e) { return null; }
    }
    function playTone(freq0, freq1, dur, type, vol) {
      const ac = ensure(); if (!ac) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq0, t);
      if (freq1) o.frequency.exponentialRampToValueAtTime(freq1, t + dur);
      g.gain.setValueAtTime(vol || 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    return {
      isOn: function () { return on; },
      toggle: function () {
        on = !on;
        try { localStorage.setItem('h10_lab_sfx', on ? '1' : '0'); } catch (e) {}
        return on;
      },
      drop: function () { playTone(680, 320, 0.09, 'sine', 0.08); },
      bubble: function () { playTone(440 + Math.random() * 220, 920, 0.06, 'sine', 0.04); },
      ignite: function () { playTone(160, 420, 0.16, 'triangle', 0.10); },
      click: function () { playTone(520, 620, 0.04, 'sine', 0.05); },
      error: function () { playTone(230, 150, 0.14, 'sawtooth', 0.06); },
      win: function () {
        playTone(523, 523, 0.12, 'triangle', 0.09);
        setTimeout(function () { playTone(659, 659, 0.12, 'triangle', 0.09); }, 95);
        setTimeout(function () { playTone(784, 784, 0.22, 'triangle', 0.11); }, 190);
      }
    };
  })();

  function syncSfxBtn(btn) {
    if (!btn) return;
    btn.textContent = SoundFX.isOn() ? '🔊 Âm thanh' : '🔇 Tắt âm';
  }
  const topSfx = document.getElementById('lh-btn-sfx');
  syncSfxBtn(topSfx);
  if (topSfx) topSfx.onclick = function () { SoundFX.toggle(); syncSfxBtn(topSfx); };

  // ---- Vòng đời Module sạch (Clean Destroy, 0 memory leak) ----
  let activeScope = null;
  function createScope() {
    const rafs = [];
    const timers = [];
    const intervals = [];
    const cleanups = [];
    let dead = false;
    return {
      dead: function () { return dead; },
      raf: function (fn) {
        if (dead) return 0;
        const id = requestAnimationFrame(function loop(ts) {
          if (dead) return;
          fn(ts);
        });
        rafs.push(id);
        return id;
      },
      loop: function (stepFn) {
        let last = 0, id = 0;
        function tick(ts) {
          if (dead) return;
          if (!document.hidden) {
            if (!last) last = ts;
            const dt = Math.min(0.05, Math.max(0.001, (ts - last) / 1000));
            last = ts;
            stepFn(dt, ts);
          } else {
            last = 0;
          }
          id = requestAnimationFrame(tick);
        }
        id = requestAnimationFrame(tick);
        cleanups.push(function () { cancelAnimationFrame(id); });
      },
      timeout: function (fn, ms) {
        if (dead) return 0;
        const id = setTimeout(function () { if (!dead) fn(); }, ms);
        timers.push(id);
        return id;
      },
      interval: function (fn, ms) {
        if (dead) return 0;
        const id = setInterval(function () { if (!dead && !document.hidden) fn(); }, ms);
        intervals.push(id);
        return id;
      },
      onCleanup: function (fn) { cleanups.push(fn); },
      destroy: function () {
        dead = true;
        rafs.forEach(cancelAnimationFrame);
        timers.forEach(clearTimeout);
        intervals.forEach(clearInterval);
        cleanups.forEach(function (fn) { try { fn(); } catch (e) {} });
      }
    };
  }

  function fitCanvas(cv, minH) {
    if (!cv) return { w: 300, h: 200, ctx: null };
    const rect = cv.getBoundingClientRect();
    const w = Math.max(160, Math.round(rect.width || cv.clientWidth || 400));
    const h = Math.max(minH || 120, Math.round(rect.height || cv.clientHeight || 240));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w: w, h: h, ctx: ctx };
  }

  function hexToRgba(hex, a) {
    const h = String(hex || '#FFFFFF').replace('#', '');
    const n = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
    const v = parseInt(n, 16);
    if (isNaN(v)) return 'rgba(255,255,255,' + a + ')';
    return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')';
  }

  function fmtNum(v, dec) {
    return Number(v).toFixed(dec === undefined ? 1 : dec).replace('.', ',');
  }

  function cssVar(name, fallback) {
    try {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    } catch (e) { return fallback; }
  }

  function watchTheme(scope, fn) {
    try {
      const mo = new MutationObserver(function () { if (!scope.dead()) fn(); });
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      scope.onCleanup(function () { mo.disconnect(); });
    } catch (e) {}
  }

  function resolveAlias(rawId, rawSub) {
    let id = String(rawId || '').trim().toLowerCase();
    let sub = String(rawSub || '').trim().toLowerCase();
    if (id === 'orbital') { id = 'orbital-ms'; if (!sub) sub = 'orbital'; }
    else if (id === 'ms') { id = 'orbital-ms'; if (!sub) sub = 'ms'; }
    return { id: id, sub: sub };
  }

  function parseRoute() {
    let id = '', sub = '';
    const h = String(window.location.hash || '').replace(/^#/, '');
    if (h) {
      const qi = h.indexOf('?');
      id = qi >= 0 ? h.slice(0, qi) : h;
      if (qi >= 0) {
        try { sub = new URLSearchParams(h.slice(qi + 1)).get('sub') || ''; } catch (e) {}
      }
    }
    if (!id) {
      try {
        const sp = new URLSearchParams(window.location.search);
        id = sp.get('id') || '';
        sub = sp.get('sub') || sub;
      } catch (e) {}
    }
    return resolveAlias(id, sub);
  }

  function createTestTubeBench(mountEl, scope, cfg) {
    const tubes = cfg.tubes.map(function (t, i) {

        idx: i, key: t.key, label: t.label, sub: t.sub || '',

        gasRate: 0, vaporColor: null,

        ripple: 0, doneReagents: {}, lastRxn: null
      };
    });
    const reagents = cfg.reagents;
    let selReagent = reagents[0].key;
    let selectedTube = 0;
    let microOn = false;
    let drops = [];
    let particles = [];
    let bubbles = [];
    let vapors = [];
    let pipette = { x: 120, y: 38, tx: 120, ty: 38, squeeze: 0, color: reagents[0].color };
    let microParticles = [];
    for (let i = 0; i < 24; i++) {
      microParticles.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
        kind: i % 2
      });
    }

    mountEl.innerHTML =
      '<div class="lh-stage-grid">' +
        '<div>' +
          '<div class="lh-viewport" id="lh-tt-vp" style="height:375px">' +
            '<div class="lh-hud-top">' +
              '<div class="lh-hud-badge" id="lh-tt-hud">Chọn thuốc thử rồi chạm vào ống nghiệm</div>' +
              (cfg.quickBtn ? '<button type="button" class="nut nho tim" style="pointer-events:auto" id="lh-tt-quick">' + esc(cfg.quickBtn) + '</button>' : '') +
            '</div>' +
            '<svg class="lh-svg" id="lh-tt-svg" viewBox="0 0 560 360" preserveAspectRatio="xMidYMid meet"></svg>' +
            '<canvas class="lh-cv" id="lh-tt-cv"></canvas>' +
            '<div class="lh-micro-lens" id="lh-tt-micro"><canvas id="lh-tt-mcv"></canvas><div class="lh-micro-cap" id="lh-tt-mcap">Vi mô</div></div>' +
          '</div>' +
          '<div class="lh-card" style="margin-top:10px">' +
            '<h3>🧴 Kệ thuốc thử (Chạm để chọn hoặc kéo thả lên ống nghiệm)</h3>' +
            '<div class="lh-rack" id="lh-tt-rack"></div>' +
          '</div>' +
        '</div>' +
        '<div class="lh-panel">' +
          '<div class="lh-card" id="lh-tt-obs-card">' +
            '<h3>🔬 Hiện tượng &amp; Phương trình hóa học</h3>' +
            '<div id="lh-tt-obs"><div class="phu">Chạm 1 lọ thuốc thử bên cạnh rồi chạm vào bất kỳ ống nghiệm nào (hoặc kéo thả thẳng từ lọ thuốc thử lên miệng ống) để quan sát kết tủa, đổi màu, sủi khí.</div></div>' +
          '</div>' +

        '</div>' +
      '</div>';

    const vp = mountEl.querySelector('#lh-tt-vp');
    const svg = mountEl.querySelector('#lh-tt-svg');
    const cv = mountEl.querySelector('#lh-tt-cv');
    const microBox = mountEl.querySelector('#lh-tt-micro');
    const mcv = mountEl.querySelector('#lh-tt-mcv');
    const mcap = mountEl.querySelector('#lh-tt-mcap');
    const rack = mountEl.querySelector('#lh-tt-rack');
    const obsEl = mountEl.querySelector('#lh-tt-obs');
    const hudEl = mountEl.querySelector('#lh-tt-hud');

    const count = tubes.length;
    const spacing = count <= 3 ? 136 : 112;
    const startX = 280 - ((count - 1) * spacing) / 2;
    const tubePos = tubes.map(function (t, i) {
      return { cx: startX + i * spacing, topY: 96, w: 50, h: 176 };
    });

    function buildSvg() {
      let defs =
        '<defs>' +
          '<linearGradient id="lhGlassG" x1="0" y1="0" x2="1" y2="0">' +
            '<stop offset="0%" stop-color="rgba(255,255,255,0.30)"/>' +
            '<stop offset="18%" stop-color="rgba(255,255,255,0.06)"/>' +
            '<stop offset="82%" stop-color="rgba(255,255,255,0.04)"/>' +
            '<stop offset="100%" stop-color="rgba(255,255,255,0.24)"/>' +
          '</linearGradient>' +
          '<linearGradient id="lhRackWood" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="#8B5E3C"/><stop offset="100%" stop-color="#5C3A21"/>' +
          '</linearGradient>';
      tubePos.forEach(function (p, i) {
        const x = p.cx - p.w / 2, y = p.topY, w = p.w, h = p.h, r = w / 2;
        defs += '<clipPath id="lhTubeClip' + i + '"><path d="M' + (x + 2) + ' ' + y + ' V' + (y + h - r) + ' A' + (r - 2) + ' ' + (r - 2) + ' 0 0 0 ' + (x + w - 2) + ' ' + (y + h - r) + ' V' + y + ' Z"/></clipPath>';
      });
      defs += '</defs>';

      // Giá ống nghiệm 2 thanh gỗ
      let rackHtml =
        '<rect x="' + (startX - 66) + '" y="266" width="' + ((count - 1) * spacing + 132) + '" height="14" rx="4" fill="url(#lhRackWood)" stroke="#3E2716" stroke-width="1.5"/>' +
        '<rect x="' + (startX - 58) + '" y="148" width="' + ((count - 1) * spacing + 116) + '" height="10" rx="3" fill="url(#lhRackWood)" opacity="0.88"/>' +
        '<rect x="' + (startX - 52) + '" y="158" width="10" height="108" fill="#6F472A"/>' +
        '<rect x="' + (startX + (count - 1) * spacing + 42) + '" y="158" width="10" height="108" fill="#6F472A"/>';

      let tubesHtml = '';
      tubePos.forEach(function (p, i) {
        const t = tubes[i];
        const x = p.cx - p.w / 2, y = p.topY, w = p.w, h = p.h, r = w / 2;
        const liqY = y + 82;
        tubesHtml +=
          '<g class="lh-tube-hit" data-tube="' + i + '">' +
            '<rect class="lh-tube-ring" x="' + (x - 8) + '" y="' + (y - 10) + '" width="' + (w + 16) + '" height="' + (h + 52) + '" rx="14" fill="rgba(56,189,248,0.08)" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 3"/>' +
            '<g clip-path="url(#lhTubeClip' + i + ')">' +
              '<rect id="lh-liq-' + i + '" x="' + x + '" y="' + liqY + '" width="' + w + '" height="' + (h - 70) + '" fill="' + t.liqColor + '"/>' +
              '<ellipse id="lh-men-' + i + '" cx="' + p.cx + '" cy="' + liqY + '" rx="' + (w / 2 - 2) + '" ry="4" fill="rgba(255,255,255,0.22)"/>' +
              (t.solidType === 'powder' ? '<path d="M' + (x + 6) + ' ' + (y + h - 8) + ' Q' + p.cx + ' ' + (y + h - 22) + ' ' + (x + w - 6) + ' ' + (y + h - 8) + ' V' + (y + h + 4) + ' H' + x + ' Z" fill="' + (t.solidColor || '#E2E8F0') + '"/>' : '') +
              (t.solidType === 'chips' ? '<rect x="' + (x + 10) + '" y="' + (y + h - 18) + '" width="12" height="9" rx="2" fill="#E2E8F0"/><rect x="' + (x + 24) + '" y="' + (y + h - 16) + '" width="13" height="10" rx="3" fill="#CBD5E1"/>' : '') +
              (t.solidType === 'metal' ? '<polygon points="' + (x + 12) + ',' + (y + h - 10) + ' ' + (x + 22) + ',' + (y + h - 22) + ' ' + (x + 36) + ',' + (y + h - 18) + ' ' + (x + 38) + ',' + (y + h - 8) + '" fill="#94A3B8"/>' : '') +
              '<path id="lh-ppt-' + i + '" d="M' + x + ' ' + (y + h) + ' H' + (x + w) + ' Z" fill="transparent"/>' +
            '</g>' +
            '<path d="M' + x + ' ' + y + ' V' + (y + h - r) + ' A' + r + ' ' + r + ' 0 0 0 ' + (x + w) + ' ' + (y + h - r) + ' V' + y + '" fill="url(#lhGlassG)" stroke="#CBD5E1" stroke-width="2.2"/>' +
            '<ellipse cx="' + p.cx + '" cy="' + y + '" rx="' + (w / 2 + 3) + '" ry="4.5" fill="rgba(255,255,255,0.14)" stroke="#E2E8F0" stroke-width="1.8"/>' +
            '<line x1="' + (x + 7) + '" y1="' + (y + 18) + '" x2="' + (x + 7) + '" y2="' + (y + h - r - 6) + '" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round"/>' +
            '<line x1="' + (x + w - 11) + '" y1="' + (y + 108) + '" x2="' + (x + w - 4) + '" y2="' + (y + 108) + '" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>' +
            '<line x1="' + (x + w - 14) + '" y1="' + (y + 132) + '" x2="' + (x + w - 4) + '" y2="' + (y + 132) + '" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>' +
            '<rect x="' + (p.cx - 32) + '" y="287" width="64" height="25" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>' +
            '<text x="' + p.cx + '" y="303" fill="#F8FAFC" font-size="12.5" font-weight="800" text-anchor="middle">' + esc(t.label) + '</text>' +
            (t.sub ? '<text x="' + p.cx + '" y="326" fill="#94A3B8" font-size="10.5" font-weight="600" text-anchor="middle">' + esc(t.sub) + '</text>' : '') +
          '</g>';
      });

      // Pipet thủy tinh nhỏ giọt
      const pipHtml =
        '<g id="lh-pipette" transform="translate(' + pipette.x + ',' + pipette.y + ')">' +
          '<path d="M-9 -24 C-11 -36 11 -36 9 -24 L7 -14 H-7 Z" fill="#EF4444" stroke="#991B1B" stroke-width="1.5"/>' +
          '<path d="M-5 -14 H5 L4 18 L1.5 34 H-1.5 L-4 18 Z" fill="rgba(255,255,255,0.28)" stroke="#E2E8F0" stroke-width="1.5"/>' +
          '<path id="lh-pip-liq" d="M-3.4 4 H3.4 L1.2 32 H-1.2 Z" fill="' + pipette.color + '"/>' +
        '</g>';

      svg.innerHTML = defs + rackHtml + tubesHtml + pipHtml;

      svg.querySelectorAll('[data-tube]').forEach(function (g) {
        g.onclick = function () {
          const idx = Number(g.getAttribute('data-tube'));
          dropIntoTube(idx, selReagent);
        };
      });
    }

    function renderReagents() {
      rack.innerHTML = reagents.map(function (rg) {
        return '<button type="button" class="lh-reagent' + (rg.key === selReagent ? ' on' : '') + '" data-rg="' + esc(rg.key) + '">' +
          '<i style="background:' + esc(rg.color) + '"></i>' +
          '<div><div>' + md(rg.label) + '</div><div class="phu" style="font-size:11px">' + esc(rg.note || '') + '</div></div>' +
        '</button>';
      }).join('');

      rack.querySelectorAll('[data-rg]').forEach(function (btn) {
        btn.onclick = function () {
          SoundFX.click();
          selReagent = btn.getAttribute('data-rg');
          const rObj = reagents.find(function (x) { return x.key === selReagent; });
          if (rObj) pipette.color = rObj.color;
          const pl = document.getElementById('lh-pip-liq');
          if (pl) pl.setAttribute('fill', pipette.color);
          renderReagents();
        };

        // Hỗ trợ kéo thả trực tiếp từ lọ thuốc thử lên ống nghiệm
        btn.addEventListener('pointerdown', function (ev) {
          if (ev.button && ev.button !== 0) return;
          const rgKey = btn.getAttribute('data-rg');
          const sx = ev.clientX, sy = ev.clientY;
          let dragging = false, ghost = null, hitIdx = -1;
          const rObj = reagents.find(function (x) { return x.key === rgKey; });
          function onMove(e) {
            if (!dragging && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) {
              dragging = true;
              selReagent = rgKey;
              if (rObj) pipette.color = rObj.color;
              renderReagents();
              ghost = document.createElement('div');
              ghost.className = 'lh-drag-ghost';
              ghost.textContent = '💧 ' + (rObj ? rObj.label : rgKey);
              document.body.appendChild(ghost);
            }
            if (!dragging) return;
            ghost.style.left = e.clientX + 'px';
            ghost.style.top = e.clientY + 'px';
            const vr = vp.getBoundingClientRect();
            const svgX = ((e.clientX - vr.left) / vr.width) * 560;
            const svgY = ((e.clientY - vr.top) / vr.height) * 360;
            hitIdx = -1;
            if (svgY >= 50 && svgY <= 330) {
              tubePos.forEach(function (p, i) {
                if (Math.abs(svgX - p.cx) < 42) hitIdx = i;
              });
            }
            svg.querySelectorAll('[data-tube]').forEach(function (g, i) {
              g.classList.toggle('hover', i === hitIdx);
            });
          }
          function onUp() {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            if (ghost) ghost.remove();
            svg.querySelectorAll('[data-tube]').forEach(function (g) { g.classList.remove('hover'); });
            if (dragging && hitIdx >= 0) dropIntoTube(hitIdx, rgKey);
          }
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      });
    }

    function applyReaction(idx, rgKey) {
      const t = tubes[idx];
      const rKey = t.key + '|' + rgKey;
      let rxn = REACTIONS[rKey] || null;
      // Xử lý riêng Hồ tinh bột trên ống KI khi đã/chưa có I2
      if (t.key === 'KI' && rgKey === 'Starch') {
        if (!t.hasI2) {
          rxn = {
            A: 'KI (aq)', B: 'Hồ tinh bột', loai: 'khong',
            hienTuong: 'Dung dịch KI chỉ chứa ion I⁻ nên **chưa đổi màu**. Hãy nhỏ nước Cl2 hoặc Br2 để giải phóng I2 trước!',
            pt: 'I⁻ + Hồ tinh bột → Không đổi màu'
          };
        } else {
          t.hasStarchI2 = true;
          t.heated = false;
        }
      }
      // Nhỏ HCl vào ống NaOH đã có phenolphthalein làm mất màu hồng
      if (t.key === 'NaOH' && rgKey === 'HCl' && t.doneReagents['Phenol']) {
        rxn = {
          A: 'NaOH (hồng)', B: 'HCl 1M', loai: 'doiMau', mau: 'rgba(186,230,253,0.30)',
          hienTuong: 'Dung dịch **mất màu hồng** trở về trong suốt do phản ứng trung hòa H⁺ + OH⁻ → H2O.',
          pt: 'NaOH(aq) + HCl(aq) → NaCl(aq) + H2O(l)'
        };
      }

      if (!rxn) {
        obsEl.innerHTML = '<div class="lh-eq"><b>Ống ' + esc(t.label) + ' + ' + md(rgKey) + ':</b> Không xảy ra phản ứng hóa học rõ rệt.</div>';
        return;
      }

      t.doneReagents[rgKey] = true;
      t.lastRxn = rxn;
      selectedTube = idx;
      if (rxn.coI2) t.hasI2 = true;
      if (rxn.mau && !t.hasStarchI2) t.liqColor = rxn.mau;
      else if (rxn.laHoTinhBot) t.liqColor = rxn.mau;

      const liqEl = document.getElementById('lh-liq-' + idx);
      if (liqEl) liqEl.setAttribute('fill', t.liqColor);

      if (rxn.loai === 'ketTua') {
        t.pptColor = rxn.ketTuaMau;
        t.pptTarget = 1;
        const p = tubePos[idx];
        const countP = REDUCED_MOTION ? 14 : 38;
        for (let k = 0; k < countP; k++) {
          particles.push({
            x: p.cx + (Math.random() - 0.5) * 34,
            y: p.topY + 86 + Math.random() * 24,
            vx: (Math.random() - 0.5) * 18,
            vy: 18 + Math.random() * 28,
            r: 1.8 + Math.random() * 2.2,
            color: rxn.ketTuaMau,
            tube: idx,
            life: 1.8 + Math.random() * 0.7
          });
        }
      } else if (rxn.loai === 'khi') {
        t.gasRate = 1;
        t.vaporColor = rxn.khiMau || null;
      }

      const heatHtml = t.hasStarchI2
        ? '<div class="hang-nut" style="margin-top:8px"><button type="button" class="nut nho tim" id="lh-heat-i2">' + (t.heated ? '❄️ Để nguội ống KI' : '🔥 Đun nóng nhẹ ống KI') + '</button></div>'
        : '';
      const uvHtml = (t.key === 'NaCl' && rxn.loai === 'ketTua')
        ? '<div class="hang-nut" style="margin-top:8px"><button type="button" class="nut nho" id="lh-uv-agcl">☀️ Chiếu ánh sáng (2AgCl → 2Ag↓ + Cl₂)</button></div>'
        : '';

      obsEl.innerHTML =
        '<div class="lh-eq">' +
          '<div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:4px">' +
            '<b>Ống ' + esc(t.label) + ' + ' + md(rxn.B) + '</b>' +
            '<span class="chip ok">Đã phản ứng</span>' +
          '</div>' +
          '<div>' + md(rxn.hienTuong) + '</div>' +
          '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--vien);font-weight:700;color:var(--tim)">' + md(rxn.pt) + '</div>' +
          (rxn.ptIon ? '<div class="phu" style="font-size:12px;margin-top:2px">' + md('Ion rút gọn: ' + rxn.ptIon) + '</div>' : '') +
          heatHtml + uvHtml +
        '</div>';

      const hBtn = obsEl.querySelector('#lh-heat-i2');
      if (hBtn) {
        hBtn.onclick = function () {
          t.heated = !t.heated;
          t.liqColor = t.heated ? 'rgba(186,230,253,0.34)' : 'rgba(49,46,129,0.92)';
          if (liqEl) liqEl.setAttribute('fill', t.liqColor);
          hBtn.textContent = t.heated ? '❄️ Để nguội ống KI' : '🔥 Đun nóng nhẹ ống KI';
        };
      }
      const uvBtn = obsEl.querySelector('#lh-uv-agcl');
      if (uvBtn) {
        uvBtn.onclick = function () {
          t.pptColor = '#64748B';
          const pptEl = document.getElementById('lh-ppt-' + idx);
          if (pptEl) pptEl.setAttribute('fill', t.pptColor);
          uvBtn.textContent = '🌑 AgCl hóa xám đen ngoài ánh sáng!';
        };
      }

      if (rxn.micro) {
        mcap.textContent = rxn.micro.label;
      } else {
        mcap.textContent = 'Ống ' + t.label;
      }
      hudEl.textContent = 'Đã nhỏ ' + reagents.find(function (r) { return r.key === rgKey; }).label + ' vào ' + t.label;
      if (cfg.onReact) cfg.onReact(t, rgKey, rxn);
    }

    function dropIntoTube(idx, rgKey) {
      const p = tubePos[idx];
      if (!p) return;
      const rObj = reagents.find(function (x) { return x.key === rgKey; }) || reagents[0];
      pipette.tx = p.cx;
      pipette.ty = p.topY - 36;
      pipette.color = rObj.color;
      const pl = document.getElementById('lh-pip-liq');
      if (pl) pl.setAttribute('fill', pipette.color);

      SoundFX.drop();
      const delay = REDUCED_MOTION ? 40 : 180;
      for (let d = 0; d < 2; d++) {
        scope.timeout(function () {
          pipette.squeeze = 1;
          drops.push({
            x: p.cx, y: p.topY - 4, vy: 80, color: rObj.color === 'rgba(226,232,240,0.95)' ? '#BAE6FD' : rObj.color,
            targetY: p.topY + 82, idx: idx, trigger: d === 1, rgKey: rgKey
          });
        }, delay + d * 110);
      }
    }

    const qBtn = mountEl.querySelector('#lh-tt-quick');
    if (qBtn) {
      qBtn.onclick = function () {
        tubes.forEach(function (_, i) {
          scope.timeout(function () { dropIntoTube(i, selReagent); }, i * 260);
        });
      };
    }

    buildSvg();
    renderReagents();

    // Vòng lặp vẽ Canvas 60fps: giọt rơi, kết tủa lắng, bọt khí, hơi khí & kính lúp vi mô
    scope.loop(function (dt) {
      // Pipet lướt mượt tới vị trí mục tiêu
      pipette.x += (pipette.tx - pipette.x) * Math.min(1, dt * 12);
      pipette.y += (pipette.ty - pipette.y) * Math.min(1, dt * 12);
      pipette.squeeze = Math.max(0, pipette.squeeze - dt * 5);
      const pipG = document.getElementById('lh-pipette');
      if (pipG) pipG.setAttribute('transform', 'translate(' + pipette.x.toFixed(1) + ',' + pipette.y.toFixed(1) + ') scale(' + (1 - pipette.squeeze * 0.06).toFixed(3) + ',1)');

      // Chuyển đổi tọa độ viewBox 560x360 sang pixel canvas
      const box = fitCanvas(cv);
      const ctx = box.ctx; if (!ctx) return;
      ctx.clearRect(0, 0, box.w, box.h);
      const sc = Math.min(box.w / 560, box.h / 360);
      const ox = (box.w - 560 * sc) / 2;
      const oy = (box.h - 360 * sc) / 2;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(sc, sc);

      // Giọt rơi
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.vy += 680 * dt;
        d.y += d.vy * dt;
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 4, 0, Math.PI * 2);
        ctx.moveTo(d.x - 3.5, d.y);
        ctx.lineTo(d.x, d.y - 9);
        ctx.lineTo(d.x + 3.5, d.y);
        ctx.fill();
        if (d.y >= d.targetY) {
          tubes[d.idx].ripple = 1;
          if (d.trigger) applyReaction(d.idx, d.rgKey);
          drops.splice(i, 1);
        }
      }

      // Gợn sóng mặt thoáng + tăng dần lớp kết tủa đáy ống + sủi khí
      tubes.forEach(function (t, i) {
        const p = tubePos[i];
        if (t.ripple > 0) {
          t.ripple = Math.max(0, t.ripple - dt * 2.2);
          ctx.strokeStyle = 'rgba(255,255,255,' + (t.ripple * 0.7) + ')';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(p.cx, p.topY + 82, (1 - t.ripple) * 20 + 4, 3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        if (t.pptLevel < t.pptTarget) {
          t.pptLevel = Math.min(t.pptTarget, t.pptLevel + dt * 0.55);
          const pptEl = document.getElementById('lh-ppt-' + i);
          if (pptEl && t.pptColor) {
            const x = p.cx - p.w / 2, bot = p.topY + p.h, topP = bot - 12 - t.pptLevel * 22;
            pptEl.setAttribute('d', 'M' + x + ' ' + topP.toFixed(1) + ' Q' + p.cx + ' ' + (topP - 5).toFixed(1) + ' ' + (x + p.w) + ' ' + topP.toFixed(1) + ' V' + (bot + 4) + ' H' + x + ' Z');
            pptEl.setAttribute('fill', t.pptColor);
          }
        }
        if (t.gasRate > 0 && Math.random() < (REDUCED_MOTION ? 0.15 : 0.45)) {
          bubbles.push({
            x: p.cx + (Math.random() - 0.5) * 24,
            y: p.topY + p.h - 14,
            vy: 45 + Math.random() * 55,
            r: 1.6 + Math.random() * 2.2,
            top: p.topY + 84
          });
          if (t.vaporColor && Math.random() < 0.35) {
            vapors.push({
              x: p.cx + (Math.random() - 0.5) * 18,
              y: p.topY - 2,
              vx: (Math.random() - 0.5) * 12,
              vy: -22 - Math.random() * 18,
              r: 6 + Math.random() * 8,
              life: 1,
              color: t.vaporColor
            });
          }
        }
      });

      // Hạt kết tủa lơ lửng rơi xuống đáy
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vx *= 0.96;
        pt.life -= dt;
        const p = tubePos[pt.tube];
        if (pt.x < p.cx - 21) pt.x = p.cx - 21;
        if (pt.x > p.cx + 21) pt.x = p.cx + 21;
        ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, Math.min(p.topY + p.h - 12, pt.y), pt.r, 0, Math.PI * 2);
        ctx.fill();
        if (pt.life <= 0) particles.splice(i, 1);
      }
      ctx.globalAlpha = 1;

      // Bọt khí
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.vy * dt;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
        if (b.y <= b.top) bubbles.splice(i, 1);
      }

      // Khói / hơi màu bay lên từ miệng ống
      for (let i = vapors.length - 1; i >= 0; i--) {
        const v = vapors[i];
        v.x += v.vx * dt;
        v.y += v.vy * dt;
        v.r += 7 * dt;
        v.life -= dt * 0.55;
        ctx.globalAlpha = Math.max(0, v.life * 0.55);
        ctx.fillStyle = v.color;
        ctx.beginPath();
        ctx.arc(v.x, v.y, v.r, 0, Math.PI * 2);
        ctx.fill();
        if (v.life <= 0) vapors.splice(i, 1);
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // Kính lúp vi mô
      if (microOn) {
        const mb = fitCanvas(mcv);
        const mx = mb.ctx; if (!mx) return;
        mx.clearRect(0, 0, mb.w, mb.h);
        const cur = tubes[selectedTube] && tubes[selectedTube].lastRxn && tubes[selectedTube].lastRxn.micro;
        const c1 = cur ? cur.cations : ['Ion⁺', '#BAE6FD'];
        const c2 = cur ? cur.anions : ['X⁻', '#A7F3D0'];
        const isPrecip = cur && cur.mode === 'precip';
        microParticles.forEach(function (mp, idx) {
          if (isPrecip && idx > 5) {
            // Hút tụ xuống đáy kính lúp thành tinh thể kết tủa
            const row = Math.floor((idx - 6) / 6), col = (idx - 6) % 6;
            const tx = 0.25 + col * 0.1, ty = 0.72 + (row % 3) * 0.08;
            mp.x += (tx - mp.x) * Math.min(1, dt * 2.4);
            mp.y += (ty - mp.y) * Math.min(1, dt * 2.4);
          } else {
            mp.x += mp.vx * dt; mp.y += mp.vy * dt;
            if (mp.x < 0.12 || mp.x > 0.88) mp.vx *= -1;
            if (mp.y < 0.14 || mp.y > 0.78) mp.vy *= -1;
          }
          const px = mp.x * mb.w, py = mp.y * mb.h;
          const lbl = mp.kind ? c1[0] : c2[0];
          const col = mp.kind ? c1[1] : c2[1];
          mx.fillStyle = col;
          mx.beginPath(); mx.arc(px, py, 9, 0, Math.PI * 2); mx.fill();
          mx.fillStyle = '#0F172A';
          mx.font = '800 8.5px "Be Vietnam Pro",sans-serif';
          mx.textAlign = 'center'; mx.textBaseline = 'middle';
          mx.fillText(lbl, px, py);
        });
      }
    });

    return {
      toggleMicro: function (btn) {
        microOn = !microOn;
        microBox.classList.toggle('on', microOn);
        if (btn) btn.classList.toggle('tim', microOn);
      },
      extraSlot: mountEl.querySelector('#lh-tt-extra'),
      tubes: tubes,
      dropIntoTube: dropIntoTube
    };
  }

  function mountHalideLab(mainEl, scope, sub, isOngNghiem) {
    if (isOngNghiem) {
      const meta = EXTRA_LABS['ong-nghiem'];
      buildToolbar(mainEl, meta, 'co-ban', {
        hasMicro: true,
        onMicro: function (b) { bench.toggleMicro(b); },
        onReset: function () { mountLab('ong-nghiem', 'co-ban'); }
      });
      const host = document.createElement('div');
      mainEl.appendChild(host);
      const bench = createTestTubeBench(host, scope, {
        tubes: [
          { key: 'CaCO3', label: 'CaCO₃', sub: 'Đá vôi + H₂O', solidType: 'chips' },
          { key: 'Zn', label: 'Kẽm Zn', sub: 'Viên kẽm', solidType: 'metal' },
          { key: 'CuSO4', label: 'CuSO₄', sub: 'Xanh lam', liqColor: 'rgba(14,165,233,0.45)' },
          { key: 'NaOH', label: 'NaOH', sub: 'Kiềm không màu' }
        ],
        reagents: [
          { key: 'HCl', label: 'HCl 1M', note: 'Acid mạnh', color: '#E2E8F0' },
          { key: 'NaOH', label: 'NaOH 1M', note: 'Kiềm tạo tủa', color: '#BAE6FD' },
          { key: 'Phenol', label: 'Phenolphthalein', note: 'Chỉ thị pH', color: '#EC4899' }
        ],
        quickBtn: null
      });
      bench.extraSlot.innerHTML =
        '<div class="lh-card"><h3>📋 Bảng phản ứng mẫu (dạng dữ liệu)</h3>' +
        '<table class="lh-tbl"><tr><th>Ống + Thuốc thử</th><th>Hiện tượng</th></tr>' +
        '<tr><td>CaCO₃ + HCl</td><td>Sủi bọt khí CO₂↑</td></tr>' +
        '<tr><td>Zn + HCl</td><td>Sủi bọt khí H₂↑</td></tr>' +
        '<tr><td>CuSO₄ + NaOH</td><td>Kết tủa xanh lam Cu(OH)₂↓</td></tr>' +
        '<tr><td>NaOH + Phenolphthalein</td><td>Hồng cánh sen (thêm HCl mất màu)</td></tr></table></div>';
      return;
    }

    const meta = LAB_LIST[0];
    let curSub = sub || 'ag';
    if (['ag', 'the', 'game'].indexOf(curSub) < 0) curSub = 'ag';
    let bench = null;

    buildToolbar(mainEl, meta, curSub, {
      hasMicro: true,
      onSub: function (ns) { window.location.hash = '#halide?sub=' + ns; },
      onMicro: function (b) { if (bench) bench.toggleMicro(b); },
      onReset: function () { mountLab('halide', curSub); }
    });
    const host = document.createElement('div');
    mainEl.appendChild(host);

    if (curSub === 'ag') {
      bench = createTestTubeBench(host, scope, {
        tubes: [
          { key: 'NaF', label: 'NaF', sub: 'Ion F⁻' },
          { key: 'NaCl', label: 'NaCl', sub: 'Ion Cl⁻' },
          { key: 'NaBr', label: 'NaBr', sub: 'Ion Br⁻' },
          { key: 'NaI', label: 'NaI', sub: 'Ion I⁻' }
        ],
        reagents: [
          { key: 'AgNO3', label: 'AgNO₃ 0,1M', note: 'Thuốc thử halide', color: '#E2E8F0' },
          { key: 'HNO3', label: 'HNO₃ loãng', note: 'Thử độ tan tủa', color: '#BAE6FD' }
        ],
        quickBtn: '💧 Nhỏ AgNO₃ cả 4 ống'
      });
      bench.extraSlot.innerHTML =
        '<div class="lh-card"><h3>🎯 Ghi nhớ nhanh (SGK Bài 22)</h3>' +
        '<div class="lh-pills">' +
          '<span class="chip sky">AgF: Tan (trong suốt)</span>' +
          '<span class="chip">AgCl↓: Trắng</span>' +
          '<span class="chip canh">AgBr↓: Vàng nhạt</span>' +
          '<span class="chip" style="background:#FEF08A;color:#854D0E;border-color:#FACC15">AgI↓: Vàng đậm</span>' +
        '</div></div>';
    } else if (curSub === 'the') {
      let cheDo = 'dd';
      let subScope = null;
      scope.onCleanup(function () { if (subScope) { subScope.destroy(); subScope = null; } });
      const subBar = document.createElement('div');
      subBar.className = 'lh-pills';
      subBar.style.marginBottom = '10px';
      subBar.innerHTML =
        '<button type="button" class="lh-pill-btn on" data-m="dd">1. Phản ứng thế Halogen (Cl₂ > Br₂ > I₂)</button>' +
        '<button type="button" class="lh-pill-btn" data-m="ran">2. Muối rắn + H₂SO₄ đặc (tính khử tăng dần)</button>';
      host.appendChild(subBar);
      const wrap = document.createElement('div');
      host.appendChild(wrap);

      function renderThe() {
        if (subScope) { subScope.destroy(); subScope = null; }
        subScope = createScope();
        subBar.querySelectorAll('[data-m]').forEach(function (b) {
          b.classList.toggle('on', b.getAttribute('data-m') === cheDo);
        });
        if (cheDo === 'dd') {
          bench = createTestTubeBench(wrap, subScope, {
            tubes: [
              { key: 'NaCl', label: 'dd NaCl', sub: 'Cl⁻' },
              { key: 'NaBr', label: 'dd NaBr', sub: 'Br⁻' },
              { key: 'KI', label: 'dd KI', sub: 'I⁻' }
            ],
            reagents: [
              { key: 'Cl2', label: 'Nước Cl₂', note: 'Vàng lục nhạt', color: '#BEF264' },
              { key: 'Br2', label: 'Nước Br₂', note: 'Vàng cam', color: '#F97316' },
              { key: 'Starch', label: 'Hồ tinh bột', note: 'Nhận biết I₂', color: '#F8FAFC' }
            ]
          });
          bench.extraSlot.innerHTML =
            '<div class="lh-card"><h3>⚡ Mẹo thực hành</h3><div class="phu">Nhỏ <b>Nước Cl₂</b> vào <b>KI</b> cho màu nâu I₂, sau đó nhỏ tiếp <b>Hồ tinh bột</b> để thấy phức xanh tím! Thử đun nóng để xem hiện tượng mất màu rồi hiện lại khi nguội.</div></div>';
        } else {
          bench = createTestTubeBench(wrap, subScope, {
            tubes: [
              { key: 'NaCl_s', label: 'NaCl (rắn)', sub: 'Tinh thể trắng', solidType: 'powder', solidColor: '#F8FAFC', liqColor: 'transparent' },
              { key: 'NaBr_s', label: 'NaBr (rắn)', sub: 'Tinh thể trắng', solidType: 'powder', solidColor: '#F1F5F9', liqColor: 'transparent' },
              { key: 'NaI_s', label: 'NaI (rắn)', sub: 'Tinh thể trắng', solidType: 'powder', solidColor: '#E2E8F0', liqColor: 'transparent' }
            ],
            reagents: [
              { key: 'H2SO4', label: 'H₂SO₄ đặc', note: 'Acid đặc nóng', color: '#FDE68A' }
            ],
            quickBtn: '💧 Nhỏ H₂SO₄ đặc cả 3 ống'
          });
          bench.extraSlot.innerHTML =
            '<div class="lh-card"><h3>📉 Tính khử: Cl⁻ &lt; Br⁻ &lt; I⁻</h3><div class="phu">Vì Br⁻ và I⁻ khử được H₂SO₄ đặc thành Br₂ / I₂ + SO₂ / H₂S nên <b>không thể điều chế HBr, HI</b> bằng phương pháp sunfat như HCl!</div></div>';
        }
      }

        b.onclick = function () { SoundFX.click(); cheDo = b.getAttribute('data-m'); renderThe(); };
      });
      renderThe();
    } else {
      // Chế độ Giải mã 4 lọ mất nhãn (X, Y, Z, T)
      const ds = ['NaF', 'NaCl', 'NaBr', 'NaI'].sort(function () { return Math.random() - 0.5; });
      const tenLo = ['Lọ X', 'Lọ Y', 'Lọ Z', 'Lọ T'];
      bench = createTestTubeBench(host, scope, {
        tubes: ds.map(function (k, i) { return { key: k, label: tenLo[i], sub: 'Mất nhãn' }; }),
        reagents: [
          { key: 'AgNO3', label: 'AgNO₃ 0,1M', note: 'Nhỏ nhận biết', color: '#E2E8F0' },
          { key: 'Cl2', label: 'Nước Cl₂', note: 'Thử đối chiếu', color: '#BEF264' }
        ],
        quickBtn: '💧 Nhỏ AgNO₃ cả 4 lọ'
      });
      bench.extraSlot.innerHTML =
        '<div class="lh-card">' +
          '<h3>🕵️ Phiếu giải mã 4 lọ mất nhãn</h3>' +
          '<p class="phu" style="margin:0 0 8px">Nhỏ thuốc thử vào X, Y, Z, T rồi chọn đúng chất trong mỗi lọ:</p>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
            tenLo.map(function (nm, i) {
              return '<div class="truong"><label>' + nm + '</label><select data-guess="' + i + '">' +
                '<option value="">-- Chọn chất --</option>' +
                '<option value="NaF">NaF</option><option value="NaCl">NaCl</option><option value="NaBr">NaBr</option><option value="NaI">NaI</option>' +
              '</select></div>';
            }).join('') +
          '</div>' +
          '<div class="hang-nut" style="margin-top:10px">' +
            '<button type="button" class="nut chinh" id="lh-hl-check">✓ Chấm điểm</button>' +
            '<button type="button" class="nut" id="lh-hl-new">🔀 Đảo 4 lọ mới</button>' +
          '</div>' +
          '<div id="lh-hl-res" style="margin-top:8px"></div>' +
        '</div>';

      bench.extraSlot.querySelector('#lh-hl-new').onclick = function () { SoundFX.click(); mountLab('halide', 'game'); };
      bench.extraSlot.querySelector('#lh-hl-check').onclick = function () {
        let dung = 0;
        const selects = bench.extraSlot.querySelectorAll('[data-guess]');
        selects.forEach(function (sel, i) {
          if (sel.value === ds[i]) dung++;
        });
        const resEl = bench.extraSlot.querySelector('#lh-hl-res');
        if (dung === 4) {
          SoundFX.win();
          phaoGiay(65);
          resEl.innerHTML = '<div class="thongbao ok" style="margin:0"><b>Xuất sắc 4/4!</b> Em đã nhận diện chuẩn xác cả 4 muối halide!</div>';
        } else {
          SoundFX.error();
          resEl.innerHTML = '<div class="thongbao canh" style="margin:0">Đúng <b>' + dung + '/4</b> lọ. Hãy nhỏ <b>AgNO₃</b> quan sát kỹ màu trắng / vàng nhạt / vàng / tan nhé!</div>';
        }
      };
    }
  }

  /* ============================================================================
   * LAB 2: TỐC ĐỘ PHẢN ỨNG (toc-do: Xi-lanh thu khí & Dấu × biến mất)
   * Chuẩn SGK Bài 19-20: 0,004 mol khí => V_max = 0,004 * 24,79 * 1000 = 99,2 mL (đkc)
   * ============================================================================ */
  function mountTocDoLab(mainEl, scope, sub) {
    const meta = LAB_LIST[1];
    let curSub = sub === 'chu-thap' ? 'chu-thap' : 'xilanh';
    let microOn = false;

    buildToolbar(mainEl, meta, curSub, {
      hasMicro: curSub === 'xilanh',
      onSub: function (ns) { window.location.hash = '#toc-do?sub=' + ns; },
      onMicro: function (b) {
        microOn = !microOn;
        b.classList.toggle('tim', microOn);
        const ml = document.getElementById('lh-td-micro');
        if (ml) ml.classList.toggle('on', microOn);
      },
      onReset: function () { mountLab('toc-do', curSub); }
    });

    const host = document.createElement('div');
    mainEl.appendChild(host);

    if (curSub === 'xilanh') {
      const V_MAX = 99.2; // 0.004 mol * 24.79 L/mol * 1000 mL/L (đkc 25°C, 1 bar)
      const RXNS = {
        caco3: { ten: 'CaCO₃ + HCl', pt: 'CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + CO₂↑ + H₂O(l)', solid: true, cat: false, baseK: 0.09, liq: 'rgba(186,230,253,0.34)' },
        zn: { ten: 'Zn + HCl', pt: 'Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂↑', solid: true, cat: false, baseK: 0.075, liq: 'rgba(186,230,253,0.34)' },
        h2o2: { ten: 'H₂O₂ (xúc tác MnO₂)', pt: '2H₂O₂(aq) --(MnO₂)--> 2H₂O(l) + O₂↑', solid: false, cat: true, baseK: 0.012, liq: 'rgba(224,242,254,0.36)' }
      };

      const st = {
        rxn: 'caco3', conc: 1.0, temp: 25, surf: 1.0, cat: false,
        running: false, t: 0, V: 0, curve: [], pinned: null,
        bubbles: [], microPts: []
      };
      for (let i = 0; i < 28; i++) {
        st.microPts.push({ x: Math.random(), y: Math.random(), a: Math.random() * Math.PI * 2, flash: 0 });
      }

      function rateConst() {
        const r = RXNS[st.rxn];
        const fConc = Math.pow(st.conc, 1.05);
        const fTemp = Math.pow(2, (st.temp - 25) / 10); // Hệ số Van't Hoff γ = 2
        const fSurf = r.solid ? st.surf : 1;
        const fCat = r.cat ? (st.cat ? 10.5 : 1) : 1;
        return r.baseK * fConc * fTemp * fSurf * fCat;
      }

      host.innerHTML =
        '<div class="lh-stage-grid">' +
          '<div>' +
            '<div class="lh-viewport" style="height:335px">' +
              '<div class="lh-hud-top">' +
                '<div class="lh-hud-badge" id="lh-td-clock">⏱️ 0,0 s · V = 0,0 mL (đkc)</div>' +
                '<div class="lh-hud-badge" id="lh-td-rate">Hệ số tốc độ: ×1,0</div>' +
              '</div>' +
              '<svg class="lh-svg" id="lh-td-svg" viewBox="0 0 560 320">' +
                '<defs><linearGradient id="tdGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(255,255,255,0.28)"/><stop offset="50%" stop-color="rgba(255,255,255,0.05)"/><stop offset="100%" stop-color="rgba(255,255,255,0.24)"/></linearGradient></defs>' +
                // Bếp gia nhiệt ổn nhiệt dưới bình
                '<rect x="52" y="250" width="136" height="24" rx="6" fill="#334155" stroke="#64748B" stroke-width="1.5"/>' +
                '<rect id="lh-td-coil" x="66" y="246" width="108" height="5" rx="2" fill="#475569"/>' +
                '<text id="lh-td-tdisp" x="120" y="266" fill="#FDE047" font-size="11" font-weight="800" text-anchor="middle">25 °C</text>' +
                // Bình tam giác
                '<path d="M104 92 H136 V130 L172 232 A10 10 0 0 1 162 246 H78 A10 10 0 0 1 68 232 L104 130 Z" fill="url(#tdGlass)" stroke="#CBD5E1" stroke-width="2.4"/>' +
                '<path id="lh-td-liq" d="M84 188 H156 L171 232 A9 9 0 0 1 162 245 H78 A9 9 0 0 1 69 232 Z" fill="rgba(186,230,253,0.34)"/>' +
                '<g id="lh-td-solids"></g>' +
                // Nút cao su & ống dẫn khí
                '<path d="M105 78 H135 L132 98 H108 Z" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>' +
                '<path d="M120 82 V50 H252 V132 H276" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
                // Giá đỡ & Xi-lanh thu khí 0-100 mL
                '<rect x="330" y="156" width="14" height="114" fill="#475569"/><rect x="304" y="264" width="66" height="10" rx="3" fill="#64748B"/>' +
                '<rect x="276" y="106" width="186" height="52" rx="6" fill="rgba(255,255,255,0.12)" stroke="#E2E8F0" stroke-width="2.4"/>' +
                '<rect id="lh-td-gasfill" x="278" y="108" width="4" height="48" fill="rgba(56,189,248,0.20)"/>' +
                // Vạch chia 0..100 mL
                '<g id="lh-td-ticks"></g>' +
                // Pít-tông trượt theo V
                '<g id="lh-td-piston" transform="translate(282,0)">' +
                  '<rect x="0" y="109" width="16" height="46" rx="3" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>' +
                  '<rect x="16" y="128" width="96" height="8" rx="3" fill="#CBD5E1"/>' +
                  '<rect x="110" y="116" width="9" height="32" rx="3" fill="#94A3B8"/>' +
                '</g>' +
                '<text x="369" y="182" fill="#BAE6FD" font-size="11.5" font-weight="800" text-anchor="middle">Xi-lanh thu khí (0 – 100 mL)</text>' +
              '</svg>' +
              '<canvas class="lh-cv" id="lh-td-cv"></canvas>' +
              '<div class="lh-micro-lens" id="lh-td-micro"><canvas id="lh-td-mcv"></canvas><div class="lh-micro-cap">Va chạm hiệu quả</div></div>' +
            '</div>' +
            '<div class="lh-card" style="margin-top:10px">' +
              '<h3>🎛️ Điều chỉnh 4 yếu tố tốc độ phản ứng</h3>' +
              '<div class="lh-pills" id="lh-td-rxns" style="margin-bottom:8px"></div>' +
              '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px">' +
                '<div><div class="nhan-o" style="margin-bottom:5px" id="lh-td-clbl">Nồng độ dung dịch</div><div class="lh-pills" id="lh-td-conc"></div></div>' +
                '<div><div class="nhan-o" style="margin-bottom:5px">Nhiệt độ (Van’t Hoff γ = 2)</div><div class="lh-pills" id="lh-td-temp"></div></div>' +
                '<div id="lh-td-surfbox"><div class="nhan-o" style="margin-bottom:5px" id="lh-td-slbl">Diện tích bề mặt</div><div class="lh-pills" id="lh-td-surf"></div></div>' +
              '</div>' +
              '<div class="hang-nut" style="margin-top:10px">' +
                '<button type="button" class="nut chinh" id="lh-td-go">▶ Chạy phản ứng</button>' +
                '<button type="button" class="nut tim" id="lh-td-pin">📌 Ghim làm Lần 1</button>' +
                '<button type="button" class="nut" id="lh-td-rst">↺ Xóa &amp; Thử lại</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="lh-panel">' +
            '<div class="lh-card">' +
              '<h3>📈 Đồ thị Thể tích khí theo thời gian V(t)</h3>' +
              '<div class="lh-chart-box"><canvas id="lh-td-chart"></canvas></div>' +
              '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:7px">' +
                '<span style="color:#0284C7;font-weight:700">━━ Lần hiện tại</span>' +
                '<span id="lh-td-pin-lbl" style="color:#D97706;font-weight:700">┈┈ Chưa ghim Lần 1</span>' +
                '<span class="phu" style="margin-left:auto">V_max = 99,2 mL (đkc 24,79 L/mol)</span>' +
              '</div>' +
            '</div>' +
            '<div class="lh-card">' +
              '<h3>⚗️ Phương trình &amp; Công thức Van’t Hoff</h3>' +
              '<div class="lh-eq" id="lh-td-eq"></div>' +
              '<div class="lh-metrics" style="margin-top:8px">' +
                '<div class="lh-stat"><span>Thể tích khí V</span><b id="lh-td-vstat">0,0 mL</b></div>' +
                '<div class="lh-stat"><span>Hệ số Van’t Hoff</span><b id="lh-td-vh">×1</b></div>' +
                '<div class="lh-stat"><span>Tốc độ đầu tương đối</span><b id="lh-td-v0">×1,0</b></div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      // Vẽ vạch chia ml trên xi-lanh
      const tickG = host.querySelector('#lh-td-ticks');
      let th = '';
      for (let ml = 0; ml <= 100; ml += 20) {
        const tx = 282 + (ml / 100) * 140;
        th += '<line x1="' + tx + '" y1="106" x2="' + tx + '" y2="117" stroke="#E2E8F0" stroke-width="1.4"/>' +
          '<text x="' + tx + '" y="100" fill="#CBD5E1" font-size="9.5" font-weight="700" text-anchor="middle">' + ml + '</text>';
      }
      tickG.innerHTML = th;

      function updateControlsUI() {
        const rxnBox = host.querySelector('#lh-td-rxns');
        rxnBox.innerHTML = Object.keys(RXNS).map(function (k) {
          return '<button type="button" class="lh-pill-btn' + (st.rxn === k ? ' on' : '') + '" data-r="' + k + '">' + esc(RXNS[k].ten) + '</button>';
        }).join('');
        rxnBox.querySelectorAll('[data-r]').forEach(function (b) {
          b.onclick = function () { SoundFX.click(); st.rxn = b.getAttribute('data-r'); resetRun(); updateControlsUI(); };
        });

        const concs = st.rxn === 'h2o2' ? [[0.5, '3%'], [1.0, '6%'], [2.0, '12%']] : [[0.5, '0,5 M'], [1.0, '1,0 M'], [2.0, '2,0 M']];
        host.querySelector('#lh-td-conc').innerHTML = concs.map(function (c) {
          return '<button type="button" class="lh-pill-btn' + (st.conc === c[0] ? ' on' : '') + '" data-c="' + c[0] + '">' + c[1] + '</button>';
        }).join('');
        host.querySelectorAll('#lh-td-conc [data-c]').forEach(function (b) {
          b.onclick = function () { SoundFX.click(); st.conc = Number(b.getAttribute('data-c')); updateReadouts(); updateControlsUI(); };
        });

        host.querySelector('#lh-td-temp').innerHTML = [25, 35, 45].map(function (tp) {
          return '<button type="button" class="lh-pill-btn' + (st.temp === tp ? ' on' : '') + '" data-t="' + tp + '">' + tp + ' °C</button>';
        }).join('');
        host.querySelectorAll('#lh-td-temp [data-t]').forEach(function (b) {
          b.onclick = function () { SoundFX.click(); st.temp = Number(b.getAttribute('data-t')); updateReadouts(); updateControlsUI(); };
        });

        const sBox = host.querySelector('#lh-td-surf');
        if (RXNS[st.rxn].solid) {
          host.querySelector('#lh-td-slbl').textContent = 'Kích thước hạt (Diện tích bề mặt)';
          sBox.innerHTML = [[1.0, 'Viên to'], [1.8, 'Hạt nhỏ'], [3.0, 'Bột mịn']].map(function (s) {
            return '<button type="button" class="lh-pill-btn' + (st.surf === s[0] ? ' on' : '') + '" data-s="' + s[0] + '">' + s[1] + '</button>';
          }).join('');
          sBox.querySelectorAll('[data-s]').forEach(function (b) {
            b.onclick = function () { SoundFX.click(); st.surf = Number(b.getAttribute('data-s')); updateReadouts(); updateControlsUI(); };
          });
        } else {
          host.querySelector('#lh-td-slbl').textContent = 'Chất xúc tác MnO₂';
          sBox.innerHTML = [[false, 'Không MnO₂'], [true, 'Có MnO₂']].map(function (s) {
            return '<button type="button" class="lh-pill-btn' + (st.cat === s[0] ? ' on' : '') + '" data-cat="' + (s[0] ? '1' : '0') + '">' + s[1] + '</button>';
          }).join('');
          sBox.querySelectorAll('[data-cat]').forEach(function (b) {
            b.onclick = function () { SoundFX.click(); st.cat = b.getAttribute('data-cat') === '1'; updateReadouts(); updateControlsUI(); };
          });
        }
        updateReadouts();
      }

      function updateReadouts() {
        const r = RXNS[st.rxn];
        host.querySelector('#lh-td-eq').innerHTML = '<div><b>' + md(r.pt) + '</b></div>' +
          '<div class="phu" style="font-size:12px;margin-top:4px">Cùng lượng chất thiếu 0,004 mol → đường đồ thị khác độ dốc nhưng hội tụ tại đúng <b>99,2 mL</b>!</div>';
        host.querySelector('#lh-td-tdisp').textContent = st.temp + ' °C';
        host.querySelector('#lh-td-coil').setAttribute('fill', st.temp === 45 ? '#EF4444' : st.temp === 35 ? '#F59E0B' : '#475569');
        host.querySelector('#lh-td-liq').setAttribute('fill', r.liq);
        const solG = host.querySelector('#lh-td-solids');
        if (r.solid) {
          if (st.surf >= 2.8) solG.innerHTML = '<path d="M88 242 Q120 232 152 242 Z" fill="#E2E8F0"/>';
          else if (st.surf >= 1.5) solG.innerHTML = '<circle cx="102" cy="239" r="4.5" fill="#CBD5E1"/><circle cx="118" cy="240" r="4" fill="#E2E8F0"/><circle cx="134" cy="238" r="4.5" fill="#CBD5E1"/>';
          else solG.innerHTML = '<rect x="108" y="231" width="24" height="12" rx="4" fill="#CBD5E1"/>';
        } else {
          solG.innerHTML = st.cat ? '<path d="M100 243 Q120 235 140 243 Z" fill="#1E293B"/>' : '';
        }

        const vhFactor = Math.pow(2, (st.temp - 25) / 10);
        const rel = rateConst() / (r.baseK * 1.0);
        host.querySelector('#lh-td-vh').textContent = '×' + vhFactor + ' (so 25°C)';
        host.querySelector('#lh-td-v0').textContent = '×' + fmtNum(rel, 1);
        host.querySelector('#lh-td-rate').textContent = 'Tốc độ đầu: ×' + fmtNum(rel, 1);
      }

      function resetRun() {
        st.running = false; st.t = 0; st.V = 0; st.curve = [{ t: 0, V: 0 }]; st.bubbles = [];
        host.querySelector('#lh-td-go').textContent = '▶ Chạy phản ứng';
        syncSyringe(); drawChart();
      }

      function syncSyringe() {
        const px = 282 + (st.V / 100) * 140;
        host.querySelector('#lh-td-piston').setAttribute('transform', 'translate(' + px.toFixed(1) + ',0)');
        host.querySelector('#lh-td-gasfill').setAttribute('width', Math.max(2, px - 280).toFixed(1));
        host.querySelector('#lh-td-clock').textContent = '⏱️ ' + fmtNum(st.t, 1) + ' s · V = ' + fmtNum(st.V, 1) + ' mL';
        host.querySelector('#lh-td-vstat').textContent = fmtNum(st.V, 1) + ' mL';
      }

      function drawChart() {
        const cvC = host.querySelector('#lh-td-chart');
        const b = fitCanvas(cvC);
        const ctx = b.ctx; if (!ctx) return;
        ctx.clearRect(0, 0, b.w, b.h);
        const pad = { l: 40, r: 12, t: 12, b: 26 };
        const pw = b.w - pad.l - pad.r, ph = b.h - pad.t - pad.b;
        const maxT = Math.max(30, st.t + 2, st.pinned ? st.pinned[st.pinned.length - 1].t : 30);

        ctx.strokeStyle = 'rgba(148,163,184,0.28)';
        ctx.lineWidth = 1;
        for (let v = 0; v <= 100; v += 25) {
          const y = pad.t + ph - (v / 105) * ph;
          ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + pw, y); ctx.stroke();
          ctx.fillStyle = '#64748B'; ctx.font = '600 10px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'right';
          ctx.fillText(v + ' mL', pad.l - 5, y + 3);
        }
        // Đường giới hạn 99,2 mL
        const yMax = pad.t + ph - (V_MAX / 105) * ph;
        ctx.setLineDash([4, 4]); ctx.strokeStyle = '#94A3B8';
        ctx.beginPath(); ctx.moveTo(pad.l, yMax); ctx.lineTo(pad.l + pw, yMax); ctx.stroke();
        ctx.setLineDash([]);

        function plot(arr, color, dashed) {
          if (!arr || arr.length < 2) return;
          ctx.strokeStyle = color; ctx.lineWidth = 2.6;
          if (dashed) ctx.setLineDash([6, 4]);
          ctx.beginPath();
          arr.forEach(function (pt, idx) {
            const x = pad.l + (pt.t / maxT) * pw;
            const y = pad.t + ph - (pt.V / 105) * ph;
            if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          });
          ctx.stroke();
          ctx.setLineDash([]);
        }
        if (st.pinned) plot(st.pinned, '#D97706', true);
        plot(st.curve, '#0284C7', false);
        ctx.fillStyle = '#64748B'; ctx.font = '700 10.5px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Thời gian t (s)', pad.l + pw / 2, b.h - 6);
      }

      host.querySelector('#lh-td-go').onclick = function () {
        if (st.V >= V_MAX - 0.15) resetRun();
        st.running = !st.running;
        SoundFX.click();
        this.textContent = st.running ? '⏸ Tạm dừng' : '▶ Tiếp tục';
      };
      host.querySelector('#lh-td-pin').onclick = function () {
        if (st.curve.length < 2) { H10.toast('Hãy chạy Lần 1 vài giây rồi bấm ghim nhé!'); return; }
        st.pinned = st.curve.slice();
        host.querySelector('#lh-td-pin-lbl').textContent = '┈┈ Lần 1 đã ghim';
        SoundFX.click();
        resetRun();
      };
      host.querySelector('#lh-td-rst').onclick = function () {
        SoundFX.click();
        st.pinned = null;
        host.querySelector('#lh-td-pin-lbl').textContent = '┈┈ Chưa ghim Lần 1';
        resetRun();
      };

      resetRun();
      updateControlsUI();

      scope.loop(function (dt) {
        if (st.running && st.V < V_MAX - 0.1) {
          st.t += dt;
          const k = rateConst();
          const newV = V_MAX * (1 - Math.exp(-k * st.t));
          const instRate = (newV - st.V) / dt;
          st.V = Math.min(V_MAX, newV);
          const lastPt = st.curve[st.curve.length - 1];
          if (!lastPt || st.t - lastPt.t >= 0.2) st.curve.push({ t: st.t, V: st.V });
          if (Math.random() < Math.min(0.85, instRate / 22)) {
            st.bubbles.push({ x: 100 + Math.random() * 40, y: 240, vy: 45 + Math.random() * 65, r: 1.5 + Math.random() * 2.2 });
            if (Math.random() < 0.12) SoundFX.bubble();
          }
          if (st.V >= V_MAX - 0.1) {
            st.V = V_MAX; st.running = false;
            host.querySelector('#lh-td-go').textContent = '✓ Hoàn thành (Chạy lại)';
            SoundFX.win();
          }
          syncSyringe(); drawChart();
        }
        const cvEl = host.querySelector('#lh-td-cv');
        const bx = fitCanvas(cvEl);
        const ctx = bx.ctx;
        if (ctx) {
          ctx.clearRect(0, 0, bx.w, bx.h);
          const sc = Math.min(bx.w / 560, bx.h / 320);
          ctx.save(); ctx.translate((bx.w - 560 * sc) / 2, (bx.h - 320 * sc) / 2); ctx.scale(sc, sc);
          for (let i = st.bubbles.length - 1; i >= 0; i--) {
            const b = st.bubbles[i];
            b.y -= b.vy * dt;
            ctx.strokeStyle = 'rgba(255,255,255,0.78)'; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
            if (b.y < 188) st.bubbles.splice(i, 1);
          }
          ctx.restore();
        }
        if (microOn) {
          const mb = fitCanvas(host.querySelector('#lh-td-mcv'));
          const mx = mb.ctx; if (!mx) return;
          mx.clearRect(0, 0, mb.w, mb.h);
          const spd = (0.35 + (st.temp - 25) * 0.022) * (st.conc >= 2 ? 1.2 : 1);
          const activeN = Math.round(10 + st.conc * 8);
          mx.fillStyle = '#64748B'; mx.fillRect(0, mb.h * 0.78, mb.w, mb.h * 0.22);
          st.microPts.slice(0, activeN).forEach(function (pt) {
            pt.x += Math.cos(pt.a) * spd * dt; pt.y += Math.sin(pt.a) * spd * dt;
            if (pt.x < 0.08 || pt.x > 0.92) pt.a = Math.PI - pt.a;
            if (pt.y < 0.08) pt.a = -pt.a;
            if (pt.y > 0.75) { pt.y = 0.74; pt.a = -Math.abs(pt.a); pt.flash = st.running ? 0.5 : 0; }
            pt.flash = Math.max(0, pt.flash - dt * 2.5);
            if (pt.flash > 0) {
              mx.fillStyle = 'rgba(250,204,21,' + pt.flash + ')';
              mx.beginPath(); mx.arc(pt.x * mb.w, pt.y * mb.h, 11, 0, Math.PI * 2); mx.fill();
            }
            mx.fillStyle = '#38BDF8';

              '<div class="lh-eq" id="lh-en-eq"></div>' +
              '<div class="thongbao info" style="margin:8px 0 0">Nhớ quy tắc đảo dấu: theo <b>ΔfH°</b> lấy <b>Sản phẩm − Chất đầu</b>; theo <b>Eb</b> lấy <b>Chất đầu − Sản phẩm</b>.</div>' +
            '</div>' +
          '</div>' +
        '</div>';

      function drawDiag() {
        const exo = sel.dH < 0;
        const b = fitCanvas(host.querySelector('#lh-en-cv'));
        const ctx = b.ctx; if (!ctx) return;
        ctx.clearRect(0, 0, b.w, b.h);
        const sc = Math.min(b.w / 480, b.h / 310);
        ctx.save();
        ctx.translate((b.w - 480 * sc) / 2, (b.h - 310 * sc) / 2);
        ctx.scale(sc, sc);
        const yR = exo ? 105 : 225, yP = exo ? 230 : 115, yTop = 44;
        // Trục tung H
        ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(54, 278); ctx.lineTo(54, 30); ctx.moveTo(48, 38); ctx.lineTo(54, 28); ctx.lineTo(60, 38); ctx.stroke();
        ctx.fillStyle = '#CBD5E1'; ctx.font = '800 12px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('Enthalpy (H)', 66, 36);
        // Mức chất đầu & sản phẩm
        ctx.strokeStyle = '#38BDF8'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(85, yR); ctx.lineTo(185, yR); ctx.stroke();
        ctx.strokeStyle = exo ? '#2DD4BF' : '#F472B6';
        ctx.beginPath(); ctx.moveTo(320, yP); ctx.lineTo(435, yP); ctx.stroke();
        // Đường cong năng lượng hoạt hóa
        ctx.strokeStyle = '#FACC15'; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(185, yR);
        ctx.bezierCurveTo(225, yTop, 280, yTop, 320, yP); ctx.stroke();
        // Mũi tên ΔrH
        ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.moveTo(185, yR); ctx.lineTo(310, yR); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = exo ? '#EF4444' : '#38BDF8'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(270, yR); ctx.lineTo(270, yP); ctx.stroke();
        ctx.fillStyle = exo ? '#FCA5A5' : '#BAE6FD';
        ctx.font = '800 13.5px "Be Vietnam Pro",sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('ΔrH° = ' + (sel.dH > 0 ? '+' : '') + fmtNum(sel.dH, 1) + ' kJ', 270, (yR + yP) / 2 - 4);
        ctx.fillStyle = '#E2E8F0'; ctx.font = '700 12px "Be Vietnam Pro",sans-serif';
        ctx.fillText('Chất đầu (cđ)', 135, yR - 10);
        ctx.fillText('Sản phẩm (sp)', 378, yP - 10);
        ctx.fillStyle = exo ? '#4ADE80' : '#FDE047';
        ctx.fillText(exo ? 'TỎA NHIỆT (ΔrH < 0)' : 'THU NHIỆT (ΔrH > 0)', 270, 295);
        ctx.restore();
      }

      function syncEn() {
        host.querySelector('#lh-en-list').innerHTML = DIAG.map(function (d) {
          return '<button type="button" class="lh-pill-btn' + (d.id === sel.id ? ' on' : '') + '" data-d="' + d.id + '">' + md(d.ten) + '</button>';
        }).join('');
        host.querySelectorAll('#lh-en-list [data-d]').forEach(function (b) {
          b.onclick = function () { SoundFX.click(); sel = DIAG.find(function (x) { return x.id === b.getAttribute('data-d'); }); syncEn(); };
        });
        host.querySelector('#lh-en-eq').innerHTML = '<div><b>Phương pháp:</b> ' + esc(sel.mode) + '</div><div style="margin-top:4px">' + md(sel.calc) + '</div>';
        drawDiag();
      }
      syncEn();
      watchTheme(scope, drawDiag);
      const onEnResize = function () { drawDiag(); };
      window.addEventListener('resize', onEnResize);
      scope.onCleanup(function () { window.removeEventListener('resize', onEnResize); });
    }
  }

        Mg: { ten: 'Magnesium (Mg)', d: 'Nhóm IIA · cần đun nóng', floats: false, speed: 0, flame: false, pH: 10.1, pt: 'Mg(s) + 2H2O(l) --(t°)--> Mg(OH)2↓ + H2↑', desc: 'Chìm đáy chậu: ở 25 °C hầu như không sủi bọt; bật **Đun nóng 80 °C** mới sủi bọt H2 đều.' },

      };
      let hot = false, curM = null, obj = null, pinkAlpha = 0, bubbles = [], sparks = [];
      host.innerHTML =

            '<div class="lh-hud-top">' +
              '<div class="lh-hud-badge" id="lh-km-ph">H₂O + Phenolphthalein · pH = 7,0</div>' +

            '</div>' +
            '<div class="lh-card">' +
              '<h3>📝 Quan sát &amp; Xu hướng (Bài 6, 9)</h3>' +
              '<div class="lh-eq" id="lh-km-eq">Chọn một kim loại (Li, Na, K, Mg hoặc Ca) để thả vào chậu nước có nhỏ sẵn phenolphthalein!</div>' +
              '<div class="lh-pills" style="margin-top:8px"><span class="chip chinh">Nhóm IA: Li &lt; Na &lt; K</span><span class="chip tim">Chu kì 3: Na &gt; Mg</span><span class="chip ok">Nhóm IIA: Mg &lt; Ca</span></div>' +

      host.querySelector('#lh-km-btns').innerHTML = Object.keys(METALS).map(function (k) {

      }).join('');
      host.querySelectorAll('[data-m]').forEach(function (b) {
        b.onclick = function () {

          curM = METALS[k]; curM.k = k;

          const cvEl = host.querySelector('#lh-km-cv');
          const cw = (cvEl && cvEl.clientWidth) || 420;
          obj = { x: Math.max(68, Math.min(cw - 68, cw * 0.5)), y: 72, vx: curM.floats ? (Math.random() < 0.5 ? -curM.speed : curM.speed) : 0, life: 1, inWater: false };
          SoundFX.drop();
          if (curM.flame) scope.timeout(function () { SoundFX.ignite(); }, 250);

      host.querySelector('#lh-km-heat').onclick = function () {

      scope.loop(function (dt) {
        const b = fitCanvas(host.querySelector('#lh-km-cv'));

            if (active && obj.life > 0) {
              obj.life = Math.max(0, obj.life - dt * (curM.k === 'K' ? 0.22 : curM.k === 'Na' ? 0.16 : 0.08));
              pinkAlpha = Math.min(0.68, pinkAlpha + dt * (curM.k === 'K' ? 0.22 : curM.k === 'Mg' ? 0.04 : 0.12));
              host.querySelector('#lh-km-ph').textContent = 'Phenolphthalein hóa hồng · pH ≈ ' + fmtNum(curM.pH, 1);
              if (curM.floats) {

              if (obj.x < wL + 22) { obj.x = wL + 22; obj.vx = Math.abs(obj.vx); }
              else if (obj.x > wR - 22) { obj.x = wR - 22; obj.vx = -Math.abs(obj.vx); }
              if (Math.random() < (curM.k === 'K' || curM.k === 'Na' || curM.k === 'Ca' ? 0.75 : 0.35)) {

              }
              if (curM.flame && Math.random() < 0.6) {
                sparks.push({ x: obj.x, y: obj.y - 6, vx: (Math.random() - 0.5) * 60, vy: -50 - Math.random() * 50, life: 0.45 });
              }

      function renderLt() {

        b.onclick = function () { SoundFX.drop(); addedHCl = false; eqNaOH = Number(b.getAttribute('data-n')); renderLt(); };
      });
      host.querySelector('#lh-lt-hcl').onclick = function () { SoundFX.drop(); addedHCl = true; renderLt(); };
