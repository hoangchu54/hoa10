    h += '<div id="gallery-tn-slot"></div>';

    h += '<div class="nhan-muc">10 Kho mô phỏng Hóa học quốc tế &amp; trong nước (' + WEB_THAM_KHAO.length + ')</div>' +
      '<div class="tn-cards">' + WEB_THAM_KHAO.map(w => '<a class="tn-card" href="' + esc(w.url) + '" target="h10_ngoai" rel="noopener"><strong><span>' + esc(w.ten) + '</span><span aria-hidden="true" style="opacity:.6;font-size:13px">↗</span></strong><span>' + esc(w.moTa) + '</span></a>').join('') + '</div>';

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderGalleryHoa10(document.getElementById('gallery-tn-slot'), 'Sắc màu & Hiện tượng Thí nghiệm Hóa 10');
    renderSlogan(document.getElementById('slogan-slot'));

    $('#tn-tk').oninput = function () { loc.tk = this.value; veTrang(); $('#tn-tk').focus(); const l = $('#tn-tk').value.length; $('#tn-tk').setSelectionRange(l, l); };
    $('#tn-bai').onchange = function () { loc.bai = this.value; veTrang(); };
    const txl = $('#tn-xoa-loc'); if (txl) txl.onclick = function () { loc = { bai: '', tk: '' }; veTrang(); };
    app.querySelectorAll('[data-b]').forEach(btn => btn.onclick = () => { loc.bai = btn.getAttribute('data-b'); veTrang(); });
    app.querySelectorAll('[data-open-bai]').forEach(btn => btn.onclick = () => {
      const maBai = btn.getAttribute('data-open-bai');
      const idx = Number(btn.getAttribute('data-open-idx')) || 0;
      const baiObj = BAI_THI_NGHIEM.find(x => x.bai === maBai);
      if (baiObj && baiObj.links[idx]) moPhongLab(baiObj, baiObj.links[idx]);
    });
  }

  // Hiển thị ngay lập tức ở 0ms (dữ liệu 16 bài đã nằm sẵn tại client), gọi API chạy ngầm để bổ sung cấu hình Drive
  data = { caiDatTrang: {}, webUrl: '' };
  veTopLinks();
  veTrang();
  api('tnKhoiDong').then(function (r) {
    data = r;
    veTopLinks();
    if (r && r.caiDatTrang && r.caiDatTrang.linkThuMucThiNghiem) veTrang();
  }).catch(function () {});
})();
</script>
</body>
</html>
