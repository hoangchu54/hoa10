              h += '<div class="ds-row"><span class="ds-key">' + 'abcd'.charAt(j) + ')</span><span class="ds-txt">' + md(txt) + '</span>' +
                '<div class="ds-tog">' +
                  '<button type="button" class="ds-btn" data-lt-ds="' + esc(c.id) + '" data-idx="' + j + '" data-v="1" aria-pressed="' + (v === true ? 'true' : 'false') + '">Đúng</button>' +
                  '<button type="button" class="ds-btn" data-lt-ds="' + esc(c.id) + '" data-idx="' + j + '" data-v="0" aria-pressed="' + (v === false ? 'true' : 'false') + '">Sai</button>' +
                '</div></div>';
            });
            h += '</div>';
          }
        } else {
          const idn = 'lt-inp-' + i;
          h += '<div class="truong"><input id="' + idn + '" class="o-tra-loi" type="text" ' + (c.loai === 'so' ? 'inputmode="decimal" placeholder="Nhập con số..."' : 'placeholder="Nhập công thức / câu trả lời ngắn..."') + ' data-lt-inp="' + esc(c.id) + '" value="' + esc(tl || '') + '"' + (hienGiai ? ' disabled' : '') + '></div>';
        }

        if (hienGiai) {
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(c.dapAnHien) + '</div>' +
            (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div>';
        }
        h += '</div>';
      });

      h += '<div class="hang-nut" style="margin-top:14px">' +
        (!daChamHet ? '<button type="button" class="nut chinh to" style="flex:2" id="lt-cham-het">✓ Chấm toàn bộ ' + dsCau.length + ' câu</button>' : '<button type="button" class="nut chinh to" style="flex:2" id="lt-lam-lai-2">🔁 Trộn &amp; Luyện lại lần nữa</button>') +
        '<button type="button" class="nut to" style="flex:1" id="lt-ve-2">Về danh sách</button>' +
      '</div><div id="slogan-slot"></div>';

      app.innerHTML = h;
      renderSlogan(document.getElementById('slogan-slot'));

      const thoat = function () { document.body.classList.remove('dang-lam'); manDanhSach(); };
      $('#lt-ve').onclick = thoat;
      $('#lt-ve-2').onclick = thoat;
      $('#lt-casio').onclick = function () { if (typeof moBangTraCuu === 'function') moBangTraCuu('casio'); };
      const tronLai = function () { veLuyenTap(tieuDe, tronMang_(dsGoc)); };
      $('#lt-tron').onclick = tronLai;
      const ll2 = $('#lt-lam-lai-2'); if (ll2) ll2.onclick = tronLai;

      app.querySelectorAll('[data-lt-q]').forEach(function (b) {
        b.onclick = function () {
          const q = b.getAttribute('data-lt-q'), k = Number(b.getAttribute('data-k'));
          tlMap[q] = k;
          b.parentNode.querySelectorAll('.lc').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        };
      });
      app.querySelectorAll('[data-lt-ds]').forEach(function (b) {
        b.onclick = function () {
          const q = b.getAttribute('data-lt-ds'), idx = Number(b.getAttribute('data-idx')), val = b.getAttribute('data-v') === '1';
          if (!Array.isArray(tlMap[q])) tlMap[q] = [null, null, null, null];
          tlMap[q][idx] = val;
          b.parentNode.querySelectorAll('.ds-btn').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        };
      });
      app.querySelectorAll('[data-lt-inp]').forEach(function (inp) {
        inp.oninput = function () { tlMap[inp.getAttribute('data-lt-inp')] = inp.value.trim(); };
      });
      app.querySelectorAll('[data-kt-cau]').forEach(function (b) {
        b.onclick = function () {
          daKiem[b.getAttribute('data-kt-cau')] = true;
          const y = window.scrollY;
          ve();
          window.scrollTo(0, y);
        };
      });
      const chHet = $('#lt-cham-het');
      if (chHet) chHet.onclick = function () {
        daChamHet = true;
        cuon();
        ve();
        let td = 0; dsCau.forEach(c => { td += chamCauLuyen_(c, tlMap[c.id]); });
        if (dsCau.length && (td / dsCau.length) >= 0.8 && typeof phaoGiay === 'function') phaoGiay(90);
      };
    }
    ve();
  }

  // ---------- khởi động gộp 1 request (kèm Stale-While-Revalidate mở 0ms) ----------
  ganThanhDieuHuongHS('btvn', {});
  const cachedInit = docCacheUI('hs_init');
  const cachedDS0 = (hs && hs.khoa) ? docCacheUI('hs_ds_' + hs.khoa) : null;
  if (cachedInit) {
    linkTrang = { webUrl: cachedInit.webUrl, trangChu: cachedInit.trangChu, caiDatTrang: cachedInit.caiDatTrang };
    hsList = cachedInit.hsList || [];
    veTopLinks();
    if (hs && hs.khoa && cachedDS0 && cachedDS0.ten) {
      veDanhSach(cachedDS0);
    } else if (!hs || !hs.khoa) {
      manNhapTen('');
    } else {
      dangTai('Đang mở lớp Hóa 10...');
    }
  } else {
    dangTai('Đang mở lớp Hóa 10...');
  }

  api('hsKhoiDong', hs && hs.khoa ? hs.khoa : '').then(function (res) {
    linkTrang = { webUrl: res.webUrl, trangChu: res.trangChu, caiDatTrang: res.caiDatTrang };
    hsList = res.hsList || [];
    ghiCacheUI('hs_init', { webUrl: res.webUrl, trangChu: res.trangChu, caiDatTrang: res.caiDatTrang, hsList: hsList });
    veTopLinks();
    if (hs && hs.khoa && res.danhSach && res.danhSach.ten) {
      hs.ten = res.danhSach.ten; kho.dat(KHOA_HS, hs);
      ghiCacheUI('hs_ds_' + hs.khoa, res.danhSach);
      if (!lam) veDanhSach(res.danhSach);
    } else {
      if (hs && hs.khoa) { kho.xoa(KHOA_HS); hs = null; }
      if (!lam) manNhapTen(hs && !res.danhSach ? 'Thầy đã cập nhật danh sách lớp. Em chọn lại tên nhé.' : '');
    }
  }).catch(function (e) {
    if (cachedInit && (cachedDS0 || !hs)) return;
    if (!laGAS) { linkTrang = { webUrl: '', trangChu: '', caiDatTrang: {} }; veTopLinks(); }
    const m = baoLoi(e);
    if (typeof m === 'string') {
      app.innerHTML = '<div class="thongbao loi">' + esc(m) + '</div><button class="nut chinh" type="button" onclick="location.reload()">Tải lại</button>';
    }
  });
})();
</script>
</body>
</html>
