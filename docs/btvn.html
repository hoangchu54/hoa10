    const opt = { cfg: cfg, webUrl: (linkTrang && linkTrang.webUrl) || '', laFull: laFull };
    ganThanhDieuHuongHS('btvn', opt);
    if (!linkTrang) return;
    const hm = $('#btn-home');
    if (hm) { const l = buildLinkTrang('home', opt); hm.href = l.href; hm.target = l.target; hm.classList.remove('an'); }
    const tl = $('#btn-tailieu');
    if (tl) { const l = buildLinkTrang('tailieu', opt); tl.href = l.href; tl.target = l.target; tl.classList.remove('an'); }
    const lb = $('#btn-lab');
    if (lb) { const l = buildLinkTrang('thinghiem', opt); lb.href = l.href; lb.target = l.target; lb.classList.remove('an'); }
    const gm = $('#btn-game');
    if (gm) { const l = buildLinkTrang('trochoi', opt); gm.href = l.href; gm.target = l.target; gm.classList.remove('an'); }
    const bf = $('#btn-full');
    if (bf) {
      if (!laGAS) { bf.classList.add('an'); return; }
      bf.classList.remove('an');
      if (laFull) {
        bf.href = linkTrang.trangChu;
        bf.target = '_top';
        bf.innerHTML = ICONS.ve + '<span>Về Sites</span>';
      } else {
        bf.href = linkTrang.webUrl + '?full=1';
        bf.target = '_top';
        bf.innerHTML = ICONS.full + '<span>Toàn màn hình</span>';
      }
    }
  }

  getLocation(function (loc) {
    laFull = !!(loc && loc.parameter && loc.parameter.full);
    if (loc && loc.parameter && loc.parameter.de) deTuUrl = String(loc.parameter.de);
    if (loc && loc.parameter && loc.parameter.bai) locDe.bai = String(loc.parameter.bai);
    veTopLinks();
    if (dsDeCache && !lam) veDanhSach(dsDeCache);
  });

  function dangTai(chu) {
    app.innerHTML = '<div class="phu" style="margin:6px 2px 10px"><span class="cho"></span> ' + esc(chu || 'Đang tải dữ liệu...') + '</div>' + skelCards(3);
  }
  function baoLoi(e) {
    const m = (e && e.message) ? e.message : String(e);
    if (m.indexOf('KHONG_CO_HS') >= 0) {
      kho.xoa(KHOA_HS); hs = null;
      manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
      return null;
    }
    return m.replace(/^Exception:\s*/, '');
  }
  function cuon() { try { window.scrollTo(0, 0); } catch (e) {} }
  function dungDongHo() { if (demGio) { clearInterval(demGio); demGio = null; } document.body.classList.remove('dang-lam'); }

  // ---------- 1. Chọn / nhập họ tên ----------
  function manNhapTen(loi) {
    dungDongHo();
    const coDs = hsList && hsList.length > 0;
    let h = '<div class="hero-box art-atom">' +
      '<span class="chip chinh">HÓA 10 · BÀI TẬP VỀ NHÀ</span>' +
      '<h1>Chào em!</h1>' +
      '<p class="phu" style="margin:0">' + (coDs ? 'Chọn tên em trong danh sách hoặc nhập họ tên mới nếu chưa có.' : 'Nhập đầy đủ họ và tên để bắt đầu làm bài tập.') + '</p>' +
      '</div>';

    if (loi) h += '<div class="thongbao loi" role="alert">' + esc(loi) + '</div>';

    if (coDs) {
      h += '<section class="the">' +
        '<h2 class="tieu-khoi" style="margin-bottom:8px">Chọn nhanh từ danh sách lớp (' + hsList.length + ' bạn)</h2>' +
        '<div class="truong"><input id="loc-hs" type="search" placeholder="Gõ tên để tìm nhanh..."></div>' +
        '<div class="hs-picker-list" id="hs-picker" role="list"></div>' +
        '<div class="hs-dem" id="hs-dem"></div>' +
        '</section>';
    }

    h += '<form class="the" id="f-ten">' +
      '<h2 class="tieu-khoi" style="margin-bottom:8px">' + (coDs ? 'Hoặc nhập họ và tên mới' : 'Đăng ký vào làm bài') + '</h2>' +
      '<div class="truong"><label for="hoten">Họ và tên đầy đủ</label>' +
      '<input id="hoten" type="text" autocomplete="name" required minlength="2" placeholder="Ví dụ: Nguyễn Minh Anh"></div>' +
      '<button class="nut chinh to rong" style="margin-top:12px" type="submit">Vào làm bài</button>' +
      '<div class="thongbao info" style="margin-bottom:0">' + ICONS.tt + '<span>Nếu tên em đã có ở trên, hãy bấm chọn đúng tên đó để không bị tách thành 2 tài khoản nhé.</span></div>' +
      '</form><div id="slogan-slot"></div>';

    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));

    if (coDs) {
      const box = $('#hs-picker');
      const veList = function (tk) {
        const q = String(tk || '').trim().toLowerCase();
        const ds = q ? hsList.filter(function (x) { return x.ten.toLowerCase().indexOf(q) >= 0; }) : hsList;
        const dem = $('#hs-dem');
        if (!ds.length) {
          box.innerHTML = '<div class="phu" style="padding:10px;text-align:center;grid-column:1/-1">Không thấy tên phù hợp, em nhập tên mới ở khung bên dưới nhé.</div>';
          if (dem) dem.textContent = '';
          return;
        }
        box.innerHTML = ds.map(function (x) {
          return '<button type="button" role="listitem" class="hs-picker-item" data-chon-hs="' + esc(x.khoa) + '" data-ten-hs="' + esc(x.ten) + '" title="Chọn ' + esc(x.ten) + '">' +
            avatarHS(x.ten) + '<span class="hs-picker-ten">' + esc(x.ten) + '</span></button>';
        }).join('');
        if (dem) dem.textContent = q ? ('Tìm thấy ' + ds.length + ' bạn') : (ds.length > 8 ? 'Cuộn xuống để xem thêm tên ↓' : '');
        box.querySelectorAll('[data-chon-hs]').forEach(function (btn) {
          btn.onclick = function () {
            hs = { khoa: btn.getAttribute('data-chon-hs'), ten: btn.getAttribute('data-ten-hs') };
            kho.dat(KHOA_HS, hs);
            manDanhSach();
          };
        });
      };
      veList('');
      $('#loc-hs').oninput = function () { veList(this.value); };
    }

    const f = $('#f-ten');
    f.onsubmit = function (ev) {
      ev.preventDefault();
      const ten = $('#hoten').value;
      const nut = f.querySelector('button[type="submit"]');
      nut.disabled = true; nut.textContent = 'Đang vào...';
      api('hsDangKy', ten).then(function (r) {
        hs = r; kho.dat(KHOA_HS, r);
        if (!hsList.some(function (x) { return x.khoa === r.khoa; })) {
          hsList.push(r);
          hsList.sort(function (a, b) { return a.ten.localeCompare(b.ten, 'vi'); });
        }
        manDanhSach();
      }).catch(function (e) {
        const m = baoLoi(e); if (typeof m === 'string') manNhapTen(m);
      });
    };
  }

  // ---------- 2. Danh sách đề ----------
  function manDanhSach() {
    dungDongHo(); cuon();
    const cachedDS = hs && hs.khoa ? docCacheUI('hs_ds_' + hs.khoa) : null;
    if (cachedDS && cachedDS.ten) {
      veDanhSach(cachedDS);
    } else {
      dangTai('Đang tải danh sách đề...');
    }
    api('hsDanhSach', hs.khoa).then(function (r) {
      if (!r.ten) {
        kho.xoa(KHOA_HS); hs = null;
        return manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
      }
      hs.ten = r.ten; kho.dat(KHOA_HS, hs);
      ghiCacheUI('hs_ds_' + hs.khoa, r);
      veDanhSach(r);
    }).catch(function (e) {
      if (cachedDS) return;
      const m = baoLoi(e);
      if (typeof m === 'string') {
        app.innerHTML = '<div class="thongbao loi">' + esc(m) + '</div><button class="nut chinh" type="button" id="thu-lai">Thử lại</button>';
        $('#thu-lai').onclick = manDanhSach;
      }
    });
  }

  function veNhanCauHinhDe_(d) {
    const ch = (d && d.cauHinh) || {};
    let s = '';
    if (ch.phutLam > 0) s += '<span class="chip tim">⏱️ ' + ch.phutLam + ' phút</span>';
    if (ch.soLanToiDa > 0) s += '<span class="chip' + (d.hetLuot && !d.hetHan ? ' loi' : '') + '">🎯 Tối đa ' + ch.soLanToiDa + ' lượt</span>';
    if (ch.thangDiemDS === 'luy_tien') s += '<span class="chip">Đ/S chuẩn Bộ GD</span>';
    if (ch.moDapAnNgay && !d.hetHan) s += '<span class="chip ok">Mở đáp án sau nộp</span>';
    return s;
  }

  function veBieuDoDiemSVG_(ls) {
    if (!ls || !ls.length) {
      return '<div class="phu" style="font-size:13px;padding:12px 0">Khi em hoàn thành các đề BTVN, biểu đồ đường tiến bộ điểm số sẽ tự động hiển thị tại đây.</div>';
    }
    const W = 360, H = 122, pL = 26, pR = 16, pT = 22, pB = 24;
    const gW = W - pL - pR, gH = H - pT - pB;
    const n = ls.length;
    const pts = ls.map(function (it, idx) {
      const x = n === 1 ? (pL + gW / 2) : (pL + (idx / (n - 1)) * gW);
      const val = Math.max(0, Math.min(10, Number(it.diem) || 0));
      const y = pT + (1 - val / 10) * gH;
      return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, val: val, ten: it.ten || ('Đề ' + (idx + 1)) };
    });
    const poly = pts.map(p => p.x + ',' + p.y).join(' ');
    const area = pts.length > 1
      ? ('M ' + pts[0].x + ',' + (pT + gH) + ' L ' + pts.map(p => p.x + ',' + p.y).join(' L ') + ' L ' + pts[pts.length - 1].x + ',' + (pT + gH) + ' Z')
      : '';
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="Biểu đồ điểm số các đề gần đây">' +
      '<defs><linearGradient id="progGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9e1e4c" stop-opacity="0.28"/><stop offset="100%" stop-color="#9e1e4c" stop-opacity="0.0"/></linearGradient></defs>';
    [0, 5, 8, 10].forEach(function (m) {
      const gy = Math.round((pT + (1 - m / 10) * gH) * 10) / 10;
      svg += '<line x1="' + pL + '" y1="' + gy + '" x2="' + (W - pR) + '" y2="' + gy + '" stroke="var(--vien)" stroke-dasharray="3 3" stroke-width="1"/>' +
        '<text x="' + (pL - 6) + '" y="' + (gy + 3.5) + '" text-anchor="end" font-size="9.5" fill="var(--mo)">' + m + '</text>';
    });
    if (area) svg += '<path d="' + area + '" fill="url(#progGrad)"/>';
    if (pts.length > 1) svg += '<polyline fill="none" stroke="var(--do)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' + poly + '"/>';
    pts.forEach(function (p, i) {
      svg += '<g><title>' + esc(p.ten + ': ' + diem(p.val) + '/10') + '</title>' +
        '<circle cx="' + p.x + '" cy="' + p.y + '" r="4.2" fill="var(--the)" stroke="var(--do)" stroke-width="2.4"/>' +
        '<text x="' + p.x + '" y="' + (p.y - 7) + '" text-anchor="middle" font-size="10" font-weight="800" fill="var(--chu)">' + diem(p.val) + '</text>' +
        '<text x="' + p.x + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9.5" fill="var(--mo)">#' + (i + 1) + '</text></g>';
    });
    svg += '</svg>';
    return svg;
  }

  function veDanhSach(r) {
    dsDeCache = r;
    const nhap = kho.lay(KHOA_NHAP);
    const tkDe = locDe.tk.trim().toLowerCase();
    const mucLuc = r.mucLuc || [];
    const tenBaiMap = {};
    mucLuc.forEach(function (c) {
      tenBaiMap[c.id] = c.ten;
      (c.bai || []).forEach(function (b) { tenBaiMap[b.id] = b.ten; });
    });

    const hopBaiDe = function (d, maBai) {
      if (!maBai) return true;
      const bIds = Array.isArray(d.baiIds) ? d.baiIds : [];
      if (/^C\d$/.test(maBai)) {
        const ch = mucLuc.find(c => c.id === maBai);
        if (!ch) return true;
        const setB = (ch.bai || []).map(b => b.id);
        if (bIds.length) return bIds.some(id => setB.indexOf(id) >= 0);
        return String(d.ten || '').toLowerCase().indexOf('chương ' + maBai.slice(1)) >= 0;
      }
      if (bIds.length) return bIds.indexOf(maBai) >= 0;
      return String(d.ten || '').toLowerCase().indexOf('bài ' + maBai.toLowerCase()) >= 0;
    };

    const hopDeLoc = function (d) {
      if (locDe.bai && !hopBaiDe(d, locDe.bai)) return false;
      if (tkDe && String(d.ten || '').toLowerCase().indexOf(tkDe) < 0) return false;
      if (locDe.tt === 'chua_lam') return !d.soLan;
      if (locDe.tt === 'da_lam') return d.soLan > 0;
      return true;
    };

    const dangLocDe = !!(locDe.bai || tkDe || locDe.tt !== 'tat_ca');
    const mo = r.de.filter(d => !d.hetHan), het = r.de.filter(d => d.hetHan);
    const homNay = !dangLocDe ? mo[0] : null;
    const conLai = (homNay ? mo.slice(1) : mo).filter(hopDeLoc);
    const hetLoc = het.filter(hopDeLoc);
    const laHomNay = ms => new Date(ms).toDateString() === new Date(r.now).toDateString();

    function nutLam(d, lop) {
      const dangDo = nhap && nhap.de && nhap.de.id === d.id && nhap.khoa === hs.khoa;
      if (!d.hetHan && d.hetLuot && !dangDo) {
        return '<button type="button" class="nut nho" disabled title="Đề này giới hạn số lượt làm bài">Đã hết lượt (' + d.soLan + '/' + d.cauHinh.soLanToiDa + ')</button>';
      }
      const chu = dangDo ? 'Làm tiếp bài dở' : (d.soLan ? 'Làm lại' : 'Làm bài');
      return '<button type="button" class="nut ' + lop + '" data-lam="' + esc(d.id) + '">' + chu + '</button>';
    }

    let h = '<div class="hero-box art-benzene">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">' +
        '<div><span class="chip chinh">XIN CHÀO</span><h1>' + esc(hs.ten) + '</h1></div>' +
        '<button type="button" class="nut nho" id="doi-ten">Đổi học sinh</button>' +
      '</div>';
    if (linkTrang && linkTrang.caiDatTrang && linkTrang.caiDatTrang.thongBao) {
      h += '<div class="thongbao info" style="margin:10px 0 0">' + ICONS.tt + '<div><b>📢 Thông báo từ Thầy Hoàng:</b><div style="margin-top:2px">' + md(linkTrang.caiDatTrang.thongBao) + '</div></div></div>';
    }
    h += '</div>';

    // Nếu học sinh bấm từ Trang chủ vào 1 đề cụ thể (?de=...)
    const deChonUrl = deTuUrl ? r.de.find(x => x.id === deTuUrl) : null;
    if (deChonUrl) {
      h += '<div class="the the-noi" style="border-color:var(--do);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<div><span class="chip chinh">🎯 Đề em vừa chọn</span><div style="font-weight:800;font-size:16px;margin-top:4px">' + esc(deChonUrl.ten) + '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><span class="chip">' + deChonUrl.soCau + ' câu</span>' + veNhanCauHinhDe_(deChonUrl) + '</div></div>' +
        '<div class="hang-nut">' +
          (deChonUrl.duocXemDapAn ? '<button type="button" class="nut nho xanh" data-xem="' + esc(deChonUrl.id) + '">Xem đáp án</button>' : '') +
          nutLam(deChonUrl, 'chinh') +
        '</div></div>';
    }

    // Bảng nhắc bài tập chưa làm, điểm số & chuyên cần cá nhân (Bento KPI + Vòng tròn tiến độ)
    const daNopDe = r.de.filter(d => d.soLan > 0);
    const diemTBCao = daNopDe.length ? (Math.round(daNopDe.reduce((s, d) => s + Number(d.best || 0), 0) / daNopDe.length * 10) / 10) : null;
    const chuaLamMo = mo.filter(d => !d.soLan);
    const cc = r.chuyenCan;
    if (r.de.length || cc) {
      const pct = r.de.length ? Math.round(daNopDe.length / r.de.length * 100) : 0;
      const circ = 150.8; // 2πr, r = 24
      const off = Math.round(circ * (1 - pct / 100) * 10) / 10;
      const ringSvg = '<div class="ring-wrap" role="img" aria-label="Đã làm ' + pct + '% số đề">' +
        '<svg class="ring-svg" viewBox="0 0 56 56" aria-hidden="true">' +
        '<circle class="ring-bg" cx="28" cy="28" r="24"></circle>' +
        '<circle class="ring-fg" cx="28" cy="28" r="24" stroke-dasharray="' + circ + '" stroke-dashoffset="' + off + '"></circle>' +
        '</svg><span class="ring-pct">' + pct + '%</span></div>';
      h += '<div class="kpi-strip">' +
        '<div class="kpi-card xanh"><div><div class="n">Tiến độ BTVN</div><div class="g">' + daNopDe.length + '<span style="font-size:14px;color:var(--mo)">/' + r.de.length + ' đề</span></div></div>' + ringSvg + '</div>' +
        '<div class="kpi-card tim"><div><div class="n">Điểm TB cao nhất</div><div class="g">' + (diemTBCao !== null ? diem(diemTBCao) : '–') + '</div></div><div class="kpi-ic">★</div></div>' +
        (cc ? ('<div class="kpi-card' + (cc.kp ? ' canh' : '') + '"><div><div class="n">Chuyên cần</div><div class="g">' + cc.co + '<span style="font-size:14px;color:var(--mo)">/' + cc.tongBuoi + ' buổi</span></div></div><div class="kpi-ic">✓</div></div>') : '') +
      '</div>';
    }

    // Góc Tiến bộ Cá nhân & Phòng Tự Luyện Ngẫu Nhiên
    const tb = r.tienBo || {};
    const lsDiem = Array.isArray(tb.lichSuDiem) ? tb.lichSuDiem : [];
    const baiHaySai = Array.isArray(tb.baiHaySai) ? tb.baiHaySai : [];
    const soCauOnTap = Number(tb.soCauOnTap) || 0;
    if (lsDiem.length || soCauOnTap > 0) {
      h += '<section class="prog-box">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<b style="font-size:15.5px">📈 Góc tiến bộ &amp; Phòng tự luyện thông minh</b>' +
          (soCauOnTap ? '<span class="chip ok">Ngân hàng ' + soCauOnTap + ' câu tự luyện</span>' : '') +
        '</div>' +
        '<div class="prog-grid">' +
          '<div class="prog-chart-card">' +
            '<div style="font-size:12.5px;font-weight:700;color:var(--mo)">Biểu đồ điểm cao nhất qua các đề gần đây</div>' +
            veBieuDoDiemSVG_(lsDiem) +
            (baiHaySai.length
              ? ('<div style="margin-top:4px"><div style="font-size:12px;font-weight:700;color:var(--mo);margin-bottom:5px">🎯 Chủ đề em hay nhầm (bấm để luyện riêng):</div>' +
                  '<div style="display:flex;flex-wrap:wrap;gap:6px">' + baiHaySai.map(function (b) {
                    const tenNgan = (b.ten || ('Bài ' + b.bai)).replace(/^Bài\s+\S+:\s*/i, '');
                    return '<button type="button" class="weak-chip" data-luyen-bai="' + esc(b.bai) + '" title="' + esc(b.ten) + '">⚡ Bài ' + esc(b.bai) + ': ' + esc(tenNgan.length > 26 ? tenNgan.slice(0, 24) + '…' : tenNgan) + ' (' + b.sai + ')</button>';
                  }).join('') + '</div></div>')
              : '<div class="phu" style="font-size:12px">Chưa phát hiện bài nào hay sai — phong độ rất tốt!</div>') +
          '</div>' +
          '<div class="prog-prac-card">' +
            '<div>' +
              '<b style="font-size:14.5px;color:var(--tim)">⚡ Tự luyện ngẫu nhiên (chấm ngay)</b>' +
              '<p class="phu" style="margin:4px 0 8px;font-size:12.5px">Rút ngẫu nhiên câu hỏi từ các đề đã hết hạn để ôn phản xạ trước kiểm tra, không ảnh hưởng điểm trên lớp.</p>' +
              '<div class="truong" style="margin-bottom:8px"><label for="tl-pham-vi" style="font-size:11.5px">Chọn phạm vi ôn tập</label>' +
                '<select id="tl-pham-vi">' +
                  (baiHaySai.length ? '<option value="__HAY_SAI__">🔥 Ưu tiên các bài em hay sai</option>' : '') +
                  '<option value="">📚 Tất cả đề đã hết hạn</option>' +
                  mucLuc.map(c => '<option value="' + esc(c.id) + '">' + esc(c.ten) + '</option>').join('') +
                '</select></div>' +
              '<div class="truong"><label for="tl-so-cau" style="font-size:11.5px">Số lượng câu</label>' +
                '<select id="tl-so-cau"><option value="10">10 câu nhanh (~5 phút)</option><option value="15">15 câu chuẩn (~10 phút)</option><option value="20">20 câu tổng hợp</option></select></div>' +
            '</div>' +
            '<button type="button" class="nut chinh rong" id="btn-tu-luyen"' + (soCauOnTap ? '' : ' disabled') + '>' +
              (soCauOnTap ? '⚡ Bắt đầu tự luyện ngay →' : 'Chờ có đề hết hạn để mở kho luyện') +
            '</button>' +
          '</div>' +
        '</div>' +
      '</section>';
    }

    // Đề mới nhất đã có khung riêng (kèm dòng nhắc) nên không lặp lại trong hộp nhắc
    const chuaLamKhac = chuaLamMo.filter(d => (!homNay || d.id !== homNay.id) && !d.hetLuot);
    if (chuaLamKhac.length) {
      h += '<div class="tb-nhac">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">' +
          '<b>⏰ Em còn ' + chuaLamKhac.length + ' bài tập ' + (homNay && !homNay.soLan ? 'khác ' : '') + 'đang mở chưa làm</b>' +
          '<span class="chip canh">Nhớ nộp đúng hạn nhé!</span>' +
        '</div>';
      chuaLamKhac.forEach(function (d) {
        const conGio = Math.max(0, Math.round((d.han - r.now) / 3600e3));
        const conTxt = conGio < 24 ? ('Còn ' + Math.max(1, conGio) + ' giờ') : ('Còn ' + Math.round(conGio / 24) + ' ngày');
        h += '<div class="tb-nhac-item">' +
          '<div style="min-width:0;flex:1 1 200px"><div style="font-weight:700;font-size:14px">' + esc(d.ten) + '</div>' +
          '<div class="phu" style="font-size:12px">Hạn: ' + han(d.han) + ' · <b style="color:' + (conGio < 24 ? 'var(--loi)' : 'var(--canh)') + '">' + conTxt + '</b></div></div>' +
          '<button type="button" class="nut nho chinh" data-lam="' + esc(d.id) + '">Làm ngay →</button>' +
        '</div>';
      });
      h += '</div>';
    }
    if (cc && (cc.muon || cc.cp || cc.kp)) {
      const ttText = { co: 'Có mặt', muon: 'Đi muộn', vang_cp: 'Nghỉ CP', vang_kp: 'Nghỉ KP' };
      const gan = (cc.ganNhat || []).filter(x => x.tt !== 'co').slice(0, 3);
      if (gan.length) {
        h += '<div class="thongbao canh" style="margin:0 0 12px">' + ICONS.tt + '<div><b>Lưu ý chuyên cần:</b> ' +
          gan.map(x => esc(x.ngay.split('-').reverse().join('/') + ': ' + (ttText[x.tt] || x.tt) + (x.gc ? ' (' + x.gc + ')' : ''))).join(' · ') +
          '</div></div>';
      }
    }

    if (!r.de.length) h += '<div class="the"><p class="phu" style="margin:0;text-align:center">Thầy chưa giao đề nào. Em quay lại sau nhé.</p></div>';

    if (homNay) {
      const conGioHn = Math.max(0, Math.round((homNay.han - r.now) / 3600e3));
      const demNguocHn = conGioHn < 24 ? ('⏳ Còn ' + Math.max(1, conGioHn) + ' giờ') : ('⏳ Còn ' + Math.round(conGioHn / 24) + ' ngày');
      const dangDoHn = nhap && nhap.de && nhap.de.id === homNay.id && nhap.khoa === hs.khoa;
      const hetLuotHn = !homNay.hetHan && homNay.hetLuot && !dangDoHn;
      const chuNutHn = dangDoHn ? 'Làm tiếp bài dở →' : (hetLuotHn ? ('Đã hết lượt (' + homNay.soLan + '/' + homNay.cauHinh.soLanToiDa + ')') : (homNay.soLan ? 'Làm lại để nâng điểm →' : 'Làm bài ngay →'));
      h += '<div class="nhan-muc">Đề mới nhất</div>' +
        '<div class="the the-noi feat-banner">' +
          '<div class="feat-top">' +
            '<div class="feat-meta">' +
              (laHomNay(homNay.ngayMo) ? '<span class="chip chinh">★ Mới · ' + ngay(homNay.ngayMo) + '</span>' : '<span class="chip tim">Đang mở</span>') +
              '<span><b>' + homNay.soCau + '</b> câu</span><span class="dot"></span>' +
              '<span>Hạn <b>' + han(homNay.han) + '</b></span>' +
              veNhanCauHinhDe_(homNay) +
            '</div>' +
            '<span class="feat-countdown' + (conGioHn < 24 ? ' gap' : '') + '">' + demNguocHn + '</span>' +
          '</div>' +
          '<h2 class="feat-title">' + esc(homNay.ten) + '</h2>' +
          (!homNay.soLan && !dangDoHn ? '<div class="feat-nhac">⏰ Em chưa làm bài này — nhớ nộp trước hạn nhé!</div>' : '') +
          (dangDoHn ? '<div class="feat-nhac">✏️ Em đang làm dở bài này, bấm để làm tiếp.</div>' : '') +
          '<div class="feat-body">' +
            '<div class="kpi-strip" style="margin-bottom:0;flex:1 1 320px">' +
              '<div class="kpi-card xanh"><div><div class="n">Điểm cao nhất</div><div class="g">' + (homNay.soLan ? diem(homNay.best) : 'Chưa làm') + '</div></div><div class="kpi-ic">★</div></div>' +
              '<div class="kpi-card tim"><div><div class="n">Số lần làm đúng hạn</div><div class="g">' + homNay.soLan + (homNay.cauHinh && homNay.cauHinh.soLanToiDa ? ('/' + homNay.cauHinh.soLanToiDa) : '') + '</div></div><div class="kpi-ic">#</div></div>' +
            '</div>' +
            '<div class="hang-nut" style="align-items:stretch">' +
              (homNay.duocXemDapAn && homNay.coBaiLam ? '<button type="button" class="nut tim" data-xem-bai="' + esc(homNay.id) + '">Xem lại bài</button>' : '') +
              (homNay.duocXemDapAn ? '<button type="button" class="nut xanh" data-xem="' + esc(homNay.id) + '">Đáp án</button>' : '') +
              '<button type="button" class="nut ' + (hetLuotHn ? '' : 'chinh ') + 'to feat-cta"' + (hetLuotHn ? ' disabled' : ' data-lam="' + esc(homNay.id) + '"') + '>' + chuNutHn + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    if (r.de.length > 2 || dangLocDe) {
      const nChua = r.de.filter(d => !d.soLan).length;
      const nXong = r.de.filter(d => d.soLan > 0).length;
      h += '<div class="hang" style="align-items:center;justify-content:space-between;margin:14px 0 4px;gap:8px">' +
        '<input id="loc-de-tk" type="search" placeholder="Tìm nhanh tên đề, bài học..." value="' + esc(locDe.tk) + '" style="flex:1 1 200px;max-width:340px;min-height:36px">' +
        (locDe.bai ? ('<button type="button" class="nut nho xoa" id="bo-loc-bai">✕ Lọc: ' + esc(tenBaiMap[locDe.bai] || ('Bài ' + locDe.bai)) + '</button>') : '') +
        '<div class="seg">' +
          '<button type="button" data-ld-tt="tat_ca" class="' + (locDe.tt === 'tat_ca' ? 'on' : '') + '">Tất cả (' + r.de.length + ')</button>' +
          '<button type="button" data-ld-tt="chua_lam" class="' + (locDe.tt === 'chua_lam' ? 'on' : '') + '">Chưa làm (' + nChua + ')</button>' +
          '<button type="button" data-ld-tt="da_lam" class="' + (locDe.tt === 'da_lam' ? 'on' : '') + '">Đã làm (' + nXong + ')</button>' +
        '</div>' +
      '</div>';
    }

    if (dangLocDe && !conLai.length && !hetLoc.length) {
      h += '<div class="the" style="text-align:center"><p class="phu" style="margin:0 0 8px">Không tìm thấy đề BTVN nào khớp bộ lọc hiện tại.</p><button type="button" class="nut nho chinh" id="xoa-het-loc-de">Hiện tất cả đề</button></div>';
    }

    if (conLai.length) {
      h += '<div class="nhan-muc">' + (homNay ? 'Đang mở khác' : 'Đề đang mở') + ' (' + conLai.length + ')</div><div class="de-grid">';
      conLai.forEach(function (d) {
        h += '<div class="de-card' + (d.soLan ? ' xong' : '') + '">' +
          '<div style="flex:1 1 200px;min-width:0">' +
            '<div style="font-weight:700;font-size:15.5px;margin-bottom:6px">' + esc(d.ten) + '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
              '<span class="chip canh">Hạn ' + han(d.han) + '</span>' +
              '<span class="chip">' + d.soCau + ' câu</span>' +
              veNhanCauHinhDe_(d) +
              '<span class="chip ' + (d.soLan ? 'ok' : '') + '">' + (d.soLan ? '★ Cao nhất ' + diem(d.best) + ' (' + d.soLan + ' lần)' : 'Chưa làm') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="hang-nut">' +
            (d.duocXemDapAn && d.coBaiLam ? '<button type="button" class="nut nho tim" data-xem-bai="' + esc(d.id) + '">Xem lại bài</button>' : '') +
            (d.duocXemDapAn ? '<button type="button" class="nut nho xanh" data-xem="' + esc(d.id) + '">Đáp án</button>' : '') +
            nutLam(d, 'vien') +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    }

    if (hetLoc.length) {
      h += '<div class="nhan-muc">Đã hết hạn (' + hetLoc.length + ')</div><div class="de-grid">';
      hetLoc.forEach(function (d) {
        h += '<div class="de-card ' + (d.soLan ? 'xong' : 'het') + '">' +
          '<div style="flex:1 1 200px;min-width:0">' +
            '<div style="font-weight:700;font-size:15px;margin-bottom:5px">' + esc(d.ten) + '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
              '<span class="chip ' + (d.soLan ? 'ok' : '') + '">' + (d.soLan ? ('★ Cao nhất ' + diem(d.best) + '/10') : 'Chưa làm trong hạn') + '</span>' +
              (d.soLan ? '<span class="phu" style="font-size:12.5px">' + d.soLan + ' lần đúng hạn</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="hang-nut">' +
            (d.coBaiLam ? '<button type="button" class="nut nho tim" data-xem-bai="' + esc(d.id) + '">Xem lại bài</button>' : '') +
            '<button type="button" class="nut nho xanh" data-xem="' + esc(d.id) + '">Đáp án</button>' +
            '<button type="button" class="nut nho" data-lam="' + esc(d.id) + '">Luyện lại</button>' +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    }

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));
    $('#doi-ten').onclick = function () { kho.xoa(KHOA_HS); kho.xoa(KHOA_NHAP); hs = null; manNhapTen(); };
    const ldtk = $('#loc-de-tk');
    if (ldtk) {
      ldtk.oninput = function () {
        locDe.tk = this.value;
        const pos = this.selectionStart;
        veDanhSach(dsDeCache);
        const inp2 = $('#loc-de-tk');
        if (inp2) { inp2.focus(); try { inp2.setSelectionRange(pos, pos); } catch (e) {} }
      };
    }
    const blb = $('#bo-loc-bai'); if (blb) blb.onclick = function () { locDe.bai = ''; veDanhSach(dsDeCache); };
    const xhld = $('#xoa-het-loc-de'); if (xhld) xhld.onclick = function () { locDe = { tk: '', tt: 'tat_ca', bai: '' }; veDanhSach(dsDeCache); };
    const btnTuLuyen = $('#btn-tu-luyen');
    if (btnTuLuyen) {
      btnTuLuyen.onclick = function () {
        const pv = ($('#tl-pham-vi') && $('#tl-pham-vi').value) || '';
        const sc = Number(($('#tl-so-cau') && $('#tl-so-cau').value) || 10);
        if (pv === '__HAY_SAI__') {
          batDauTuLuyen({ soCau: sc, uuTienHaySai: true });
        } else {
          batDauTuLuyen({ soCau: sc, bai: pv });
        }
      };
    }
    app.querySelectorAll('[data-luyen-bai]').forEach(function (b) {
      b.onclick = function () { batDauTuLuyen({ soCau: 10, bai: b.getAttribute('data-luyen-bai') }); };
    });
    app.querySelectorAll('[data-ld-tt]').forEach(b => b.onclick = () => { locDe.tt = b.getAttribute('data-ld-tt'); veDanhSach(dsDeCache); });
    app.querySelectorAll('[data-lam]').forEach(b => b.onclick = () => batDau(b.getAttribute('data-lam')));
    app.querySelectorAll('[data-xem]').forEach(b => b.onclick = () => xemDapAn(b.getAttribute('data-xem')));
    app.querySelectorAll('[data-xem-bai]').forEach(b => b.onclick = () => xemBaiCu(b.getAttribute('data-xem-bai')));
  }

  // ---------- 3. Làm bài ----------
  function batDau(deId) {
    const nhap = kho.lay(KHOA_NHAP);
    if (nhap && nhap.de && nhap.de.id === deId && nhap.khoa === hs.khoa) {
      const quaLau = !nhap.batDau || (Date.now() - nhap.batDau > 5.75 * 3600 * 1000);
      if (!quaLau) { lam = nhap; return veLamBai(); }
      const tlCu = nhap.traLoi || {};
      dangTai('Đang làm mới phiên làm bài...');
      api('hsBatDau', hs.khoa, deId).then(function (r) {
        const giu = {};
        r.cau.forEach(function (c) { if (tlCu[c.id] !== undefined && tlCu[c.id] !== '') giu[c.id] = tlCu[c.id]; });
        lam = { token: r.token, batDau: Date.now(), de: r.de, cau: r.cau, traLoi: giu, khoa: hs.khoa };
        kho.dat(KHOA_NHAP, lam);
        veLamBai();
        if (Object.keys(giu).length) alertNho('Phiên cũ gần hết 6 tiếng nên hệ thống đã cấp phiên mới và giữ nguyên ' + Object.keys(giu).length + ' câu em đã làm.');
      }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
      return;
    }
    dangTai('Đang lấy đề...');
    api('hsBatDau', hs.khoa, deId).then(function (r) {
      lam = { token: r.token, batDau: Date.now(), de: r.de, cau: r.cau, traLoi: {}, khoa: hs.khoa };
      kho.dat(KHOA_NHAP, lam);
      veLamBai();
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }
  function alertNho(m) {
    const d = document.createElement('div');
    d.className = 'thongbao loi';
    d.setAttribute('role', 'alert');
    d.textContent = m;
    app.prepend(d);
  }

  const TEN_LOAI = { tn: 'Nhiều lựa chọn', ds: 'Đúng / Sai', so: 'Trả lời ngắn', chu: 'Trả lời ngắn' };
  function nhomPhan(loai, thangDiemDS) {
    if (loai === 'tn') return { key: 'I', ten: 'Phần I. Câu trắc nghiệm nhiều lựa chọn', moTa: 'Chọn 1 đáp án đúng' };
    if (loai === 'ds') {
      const luyTien = thangDiemDS === 'luy_tien';
      return { key: 'II', ten: 'Phần II. Câu trắc nghiệm đúng sai', moTa: luyTien ? '1–2–3–4 ý đúng: 0,1 · 0,25 · 0,5 · 1,0 câu' : 'Mỗi ý đúng được 0,25 câu' };
    }
    return { key: 'III', ten: 'Phần III. Câu trắc nghiệm trả lời ngắn', moTa: 'Điền số hoặc công thức / từ ngắn' };
  }
  function cauDaXong(c) {
    const tl = lam.traLoi[c.id];
    if (c.loai === 'ds') return Array.isArray(tl) && tl.filter(v => v === true || v === false).length === 4;
    return tl !== undefined && tl !== null && tl !== '';
  }

  function datCauKbd_(cards, idx) {
    kbdIdx = idx;
    cards.forEach(function (el, i) { el.classList.toggle('active-kbd', i === idx); });
  }

  function veLamBai() {
    cuon();
    document.body.classList.add('dang-lam');
    if (!lam.co) lam.co = {};
    if (typeof lam.roiTab !== 'number') lam.roiTab = 0;
    kbdIdx = -1;
    locCauThi = 'tat_ca';
    const chDe = (lam.de && lam.de.cauHinh) || {};
    const phutLam = Number(chDe.phutLam) || 0;
    const luoiNutSo = lam.cau.map((c, i) => '<button type="button" class="o-so' + (lam.co[c.id] ? ' co-flag' : '') + '" data-den="' + i + '">' + (i + 1) + '</button>').join('');
    let h = '<div class="thanh-lam">' +
      '<div class="hang">' +
        '<button type="button" class="nut nho" id="quay" aria-label="Quay lại">←</button>' +
        '<span class="tieu-de" title="' + esc(lam.de.ten) + '">' + esc(lam.de.ten) + '</span>' +
        '<button type="button" class="nut nho" id="casio-top" title="Mở Máy tính Casio Hóa học">🧮</button>' +
        '<button type="button" class="nut nho" id="loc-chua-xong" title="Chỉ hiện câu chưa làm hoặc đang cắm cờ">🚩</button>' +
        '<button type="button" class="nut nho" id="toggle-muc" title="Chuyển nhanh câu hỏi">' + ICONS.grid + '</button>' +
        '<span class="dong-ho" id="gio">00:00</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mo);margin-top:6px"><span id="da-lam"></span><span>' +
        (phutLam > 0 ? ('⏱️ Giới hạn ' + phutLam + ' phút · ') : '') +
        (lam.de.hetHan ? 'Luyện tập (hết hạn)' : 'Hạn ' + han(lam.de.han)) +
      '</span></div>' +
      '<div class="vach"><div id="vach" style="width:0"></div></div>' +
      '<div class="lam-nav-drawer an" id="lam-drawer">' +
        '<div style="font-size:12px;font-weight:700;color:var(--mo)">Chuyển nhanh đến câu (chấm cam = đang cắm cờ)</div>' +
        '<div class="luoi-so">' + luoiNutSo + '</div>' +
      '</div>' +
    '</div>';

    h += '<div class="exam-layout"><div class="exam-main">';
    let phanTruoc = '';
    lam.cau.forEach(function (c, i) {
      const p = nhomPhan(c.loai, chDe.thangDiemDS);
      if (p.key !== phanTruoc) {
        phanTruoc = p.key;
        h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
      }
      const tl = lam.traLoi[c.id];
      const daCo = !!lam.co[c.id];
      h += '<div class="the cau-hs' + (daCo ? ' co-flag' : '') + '" id="cau-' + i + '" data-cid="' + esc(c.id) + '">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
          '<span class="chip chinh">Câu ' + (i + 1) + '</span>' +
          '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
          '<button type="button" class="nut-flag' + (daCo ? ' on' : '') + '" data-flag="' + esc(c.id) + '" title="Đánh dấu xem lại câu này (Phím F)">🚩 ' + (daCo ? 'Đã đánh dấu' : 'Xem lại') + '</button>' +
        '</div>' +
        '<div class="noi-dung">' + md(c.cauHoi) + '</div>';
      if (c.loai === 'tn') {
        const ngan = (c.luaChon || []).every(o => String(o.t || '').length <= 68);
        h += '<div class="lua-chon' + (ngan ? ' grid-2' : '') + '" role="group" aria-label="Các lựa chọn câu ' + (i + 1) + '">';
        c.luaChon.forEach(function (o, j) {
          h += '<button type="button" class="lc" data-q="' + esc(c.id) + '" data-k="' + o.k + '" aria-pressed="' + (tl === o.k ? 'true' : 'false') + '">' +
            '<span class="chu-cai">' + 'ABCD'.charAt(j) + '</span><span>' + md(o.t) + '</span></button>';
        });
        h += '</div>';
      } else if (c.loai === 'ds') {
        const arr = Array.isArray(tl) ? tl : [null, null, null, null];
        h += '<div class="ds-list" role="group" aria-label="Các mệnh đề câu ' + (i + 1) + '">';
        (c.luaChon || []).forEach(function (txt, j) {
          const v = arr[j];
          h += '<div class="ds-row">' +
            '<span class="ds-key">' + 'abcd'.charAt(j) + ')</span>' +
            '<span class="ds-txt">' + md(txt) + '</span>' +
            '<div class="ds-tog">' +
              '<button type="button" class="ds-btn" data-q="' + esc(c.id) + '" data-idx="' + j + '" data-v="1" aria-pressed="' + (v === true ? 'true' : 'false') + '">Đúng</button>' +
              '<button type="button" class="ds-btn" data-q="' + esc(c.id) + '" data-idx="' + j + '" data-v="0" aria-pressed="' + (v === false ? 'true' : 'false') + '">Sai</button>' +
            '</div></div>';
        });
        h += '</div>';
      } else {
        const idn = 'tl-' + i;
        h += '<div class="truong"><label for="' + idn + '">' + (c.loai === 'so' ? 'Đáp số' : 'Câu trả lời') + '</label>' +
          '<input id="' + idn + '" class="o-tra-loi" type="text" ' + (c.loai === 'so' ? 'inputmode="decimal" placeholder="Ví dụ: 2,24"' : 'placeholder="Ví dụ: Na, H2SO4, [Ar] 3d5 4s1"') + ' data-q="' + esc(c.id) + '" value="' + esc(tl || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false">' +
          '</div>' +
          (c.loai === 'chu'
            ? ('<div class="sym-bar"><span class="phu" style="font-size:11.5px">Chèn nhanh:</span>' +
                ['[Ar] ', '[Ne] ', '+', '-', '(', ')', '→', '⇌', '°C'].map(function (sy) {
                  return '<button type="button" class="sym-btn" data-sym-for="' + idn + '" data-sym="' + esc(sy) + '">' + esc(sy.trim() || sy) + '</button>';
                }).join('') +
              '</div>')
            : '') +
          '<div class="phu" style="font-size:12px;margin-top:6px">' +
          (c.loai === 'chu' ? 'Gõ số thường, ví dụ H2SO4 sẽ hiểu là H₂SO₄. Chú ý viết hoa đúng kí hiệu hóa học.' : 'Chỉ ghi con số, không cần đơn vị. Dùng dấu phẩy hay dấu chấm đều được.') + '</div>';
      }
      h += '</div>';
    });

    h += '<div class="exam-mobile-foot">' +
      '<div class="the">' +
        '<div style="font-size:13px;font-weight:700;color:var(--mo)">Chuyển nhanh đến câu</div>' +
        '<div class="luoi-so">' + luoiNutSo + '</div>' +
      '</div>' +
      '<button type="button" class="nut chinh to rong" style="margin-top:14px" id="nop" data-nop-btn>Nộp bài</button>' +
      '<p class="phu" style="text-align:center;font-size:12px;margin-top:8px">Thứ tự câu hỏi và đáp án đổi ngẫu nhiên mỗi lần làm.</p>' +
    '</div></div>' +
    '<aside class="exam-side" aria-label="Bảng điều khiển bài làm">' +
      '<div class="the exam-panel">' +
        '<div class="exam-side-top">' +
          '<button type="button" class="nut nho" id="quay-side">← Danh sách</button>' +
          '<span class="chip ' + (lam.de.hetHan ? 'canh' : 'tim') + '">' + (lam.de.hetHan ? 'Luyện tập' : 'Hạn ' + han(lam.de.han)) + '</span>' +
        '</div>' +
        '<div class="exam-side-ten">' + esc(lam.de.ten) + '</div>' +
        '<div class="exam-clock-box" id="box-gio-side">' +
          '<span class="n">' + (phutLam > 0 ? ('Đếm ngược (' + phutLam + ' phút)') : 'Thời gian làm bài') + '</span>' +
          '<span class="g" id="gio-side">00:00</span>' +
        '</div>' +
        '<div class="exam-prog-meta"><span id="da-lam-side"></span></div>' +
        '<div class="vach"><div id="vach-side" style="width:0"></div></div>' +
        '<div class="exam-pal-head"><span>Bản đồ câu hỏi</span><button type="button" class="nut-flag" id="loc-chua-xong-side" style="font-size:11px;padding:2px 8px">🚩 Lọc chưa xong</button></div>' +
        '<div class="luoi-so">' + luoiNutSo + '</div>' +
        '<button type="button" class="nut vien rong" style="margin-top:10px" id="casio-side">🧮 Mở Máy tính Casio &amp; M</button>' +
        '<button type="button" class="nut chinh to rong" style="margin-top:8px" id="nop-side" data-nop-btn>Nộp bài</button>' +
        '<div class="phu kbd-hint" style="justify-content:center;margin-top:8px">Phím tắt: <kbd>A–D</kbd> chọn · <kbd>F</kbd> cắm cờ · <kbd>↑/↓</kbd> chuyển · <kbd>Alt+P</kbd> Casio</div>' +
      '</div>' +
    '</aside></div>' +
    '<div class="exam-fab-drawer an" id="fab-drawer">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">' +
        '<b style="font-size:13.5px">🔢 Chọn nhanh câu hỏi</b>' +
        '<div class="hang-nut" style="gap:6px">' +
          '<button type="button" class="nut-flag" id="loc-chua-xong-fab" style="font-size:11.5px;padding:3px 9px">🚩 Lọc chưa xong</button>' +
          '<button type="button" class="nut nho" id="dong-fab-drawer">Đóng</button>' +
        '</div>' +
      '</div>' +
      '<div class="luoi-so">' + luoiNutSo + '</div>' +
    '</div>' +
    '<div class="exam-fab-bar" role="toolbar" aria-label="Công cụ làm bài nhanh">' +
      '<button type="button" class="exam-fab-btn" id="fab-pick" title="Mở bảng chọn nhanh câu hỏi">🔢 <span id="fab-tien-do">0/' + lam.cau.length + '</span></button>' +
      '<button type="button" class="exam-fab-btn casio" id="fab-casio" title="Mở Máy tính Casio Hóa học">🧮 Casio</button>' +
      '<button type="button" class="exam-fab-btn" id="fab-clock" title="Thời gian làm bài">⏱️ <span id="gio-fab">00:00</span></button>' +
      '<button type="button" class="exam-fab-btn chinh" data-nop-btn>Nộp bài</button>' +
    '</div>';

    app.innerHTML = h;

    app.querySelectorAll('.cau-hs').forEach(function (card, idx) {
      card.addEventListener('click', function () { kbdIdx = idx; app.querySelectorAll('.cau-hs.active-kbd').forEach(x => x.classList.remove('active-kbd')); });
    });

    app.querySelectorAll('.lc').forEach(function (b) {
      b.onclick = function () {
        const q = b.getAttribute('data-q'), k = Number(b.getAttribute('data-k'));
        lam.traLoi[q] = k;
        b.parentNode.querySelectorAll('.lc').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        luuNhap(); capNhatTienDo();
      };
    });
    app.querySelectorAll('.ds-btn').forEach(function (b) {
      b.onclick = function () {
        const q = b.getAttribute('data-q');
        const idx = Number(b.getAttribute('data-idx'));
        const val = b.getAttribute('data-v') === '1';
        if (!Array.isArray(lam.traLoi[q])) lam.traLoi[q] = [null, null, null, null];
        lam.traLoi[q][idx] = val;
        b.parentNode.querySelectorAll('.ds-btn').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        luuNhap(); capNhatTienDo();
      };
    });
    app.querySelectorAll('.o-tra-loi').forEach(function (inp) {
      inp.oninput = function () {
        const q = inp.getAttribute('data-q'), v = inp.value.trim();
        if (v) lam.traLoi[q] = v; else delete lam.traLoi[q];
        luuNhap(); capNhatTienDo();
      };
    });
    app.querySelectorAll('[data-sym-for]').forEach(function (btn) {
      btn.onclick = function () {
        const inp = document.getElementById(btn.getAttribute('data-sym-for'));
        if (!inp) return;
        const sy = btn.getAttribute('data-sym') || '';
        const st = inp.selectionStart || inp.value.length;
        const en = inp.selectionEnd || inp.value.length;
        inp.value = inp.value.slice(0, st) + sy + inp.value.slice(en);
        inp.focus();
        try { inp.setSelectionRange(st + sy.length, st + sy.length); } catch (e) {}
        inp.dispatchEvent(new Event('input'));
      };
    });
    app.querySelectorAll('[data-flag]').forEach(function (btn) {
      btn.onclick = function () {
        const cid = btn.getAttribute('data-flag');
        if (!lam.co) lam.co = {};
        if (lam.co[cid]) delete lam.co[cid]; else lam.co[cid] = true;
        const on = !!lam.co[cid];
        btn.classList.toggle('on', on);
        btn.innerHTML = '🚩 ' + (on ? 'Đã đánh dấu' : 'Xem lại');
        const card = btn.closest('.cau-hs');
        if (card) card.classList.toggle('co-flag', on);
        luuNhap(); capNhatTienDo();
      };
    });
    const apLocCauThi = function () {
      locCauThi = (locCauThi === 'tat_ca') ? 'chua_xong' : 'tat_ca';
      const chiChua = locCauThi === 'chua_xong';
      const b1 = $('#loc-chua-xong'), b2 = $('#loc-chua-xong-side'), b3 = $('#loc-chua-xong-fab');
      if (b1) b1.classList.toggle('chinh', chiChua);
      if (b2) { b2.classList.toggle('on', chiChua); b2.textContent = chiChua ? '🚩 Hiện tất cả' : '🚩 Lọc chưa xong'; }
      if (b3) { b3.classList.toggle('on', chiChua); b3.textContent = chiChua ? '🚩 Hiện tất cả' : '🚩 Lọc chưa xong'; }
      let demAn = 0;
      app.querySelectorAll('.cau-hs').forEach(function (card) {
        const cid = card.getAttribute('data-cid');
        const cObj = lam.cau.find(x => x.id === cid);
        const canLam = cObj && (!cauDaXong(cObj) || (lam.co && lam.co[cid]));
        const an = chiChua && !canLam;
        card.classList.toggle('an', an);
        if (an) demAn++;
      });
      if (chiChua && demAn === lam.cau.length) {
        locCauThi = 'tat_ca';
        app.querySelectorAll('.cau-hs').forEach(c => c.classList.remove('an'));
        if (b1) b1.classList.remove('chinh');
        if (b2) { b2.classList.remove('on'); b2.textContent = '🚩 Lọc chưa xong'; }
        if (b3) { b3.classList.remove('on'); b3.textContent = '🚩 Lọc chưa xong'; }
        alertNho('Tất cả các câu đều đã trả lời và không có câu nào đang cắm cờ!');
      }
    };
    const lcx1 = $('#loc-chua-xong'), lcx2 = $('#loc-chua-xong-side'), lcx3 = $('#loc-chua-xong-fab');
    if (lcx1) lcx1.onclick = apLocCauThi;
    if (lcx2) lcx2.onclick = apLocCauThi;
    if (lcx3) lcx3.onclick = apLocCauThi;
    app.querySelectorAll('[data-den]').forEach(function (b) {
      b.onclick = function () {
        if (locCauThi !== 'tat_ca') apLocCauThi();
        const dr = $('#lam-drawer'); if (dr) dr.classList.add('an');
        const fdr = $('#fab-drawer'); if (fdr) fdr.classList.add('an');
        const idx = Number(b.getAttribute('data-den'));
        const el = $('#cau-' + idx);
        if (el) {
          const all = Array.prototype.slice.call(app.querySelectorAll('.cau-hs'));
          datCauKbd_(all, idx);
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };
    });
    const tm = $('#toggle-muc');
    if (tm) tm.onclick = function () { const dr = $('#lam-drawer'); if (dr) dr.classList.toggle('an'); };
    const fPick = $('#fab-pick'), fClk = $('#fab-clock'), fDr = $('#fab-drawer'), dFdr = $('#dong-fab-drawer');
    const togFabDr = function () { if (fDr) fDr.classList.toggle('an'); };
    if (fPick) fPick.onclick = togFabDr;
    if (fClk) fClk.onclick = togFabDr;
    if (dFdr) dFdr.onclick = function () { if (fDr) fDr.classList.add('an'); };
    const moCasio = function () { if (typeof moBangTraCuu === 'function') moBangTraCuu('casio'); };
    const ct1 = $('#casio-top'), ct2 = $('#casio-side'), ct3 = $('#fab-casio');
    if (ct1) ct1.onclick = moCasio;
    if (ct2) ct2.onclick = moCasio;
    if (ct3) ct3.onclick = moCasio;
    $('#quay').onclick = manDanhSach;
    const qs = $('#quay-side'); if (qs) qs.onclick = manDanhSach;
    app.querySelectorAll('[data-nop-btn]').forEach(b => b.onclick = hoiNop);
    capNhatTienDo();
    batDongHo();
  }

  // Phím tắt bàn phím trên Máy tính khi đang làm bài (A/B/C/D hoặc 1/2/3/4 chọn đáp án, J/K hoặc ↓/↑ chuyển câu)
  document.addEventListener('keydown', function (e) {
    if (!lam || !document.body.classList.contains('dang-lam')) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (document.getElementById('h10-ref-modal') || !$('#hop-xn').classList.contains('an')) return;

    const cards = Array.prototype.slice.call(app.querySelectorAll('.cau-hs:not(.an)'));
    if (!cards.length) return;
    let curIdx = kbdIdx >= 0 && kbdIdx < cards.length ? kbdIdx : -1;
    if (curIdx < 0) {
      const mid = window.innerHeight * 0.36;
      let minDist = 1e9;
      cards.forEach(function (el, i) {
        const r = el.getBoundingClientRect();
        const d = Math.abs(r.top - mid);
        if (d < minDist) { minDist = d; curIdx = i; }
      });
    }

    const k = e.key.toUpperCase();
    if (k === 'F') {
      datCauKbd_(cards, curIdx);
      const card = cards[curIdx];
      const fBtn = card ? card.querySelector('[data-flag]') : null;
      if (fBtn) { e.preventDefault(); fBtn.click(); }
      return;
    }
    if (k === 'J' || e.key === 'ArrowDown') {
      e.preventDefault();
      const nextIdx = Math.min(cards.length - 1, curIdx + 1);
      datCauKbd_(cards, nextIdx);
      if (cards[nextIdx]) cards[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (k === 'K' || e.key === 'ArrowUp') {
      e.preventDefault();
      const prevIdx = Math.max(0, curIdx - 1);
      datCauKbd_(cards, prevIdx);
      if (cards[prevIdx]) cards[prevIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const mapABCD = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, '1': 0, '2': 1, '3': 2, '4': 3 };
    if (mapABCD[k] !== undefined) {
      datCauKbd_(cards, curIdx);
      const card = cards[curIdx];
      const btns = card ? card.querySelectorAll('.lc') : [];
      if (btns && btns[mapABCD[k]]) {
        e.preventDefault();
        btns[mapABCD[k]].click();
      }
    }
  });

  let henLuu = null;
  function luuNhap() { clearTimeout(henLuu); henLuu = setTimeout(function () { if (lam) kho.dat(KHOA_NHAP, lam); }, 300); }
  // Khóa nháp tức thì 0ms & ghi nhận chuyển tab khi đang làm bài kiểm tra
  window.addEventListener('pagehide', function () { if (lam) { clearTimeout(henLuu); kho.dat(KHOA_NHAP, lam); } });
  document.addEventListener('visibilitychange', function () {
    if (!lam || !document.body.classList.contains('dang-lam')) return;
    if (document.visibilityState === 'hidden') {
      clearTimeout(henLuu);
      lam.roiTab = (Number(lam.roiTab) || 0) + 1;
      kho.dat(KHOA_NHAP, lam);
    } else if (document.visibilityState === 'visible') {
      const ch = (lam.de && lam.de.cauHinh) || {};
      if ((ch.kiemTra || ch.phutLam > 0) && lam.roiTab > 0) {
        toast('⚠️ Hệ thống ghi nhận em vừa rời màn hình làm bài (' + lam.roiTab + ' lần).', true);
      }
    }
  });

  function soDaLam() { return lam.cau.filter(cauDaXong).length; }
  function capNhatTienDo() {
    const n = soDaLam(), t = lam.cau.length;
    const nCo = lam.co ? Object.keys(lam.co).filter(k => lam.co[k]).length : 0;
    const txt = 'Đã trả lời ' + n + '/' + t + ' câu' + (nCo ? ' · 🚩 ' + nCo : '');
    const pct = (t ? n / t * 100 : 0) + '%';
    const a = $('#da-lam'); if (a) a.textContent = txt;
    const as = $('#da-lam-side'); if (as) as.textContent = txt;
    const fp = $('#fab-tien-do'); if (fp) fp.textContent = n + '/' + t + (nCo ? '·🚩' + nCo : '');
    const v = $('#vach'); if (v) v.style.width = pct;
    const vs = $('#vach-side'); if (vs) vs.style.width = pct;
    app.querySelectorAll('[data-den]').forEach(function (b) {
      const idx = b.getAttribute('data-den');
      const c = lam.cau[Number(idx)];
      if (c) {
        b.classList.toggle('da', cauDaXong(c));
        b.classList.toggle('co-flag', !!(lam.co && lam.co[c.id]));
      }
    });
  }
  function batDongHo() {
    dungDongHo();
    document.body.classList.add('dang-lam');
    const phutGioiHan = (lam && lam.de && lam.de.cauHinh) ? (Number(lam.de.cauHinh.phutLam) || 0) : 0;
    let daTuNop = false;
    const f = function () {
      if (!lam) return;
      const daQua = (Date.now() - lam.batDau) / 1000;
      if (phutGioiHan > 0) {
        const conGiay = Math.max(0, Math.ceil(phutGioiHan * 60 - daQua));
        const t = thoiGian(conGiay);
        const gap = conGiay <= 120;
        const g = $('#gio'); if (g) { g.textContent = '⏳ ' + t; g.classList.toggle('gap', gap); }
        const gs = $('#gio-side'); if (gs) gs.textContent = t;
        const boxGs = $('#box-gio-side'); if (boxGs) boxGs.classList.toggle('gap', gap);
        const gf = $('#gio-fab'); if (gf) gf.textContent = t;
        if (conGiay <= 0 && !daTuNop) {
          daTuNop = true;
          clearInterval(demGio); demGio = null;
          const hop = $('#hop-xn'); if (hop) hop.classList.add('an');
          toast('⏰ Đã hết thời gian làm bài! Hệ thống đang tự động thu bài của em.', true);
          nop();
        }
      } else {
        const t = thoiGian(daQua);
        const g = $('#gio'); if (g) g.textContent = t;
        const gs = $('#gio-side'); if (gs) gs.textContent = t;
        const gf = $('#gio-fab'); if (gf) gf.textContent = t;
      }
    };
    f(); demGio = setInterval(f, 1000);
  }

  function hoiNop() {
    const con = lam.cau.length - soDaLam();
    if (!con) return nop();
    $('#xn-chu').textContent = 'Em còn ' + con + ' câu chưa trả lời đủ. Ý/câu bỏ trống sẽ tính là sai. Em có muốn nộp luôn không?';
    const hop = $('#hop-xn'); hop.classList.remove('an');
    $('#xn-khong').focus();
    $('#xn-khong').onclick = function () { hop.classList.add('an'); };
    $('#xn-co').onclick = function () { hop.classList.add('an'); nop(); };
  }
  function nop() {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      kho.dat(KHOA_NHAP, lam);
      alertNho('Thiết bị đang mất kết nối mạng (Wi-Fi/4G). Bài làm của em đã được khóa an toàn trên máy — hãy bật lại mạng rồi bấm Nộp bài nhé!');
      cuon();
      return;
    }
    const nuts = app.querySelectorAll('[data-nop-btn]');
    nuts.forEach(b => { b.disabled = true; b.textContent = 'Đang chấm bài...'; });
    const daLam = lam;
    const metaNop = { roiTab: Number(daLam.roiTab) || 0 };
    api('hsNopBai', daLam.token, daLam.traLoi, metaNop).then(function (kq) {
      dungDongHo();
      kho.xoa(KHOA_NHAP);
      lam = null;
      veKetQua(daLam, kq);
    }).catch(function (e) {
      const m = baoLoi(e);
      if (typeof m !== 'string') return;
      nuts.forEach(b => { b.disabled = false; b.textContent = 'Nộp bài'; });
      if (m.indexOf('quá 6 tiếng') >= 0) {
        const cu = app.querySelector('.thongbao[role="alert"]'); if (cu) cu.remove();
        const box = document.createElement('div'); box.className = 'thongbao loi'; box.setAttribute('role', 'alert');
        box.style.flexDirection = 'column';
        box.innerHTML = '<div>' + esc(m) + ' (bài làm của em vẫn được giữ nguyên trên máy)</div>' +
          '<button type="button" class="nut chinh nho" id="gia-han-nop">Gia hạn phiên và nộp ngay</button>';
        app.prepend(box);
        $('#gia-han-nop').onclick = function () {
          const b = this; b.disabled = true; b.textContent = 'Đang gia hạn & nộp...';
          api('hsBatDau', hs.khoa, daLam.de.id).then(function (r) {
            daLam.token = r.token; daLam.batDau = Date.now(); lam = daLam; kho.dat(KHOA_NHAP, lam);
            return api('hsNopBai', daLam.token, daLam.traLoi, metaNop);
          }).then(function (kq) { dungDongHo(); kho.xoa(KHOA_NHAP); lam = null; veKetQua(daLam, kq); })
            .catch(function (err) { b.disabled = false; b.textContent = 'Gia hạn phiên và nộp ngay'; alertNho(baoLoi(err)); });
        };
      } else {
        alertNho(m + ' (bài làm của em vẫn được giữ nguyên trên máy)');
      }
      cuon();
    });
  }

  // ---------- 4. Kết quả ----------
  function hienTraLoi(c, tl) {
    if (c.loai === 'ds') {
      if (!Array.isArray(tl) || !tl.some(v => v === true || v === false)) return '<em>(bỏ trống)</em>';
      return tl.slice(0, 4).map((v, j) => 'abcd'.charAt(j) + ') ' + (v === true ? 'Đúng' : (v === false ? 'Sai' : '–'))).join(' · ');
    }
    if (tl === undefined || tl === null || tl === '') return '<em>(bỏ trống)</em>';
    if (c.loai === 'tn') {
      const o = c.luaChon.find(x => x.k === Number(tl));
      return o ? md(o.t) : esc(tl);
    }
    return md(tl);
  }

  function veDsChiTiet(luaChon, tlArr, daArr) {
    let s = '<div class="ds-list">';
    (luaChon || []).forEach(function (txt, j) {
      const da = daArr ? daArr[j] : null;
      const chon = Array.isArray(tlArr) ? tlArr[j] : null;
      let cls = '', note = '';
      if (daArr) {
        const coChon = chon === true || chon === false;
        const dung = coChon && chon === da;
        if (tlArr !== undefined) {
          cls = dung ? ' dung' : ' sai';
          note = '<span class="ds-note" style="color:' + (dung ? 'var(--ok)' : 'var(--loi)') + '">' +
            (coChon ? ('Chọn: ' + (chon ? 'Đ' : 'S') + ' · ') : 'Bỏ trống · ') +
            'Đáp án: ' + (da ? 'Đúng' : 'Sai') + '</span>';
        } else {
          cls = da ? ' dung' : '';
          note = '<span class="ds-note" style="color:' + (da ? 'var(--ok)' : 'var(--mo)') + '">' + (da ? 'Đúng' : 'Sai') + '</span>';
        }
      }
      s += '<div class="ds-row' + cls + '"><span class="ds-key">' + 'abcd'.charAt(j) + ')</span><span class="ds-txt">' + md(txt) + '</span>' + note + '</div>';
    });
    return s + '</div>';
  }

  function veKetQua(l, kq) {
    cuon();
    const thuTu = {}; l.cau.forEach((c, i) => thuTu[c.id] = i);
    const sai = kq.sai.slice().sort((a, b) => thuTu[a] - thuTu[b]);
    const dSo = Number(kq.diem) || 0;
    const ringCls = dSo >= 8 ? 'tot' : (dSo >= 5 ? 'kha' : 'can');
    const ringCol = dSo >= 8 ? 'var(--ok)' : (dSo >= 5 ? 'var(--tim)' : 'var(--canh)');
    const chDe = (l.de && l.de.cauHinh) || {};
    const coMoGiai = !!(kq.hetHan || chDe.moDapAnNgay || kq.giai);
    const cauSaiLuyen = Array.isArray(kq.cauSaiLuyen) ? kq.cauSaiLuyen : [];
    const conLuot = !(chDe.soLanToiDa > 0 && kq.soLan >= chDe.soLanToiDa && !kq.hetHan);

    let h = '<div class="hero-box" style="text-align:center">' +
      '<span class="chip chinh">' + esc(l.de.ten) + (kq.muon ? ' · Luyện tập' : ' · Lần thứ ' + kq.soLan) + '</span>' +
      '<div><div class="score-ring ' + ringCls + '">' +
        '<span style="font-size:46px;font-weight:800;line-height:1;color:' + ringCol + '">' + diem(kq.diem) + '</span>' +
        '<span style="font-size:19px;color:var(--mo);margin-left:3px">/10</span>' +
      '</div></div>' +
      '<div style="font-weight:700">' + soDung(kq.dung) + '/' + kq.tong + ' câu đúng</div>' +
    '</div>';

    h += '<div class="kpi-strip">' +
      '<div class="kpi-card tim"><div class="n">Thời gian làm</div><div class="g">' + thoiGian(kq.giay) + '</div></div>' +
      '<div class="kpi-card xanh"><div class="n">Điểm cao nhất</div><div class="g">' + (kq.best === null ? '–' : diem(kq.best)) + '</div></div>' +
    '</div>';

    if (kq.muon) h += '<div class="thongbao canh">' + ICONS.tt + '<span>Bài này làm sau hạn nộp nên chỉ để luyện tập, không tính vào điểm.</span></div>';

    if (cauSaiLuyen.length) {
      h += '<div class="the the-noi" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-color:var(--tim)">' +
        '<div><b style="color:var(--tim)">🔁 Muốn khắc phục ngay ' + cauSaiLuyen.length + ' câu vừa làm sai?</b>' +
        '<div class="phu" style="font-size:12.5px">Hệ thống trộn lại riêng các câu chưa đúng để em thử sức lại tức thì.</div></div>' +
        '<button type="button" class="nut chinh" id="luyen-cau-sai">🔁 Luyện riêng ' + cauSaiLuyen.length + ' câu sai</button>' +
      '</div>';
    }

    if (!sai.length) {
      h += '<div class="the" style="text-align:center"><div style="font-size:18px;font-weight:800;color:var(--ok)">Đúng hết tất cả câu hỏi, xuất sắc!</div></div>';
    } else {
      h += '<div class="nhan-muc">' + sai.length + ' câu chưa trọn điểm / làm sai</div>';
      sai.forEach(function (id) {
        const i = thuTu[id], c = l.cau[i];
        h += '<div class="the" style="border-left:4px solid var(--loi)">' +
          '<span class="chip loi" style="margin-bottom:6px">Câu ' + (i + 1) + '</span>' +
          '<div class="noi-dung" style="margin-bottom:6px">' + md(c.cauHoi) + '</div>' +
          '<div class="phu" style="font-size:13.5px">Em ' + (c.loai === 'tn' || c.loai === 'ds' ? 'chọn' : 'điền') + ': <b style="color:var(--loi)">' + hienTraLoi(c, l.traLoi[id]) + '</b></div>';
        if (kq.giai && kq.giai[id]) {
          if (c.loai === 'ds' && kq.giai[id].dapAnDs) {
            h += veDsChiTiet(c.luaChon, l.traLoi[id], kq.giai[id].dapAnDs);
          }
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(kq.giai[id].dapAn) + '</div>' +
            (kq.giai[id].loiGiai ? '<div style="margin-top:4px">' + md(kq.giai[id].loiGiai) + '</div>' : '') + '</div>';
        }
        h += '</div>';
      });
    }

    if (!coMoGiai) {
      h += '<div class="thongbao canh">' + ICONS.khoa + '<span>Đáp án đúng và lời giải sẽ mở sau <b>' + han(kq.han) + '</b>.' + (conLuot ? ' Em có thể làm lại để nâng điểm.' : '') + '</span></div>';
    }
    h += '<div class="hang-nut" style="margin-top:16px">' +
      (conLuot ? '<button type="button" class="nut chinh" style="flex:1" id="lam-lai">Làm lại cả đề</button>' : '') +
      '<button type="button" class="nut" style="flex:1" id="ve-ds">Về danh sách</button>' +
    '</div>';
    if (coMoGiai) h += '<div class="hang-nut" style="margin-top:8px"><button type="button" class="nut xanh rong" id="xem-ca">Xem đáp án cả đề</button></div>';

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));
    const ll = $('#lam-lai'); if (ll) ll.onclick = function () { batDau(l.de.id); };
    const lcs = $('#luyen-cau-sai');
    if (lcs) lcs.onclick = function () { veLuyenTap('Luyện lại câu sai · ' + l.de.ten, cauSaiLuyen); };
    $('#ve-ds').onclick = manDanhSach;
    const x = $('#xem-ca'); if (x) x.onclick = function () { xemDapAn(l.de.id); };
    if (dSo >= 8 && typeof phaoGiay === 'function') setTimeout(function () { phaoGiay(dSo >= 10 ? 140 : 90); }, 250);
  }

  // ---------- 5. Xem đáp án / xem lại bài cũ ----------
  function xemDapAn(deId) {
    dungDongHo(); dangTai('Đang lấy đáp án...');
    api('hsXemDapAn', deId, hs && hs.khoa ? hs.khoa : '').then(function (r) {
      cuon();
      let locPhan = '';
      function ve() {
        let h = '<div class="hero-box art-flask"><button type="button" class="nut nho" id="ve" style="margin-bottom:8px">← Về danh sách</button>' +
          '<h1>' + esc(r.ten) + '</h1><span class="chip ok">ĐÁP ÁN VÀ LỜI GIẢI CHI TIẾT</span></div>';
        h += '<div class="the" style="margin-bottom:12px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
            '<b style="font-size:13px;color:var(--mo)">Chuyển nhanh đến câu:</b>' +
            '<div class="seg">' +
              '<button type="button" data-lp="" class="' + (!locPhan ? 'on' : '') + '">Tất cả (' + r.cau.length + ')</button>' +
              '<button type="button" data-lp="tn" class="' + (locPhan === 'tn' ? 'on' : '') + '">Trắc nghiệm</button>' +
              '<button type="button" data-lp="ds" class="' + (locPhan === 'ds' ? 'on' : '') + '">Đúng/Sai</button>' +
              '<button type="button" data-lp="tl" class="' + (locPhan === 'tl' ? 'on' : '') + '">Trả lời ngắn</button>' +
            '</div>' +
          '</div>' +
          '<div class="luoi-so">' + r.cau.map((c, i) => '<button type="button" class="o-so kq-dung" data-jump="' + i + '">' + (i + 1) + '</button>').join('') + '</div>' +
        '</div>';

        let phanTruoc = '';
        r.cau.forEach(function (c, i) {
          if (locPhan === 'tn' && c.loai !== 'tn') return;
          if (locPhan === 'ds' && c.loai !== 'ds') return;
          if (locPhan === 'tl' && (c.loai === 'tn' || c.loai === 'ds')) return;
          const p = nhomPhan(c.loai);
          if (p.key !== phanTruoc) {
            phanTruoc = p.key;
            h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
          }
          h += '<div class="the" id="xda-' + i + '">' +
            '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span class="chip chinh">Câu ' + (i + 1) + '</span><span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span></div>' +
            '<div class="noi-dung">' + md(c.cauHoi) + '</div>';
          if (c.loai === 'tn' && c.luaChon) {
            c.luaChon.forEach(function (t, j) {
              const laDung = (c.dapAnIdx !== null && c.dapAnIdx !== undefined) ? (j === c.dapAnIdx) : (t === c.dapAn);
              h += '<div class="lc-xem' + (laDung ? ' dung' : '') + '">' + 'ABCD'.charAt(j) + '. ' + md(t) + (laDung ? ' ✓' : '') + '</div>';
            });
          } else if (c.loai === 'ds' && c.luaChon) {
            h += veDsChiTiet(c.luaChon, undefined, c.dapAnDs);
          }
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(c.dapAn) + '</div>' + (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div></div>';
        });
        h += '<button type="button" class="nut chinh rong" style="margin-top:14px" id="ve2">Về danh sách</button>';
        h += '<div id="slogan-slot"></div>';
        app.innerHTML = h;
        renderSlogan(document.getElementById('slogan-slot'));
        $('#ve').onclick = manDanhSach; $('#ve2').onclick = manDanhSach;
        app.querySelectorAll('[data-lp]').forEach(b => b.onclick = function () { locPhan = b.getAttribute('data-lp'); ve(); });
        app.querySelectorAll('[data-jump]').forEach(b => b.onclick = function () {
          if (locPhan) { locPhan = ''; ve(); }
          const el = $('#xda-' + b.getAttribute('data-jump'));
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }
      ve();
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }

  function xemBaiCu(deId, lanId) {
    dungDongHo(); dangTai('Đang tải bài làm cũ...');
    api('hsXemBaiCu', hs.khoa, deId, lanId || '').then(function (r) {
      cuon();
      let locXem = 'tat_ca'; // 'tat_ca' | 'sai' | 'ds'
      const dangXem = r.lan.find(x => x.id === r.dangXemId) || r.lan[0];
      const dsCauSai = r.cau.filter(c => !c.dung);

      function ve() {
        let h = '<div class="hero-box art-flask"><button type="button" class="nut nho" id="ve" style="margin-bottom:8px">← Về danh sách</button>' +
          '<h1>' + esc(r.ten) + '</h1>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">' +
            '<span class="chip chinh">Điểm: ' + diem(dangXem.diem) + '/10</span>' +
            '<span class="chip ok">' + soDung(dangXem.dung) + '/' + dangXem.tong + ' câu đúng</span>' +
            '<span class="chip">' + thoiGian(dangXem.giay) + '</span>' +
            (dangXem.muon ? '<span class="chip canh">Luyện tập (sau hạn)</span>' : '') +
          '</div>';
        if (r.lan.length > 1) {
          h += '<div class="truong" style="margin-top:10px"><label for="chon-lan">Xem lượt làm khác (' + r.lan.length + ' lượt)</label>' +
            '<select id="chon-lan">' + r.lan.map(function (l, idx) {
              return '<option value="' + esc(l.id) + '"' + (l.id === dangXem.id ? ' selected' : '') + '>Lượt ' + (r.lan.length - idx) + ' · ' + diem(l.diem) + ' điểm (' + han(l.nop) + ')' + (l.muon ? ' · Luyện tập' : '') + '</option>';
            }).join('') + '</select></div>';
        }
        h += '</div>';

        // Bản đồ màu câu hỏi + Bộ lọc câu sai + Nút luyện lại riêng câu sai
        h += '<div class="the" style="margin-bottom:12px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
            '<div class="seg">' +
              '<button type="button" data-lx="tat_ca" class="' + (locXem === 'tat_ca' ? 'on' : '') + '">Tất cả (' + r.cau.length + ')</button>' +
              '<button type="button" data-lx="sai" class="' + (locXem === 'sai' ? 'on' : '') + '">Chưa trọn điểm (' + dsCauSai.length + ')</button>' +
              '<button type="button" data-lx="ds" class="' + (locXem === 'ds' ? 'on' : '') + '">Phần Đúng/Sai</button>' +
            '</div>' +
            (dsCauSai.length ? '<button type="button" class="nut nho chinh" id="btn-luyen-sai-cu">🔁 Luyện riêng ' + dsCauSai.length + ' câu sai</button>' : '') +
          '</div>' +
          '<div class="luoi-so">' + r.cau.map(function (c, i) {
            const dCau = c.diemCau !== undefined ? Number(c.diemCau) : (c.dung ? 1 : 0);
            const cls = c.dung ? 'kq-dung' : (dCau > 0 ? 'kq-phan' : 'kq-sai');
            return '<button type="button" class="o-so ' + cls + '" data-jump-cu="' + i + '" title="Câu ' + (i + 1) + '">' + (i + 1) + '</button>';
          }).join('') + '</div>' +
        '</div>';

        let phanTruoc = '';
        let demHien = 0;
        r.cau.forEach(function (c, i) {
          if (locXem === 'sai' && c.dung) return;
          if (locXem === 'ds' && c.loai !== 'ds') return;
          demHien++;
          const p = nhomPhan(c.loai, r.cauHinh && r.cauHinh.thangDiemDS);
          if (p.key !== phanTruoc) {
            phanTruoc = p.key;
            h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
          }
          const dCau = c.diemCau !== undefined ? Number(c.diemCau) : (c.dung ? 1 : 0);
          const laMotPhan = c.loai === 'ds' && dCau > 0 && dCau < 1;
          const borderCol = c.dung ? 'var(--ok)' : (laMotPhan ? '#d97706' : 'var(--loi)');
          const chipCls = c.dung ? 'ok' : (laMotPhan ? 'canh' : 'loi');
          const chipTxt = c.dung ? ' · Đúng' : (laMotPhan ? (' · Đúng một phần (' + soDung(dCau) + ' câu)') : ' · Sai');
          h += '<div class="the" id="xbc-' + i + '" style="border-left:4px solid ' + borderCol + '">' +
            '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
              '<span class="chip ' + chipCls + '">Câu ' + (i + 1) + chipTxt + '</span>' +
              '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
            '</div>' +
            '<div class="noi-dung">' + md(c.cauHoi) + '</div>';

          if (c.loai === 'tn' && c.luaChon) {
            c.luaChon.forEach(function (t, j) {
              const laDung = j === c.dapAnIdx;
              const laChon = c.tl !== null && c.tl !== undefined && Number(c.tl) === j;
              const cls = laDung ? ' dung' : (laChon ? ' sai-chon' : '');
              h += '<div class="lc-xem' + cls + '">' + 'ABCD'.charAt(j) + '. ' + md(t) +
                (laDung ? ' ✓' : (laChon ? ' (em chọn)' : '')) + '</div>';
            });
          } else if (c.loai === 'ds' && c.luaChon) {
            h += veDsChiTiet(c.luaChon, c.tl, c.dapAnDs);
          } else {
            const tlHien = (c.tl === null || c.tl === undefined || c.tl === '') ? '<em>(bỏ trống)</em>' : md(c.tl);
            h += '<div class="phu" style="font-size:13.5px;margin-bottom:6px">Em trả lời: <b style="color:' + (c.dung ? 'var(--ok)' : 'var(--loi)') + '">' + tlHien + '</b></div>';
          }
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(c.dapAn) + '</div>' + (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div></div>';
        });

        if (!demHien) h += '<div class="the" style="text-align:center"><p class="phu" style="margin:0">Không có câu hỏi nào trong mục lọc này.</p></div>';
        h += '<button type="button" class="nut chinh rong" style="margin-top:14px" id="ve2">Về danh sách</button>';
        h += '<div id="slogan-slot"></div>';
        app.innerHTML = h;
        renderSlogan(document.getElementById('slogan-slot'));
        $('#ve').onclick = manDanhSach; $('#ve2').onclick = manDanhSach;
        const cl = $('#chon-lan'); if (cl) cl.onchange = function () { xemBaiCu(deId, this.value); };
        app.querySelectorAll('[data-lx]').forEach(b => b.onclick = function () { locXem = b.getAttribute('data-lx'); ve(); });
        app.querySelectorAll('[data-jump-cu]').forEach(b => b.onclick = function () {
          if (locXem !== 'tat_ca') { locXem = 'tat_ca'; ve(); }
          const el = $('#xbc-' + b.getAttribute('data-jump-cu'));
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        const blsc = $('#btn-luyen-sai-cu');
        if (blsc) blsc.onclick = function () { veLuyenTap('Luyện lại câu chưa đúng · ' + r.ten, dsCauSai); };
      }
      ve();
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }

  // ---------- 6. Phòng Tự Luyện & Luyện Lại Câu Sai (chấm tức thì tại máy) ----------
  function tronMang_(arr) {
    const a = (arr || []).slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function chuanCauLuyenTap_(c) {
    const o = {
      id: c.id,
      loai: c.loai,
      bai: c.bai || '',
      cauHoi: c.cauHoi,
      dapAnHien: c.dapAnHien || c.dapAn || '',
      loiGiai: c.loiGiai || ''
    };
    if (c.loai === 'tn') {
      const goc = Array.isArray(c.luaChon) ? c.luaChon.map(function (it, idx) {
        return (it && typeof it === 'object' && 'k' in it) ? { k: Number(it.k), t: it.t } : { k: idx, t: String(it) };
      }) : [];
      o.luaChon = tronMang_(goc);
      o.dapAnK = c.dapAnK !== undefined && c.dapAnK !== null ? Number(c.dapAnK) : Number(c.dapAnIdx);
    } else if (c.loai === 'ds') {
      o.luaChon = Array.isArray(c.luaChon) ? c.luaChon.slice() : [];
      o.dapAnDs = Array.isArray(c.dapAnDs) ? c.dapAnDs.slice() : [false, false, false, false];
    } else if (c.loai === 'so') {
      o.dapAnSo = String(c.dapAnSo !== undefined && c.dapAnSo !== null ? c.dapAnSo : (c.dapAn || ''));
      o.saiSo = Math.abs(Number(c.saiSo) || 0);
    } else {
      o.chapNhan = Array.isArray(c.chapNhan) && c.chapNhan.length ? c.chapNhan : [String(c.dapAn || '')];
      o.phanBietHoa = !!c.phanBietHoa;
    }
    return o;
  }

  function chamCauLuyen_(c, tl) {
    if (tl === undefined || tl === null || tl === '') return 0;
    if (c.loai === 'tn') return Number(tl) === Number(c.dapAnK) ? 1 : 0;
    if (c.loai === 'ds') {
      if (!Array.isArray(tl)) return 0;
      let dungY = 0;
      for (let i = 0; i < 4; i++) {
        if ((tl[i] === true || tl[i] === false) && tl[i] === c.dapAnDs[i]) dungY++;
      }
      return dungY * 0.25;
    }
    if (c.loai === 'so') {
      const a = parseFloat(String(tl).trim().replace(/\s+/g, '').replace(',', '.'));
      const b = parseFloat(String(c.dapAnSo).trim().replace(/\s+/g, '').replace(',', '.'));
      if (isNaN(a) || isNaN(b)) return 0;
      const ss = c.saiSo > 0 ? c.saiSo : Math.max(1e-9, Math.abs(b) * 0.005);
      return Math.abs(a - b) <= ss + 1e-9 ? 1 : 0;
    }
    const chuan = function (s) {
      let x = String(s || '').trim().replace(/\s+/g, ' ').replace(/[−–]/g, '-');
      return c.phanBietHoa ? x : x.toLowerCase();
    };
    const u = chuan(tl);
    return (c.chapNhan || []).some(d => chuan(d) === u) ? 1 : 0;
  }

  function batDauTuLuyen(opts) {
    dungDongHo();
    dangTai('Đang rút đề tự luyện ngẫu nhiên...');
    api('hsLayDeTuLuyen', hs.khoa, opts || {}).then(function (r) {
      if (!r || !Array.isArray(r.cau) || !r.cau.length) {
        manDanhSach();
        setTimeout(() => alertNho('Chưa có câu hỏi phù hợp trong các đề đã hết hạn để tạo bài tự luyện.'), 300);
        return;
      }
      veLuyenTap(r.ten || 'Phòng tự luyện Hóa 10', r.cau);
    }).catch(function (e) {
      const m = baoLoi(e);
      if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 350); }
    });
  }

  function veLuyenTap(tieuDe, dsGoc) {
    dungDongHo();
    cuon();
    document.body.classList.add('dang-lam');
    const dsCau = (dsGoc || []).map(chuanCauLuyenTap_);
    const tlMap = {};
    const daKiem = {};
    let daChamHet = false;

    function ve() {
      let tongDiem = 0;
      dsCau.forEach(c => { tongDiem += chamCauLuyen_(c, tlMap[c.id]); });
      const diem10 = dsCau.length ? Math.round((tongDiem / dsCau.length) * 100) / 10 : 0;

      let h = '<div class="hero-box art-atom">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<button type="button" class="nut nho" id="lt-ve">← Về danh sách</button>' +
          '<div class="hang-nut">' +
            '<button type="button" class="nut nho" id="lt-casio">🧮 Casio</button>' +
            '<button type="button" class="nut nho tim" id="lt-tron">🔀 Trộn làm lại</button>' +
          '</div>' +
        '</div>' +
        '<h1 style="margin-top:8px">' + esc(tieuDe) + '</h1>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">' +
          '<span class="chip tim">⚡ Chế độ tự luyện · Không giới hạn</span>' +
          '<span class="chip">' + dsCau.length + ' câu</span>' +
          (daChamHet ? ('<span class="chip ok">Kết quả: ' + diem(diem10) + '/10 (' + soDung(tongDiem) + '/' + dsCau.length + ' câu)</span>') : '') +
        '</div>' +
      '</div>';

      dsCau.forEach(function (c, i) {
        const tl = tlMap[c.id];
        const hienGiai = !!(daChamHet || daKiem[c.id]);
        const dCau = hienGiai ? chamCauLuyen_(c, tl) : null;
        const borderStyle = !hienGiai ? '' : ('border-left:4px solid ' + (dCau >= 1 - 1e-9 ? 'var(--ok)' : (dCau > 0 ? '#d97706' : 'var(--loi)')));

        h += '<div class="the cau-hs" style="' + borderStyle + '">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
            '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
              '<span class="chip ' + (!hienGiai ? 'chinh' : (dCau >= 1 - 1e-9 ? 'ok' : (dCau > 0 ? 'canh' : 'loi'))) + '">Câu ' + (i + 1) + (!hienGiai ? '' : (dCau >= 1 - 1e-9 ? ' · Đúng ✓' : (dCau > 0 ? ' · Đúng ' + soDung(dCau) : ' · Chưa đúng'))) + '</span>' +
              '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
              (c.bai ? '<span class="chip tim">Bài ' + esc(c.bai) + '</span>' : '') +
            '</div>' +
            (!hienGiai ? '<button type="button" class="nut nho vien" data-kt-cau="' + esc(c.id) + '">Kiểm tra câu này</button>' : '') +
          '</div>' +
          '<div class="noi-dung">' + md(c.cauHoi) + '</div>';

        if (c.loai === 'tn') {
          const ngan = (c.luaChon || []).every(o => String(o.t || '').length <= 68);
          h += '<div class="lua-chon' + (ngan ? ' grid-2' : '') + '">';
          c.luaChon.forEach(function (o, j) {
            const dangChon = tl === o.k;
            let extraStyle = '';
            if (hienGiai) {
              if (o.k === c.dapAnK) extraStyle = 'border-color:var(--ok);background:var(--dung-n);';
              else if (dangChon) extraStyle = 'border-color:var(--loi);background:var(--sai-n);';
            }
            h += '<button type="button" class="lc" style="' + extraStyle + '" data-lt-q="' + esc(c.id) + '" data-k="' + o.k + '" aria-pressed="' + (dangChon ? 'true' : 'false') + '"' + (hienGiai ? ' disabled' : '') + '>' +
              '<span class="chu-cai">' + 'ABCD'.charAt(j) + '</span><span>' + md(o.t) + '</span></button>';
          });
          h += '</div>';
        } else if (c.loai === 'ds') {
          if (hienGiai) {
            h += veDsChiTiet(c.luaChon, tl, c.dapAnDs);
          } else {
            const arr = Array.isArray(tl) ? tl : [null, null, null, null];
            h += '<div class="ds-list">';
            (c.luaChon || []).forEach(function (txt, j) {
              const v = arr[j];
