<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="utf-8">
<title>Bài tập về nhà Hóa 10</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --do:#7A2230; --do2:#5B1722; --do3:#A6384B; --do-n:#F9ECEF; --do-v:#E8C6CE;
  --tim:#6D28D9; --tim2:#5B21B6; --tim-n:#F3EEFE; --tim-v:#DDD6FE;
  --xanh:#0F766E; --xanh-n:#E6F6F3; --xanh-v:#B5E3D9;
  --sky:#0284C7; --sky-n:#E8F4FC;
  --nen:#F7F8FC; --the:#FFFFFF; --nen2:#F9FAFD; --vien:#E3E6F0; --vien2:#EEF0F7;
  --chu:#1E1B24; --mo:#646072;
  --loi:#B91C1C; --loi-n:#FEF2F2; --loi-v:#FECACA;
  --ok:#0F766E; --ok-n:#E6F6F3; --ok-v:#A7F3D0;
  --canh:#B45309; --canh-n:#FFFBEB; --canh-v:#FDE68A;
  --shadow:0 1px 2px rgba(24,20,38,.04), 0 6px 18px rgba(30,24,52,.045);
  --grad:linear-gradient(90deg,var(--do) 0%,var(--tim) 52%,var(--xanh) 100%);
  --dot:radial-gradient(rgba(109,40,217,.08) 1px, transparent 1px);
}
html[data-theme="classic"]{
  --nen:#F5F4F2; --nen2:#FAF9F8; --vien:#E6E1DE; --vien2:#EFEBE8;
  --dot:none;
}
html[data-theme="dark"]{
  --do:#C24156; --do2:#E1586E; --do3:#9F2D40; --do-n:rgba(194,65,86,.18); --do-v:rgba(225,88,110,.35);
  --tim:#A78BFA; --tim2:#8B5CF6; --tim-n:rgba(167,139,250,.16); --tim-v:rgba(167,139,250,.32);
  --xanh:#2DD4BF; --xanh-n:rgba(45,212,191,.15); --xanh-v:rgba(45,212,191,.3);
  --sky:#38BDF8; --sky-n:rgba(56,189,248,.16);
  --nen:#12131C; --the:#1A1C29; --nen2:#212436; --vien:#2C3047; --vien2:#25293D;
  --chu:#F1F2F8; --mo:#A0A4BD;
  --loi:#FCA5A5; --loi-n:rgba(248,113,113,.16); --loi-v:rgba(248,113,113,.32);
  --ok:#2DD4BF; --ok-n:rgba(45,212,191,.16); --ok-v:rgba(45,212,191,.32);
  --canh:#FBBF24; --canh-n:rgba(251,191,36,.16); --canh-v:rgba(251,191,36,.32);
  --shadow:0 2px 12px rgba(0,0,0,.32);
  --dot:radial-gradient(rgba(167,139,250,.1) 1px, transparent 1px);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background-color:var(--nen);background-image:var(--dot);background-size:20px 20px;color:var(--chu);font-size:14.5px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
a{color:var(--do);text-decoration:none}
a:hover{color:var(--do2);text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}

/* Topbar Burgundy - Tim - Ngoc (khong blur de cuon 60fps trong iframe) */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:35;background:var(--the);border-bottom:1px solid var(--vien);box-shadow:0 2px 10px rgba(24,18,40,.05)}
.topbar::before{content:"";display:block;height:3.5px;background:var(--grad)}
.topbar-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--do) 0%,var(--tim) 100%);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(122,34,48,.24);flex-shrink:0}
.brand-txt{min-width:0}
.brand-txt .nho{font-size:10px;letter-spacing:.11em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;text-transform:uppercase;line-height:1.2}
.brand-txt .ten{font-size:13.5px;font-weight:700;color:var(--chu);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav-links{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nav-links button{all:unset;cursor:pointer;padding:7px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mo);transition:background-color .14s,color .14s;white-space:nowrap;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;position:relative}
.nav-links button:hover{background:var(--nen2);color:var(--chu)}
.nav-links button[aria-current="page"]{background:linear-gradient(135deg,var(--do-n),var(--tim-n));color:var(--do);font-weight:600;border-color:var(--do-v)}
.nav-links button[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;border-radius:999px;background:var(--grad)}

.top-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.top-pill{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:0 10px;border-radius:8px;background:var(--nen2);border:1px solid var(--vien);color:var(--chu);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.top-pill:hover{border-color:var(--tim-v);color:var(--tim);background:var(--tim-n);text-decoration:none}
.theme-dots{display:inline-flex;gap:3px;align-items:center}
.theme-dots i{width:7px;height:7px;border-radius:999px;display:block}

/* Containers */
.khung-chinh{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:18px 16px 56px}
.khung-hep{flex:1;width:100%;max-width:740px;margin:0 auto;padding:16px 14px 52px}
.phu{font-size:13px;color:var(--mo)}
.nhan-muc{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mo);margin:18px 2px 8px}

/* Cards & Hero */
.the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative}
.the + .the{margin-top:12px}
.the-noi{border:1.5px solid var(--do-v);background:linear-gradient(180deg,var(--do-n) 0%,var(--the) 24%)}
.hero-box{background:linear-gradient(135deg,var(--do-n) 0%,var(--the) 44%,var(--tim-n) 78%,var(--xanh-n) 100%);border:1px solid var(--tim-v);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
html[data-theme="dark"] .hero-box{background:linear-gradient(135deg,rgba(194,65,86,.18) 0%,var(--the) 48%,rgba(109,40,217,.18) 100%)}
.hero-box h1{margin:4px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
h1.tieu-trang{margin:0 0 12px;font-size:22px;font-weight:800;letter-spacing:-.015em}
h2.tieu-khoi{margin:0;font-size:16.5px;font-weight:700}

/* Buttons */
.nut{min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--vien);background:var(--the);cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;transition:transform .12s,border-color .14s,background-color .14s}
.nut:hover:not(:disabled){border-color:var(--tim-v);background:var(--nen2);text-decoration:none}
.nut.to{min-height:46px;padding:0 18px;font-size:15px;border-radius:12px}
.nut.nho{min-height:31px;padding:0 10px;font-size:12.5px;border-radius:8px}
.nut.rong{width:100%}
.nut.chinh{background:var(--do);border-color:var(--do);color:#fff;box-shadow:0 2px 8px rgba(122,34,48,.22)}
.nut.chinh:hover:not(:disabled){background:var(--do2);border-color:var(--do2);color:#fff}
.nut.tim{background:var(--tim);border-color:var(--tim);color:#fff;box-shadow:0 2px 8px rgba(109,40,217,.22)}
.nut.tim:hover:not(:disabled){background:var(--tim2);border-color:var(--tim2);color:#fff}
.nut.xanh{background:var(--xanh);border-color:var(--xanh);color:#fff}
.nut.xanh:hover:not(:disabled){opacity:.92;color:#fff}
.nut.vien{background:var(--the);border:1.5px solid var(--do);color:var(--do)}
.nut.vien:hover:not(:disabled){background:var(--do-n)}
.nut.xoa{color:var(--loi);border-color:var(--loi-v);background:var(--the)}
.nut.xoa:hover:not(:disabled){background:var(--loi-n)}
.nut:disabled{opacity:.52;cursor:not-allowed;box-shadow:none}
.nut:active:not(:disabled){transform:translateY(1px)}
.hang-nut{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--nen2);border:1px solid var(--vien2);color:var(--chu);white-space:nowrap;font-weight:500}
.chip.chinh{background:var(--do-n);color:var(--do);border-color:var(--do-v);font-weight:600}
.chip.tim{background:var(--tim-n);color:var(--tim);border-color:var(--tim-v);font-weight:600}
.chip.xanh,.chip.ok{background:var(--ok-n);color:var(--ok);border-color:var(--ok-v);font-weight:600}
.chip.canh{background:var(--canh-n);color:var(--canh);border-color:var(--canh-v);font-weight:600}
.chip.loi{background:var(--loi-n);color:var(--loi);border-color:var(--loi-v);font-weight:600}
.chip.sky{background:var(--sky-n);color:var(--sky);border-color:transparent;font-weight:600}

/* Inputs & Forms */
.truong{display:flex;flex-direction:column;gap:5px}
.truong label,.nhan-o{font-size:12.5px;font-weight:600;color:var(--mo)}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],input[type=password],input[type=url],select,textarea{min-height:38px;padding:0 11px;border:1px solid var(--vien);border-radius:9px;background:var(--the);color:var(--chu);font-size:14px;width:100%;max-width:100%;min-width:0}
textarea{min-height:82px;padding:9px 11px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(109,40,217,.22);border-color:var(--tim)}
.chon{display:flex;align-items:center;gap:9px;min-height:36px;font-size:13.5px;cursor:pointer}
.chon input{width:17px;height:17px;flex-shrink:0;accent-color:var(--do)}
.hang{display:flex;flex-wrap:wrap;gap:12px}

/* Notices & Toasts */
.thongbao{padding:11px 14px;border-radius:11px;margin:10px 0;font-size:13.5px;border:1px solid transparent;display:flex;gap:10px;align-items:flex-start}
.thongbao.loi{background:var(--loi-n);color:var(--loi);border-color:var(--loi-v)}
.thongbao.canh{background:var(--canh-n);color:var(--canh);border-color:var(--canh-v)}
.thongbao.ok{background:var(--ok-n);color:var(--ok);border-color:var(--ok-v)}
.thongbao.info{background:var(--tim-n);color:var(--tim);border-color:var(--tim-v)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1E1B24;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:95;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12)}
.toast.loi{background:#991B1B}

/* Modals */
.hopdn{position:fixed;inset:0;background:rgba(16,14,26,.58);display:flex;align-items:center;justify-content:center;z-index:70;padding:14px}
.hopdn .the{width:100%;max-width:420px;max-height:92vh;overflow:auto;animation:modalIn .14s ease}
.hopdn .the.vua{max-width:560px}
.hopdn .the.rong{max-width:920px}
.an{display:none!important}

/* Tables */
.hop-bang{border:1px solid var(--vien);border-radius:12px;overflow:auto;background:var(--the);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--nen2);text-align:left;font-weight:700;color:var(--mo);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--vien)}
td{padding:10px 12px;border-top:1px solid var(--vien2);vertical-align:middle}
.so{text-align:right}
tr.cay td{background:var(--canh-n)}

/* Segmented controls & KPI */
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--vien2);border-radius:10px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--mo);white-space:nowrap}
.seg button.on{background:var(--the);color:var(--do);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:var(--the);border:1px solid var(--vien);border-left:4px solid var(--do);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi-card.tim{border-left-color:var(--tim)}
.kpi-card.xanh{border-left-color:var(--xanh)}
.kpi-card.canh{border-left-color:var(--canh)}
.kpi-card .n{font-size:12px;color:var(--mo);font-weight:600}
.kpi-card .g{font-size:22px;font-weight:800;margin-top:2px}

/* Skeleton & Spinners */
.cho{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:q .75s linear infinite;vertical-align:-2px}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--vien2) 25%,var(--nen2) 50%,var(--vien2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite linear}
.skel-card{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
@keyframes q{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

/* Student specific */
.thanh-lam{position:sticky;top:0;z-index:30;background:var(--the);border-bottom:1px solid var(--vien);padding:10px 14px;margin:0 -14px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.thanh-lam .hang{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.thanh-lam .tieu-de{flex:1;font-size:14.5px;font-weight:700;line-height:1.3;min-width:0}
.dong-ho{display:inline-flex;align-items:center;gap:5px;background:var(--nen2);border:1px solid var(--vien);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.vach{height:6px;background:var(--vien2);border-radius:999px;overflow:hidden;margin-top:6px}
.vach > div{height:100%;background:var(--grad);border-radius:999px;transition:width .2s}
.cau-hs{scroll-margin-top:110px}
.noi-dung{margin:0 0 12px;font-size:15px;line-height:1.6}
.lua-chon{display:flex;flex-direction:column;gap:8px}
.lc{min-height:46px;text-align:left;border:1px solid var(--vien);background:var(--the);border-radius:11px;padding:9px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background-color .12s}
.lc:hover{border-color:var(--tim-v);background:var(--nen2)}
.lc .chu-cai{flex-shrink:0;width:27px;height:27px;border-radius:999px;background:var(--nen2);border:1px solid var(--vien);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.lc[aria-pressed="true"]{border:2px solid var(--do);background:var(--do-n);font-weight:600;padding:8px 12px}
.lc[aria-pressed="true"] .chu-cai{background:var(--do);border-color:var(--do);color:#fff}
.luoi-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px;margin-top:10px}
.o-so{height:40px;border-radius:9px;border:1px solid var(--vien);background:var(--nen2);color:var(--chu);font-weight:600;cursor:pointer}
.o-so.da{background:var(--do);border-color:var(--do);color:#fff}
.lc-xem{padding:8px 11px;border-radius:9px;background:var(--nen2);border:1px solid var(--vien2);margin-top:6px;font-size:14px}
.lc-xem.dung{background:var(--ok-n);border-color:var(--ok-v);color:var(--ok);font-weight:700}
.lc-xem.sai-chon{background:var(--loi-n);border-color:var(--loi-v);color:var(--loi)}
.dap-an-box{margin-top:10px;background:var(--ok-n);border:1px dashed var(--ok-v);border-radius:10px;padding:10px 12px;font-size:13.5px}
.dap-an-box .d{color:var(--ok);font-weight:700}
.hs-picker-list{max-height:210px;overflow:auto;border:1px solid var(--vien);border-radius:10px;background:var(--nen2);padding:4px;margin-top:6px}
.hs-picker-item{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.hs-picker-item:hover{background:var(--do-n);color:var(--do);font-weight:600}

/* Admin specific */
.luoi-chuong{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px;align-items:start}
.chuong{border:1px solid var(--vien);border-radius:11px;padding:4px 12px;background:var(--nen2)}
.chuong summary{min-height:40px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;color:var(--do);font-size:13.5px;list-style:none}
.chuong summary::-webkit-details-marker{display:none}
.chuong summary .dem{margin-left:auto;font-weight:500;color:var(--mo);font-size:12px}
.tha{border:2px dashed var(--do-v);border-radius:13px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--do-n);text-align:center;cursor:pointer}
.tha.tren{border-color:var(--tim);background:var(--tim-n)}
.the-cau{background:var(--the);border:1px solid var(--vien);border-left:4px solid var(--vien);border-radius:13px;padding:15px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.the-cau.duyet{border-left-color:var(--ok)}
.the-cau.canh{border-left-color:var(--canh)}
.the-cau + .the-cau{margin-top:11px}
.lc4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;font-size:14px}
.lc4 .dung{color:var(--ok);font-weight:700}
.loi-giai{margin:0;font-size:13px;line-height:1.5;color:var(--mo);background:var(--nen2);border-radius:8px;padding:9px 12px}
.nhap-lc{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.nhap-lc input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.kho-grid{display:grid;grid-template-columns:265px minmax(0,1fr);gap:14px;align-items:start}
.cay-tm{background:var(--the);border:1px solid var(--vien);border-radius:13px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.cay-tm button{all:unset;box-sizing:border-box;width:100%;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--chu)}
.cay-tm button.c{font-weight:700}
.cay-tm button.b{padding-left:22px}
.cay-tm button:hover{background:var(--nen2)}
.cay-tm button[aria-pressed="true"]{background:linear-gradient(90deg,var(--do-n),var(--tim-n));color:var(--do);font-weight:700}
.file-row{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:var(--shadow)}
.file-row + .file-row{margin-top:8px}
.file-row .tt{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}

/* A4 Print Preview */
.a4-wrap{background:#E3E6EE;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.a4-sheet{background:#fff;color:#111;width:100%;max-width:794px;padding:34px 44px;box-shadow:0 4px 20px rgba(0,0,0,.14);border-radius:4px;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.4}
.a4-sheet .a4-head{border-bottom:1.5px solid #222;padding-bottom:8px;margin-bottom:12px}
.a4-sheet .a4-td{font-size:19px;font-weight:700}
.a4-sheet .a4-sub{font-size:13px;color:#444;margin-top:3px}
.a4-sheet .a4-q{margin-bottom:10px}
.a4-sheet .a4-lc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 16px;margin-top:4px;padding-left:14px}

/* Library & Home cards */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hub-card{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--chu);transition:transform .14s,border-color .14s}
.hub-card:hover{transform:translateY(-2px);border-color:var(--do-v);text-decoration:none}
.hub-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800}
.hub-ic.do{background:linear-gradient(135deg,var(--do),var(--do3))}
.hub-ic.tim{background:linear-gradient(135deg,var(--tim),var(--tim2))}
.hub-ic.xanh{background:linear-gradient(135deg,var(--xanh),#0D9488)}
.hub-ic.sky{background:linear-gradient(135deg,var(--sky),#2563EB)}
.tl-card{background:var(--the);border:1px solid var(--vien);border-left:4px solid var(--tim);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tl-card.pdf{border-left-color:var(--do)}
.tl-card.ppt{border-left-color:var(--canh)}
.tl-card.doc{border-left-color:var(--sky)}

/* Virtual Lab & Reference */
.tn-row{background:var(--the);border:1px solid var(--vien);border-left:4px solid var(--tim);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.tn-row + .tn-row{margin-top:10px}
.tn-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tn-pills{display:flex;flex-wrap:wrap;gap:7px}
.tn-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--vien);background:var(--nen2);color:var(--chu);font-size:13px;font-weight:500;text-decoration:none;transition:border-color .14s,background-color .14s,color .14s}
.tn-pill:hover{border-color:var(--do-v);background:var(--do-n);color:var(--do);text-decoration:none}
.tn-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px}
.tn-card{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--chu);transition:transform .14s,border-color .14s}
.tn-card:hover{transform:translateY(-1px);border-color:var(--tim-v);text-decoration:none}
.tn-card strong{color:var(--do);font-size:14.5px}
.tn-card span{color:var(--mo);font-size:12.5px;line-height:1.45}

/* Slogan Footer */
.slogan-foot{margin-top:20px;background:linear-gradient(135deg,var(--do-n) 0%,var(--the) 52%,var(--tim-n) 100%);border:1px solid var(--do-v);border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
html[data-theme="dark"] .slogan-foot{background:linear-gradient(135deg,rgba(194,65,86,.16) 0%,var(--the) 55%,rgba(109,40,217,.16) 100%)}
.slogan-ic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--do),var(--tim));color:#fff;display:grid;place-items:center;flex-shrink:0}
.slogan-txt{flex:1;min-width:0}
.slogan-quote{font-size:13.5px;font-weight:600;color:var(--chu);line-height:1.45}
.slogan-sub{font-size:11.5px;color:var(--mo);margin-top:2px;letter-spacing:.03em;text-transform:uppercase;font-weight:700}
.slogan-next{all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;border:1px solid var(--vien);background:var(--the);color:var(--mo);font-size:12px;font-weight:600;white-space:nowrap}
.slogan-next:hover{border-color:var(--do-v);color:var(--do);background:var(--do-n)}

/* Hero Banner Linh Vat (tiet che sang, dong bo Burgundy-Tim-Vang, font tron dong dieu bia Hoa 10) */
.hero-mascot{position:relative;border-radius:16px;padding:12px 18px;margin-bottom:12px;background:radial-gradient(120% 140% at 50% 0%,#8E1B37 0%,#5B1126 58%,#2D0916 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 6px 20px rgba(45,9,22,.22);overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.hero-mascot .hm-side{width:80px;height:80px;flex-shrink:0}
.hero-mascot .hm-side svg{width:100%;height:100%;overflow:visible}
.hero-mascot .hm-mid{flex:1;min-width:0;text-align:center}
.hero-mascot .hm-kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#FFD166}
.hero-mascot h1{margin:2px 0;font-family:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;font-size:clamp(22px,3.6vw,32px);font-weight:800;line-height:1.12;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.hero-mascot .hm-sub{margin:0;font-size:13.5px;color:#FFE7A3;font-weight:600}
.hero-mascot .hm-hint{display:inline-block;margin-top:5px;font-size:11px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.92)}

/* Che do nhung iframe Google Sites: nen trong suot xuyen xuong background cua Sites, tran vien 100% */
html.in-iframe body.embed-ok{background:transparent!important;background-image:none!important}
html.in-iframe body.embed-ok .topbar{border-radius:14px;border:1px solid var(--vien);overflow:hidden}
html.in-iframe body.embed-ok .topbar-in{max-width:100%;padding:7px 14px}
html.in-iframe body.embed-ok .khung-chinh{max-width:100%;padding:10px 0 14px}
body.embed-ok .khung-chinh{max-width:100%;padding:12px 12px 20px}
body.embed-ok .topbar-in{max-width:100%}
body.embed-ok .hub-card{padding:13px 14px;gap:6px}
body.embed-ok .slogan-foot{margin-top:12px;padding:10px 14px}
.hm-hop{animation:hmHop 2.2s ease-in-out infinite;transform-origin:100px 190px}
.hm-armL{transform-origin:62px 120px;animation:hmWave .9s ease-in-out infinite alternate}
.hm-armR{transform-origin:138px 120px;animation:hmWave2 .9s ease-in-out infinite alternate}
.hm-liq{animation:hmLiq 7s linear infinite}
@keyframes hmHop{0%,100%{transform:translateY(0) scaleY(1)}45%{transform:translateY(-9px) scaleY(1.02)}65%{transform:translateY(0) scaleY(.96)}}
@keyframes hmWave{from{transform:rotate(8deg)}to{transform:rotate(-28deg)}}
@keyframes hmWave2{from{transform:rotate(-8deg)}to{transform:rotate(28deg)}}
@keyframes hmLiq{0%,100%{fill:#FF5A7A}33%{fill:#A78BFA}66%{fill:#2DD4BF}}
.fx-e{position:fixed;z-index:99;pointer-events:none;font-size:24px;line-height:1;will-change:transform,opacity;transition:transform .85s cubic-bezier(.15,.8,.3,1),opacity .85s ease-in}
.fx-t{position:fixed;z-index:100;pointer-events:none;font:800 17px 'Be Vietnam Pro',system-ui,sans-serif;color:#fff;white-space:nowrap;padding:5px 14px;border-radius:999px;background:linear-gradient(90deg,var(--do),var(--tim));border:1px solid rgba(255,255,255,.25);box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translate(-50%,-50%) scale(.35);opacity:0;transition:transform .32s cubic-bezier(.3,1.5,.5,1),opacity .28s}
@media (max-width:600px){
  .hero-mascot{padding:14px 12px;gap:10px}
  .hero-mascot .hm-side{width:68px;height:68px}
  .hero-mascot .hm-side.r{display:none}
}
@media (prefers-reduced-motion:reduce){.hm-hop,.hm-armL,.hm-armR,.hm-liq{animation:none!important}}

/* Cau hoi Dung/Sai (4 y a, b, c, d) & Phan nhom de */
.phan-head{display:flex;align-items:center;gap:8px;margin:16px 0 10px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,var(--do-n),var(--tim-n));border:1px solid var(--do-v);font-weight:800;font-size:14.5px;color:var(--do)}
.phan-head small{font-weight:600;color:var(--mo);margin-left:auto;font-size:12.5px}
.ds-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ds-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--vien);background:var(--nen2);flex-wrap:wrap}
.ds-row.dung{border-color:var(--ok);background:var(--ok-n)}
.ds-row.sai{border-color:var(--loi);background:var(--loi-n)}
.ds-key{font-weight:800;color:var(--do);min-width:22px}
.ds-txt{flex:1 1 220px;font-size:14.5px;line-height:1.45;min-width:0}
.ds-tog{display:inline-flex;gap:6px;flex-shrink:0;margin-left:auto}
.ds-btn{padding:6px 13px;border-radius:9px;border:1.5px solid var(--vien);background:var(--the);color:var(--chu);font-weight:700;font-size:13px;cursor:pointer;transition:all .12s}
.ds-btn:hover{border-color:var(--do-v)}
.ds-btn[data-v="1"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ds-btn[data-v="0"][aria-pressed="true"]{background:var(--loi);border-color:var(--loi);color:#fff}
.ds-note{font-size:12.5px;font-weight:700;flex-shrink:0;margin-left:auto}
.drive-box{border:1px solid var(--vien);border-radius:12px;padding:12px;background:var(--nen2);margin-top:10px}
.drive-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;margin-top:8px}
.drive-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--the);border:1px solid var(--vien);font-size:13.5px;cursor:pointer}
.drive-item:hover{border-color:var(--do-v)}
.drive-item input{width:17px;height:17px;accent-color:var(--do);flex-shrink:0}
.drive-item .d-ten{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

@media (max-width:860px){
  .kho-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .topbar-in{padding:8px 12px}
  .khung-chinh,.khung-hep{padding:12px 11px 48px}
  .a4-sheet{padding:20px 18px}
  .a4-sheet .a4-lc-grid{grid-template-columns:minmax(0,1fr)}
}
@media print{
  body *{visibility:hidden}
  #a4-print-area, #a4-print-area *{visibility:visible}
  #a4-print-area{position:absolute;left:0;top:0;width:100%;padding:0;margin:0;box-shadow:none}
}

<script>
window.H10 = (function () {
  const THEME_KEY = 'hoa10_theme';
  const THEMES = [
    { id: 'rich', ten: 'Sắc Hóa học', dots: ['#7A2230', '#6D28D9', '#0F766E'] },
    { id: 'classic', ten: 'Cổ điển', dots: ['#7A2230', '#C4B5A5', '#5B4E46'] },
    { id: 'dark', ten: 'Ban đêm', dots: ['#C24156', '#A78BFA', '#2DD4BF'] }
  ];

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** Parser công thức hóa học nhẹ: _{...}, ^{...}, **đậm**, xuống dòng. */
  function md(s) {
    return esc(s)
      .replace(/_\{([^}]*)\}/g, '<sub>$1</sub>')
      .replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\n/g, '<br>');
  }

  function layTheme() {
    try {
      const t = localStorage.getItem(THEME_KEY);
      if (THEMES.some(function (x) { return x.id === t; })) return t;
    } catch (e) {}
    return 'rich';
  }

  function apTheme(t) {
    const hopLe = THEMES.some(function (x) { return x.id === t; }) ? t : 'rich';
    document.documentElement.setAttribute('data-theme', hopLe);
    try { localStorage.setItem(THEME_KEY, hopLe); } catch (e) {}
    return hopLe;
  }

  function ganNutTheme(el) {
    if (!el) return;
    function ve() {
      const cur = layTheme();
      const t = THEMES.find(function (x) { return x.id === cur; }) || THEMES[0];
      el.innerHTML = '<span class="theme-dots">' + t.dots.map(function (c) {
        return '<i style="background:' + c + '"></i>';
      }).join('') + '</span><span>' + esc(t.ten) + '</span>';
      el.title = 'Đổi giao diện (đang dùng: ' + t.ten + ')';
    }
    apTheme(layTheme());
    ve();
    el.onclick = function () {
      const cur = layTheme();
      const idx = THEMES.findIndex(function (x) { return x.id === cur; });
      const next = THEMES[(idx + 1) % THEMES.length];
      apTheme(next.id);
      ve();
    };
  }

  const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbwGoG7DJpgg-FNqewgq-uDwQ6_h08C53iM2Kq3dXzn-_bm3l_07_1zS9A2jktfBK8iO/exec';
  const laGAS = !!(window.google && window.google.script && window.google.script.run);

  function api(ten) {
    const args = Array.prototype.slice.call(arguments, 1);
    if (laGAS) {
      return new Promise(function (ok, loi) {
        const r = google.script.run
          .withSuccessHandler(ok)
          .withFailureHandler(function (e) {
            const m = (e && e.message) ? e.message : String(e);
            loi(new Error(m.replace(/^Exception:\s*/, '')));
          });
        r[ten].apply(r, args);
      });
    }
    const url = window.H10_GAS_URL || GAS_EXEC_URL;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: ten, args: args })
    }).then(function (res) {
      return res.text().then(function (txt) {
        let j = null;
        try { j = JSON.parse(txt); } catch (e) {}
        if (!j) throw new Error('Máy chủ phản hồi không hợp lệ (' + res.status + ').');
        if (!j.ok) throw new Error(j.error || 'Lỗi máy chủ.');
        return j.data;
      });
    });
  }

  function getLocation(cb) {
    if (laGAS && google.script.url && google.script.url.getLocation) {
      try { google.script.url.getLocation(cb); return; } catch (e) {}
    }
    const p = {};
    try {
      const sp = new URLSearchParams(window.location.search);
      sp.forEach(function (v, k) { p[k] = v; });
    } catch (e) {}
    cb({ parameter: p });
  }

  const STATIC_PAGES = {
    home: 'index.html',
    btvn: 'btvn.html',
    tailieu: 'tailieu.html',
    thinghiem: 'thinghiem.html',
    trochoi: 'trochoi.html',
    admin: 'admin.html'
  };

  function linkTrang(page, opts) {
    opts = opts || {};
    const cfg = opts.cfg || {};
    const webUrl = opts.webUrl || '';
    const laFull = !!opts.laFull;
    if (!laGAS) {
      if (page === 'thinghiem' && cfg.linkThiNghiem) return { href: cfg.linkThiNghiem, target: 'h10_ngoai' };
      if (page === 'trochoi' && cfg.linkTroChoi) return { href: cfg.linkTroChoi, target: '_self' };
      return {
        href: (STATIC_PAGES[page] || 'index.html') + (opts.query || ''),
        target: opts.target || (page === 'admin' ? 'h10_admin' : '_self')
      };
    }
    const suf = laFull ? '&full=1' : '';
    if (page === 'home') {
      return {
        href: (!laFull && cfg.trangChuSites) ? cfg.trangChuSites : (webUrl + '?page=home' + suf),
        target: '_top'
      };
    }
    if (page === 'btvn') {
      return {
        href: laFull ? (webUrl + '?full=1') : (cfg.trangBtvnSites || webUrl),
        target: '_top'
      };
    }
    if (page === 'tailieu') return { href: webUrl + '?page=tailieu' + suf, target: '_top' };
    if (page === 'thinghiem') {
      return cfg.linkThiNghiem
        ? { href: cfg.linkThiNghiem, target: 'h10_ngoai' }
        : { href: webUrl + '?page=thinghiem' + suf, target: '_top' };
    }
    if (page === 'trochoi') {
      return cfg.linkTroChoi
        ? { href: cfg.linkTroChoi, target: '_top' }
        : { href: webUrl + '?page=trochoi' + suf, target: '_top' };
    }
    if (page === 'admin') return { href: webUrl + '?page=admin' + suf, target: opts.target || 'h10_admin' };
    return { href: webUrl, target: '_top' };
  }

  let henToast = null;
  function toast(msg, laLoi) {
    let d = document.getElementById('h10-toast');
    if (!d) {
      d = document.createElement('div');
      d.id = 'h10-toast';
      d.setAttribute('role', 'status');
      document.body.appendChild(d);
    }
    d.className = 'toast' + (laLoi ? ' loi' : '');
    d.textContent = msg;
    d.classList.remove('an');
    clearTimeout(henToast);
    henToast = setTimeout(function () { d.classList.add('an'); }, laLoi ? 6500 : 3400);
  }

  function skelCards(so) {
    let h = '';
    for (let i = 0; i < (so || 3); i++) {
      h += '<div class="skel-card">' +
        '<div class="skel" style="height:14px;width:36%"></div>' +
        '<div class="skel" style="height:20px;width:78%"></div>' +
        '<div class="skel" style="height:14px;width:54%"></div>' +
        '</div>';
    }
    return h;
  }

  function laDienThoai() {
    try {
      return window.matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    } catch (e) { return true; }
  }

  const ICONS = {
    binh: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>',
    full: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>',
    ve: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    khoa: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    tt: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v5h1"/></svg>',
    doc: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
    game: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg>',
    lab: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18h12"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>',
    atom: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(90 12 12)"/></svg>'
  };

  const SLOGANS = [
    'Hóa học không chỉ là công thức trên giấy — đó là ngôn ngữ giải thích mọi biến đổi quanh ta.',
    'Hiểu bản chất nguyên tử nhỏ nhất để tự tin chinh phục mọi bài toán lớn nhất.',
    'Mỗi phản ứng đều có điều kiện xảy ra; thành công cũng cần đủ kiên trì và phương pháp đúng.',
    'Cẩn thận từng hệ số cân bằng và đơn vị mol — chi tiết nhỏ làm nên điểm số lớn.',
    'Thí nghiệm giải đáp "vì sao", bài tập rèn cho ta "làm thế nào".',
    'Từ bảng tuần hoàn đến thế giới phân tử 3D — càng hiểu quy luật, càng thấy Hóa học logic và đẹp.'
  ];

  function renderSlogan(el) {
    if (!el) return;
    let idx = Math.floor(Math.random() * SLOGANS.length);
    function ve() {
      el.innerHTML = '<footer class="slogan-foot">' +
        '<div class="slogan-ic">' + ICONS.atom + '</div>' +
        '<div class="slogan-txt">' +
          '<div class="slogan-quote">“' + esc(SLOGANS[idx]) + '”</div>' +
          '<div class="slogan-sub">Hóa học 10 · Kết nối tri thức · Thầy Hoàng</div>' +
        '</div>' +
        '<button type="button" class="slogan-next" title="Xem câu khác">Đổi câu</button>' +
      '</footer>';
      const btn = el.querySelector('.slogan-next');
      if (btn) btn.onclick = function () { idx = (idx + 1) % SLOGANS.length; ve(); };
    }
    ve();
  }

  function ganBungCoVu(el) {
    if (!el) return;
    const ICONS_FX = ['⚗️', '⚛️', '🧪', '⭐', '🔥', '🏆', '✨', '💡'];
    const CAU_FX = ['Học tốt – Thi tốt!', 'Cố lên nào!', 'Hóa thật hay!', 'Chinh phục 10 điểm!', 'Kiên trì là thắng!', 'Tư duy bản chất!'];
    let ac = null, last = 0;
    function pop() {
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1080, t + 0.08);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.15);
      } catch (e) {}
    }
    el.addEventListener('pointerdown', function (e) {
      const now = Date.now(); if (now - last < 140) return; last = now;
      pop();
      const x = e.clientX, y = e.clientY, sz = 22;
      for (let i = 0; i < 7; i++) {
        const sp = document.createElement('span');
        sp.className = 'fx-e';
        sp.textContent = ICONS_FX[Math.floor(Math.random() * ICONS_FX.length)];
        sp.style.left = (x - sz / 2) + 'px';
        sp.style.top = (y - sz / 2) + 'px';
        document.body.appendChild(sp);
        const a = Math.random() * Math.PI * 2, d = 36 + Math.random() * 54, r = (Math.random() - 0.5) * 90;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            sp.style.transform = 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d - 20) + 'px) rotate(' + r + 'deg) scale(' + (0.7 + Math.random() * 0.5) + ')';
            sp.style.opacity = '0';
          });
        });
        setTimeout(function () { sp.remove(); }, 950);
      }
      const txt = document.createElement('div');
      txt.className = 'fx-t';
      txt.textContent = CAU_FX[Math.floor(Math.random() * CAU_FX.length)];
      txt.style.left = Math.min(Math.max(x, 95), window.innerWidth - 95) + 'px';
      txt.style.top = Math.max(y - 24, 26) + 'px';
      document.body.appendChild(txt);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { txt.style.transform = 'translate(-50%,-50%) scale(1)'; txt.style.opacity = '1'; });
      });
      setTimeout(function () {
        txt.style.transition = 'transform .45s ease-in,opacity .45s';
        txt.style.transform = 'translate(-50%,-120%) scale(.92)';
        txt.style.opacity = '0';
      }, 850);
      setTimeout(function () { txt.remove(); }, 1400);
    });
  }

  try {
    if (window.top !== window.self) document.documentElement.classList.add('in-iframe');
  } catch (e) {
    document.documentElement.classList.add('in-iframe');
  }
  apTheme(layTheme());

  return {
    esc: esc,
    md: md,
    laGAS: laGAS,
    GAS_EXEC_URL: GAS_EXEC_URL,
    layTheme: layTheme,
    apTheme: apTheme,
    ganNutTheme: ganNutTheme,
    api: api,
    getLocation: getLocation,
    linkTrang: linkTrang,
    toast: toast,
    skelCards: skelCards,
    laDienThoai: laDienThoai,
    renderSlogan: renderSlogan,
    ganBungCoVu: ganBungCoVu,
    ICONS: ICONS
  };
})();
</script>

<script>
(function () {
  const { esc, md, api, laGAS, getLocation, linkTrang: buildLinkTrang, skelCards, ICONS, ganNutTheme, renderSlogan } = window.H10;
  document.getElementById('brand-ic').innerHTML = ICONS.binh;
  ganNutTheme(document.getElementById('btn-theme'));

  const KHOA_HS = 'btvn_hoa10_hs', KHOA_NHAP = 'btvn_hoa10_nhap';
  const bo = {};
  const kho = {
    lay(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (bo[k] || null); } catch (e) { return bo[k] || null; } },
    dat(k, v) { bo[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    xoa(k) { delete bo[k]; try { localStorage.removeItem(k); } catch (e) {} }
  };

  const $ = s => document.querySelector(s);
  const app = $('#app');
  const THU = ['Chủ nhật', 'thứ Hai', 'thứ Ba', 'thứ Tư', 'thứ Năm', 'thứ Sáu', 'thứ Bảy'];
  function gio(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function ngay(ms) { const d = new Date(ms); return d.getDate() + '/' + (d.getMonth() + 1); }
  function han(ms) { const d = new Date(ms); return gio(ms) + ', ' + THU[d.getDay()] + ' ' + ngay(ms); }
  function diem(x) { if (x === null || x === undefined || x === '') return '–'; const n = Number(x); return (Math.round(n * 10) / 10).toString().replace('.', ','); }
  function soDung(x) { if (x === null || x === undefined || x === '') return '0'; const n = Number(x); return (Math.round(n * 100) / 100).toString().replace('.', ','); }
  function thoiGian(giay) { giay = Math.max(0, Math.round(giay)); const p = Math.floor(giay / 60), g = giay % 60; return String(p).padStart(2, '0') + ':' + String(g).padStart(2, '0'); }

  let laFull = false, linkTrang = null, hsList = [];
  let hs = kho.lay(KHOA_HS);
  let lam = null, demGio = null;

  function veTopLinks() {
    if (!linkTrang) return;
    const cfg = linkTrang.caiDatTrang || {};
    const opt = { cfg: cfg, webUrl: linkTrang.webUrl, laFull: laFull };
    const hm = $('#btn-home');
    if (hm) { const l = buildLinkTrang('home', opt); hm.href = l.href; hm.target = l.target; hm.classList.remove('an'); }
    const tl = $('#btn-tailieu');
    if (tl) { const l = buildLinkTrang('tailieu', opt); tl.href = l.href; tl.target = l.target; tl.classList.remove('an'); }
    const lb = $('#btn-lab');
    if (lb) { const l = buildLinkTrang('thinghiem', opt); lb.href = l.href; lb.target = l.target; lb.classList.remove('an'); }
    const bf = $('#btn-full');
    if (bf) {
      if (!laGAS) { bf.classList.add('an'); return; }
      bf.classList.remove('an');
      if (laFull) {
        bf.href = linkTrang.trangChu;
        bf.target = '_top';
        bf.innerHTML = ICONS.ve + '<span>Về Sites</span>';
      } else {
        bf.href = linkTrang.webUrl + '?full=1';
        bf.target = '_top';
        bf.innerHTML = ICONS.full + '<span>Toàn màn hình</span>';
      }
    }
  }

  getLocation(function (loc) {
    laFull = !!(loc && loc.parameter && loc.parameter.full);
    veTopLinks();
  });

  function dangTai(chu) {
    app.innerHTML = '<div class="phu" style="margin:6px 2px 10px"><span class="cho"></span> ' + esc(chu || 'Đang tải dữ liệu...') + '</div>' + skelCards(3);
  }
  function baoLoi(e) {
    const m = (e && e.message) ? e.message : String(e);
    if (m.indexOf('KHONG_CO_HS') >= 0) {
      kho.xoa(KHOA_HS); hs = null;
      manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
      return null;
    }
    return m.replace(/^Exception:\s*/, '');
  }
  function cuon() { try { window.scrollTo(0, 0); } catch (e) {} }
  function dungDongHo() { if (demGio) { clearInterval(demGio); demGio = null; } }

  // ---------- 1. Chọn / nhập họ tên ----------
  function manNhapTen(loi) {
    dungDongHo();
    const coDs = hsList && hsList.length > 0;
    let h = '<div class="hero-box">' +
      '<span class="chip chinh">HÓA 10 · BÀI TẬP VỀ NHÀ</span>' +
      '<h1>Chào em!</h1>' +
      '<p class="phu" style="margin:0">' + (coDs ? 'Chọn tên em trong danh sách hoặc nhập họ tên mới nếu chưa có.' : 'Nhập đầy đủ họ và tên để bắt đầu làm bài tập.') + '</p>' +
      '</div>';

    if (loi) h += '<div class="thongbao loi" role="alert">' + esc(loi) + '</div>';

    if (coDs) {
      h += '<section class="the">' +
        '<h2 class="tieu-khoi" style="margin-bottom:8px">Chọn nhanh từ danh sách lớp (' + hsList.length + ' bạn)</h2>' +
        '<div class="truong"><input id="loc-hs" type="search" placeholder="Gõ tên để tìm nhanh..."></div>' +
        '<div class="hs-picker-list" id="hs-picker"></div>' +
        '</section>';
    }

    h += '<form class="the" id="f-ten">' +
      '<h2 class="tieu-khoi" style="margin-bottom:8px">' + (coDs ? 'Hoặc nhập họ và tên mới' : 'Đăng ký vào làm bài') + '</h2>' +
      '<div class="truong"><label for="hoten">Họ và tên đầy đủ</label>' +
      '<input id="hoten" type="text" autocomplete="name" required minlength="2" placeholder="Ví dụ: Nguyễn Minh Anh"></div>' +
      '<button class="nut chinh to rong" style="margin-top:12px" type="submit">Vào làm bài</button>' +
      '<div class="thongbao info" style="margin-bottom:0">' + ICONS.tt + '<span>Nếu tên em đã có ở trên, hãy bấm chọn đúng tên đó để không bị tách thành 2 tài khoản nhé.</span></div>' +
      '</form><div id="slogan-slot"></div>';

    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));

    if (coDs) {
      const box = $('#hs-picker');
      const veList = function (tk) {
        const q = String(tk || '').trim().toLowerCase();
        const ds = q ? hsList.filter(function (x) { return x.ten.toLowerCase().indexOf(q) >= 0; }) : hsList;
        if (!ds.length) {
          box.innerHTML = '<div class="phu" style="padding:10px;text-align:center">Không thấy tên phù hợp, em nhập tên mới ở khung bên dưới nhé.</div>';
          return;
        }
        box.innerHTML = ds.map(function (x) {
          return '<button type="button" class="hs-picker-item" data-chon-hs="' + esc(x.khoa) + '" data-ten-hs="' + esc(x.ten) + '"><span>' + esc(x.ten) + '</span><span class="phu" style="font-size:12px">Chọn →</span></button>';
        }).join('');
        box.querySelectorAll('[data-chon-hs]').forEach(function (btn) {
          btn.onclick = function () {
            hs = { khoa: btn.getAttribute('data-chon-hs'), ten: btn.getAttribute('data-ten-hs') };
            kho.dat(KHOA_HS, hs);
            manDanhSach();
          };
        });
      };
      veList('');
      $('#loc-hs').oninput = function () { veList(this.value); };
    }

    const f = $('#f-ten');
    f.onsubmit = function (ev) {
      ev.preventDefault();
      const ten = $('#hoten').value;
      const nut = f.querySelector('button[type="submit"]');
      nut.disabled = true; nut.textContent = 'Đang vào...';
      api('hsDangKy', ten).then(function (r) {
        hs = r; kho.dat(KHOA_HS, r);
        if (!hsList.some(function (x) { return x.khoa === r.khoa; })) {
          hsList.push(r);
          hsList.sort(function (a, b) { return a.ten.localeCompare(b.ten, 'vi'); });
        }
        manDanhSach();
      }).catch(function (e) {
        const m = baoLoi(e); if (typeof m === 'string') manNhapTen(m);
      });
    };
  }

  // ---------- 2. Danh sách đề ----------
  function manDanhSach() {
    dungDongHo(); cuon();
    dangTai('Đang tải danh sách đề...');
    api('hsDanhSach', hs.khoa).then(function (r) {
      if (!r.ten) {
        kho.xoa(KHOA_HS); hs = null;
        return manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
      }
      hs.ten = r.ten; kho.dat(KHOA_HS, hs);
      veDanhSach(r);
    }).catch(function (e) {
      const m = baoLoi(e);
      if (typeof m === 'string') {
        app.innerHTML = '<div class="thongbao loi">' + esc(m) + '</div><button class="nut chinh" type="button" id="thu-lai">Thử lại</button>';
        $('#thu-lai').onclick = manDanhSach;
      }
    });
  }

  function veDanhSach(r) {
    const nhap = kho.lay(KHOA_NHAP);
    const mo = r.de.filter(d => !d.hetHan), het = r.de.filter(d => d.hetHan);
    const homNay = mo[0], conLai = mo.slice(1);
    const laHomNay = ms => new Date(ms).toDateString() === new Date(r.now).toDateString();

    function nutLam(d, lop) {
      const dangDo = nhap && nhap.de && nhap.de.id === d.id && nhap.khoa === hs.khoa;
      const chu = dangDo ? 'Làm tiếp bài dở' : (d.soLan ? 'Làm lại' : 'Làm bài');
      return '<button type="button" class="nut ' + lop + '" data-lam="' + esc(d.id) + '">' + chu + '</button>';
    }

    let h = '<div class="hero-box">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">' +
        '<div><span class="chip chinh">XIN CHÀO</span><h1>' + esc(hs.ten) + '</h1></div>' +
        '<button type="button" class="nut nho" id="doi-ten">Đổi học sinh</button>' +
      '</div>';
    if (linkTrang && linkTrang.caiDatTrang && linkTrang.caiDatTrang.thongBao) {
      h += '<div class="thongbao info" style="margin:10px 0 0">' + ICONS.tt + '<span>' + md(linkTrang.caiDatTrang.thongBao) + '</span></div>';
    }
    h += '</div>';

    if (!r.de.length) h += '<div class="the"><p class="phu" style="margin:0;text-align:center">Thầy chưa giao đề nào. Em quay lại sau nhé.</p></div>';

    if (homNay) {
      h += '<div class="nhan-muc">Đề mới nhất</div>' +
        '<div class="the the-noi">' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">' +
            (laHomNay(homNay.ngayMo) ? '<span class="chip chinh">Mới · ' + ngay(homNay.ngayMo) + '</span>' : '<span class="chip tim">Đang mở</span>') +
            '<span class="chip">' + homNay.soCau + ' câu</span>' +
            '<span class="chip canh">Hạn: ' + han(homNay.han) + '</span>' +
          '</div>' +
          '<h2 style="margin:0 0 10px;font-size:18px">' + esc(homNay.ten) + '</h2>' +
          '<div class="kpi-strip" style="margin-bottom:12px">' +
            '<div class="kpi-card xanh"><div class="n">Điểm cao nhất</div><div class="g">' + (homNay.soLan ? diem(homNay.best) : 'Chưa làm') + '</div></div>' +
            '<div class="kpi-card tim"><div class="n">Số lần làm đúng hạn</div><div class="g">' + homNay.soLan + '</div></div>' +
          '</div>' +
          nutLam(homNay, 'chinh to rong') +
        '</div>';
    }

    if (conLai.length) {
      h += '<div class="nhan-muc">Đang mở khác (' + conLai.length + ')</div>';
      conLai.forEach(function (d) {
        h += '<div class="the" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
          '<div style="flex:1 1 220px;min-width:0">' +
            '<div style="font-weight:700;font-size:15.5px;margin-bottom:4px">' + esc(d.ten) + '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
              '<span class="chip canh">Hạn ' + han(d.han) + '</span>' +
              '<span class="chip">' + d.soCau + ' câu</span>' +
              '<span class="chip ' + (d.soLan ? 'ok' : '') + '">' + (d.soLan ? 'Cao nhất ' + diem(d.best) + ' (' + d.soLan + ' lần)' : 'Chưa làm') + '</span>' +
            '</div>' +
          '</div>' +
          nutLam(d, 'vien') +
        '</div>';
      });
    }

    if (het.length) {
      h += '<div class="nhan-muc">Đã hết hạn (' + het.length + ')</div>';
      het.forEach(function (d) {
        h += '<div class="the" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
          '<div style="flex:1 1 220px;min-width:0">' +
            '<div style="font-weight:700;font-size:15px;margin-bottom:4px">' + esc(d.ten) + '</div>' +
            '<div class="phu" style="font-size:13px">' + (d.soLan ? 'Điểm cao nhất: <b>' + diem(d.best) + '</b> · ' + d.soLan + ' lần đúng hạn' : 'Chưa làm trong hạn') + '</div>' +
          '</div>' +
          '<div class="hang-nut">' +
            (d.coBaiLam ? '<button type="button" class="nut nho tim" data-xem-bai="' + esc(d.id) + '">Xem lại bài</button>' : '') +
            '<button type="button" class="nut nho xanh" data-xem="' + esc(d.id) + '">Đáp án</button>' +
            '<button type="button" class="nut nho" data-lam="' + esc(d.id) + '">Luyện lại</button>' +
          '</div>' +
        '</div>';
      });
    }

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));
    $('#doi-ten').onclick = function () { kho.xoa(KHOA_HS); kho.xoa(KHOA_NHAP); hs = null; manNhapTen(); };
    app.querySelectorAll('[data-lam]').forEach(b => b.onclick = () => batDau(b.getAttribute('data-lam')));
    app.querySelectorAll('[data-xem]').forEach(b => b.onclick = () => xemDapAn(b.getAttribute('data-xem')));
    app.querySelectorAll('[data-xem-bai]').forEach(b => b.onclick = () => xemBaiCu(b.getAttribute('data-xem-bai')));
  }

  // ---------- 3. Làm bài ----------
  function batDau(deId) {
    const nhap = kho.lay(KHOA_NHAP);
    if (nhap && nhap.de && nhap.de.id === deId && nhap.khoa === hs.khoa) {
      const quaLau = !nhap.batDau || (Date.now() - nhap.batDau > 5.75 * 3600 * 1000);
      if (!quaLau) { lam = nhap; return veLamBai(); }
      const tlCu = nhap.traLoi || {};
      dangTai('Đang làm mới phiên làm bài...');
      api('hsBatDau', hs.khoa, deId).then(function (r) {
        const giu = {};
        r.cau.forEach(function (c) { if (tlCu[c.id] !== undefined && tlCu[c.id] !== '') giu[c.id] = tlCu[c.id]; });
        lam = { token: r.token, batDau: Date.now(), de: r.de, cau: r.cau, traLoi: giu, khoa: hs.khoa };
        kho.dat(KHOA_NHAP, lam);
        veLamBai();
        if (Object.keys(giu).length) alertNho('Phiên cũ gần hết 6 tiếng nên hệ thống đã cấp phiên mới và giữ nguyên ' + Object.keys(giu).length + ' câu em đã làm.');
      }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
      return;
    }
    dangTai('Đang lấy đề...');
    api('hsBatDau', hs.khoa, deId).then(function (r) {
      lam = { token: r.token, batDau: Date.now(), de: r.de, cau: r.cau, traLoi: {}, khoa: hs.khoa };
      kho.dat(KHOA_NHAP, lam);
      veLamBai();
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }
  function alertNho(m) {
    const d = document.createElement('div');
    d.className = 'thongbao loi';
    d.setAttribute('role', 'alert');
    d.textContent = m;
    app.prepend(d);
  }

  const TEN_LOAI = { tn: 'Nhiều lựa chọn', ds: 'Đúng / Sai', so: 'Trả lời ngắn', chu: 'Trả lời ngắn' };
  function nhomPhan(loai) {
    if (loai === 'tn') return { key: 'I', ten: 'Phần I. Câu trắc nghiệm nhiều lựa chọn', moTa: 'Chọn 1 đáp án đúng' };
    if (loai === 'ds') return { key: 'II', ten: 'Phần II. Câu trắc nghiệm đúng sai', moTa: 'Mỗi ý đúng được 0,25 câu' };
    return { key: 'III', ten: 'Phần III. Câu trắc nghiệm trả lời ngắn', moTa: 'Điền số hoặc công thức / từ ngắn' };
  }
  function cauDaXong(c) {
    const tl = lam.traLoi[c.id];
    if (c.loai === 'ds') return Array.isArray(tl) && tl.filter(v => v === true || v === false).length === 4;
    return tl !== undefined && tl !== null && tl !== '';
  }

  function veLamBai() {
    cuon();
    let h = '<div class="thanh-lam">' +
      '<div class="hang">' +
        '<button type="button" class="nut nho" id="quay" aria-label="Quay lại">←</button>' +
        '<span class="tieu-de">' + esc(lam.de.ten) + '</span>' +
        '<span class="dong-ho" id="gio">00:00</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mo);margin-top:6px"><span id="da-lam"></span><span>' + (lam.de.hetHan ? 'Luyện tập (hết hạn)' : 'Hạn ' + han(lam.de.han)) + '</span></div>' +
      '<div class="vach"><div id="vach" style="width:0"></div></div>' +
    '</div>';

    let phanTruoc = '';
    lam.cau.forEach(function (c, i) {
      const p = nhomPhan(c.loai);
      if (p.key !== phanTruoc) {
        phanTruoc = p.key;
        h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
      }
      const tl = lam.traLoi[c.id];
      h += '<div class="the cau-hs" id="cau-' + i + '">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
          '<span class="chip chinh">Câu ' + (i + 1) + '</span>' +
          '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
        '</div>' +
        '<div class="noi-dung">' + md(c.cauHoi) + '</div>';
      if (c.loai === 'tn') {
        h += '<div class="lua-chon" role="group" aria-label="Các lựa chọn câu ' + (i + 1) + '">';
        c.luaChon.forEach(function (o, j) {
          h += '<button type="button" class="lc" data-q="' + esc(c.id) + '" data-k="' + o.k + '" aria-pressed="' + (tl === o.k ? 'true' : 'false') + '">' +
            '<span class="chu-cai">' + 'ABCD'.charAt(j) + '</span><span>' + md(o.t) + '</span></button>';
        });
        h += '</div>';
      } else if (c.loai === 'ds') {
        const arr = Array.isArray(tl) ? tl : [null, null, null, null];
        h += '<div class="ds-list" role="group" aria-label="Các mệnh đề câu ' + (i + 1) + '">';
        (c.luaChon || []).forEach(function (txt, j) {
          const v = arr[j];
          h += '<div class="ds-row">' +
            '<span class="ds-key">' + 'abcd'.charAt(j) + ')</span>' +
            '<span class="ds-txt">' + md(txt) + '</span>' +
            '<div class="ds-tog">' +
              '<button type="button" class="ds-btn" data-q="' + esc(c.id) + '" data-idx="' + j + '" data-v="1" aria-pressed="' + (v === true ? 'true' : 'false') + '">Đúng</button>' +
              '<button type="button" class="ds-btn" data-q="' + esc(c.id) + '" data-idx="' + j + '" data-v="0" aria-pressed="' + (v === false ? 'true' : 'false') + '">Sai</button>' +
            '</div></div>';
        });
        h += '</div>';
      } else {
        const idn = 'tl-' + i;
        h += '<div class="truong"><label for="' + idn + '">' + (c.loai === 'so' ? 'Đáp số' : 'Câu trả lời') + '</label>' +
          '<input id="' + idn + '" class="o-tra-loi" type="text" ' + (c.loai === 'so' ? 'inputmode="decimal" placeholder="Ví dụ: 2,24"' : 'placeholder="Ví dụ: Na, H2SO4"') + ' data-q="' + esc(c.id) + '" value="' + esc(tl || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false">' +
          '</div><div class="phu" style="font-size:12px;margin-top:6px">' +
          (c.loai === 'chu' ? 'Gõ số thường, ví dụ H2SO4 sẽ hiểu là H₂SO₄. Chú ý viết hoa đúng kí hiệu hóa học.' : 'Chỉ ghi con số, không cần đơn vị. Dùng dấu phẩy hay dấu chấm đều được.') + '</div>';
      }
      h += '</div>';
    });

    h += '<div class="the">' +
      '<div style="font-size:13px;font-weight:700;color:var(--mo)">Chuyển nhanh đến câu</div>' +
      '<div class="luoi-so">' + lam.cau.map((c, i) => '<button type="button" class="o-so" data-den="' + i + '">' + (i + 1) + '</button>').join('') + '</div>' +
      '</div>' +
      '<button type="button" class="nut chinh to rong" style="margin-top:14px" id="nop">Nộp bài</button>' +
      '<p class="phu" style="text-align:center;font-size:12px;margin-top:8px">Thứ tự câu hỏi và đáp án đổi ngẫu nhiên mỗi lần làm.</p>';

    app.innerHTML = h;

    app.querySelectorAll('.lc').forEach(function (b) {
      b.onclick = function () {
        const q = b.getAttribute('data-q'), k = Number(b.getAttribute('data-k'));
        lam.traLoi[q] = k;
        b.parentNode.querySelectorAll('.lc').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        luuNhap(); capNhatTienDo();
      };
    });
    app.querySelectorAll('.ds-btn').forEach(function (b) {
      b.onclick = function () {
        const q = b.getAttribute('data-q');
        const idx = Number(b.getAttribute('data-idx'));
        const val = b.getAttribute('data-v') === '1';
        if (!Array.isArray(lam.traLoi[q])) lam.traLoi[q] = [null, null, null, null];
        lam.traLoi[q][idx] = val;
        b.parentNode.querySelectorAll('.ds-btn').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        luuNhap(); capNhatTienDo();
      };
    });
    app.querySelectorAll('.o-tra-loi').forEach(function (inp) {
      inp.oninput = function () {
        const q = inp.getAttribute('data-q'), v = inp.value.trim();
        if (v) lam.traLoi[q] = v; else delete lam.traLoi[q];
        luuNhap(); capNhatTienDo();
      };
    });
    app.querySelectorAll('[data-den]').forEach(function (b) {
      b.onclick = function () { const el = $('#cau-' + b.getAttribute('data-den')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    });
    $('#quay').onclick = manDanhSach;
    $('#nop').onclick = hoiNop;
    capNhatTienDo();
    batDongHo();
  }

  let henLuu = null;
  function luuNhap() { clearTimeout(henLuu); henLuu = setTimeout(function () { kho.dat(KHOA_NHAP, lam); }, 300); }
  function soDaLam() { return lam.cau.filter(cauDaXong).length; }
  function capNhatTienDo() {
    const n = soDaLam(), t = lam.cau.length;
    const a = $('#da-lam'); if (a) a.textContent = 'Đã trả lời ' + n + '/' + t + ' câu';
    const v = $('#vach'); if (v) v.style.width = (t ? n / t * 100 : 0) + '%';
    lam.cau.forEach(function (c, i) {
      const b = app.querySelector('[data-den="' + i + '"]');
      if (b) b.classList.toggle('da', cauDaXong(c));
    });
  }
  function batDongHo() {
    dungDongHo();
    const f = function () { const g = $('#gio'); if (g) g.textContent = thoiGian((Date.now() - lam.batDau) / 1000); };
    f(); demGio = setInterval(f, 1000);
  }

  function hoiNop() {
    const con = lam.cau.length - soDaLam();
    if (!con) return nop();
    $('#xn-chu').textContent = 'Em còn ' + con + ' câu chưa trả lời đủ. Ý/câu bỏ trống sẽ tính là sai. Em có muốn nộp luôn không?';
    const hop = $('#hop-xn'); hop.classList.remove('an');
    $('#xn-khong').focus();
    $('#xn-khong').onclick = function () { hop.classList.add('an'); };
    $('#xn-co').onclick = function () { hop.classList.add('an'); nop(); };
  }
  function nop() {
    const nut = $('#nop'); if (nut) { nut.disabled = true; nut.textContent = 'Đang chấm bài...'; }
    const daLam = lam;
    api('hsNopBai', daLam.token, daLam.traLoi).then(function (kq) {
      dungDongHo();
      kho.xoa(KHOA_NHAP);
      veKetQua(daLam, kq);
    }).catch(function (e) {
      const m = baoLoi(e);
      if (typeof m !== 'string') return;
      if (nut) { nut.disabled = false; nut.textContent = 'Nộp bài'; }
      if (m.indexOf('quá 6 tiếng') >= 0) {
        const cu = app.querySelector('.thongbao[role="alert"]'); if (cu) cu.remove();
        const box = document.createElement('div'); box.className = 'thongbao loi'; box.setAttribute('role', 'alert');
        box.style.flexDirection = 'column';
        box.innerHTML = '<div>' + esc(m) + ' (bài làm của em vẫn được giữ nguyên trên máy)</div>' +
          '<button type="button" class="nut chinh nho" id="gia-han-nop">Gia hạn phiên và nộp ngay</button>';
        app.prepend(box);
        $('#gia-han-nop').onclick = function () {
          const b = this; b.disabled = true; b.textContent = 'Đang gia hạn & nộp...';
          api('hsBatDau', hs.khoa, daLam.de.id).then(function (r) {
            daLam.token = r.token; daLam.batDau = Date.now(); lam = daLam; kho.dat(KHOA_NHAP, lam);
            return api('hsNopBai', daLam.token, daLam.traLoi);
          }).then(function (kq) { dungDongHo(); kho.xoa(KHOA_NHAP); veKetQua(daLam, kq); })
            .catch(function (err) { b.disabled = false; b.textContent = 'Gia hạn phiên và nộp ngay'; alertNho(baoLoi(err)); });
        };
      } else {
        alertNho(m + ' (bài làm của em vẫn được giữ nguyên trên máy)');
      }
      cuon();
    });
  }

  // ---------- 4. Kết quả ----------
  function hienTraLoi(c, tl) {
    if (c.loai === 'ds') {
      if (!Array.isArray(tl) || !tl.some(v => v === true || v === false)) return '<em>(bỏ trống)</em>';
      return tl.slice(0, 4).map((v, j) => 'abcd'.charAt(j) + ') ' + (v === true ? 'Đúng' : (v === false ? 'Sai' : '–'))).join(' · ');
    }
    if (tl === undefined || tl === null || tl === '') return '<em>(bỏ trống)</em>';
    if (c.loai === 'tn') {
      const o = c.luaChon.find(x => x.k === Number(tl));
      return o ? md(o.t) : esc(tl);
    }
    return md(tl);
  }

  function veDsChiTiet(luaChon, tlArr, daArr) {
    let s = '<div class="ds-list">';
    (luaChon || []).forEach(function (txt, j) {
      const da = daArr ? daArr[j] : null;
      const chon = Array.isArray(tlArr) ? tlArr[j] : null;
      let cls = '', note = '';
      if (daArr) {
        const coChon = chon === true || chon === false;
        const dung = coChon && chon === da;
        if (tlArr !== undefined) {
          cls = dung ? ' dung' : ' sai';
          note = '<span class="ds-note" style="color:' + (dung ? 'var(--ok)' : 'var(--loi)') + '">' +
            (coChon ? ('Chọn: ' + (chon ? 'Đ' : 'S') + ' · ') : 'Bỏ trống · ') +
            'Đáp án: ' + (da ? 'Đúng' : 'Sai') + '</span>';
        } else {
          cls = da ? ' dung' : '';
          note = '<span class="ds-note" style="color:' + (da ? 'var(--ok)' : 'var(--mo)') + '">' + (da ? 'Đúng' : 'Sai') + '</span>';
        }
      }
      s += '<div class="ds-row' + cls + '"><span class="ds-key">' + 'abcd'.charAt(j) + ')</span><span class="ds-txt">' + md(txt) + '</span>' + note + '</div>';
    });
    return s + '</div>';
  }

  function veKetQua(l, kq) {
    cuon();
    const thuTu = {}; l.cau.forEach((c, i) => thuTu[c.id] = i);
    const sai = kq.sai.slice().sort((a, b) => thuTu[a] - thuTu[b]);
    let h = '<div class="hero-box" style="text-align:center">' +
      '<span class="chip chinh">' + esc(l.de.ten) + (kq.muon ? ' · Luyện tập' : ' · Lần thứ ' + kq.soLan) + '</span>' +
      '<div style="font-size:48px;font-weight:800;line-height:1.1;margin:8px 0 4px;color:var(--do)">' + diem(kq.diem) + '<span style="font-size:20px;color:var(--mo)">/10</span></div>' +
      '<div style="font-weight:700">' + soDung(kq.dung) + '/' + kq.tong + ' câu đúng</div>' +
    '</div>';

    h += '<div class="kpi-strip">' +
      '<div class="kpi-card tim"><div class="n">Thời gian làm</div><div class="g">' + thoiGian(kq.giay) + '</div></div>' +
      '<div class="kpi-card xanh"><div class="n">Điểm cao nhất</div><div class="g">' + (kq.best === null ? '–' : diem(kq.best)) + '</div></div>' +
    '</div>';

    if (kq.muon) h += '<div class="thongbao canh">' + ICONS.tt + '<span>Bài này làm sau hạn nộp nên chỉ để luyện tập, không tính vào điểm.</span></div>';

    if (!sai.length) {
      h += '<div class="the" style="text-align:center"><div style="font-size:18px;font-weight:800;color:var(--ok)">Đúng hết tất cả câu hỏi, xuất sắc!</div></div>';
    } else {
      h += '<div class="nhan-muc">' + sai.length + ' câu chưa trọn điểm / làm sai</div>';
      sai.forEach(function (id) {
        const i = thuTu[id], c = l.cau[i];
        h += '<div class="the" style="border-left:4px solid var(--loi)">' +
          '<span class="chip loi" style="margin-bottom:6px">Câu ' + (i + 1) + '</span>' +
          '<div class="noi-dung" style="margin-bottom:6px">' + md(c.cauHoi) + '</div>' +
          '<div class="phu" style="font-size:13.5px">Em ' + (c.loai === 'tn' || c.loai === 'ds' ? 'chọn' : 'điền') + ': <b style="color:var(--loi)">' + hienTraLoi(c, l.traLoi[id]) + '</b></div>';
        if (kq.giai && kq.giai[id]) {
          if (c.loai === 'ds' && kq.giai[id].dapAnDs) {
            h += veDsChiTiet(c.luaChon, l.traLoi[id], kq.giai[id].dapAnDs);
          }
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(kq.giai[id].dapAn) + '</div>' +
            (kq.giai[id].loiGiai ? '<div style="margin-top:4px">' + md(kq.giai[id].loiGiai) + '</div>' : '') + '</div>';
        }
        h += '</div>';
      });
    }

    if (!kq.hetHan) h += '<div class="thongbao canh">' + ICONS.khoa + '<span>Đáp án đúng và lời giải sẽ mở sau <b>' + han(kq.han) + '</b>. Em có thể làm lại để nâng điểm.</span></div>';
    h += '<div class="hang-nut" style="margin-top:16px">' +
      '<button type="button" class="nut chinh" style="flex:1" id="lam-lai">Làm lại</button>' +
      '<button type="button" class="nut" style="flex:1" id="ve-ds">Về danh sách</button>' +
    '</div>';
    if (kq.hetHan) h += '<div class="hang-nut" style="margin-top:8px"><button type="button" class="nut xanh rong" id="xem-ca">Xem đáp án cả đề</button></div>';

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));
    $('#lam-lai').onclick = function () { batDau(l.de.id); };
    $('#ve-ds').onclick = manDanhSach;
    const x = $('#xem-ca'); if (x) x.onclick = function () { xemDapAn(l.de.id); };
  }

  // ---------- 5. Xem đáp án / xem lại bài cũ (sau hạn) ----------
  function xemDapAn(deId) {
    dungDongHo(); dangTai('Đang lấy đáp án...');
    api('hsXemDapAn', deId).then(function (r) {
      cuon();
      let h = '<div class="hero-box"><button type="button" class="nut nho" id="ve" style="margin-bottom:8px">← Về danh sách</button>' +
        '<h1>' + esc(r.ten) + '</h1><span class="chip ok">ĐÁP ÁN VÀ LỜI GIẢI</span></div>';
      let phanTruoc = '';
      r.cau.forEach(function (c, i) {
        const p = nhomPhan(c.loai);
        if (p.key !== phanTruoc) {
          phanTruoc = p.key;
          h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
        }
        h += '<div class="the">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span class="chip chinh">Câu ' + (i + 1) + '</span><span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span></div>' +
          '<div class="noi-dung">' + md(c.cauHoi) + '</div>';
        if (c.loai === 'tn' && c.luaChon) {
          c.luaChon.forEach(function (t, j) {
            const laDung = (c.dapAnIdx !== null && c.dapAnIdx !== undefined) ? (j === c.dapAnIdx) : (t === c.dapAn);
            h += '<div class="lc-xem' + (laDung ? ' dung' : '') + '">' + 'ABCD'.charAt(j) + '. ' + md(t) + (laDung ? ' ✓' : '') + '</div>';
          });
        } else if (c.loai === 'ds' && c.luaChon) {
          h += veDsChiTiet(c.luaChon, undefined, c.dapAnDs);
        }
        h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(c.dapAn) + '</div>' + (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div></div>';
      });
      h += '<button type="button" class="nut chinh rong" style="margin-top:14px" id="ve2">Về danh sách</button>';
      h += '<div id="slogan-slot"></div>';
      app.innerHTML = h;
      renderSlogan(document.getElementById('slogan-slot'));
      $('#ve').onclick = manDanhSach; $('#ve2').onclick = manDanhSach;
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }

  function xemBaiCu(deId, lanId) {
    dungDongHo(); dangTai('Đang tải bài làm cũ...');
    api('hsXemBaiCu', hs.khoa, deId, lanId || '').then(function (r) {
      cuon();
      const dangXem = r.lan.find(x => x.id === r.dangXemId) || r.lan[0];
      let h = '<div class="hero-box"><button type="button" class="nut nho" id="ve" style="margin-bottom:8px">← Về danh sách</button>' +
        '<h1>' + esc(r.ten) + '</h1>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">' +
          '<span class="chip chinh">Điểm: ' + diem(dangXem.diem) + '/10</span>' +
          '<span class="chip ok">' + soDung(dangXem.dung) + '/' + dangXem.tong + ' câu đúng</span>' +
          '<span class="chip">' + thoiGian(dangXem.giay) + '</span>' +
          (dangXem.muon ? '<span class="chip canh">Luyện tập (sau hạn)</span>' : '') +
        '</div>';
      if (r.lan.length > 1) {
        h += '<div class="truong" style="margin-top:10px"><label for="chon-lan">Xem lượt làm khác (' + r.lan.length + ' lượt)</label>' +
          '<select id="chon-lan">' + r.lan.map(function (l, idx) {
            return '<option value="' + esc(l.id) + '"' + (l.id === dangXem.id ? ' selected' : '') + '>Lượt ' + (r.lan.length - idx) + ' · ' + diem(l.diem) + ' điểm (' + han(l.nop) + ')' + (l.muon ? ' · Luyện tập' : '') + '</option>';
          }).join('') + '</select></div>';
      }
      h += '</div>';

      let phanTruoc = '';
      r.cau.forEach(function (c, i) {
        const p = nhomPhan(c.loai);
        if (p.key !== phanTruoc) {
          phanTruoc = p.key;
          h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
        }
        const dCau = c.diemCau !== undefined ? Number(c.diemCau) : (c.dung ? 1 : 0);
        const laMotPhan = c.loai === 'ds' && dCau > 0 && dCau < 1;
        const borderCol = c.dung ? 'var(--ok)' : (laMotPhan ? '#d97706' : 'var(--loi)');
        const chipCls = c.dung ? 'ok' : (laMotPhan ? 'canh' : 'loi');
        const chipTxt = c.dung ? ' · Đúng' : (laMotPhan ? (' · Đúng ' + Math.round(dCau * 4) + '/4 ý (' + soDung(dCau) + ')') : ' · Sai');
        h += '<div class="the" style="border-left:4px solid ' + borderCol + '">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
            '<span class="chip ' + chipCls + '">Câu ' + (i + 1) + chipTxt + '</span>' +
            '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
          '</div>' +
          '<div class="noi-dung">' + md(c.cauHoi) + '</div>';

        if (c.loai === 'tn' && c.luaChon) {
          c.luaChon.forEach(function (t, j) {
            const laDung = j === c.dapAnIdx;
            const laChon = c.tl !== null && c.tl !== undefined && Number(c.tl) === j;
            const cls = laDung ? ' dung' : (laChon ? ' sai-chon' : '');
            h += '<div class="lc-xem' + cls + '">' + 'ABCD'.charAt(j) + '. ' + md(t) +
              (laDung ? ' ✓' : (laChon ? ' (em chọn)' : '')) + '</div>';
          });
        } else if (c.loai === 'ds' && c.luaChon) {
          h += veDsChiTiet(c.luaChon, c.tl, c.dapAnDs);
        } else {
          const tlHien = (c.tl === null || c.tl === undefined || c.tl === '') ? '<em>(bỏ trống)</em>' : md(c.tl);
          h += '<div class="phu" style="font-size:13.5px;margin-bottom:6px">Em trả lời: <b style="color:' + (c.dung ? 'var(--ok)' : 'var(--loi)') + '">' + tlHien + '</b></div>';
        }
        h += '<div class="dap-an-box"><div class="d">Đáp án: ' + md(c.dapAn) + '</div>' + (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div></div>';
      });

      h += '<button type="button" class="nut chinh rong" style="margin-top:14px" id="ve2">Về danh sách</button>';
      h += '<div id="slogan-slot"></div>';
      app.innerHTML = h;
      renderSlogan(document.getElementById('slogan-slot'));
      $('#ve').onclick = manDanhSach; $('#ve2').onclick = manDanhSach;
      const cl = $('#chon-lan'); if (cl) cl.onchange = function () { xemBaiCu(deId, this.value); };
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }

  // ---------- khởi động gộp 1 request ----------
  dangTai('Đang mở lớp Hóa 10...');
  api('hsKhoiDong', hs && hs.khoa ? hs.khoa : '').then(function (res) {
    linkTrang = { webUrl: res.webUrl, trangChu: res.trangChu, caiDatTrang: res.caiDatTrang };
    hsList = res.hsList || [];
    veTopLinks();
    if (hs && hs.khoa && res.danhSach && res.danhSach.ten) {
      hs.ten = res.danhSach.ten; kho.dat(KHOA_HS, hs);
      veDanhSach(res.danhSach);
    } else {
      if (hs && hs.khoa) { kho.xoa(KHOA_HS); hs = null; }
      manNhapTen(hs && !res.danhSach ? 'Thầy đã cập nhật danh sách lớp. Em chọn lại tên nhé.' : '');
    }
  }).catch(function (e) {
    if (!laGAS) { linkTrang = { webUrl: '', trangChu: '', caiDatTrang: {} }; veTopLinks(); }
    const m = baoLoi(e);
    if (typeof m === 'string') {
      app.innerHTML = '<div class="thongbao loi">' + esc(m) + '</div><button class="nut chinh" type="button" onclick="location.reload()">Tải lại</button>';
    }
  });
})();
</script>
</body>
</html>
