<style>
/* Student.html mobile & UX refinements */
body.khoa-cuon{overflow:hidden!important}
.loc-de-bar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;gap:8px;flex-wrap:wrap}

.loc-de-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%}

.md-tbl-wrap{
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  background:
    linear-gradient(to right,var(--the) 25%,transparent),
    linear-gradient(to left,var(--the) 25%,transparent),
    radial-gradient(farthest-side at 0 50%,rgba(24,18,40,.16),transparent),
    radial-gradient(farthest-side at 100% 50%,rgba(24,18,40,.16),transparent);
  background-position:0 0,100% 0,0 0,100% 0;
  background-repeat:no-repeat;
  background-size:28px 100%,28px 100%,11px 100%,11px 100%;

}

  background:
    linear-gradient(to right,var(--the) 25%,transparent),
    linear-gradient(to left,var(--the) 25%,transparent),
    radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.48),transparent),
    radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.48),transparent);
  background-position:0 0,100% 0,0 0,100% 0;
  background-repeat:no-repeat;
  background-size:28px 100%,28px 100%,12px 100%,12px 100%;
  background-attachment:local,local,scroll,scroll;
}
body.dang-lam:not(.dang-luyen) #btn-quick-ref{display:none!important}
body.dang-luyen .topbar{position:sticky;top:0}
.hs-top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 15px;margin-bottom:10px;border-radius:15px;background:linear-gradient(135deg,var(--the) 0%,var(--do-n) 100%);border:1px solid var(--do-v);box-shadow:var(--shadow)}
.hs-top-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 200px}
.hs-top-id h1{margin:0;font-size:clamp(17px,2.2vw,21px);font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kpi-strip.kpi-slim{gap:8px;margin-bottom:10px}
.kpi-strip.kpi-slim .kpi-card{padding:9px 12px;border-radius:13px;gap:8px}
.kpi-strip.kpi-slim .kpi-card .n{font-size:10.5px}
.kpi-strip.kpi-slim .kpi-card .g{font-size:18px;white-space:nowrap}
.kpi-strip.kpi-slim .kpi-ic{width:32px;height:32px;border-radius:9px;font-size:14px}
.kpi-strip.kpi-slim .ring-wrap,.kpi-strip.kpi-slim .ring-svg{width:42px;height:42px}
.kpi-strip.kpi-slim .ring-pct{font-size:10.5px}
@media (max-width:640px){
  .hs-top-bar{padding:10px 12px}
  .kpi-strip.kpi-slim{grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:7px}
  .kpi-strip.kpi-slim .kpi-card{padding:8px 9px;gap:6px}
  .kpi-strip.kpi-slim .kpi-card .n{font-size:9.8px}
  .kpi-strip.kpi-slim .kpi-card .g{font-size:15.5px}
  .kpi-strip.kpi-slim .kpi-ic{display:none}
  .kpi-strip.kpi-slim .ring-wrap,.kpi-strip.kpi-slim .ring-svg{width:34px;height:34px}
  .kpi-strip.kpi-slim .ring-pct{font-size:9.5px}
  .loc-de-bar > input[type="search"]{flex:1 1 100%;max-width:none}
  .loc-de-chips{width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .loc-de-chips::-webkit-scrollbar{display:none}
  .loc-de-chips > *{flex-shrink:0}

}

  .exam-fab-bar{gap:4px;padding:4px 6px;max-width:calc(100vw - 12px)}

  .exam-fab-bar .fab-casio-lbl{display:none}
}

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="brand-mark" id="brand-ic"></div>
        <div class="brand-txt">
          <div class="nho">HÓA HỌC 10 · KNTT</div>
          <div class="ten">Bài tập về nhà</div>
        </div>
      </div>
      <div class="top-right" id="top-right">
        <a class="top-pill an" id="btn-full" href="#" target="_top"></a>
        <button type="button" class="top-pill" id="btn-theme"></button>
      </div>
    </div>
  </header>

  <main class="khung-hep" id="app" aria-live="polite"></main>
</div>

<div id="hop-xn" class="hopdn an" role="dialog" aria-modal="true" aria-labelledby="xn-chu">
  <div class="the">
    <p id="xn-chu" style="margin:0 0 14px;font-size:15px"></p>
    <div class="hang-nut" style="justify-content:flex-end">
      <button class="nut" id="xn-khong" type="button">Làm tiếp</button>
      <button class="nut chinh" id="xn-co" type="button">Nộp luôn</button>
    </div>
  </div>
</div>

<script src="assets/h10.js?v=abe638fbec"></script>
<script>
(function () {
  const { esc, md, api, laGAS, getLocation, skelCards, ICONS, ganNutTheme, toast, renderSlogan, ganThanhDieuHuongHS, moBangTraCuu, docCacheUI, ghiCacheUI, ganNutLenDau, veMascot, kichHoatMascot, phaoGiay } = window.H10;
  const boDau = window.H10.boDau || function (s) {
    return String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
  };
  /** Chữ cái đầu của tên gọi (từ cuối trong họ tên) + màu avatar ổn định theo tên. */
  function avatarHS(ten) {
    const tu = String(ten || '').trim().split(/\s+/);
    const chu = (tu[tu.length - 1] || '?').charAt(0).toUpperCase();
    let h = 0;
    for (let i = 0; i < String(ten).length; i++) h = (h * 31 + String(ten).charCodeAt(i)) >>> 0;
    return '<span class="hs-av c' + (h % 5 + 1) + '" aria-hidden="true">' + esc(chu) + '</span>';
  }
  document.getElementById('brand-ic').innerHTML = ICONS.binh;
  ganNutTheme(document.getElementById('btn-theme'));
  ganNutLenDau();

  const KHOA_HS = 'btvn_hoa10_hs', KHOA_NHAP = 'btvn_hoa10_nhap';
  const bo = {};
  const kho = {
    lay(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (bo[k] || null); } catch (e) { return bo[k] || null; } },
    dat(k, v) { bo[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    xoa(k) { delete bo[k]; try { localStorage.removeItem(k); } catch (e) {} }
  };
  function xoaCacheUI_(k) {
    try { localStorage.removeItem('h10_ui_' + k); } catch (e) {}
  }

  const $ = s => document.querySelector(s);
  const app = $('#app');
  const THU = ['Chủ nhật', 'thứ Hai', 'thứ Ba', 'thứ Tư', 'thứ Năm', 'thứ Sáu', 'thứ Bảy'];
  function gio(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function ngay(ms) { const d = new Date(ms); return d.getDate() + '/' + (d.getMonth() + 1); }
  function han(ms) { const d = new Date(ms); return gio(ms) + ', ' + THU[d.getDay()] + ' ' + ngay(ms); }
  function diem(x) { if (x === null || x === undefined || x === '') return '–'; const n = Number(x); return (Math.round(n * 10) / 10).toString().replace('.', ','); }
  function soDung(x) { if (x === null || x === undefined || x === '') return '0'; const n = Number(x); return (Math.round(n * 100) / 100).toString().replace('.', ','); }
  function thoiGian(giay) { giay = Math.max(0, Math.round(giay)); const p = Math.floor(giay / 60), g = giay % 60; return String(p).padStart(2, '0') + ':' + String(g).padStart(2, '0'); }

  let laFull = false, linkTrang = null, hsList = [];
  let hs = kho.lay(KHOA_HS);
  let lam = null, demGio = null, henLuu = null, dangNop = false, kbdCauIdx = -1;
  let manHienTai = (hs && hs.khoa) ? 'danhSach' : 'chonHS'; // 'chonHS' | 'danhSach' | 'lamBai' | 'ketQua' | 'xemDapAn' | 'xemBaiCu' | 'luyenTap'
  let locDe = { tk: '', tt: 'tat_ca', bai: '' }, dsDeCache = null, dsTab = 'btvn';
  let deTuUrl = '';
  let locCauThi = 'tat_ca'; // 'tat_ca' | 'chua_xong'

  function dangMoDrawerCau_() {
    const fdr = $('#fab-drawer'), ldr = $('#lam-drawer');
    return !!((fdr && !fdr.classList.contains('an')) || (ldr && !ldr.classList.contains('an')));
  }
  function capNhatKhoaCuon_() {
    const hop = $('#hop-xn');
    const hopMo = !!(hop && !hop.classList.contains('an'));
    document.body.classList.toggle('khoa-cuon', hopMo || dangMoDrawerCau_());
  }
  function dongHopXn_() {
    const hop = $('#hop-xn');
    if (hop) hop.classList.add('an');
    capNhatKhoaCuon_();
  }
  function moHopXn_(chu) {
    $('#xn-chu').textContent = chu;
    const hop = $('#hop-xn');
    if (hop) hop.classList.remove('an');
    capNhatKhoaCuon_();
    const nutKhong = $('#xn-khong');
    if (nutKhong) nutKhong.focus();
  }
  function dongDrawerCau_() {
    const fdr = $('#fab-drawer'), ldr = $('#lam-drawer'), bd = $('#fab-backdrop'), tl = app.querySelector('.thanh-lam');
    if (fdr) fdr.classList.add('an');
    if (ldr) ldr.classList.add('an');
    if (bd) bd.classList.add('an');
    if (tl) tl.classList.remove('drawer-mo');
    capNhatKhoaCuon_();
  }
  const hopXnEl = $('#hop-xn');
  if (hopXnEl) {
    hopXnEl.addEventListener('click', function (e) {
      if (e.target === hopXnEl) dongHopXn_();
    });
  }

  function veTopLinks() {
    const cfg = (linkTrang && linkTrang.caiDatTrang) || {};
    const opt = { cfg: cfg, webUrl: (linkTrang && linkTrang.webUrl) || '', laFull: laFull };
    ganThanhDieuHuongHS('btvn', opt);
    if (!linkTrang) return;
    const bf = $('#btn-full');
    if (bf) {
      if (!laGAS) { bf.classList.add('an'); return; }
      bf.classList.remove('an');
      if (laFull) {
        bf.href = linkTrang.trangChu;
        bf.target = '_top';
        bf.innerHTML = ICONS.ve + '<span>Về Sites</span>';
      } else {
        bf.href = linkTrang.webUrl + '?full=1';
        bf.target = '_top';
        bf.innerHTML = ICONS.full + '<span>Toàn màn hình</span>';
      }
    }
  }

  getLocation(function (loc) {
    laFull = !!(loc && loc.parameter && loc.parameter.full);
    if (loc && loc.parameter && loc.parameter.de) deTuUrl = String(loc.parameter.de);
    if (loc && loc.parameter && loc.parameter.bai) locDe.bai = String(loc.parameter.bai);
    veTopLinks();
    if (dsDeCache && manHienTai === 'danhSach' && hs && hs.khoa) veDanhSach(dsDeCache);
  });

  function dangTai(chu) {
    app.innerHTML = '<div class="phu" style="margin:6px 2px 10px"><span class="cho"></span> ' + esc(chu || 'Đang tải dữ liệu...') + '</div>' + skelCards(3);
  }
  function baoLoi(e) {
    const m = (e && e.message) ? e.message : String(e);
    if (m.indexOf('KHONG_CO_HS') >= 0) {
      clearTimeout(henLuu); henLuu = null;
      lam = null;
      if (hs && hs.khoa) xoaCacheUI_('hs_ds_' + hs.khoa);
      kho.xoa(KHOA_HS); kho.xoa(KHOA_NHAP); hs = null; dsDeCache = null;
      manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
      return null;
    }
    return m.replace(/^Exception:\s*/, '');
  }
  function cuon() { try { window.scrollTo(0, 0); } catch (e) {} }
  function dungDongHo() {
    if (demGio) { clearInterval(demGio); demGio = null; }
    document.body.classList.remove('dang-lam', 'dang-luyen');
    const hop = $('#hop-xn'); if (hop) hop.classList.add('an');
    document.body.classList.remove('khoa-cuon');
  }
  function thoatTamLamBai_() {
    clearTimeout(henLuu); henLuu = null;
    if (lam) {
      kho.dat(KHOA_NHAP, lam);
      lam = null;
    }
    dungDongHo();
  }

  // ---------- 1. Chọn / nhập họ tên ----------
  function manNhapTen(loi) {
    clearTimeout(henLuu); henLuu = null;
    lam = null;
    manHienTai = 'chonHS';
    dungDongHo();
    const coDs = hsList && hsList.length > 0;
    let h = '<div class="hero-box art-atom hero-mascot-split">' +
      '<div class="hm-txt"><span class="chip chinh">HÓA 10 · BÀI TẬP VỀ NHÀ</span>' +
      '<h1>Chào em!</h1>' +
      '<p class="phu" style="margin:0">' + (coDs ? 'Chọn tên em trong danh sách hoặc nhập họ tên mới nếu chưa có.' : 'Nhập đầy đủ họ và tên để bắt đầu làm bài tập.') + '</p></div>' +
      '<div class="st-mascot-box">' + veMascot({ alt: 'Thầy Hoàng chào đón' }) + '</div>' +
      '</div>';

    if (loi) h += '<div class="thongbao loi" role="alert">' + esc(loi) + '</div>';

    if (coDs) {
      h += '<section class="the">' +
        '<h2 class="tieu-khoi" style="margin-bottom:8px">Chọn nhanh từ danh sách lớp (' + hsList.length + ' bạn)</h2>' +
        '<div class="truong"><input id="loc-hs" type="search" autocomplete="off" placeholder="Gõ tên để tìm nhanh (có dấu hoặc không dấu)..."></div>' +
        '<div class="hs-picker-list" id="hs-picker" role="list"></div>' +
        '<div class="hs-dem" id="hs-dem"></div>' +
        '</section>';
    }

    h += '<form class="the" id="f-ten">' +
      '<h2 class="tieu-khoi" style="margin-bottom:8px">' + (coDs ? 'Hoặc nhập họ và tên mới' : 'Đăng ký vào làm bài') + '</h2>' +
      '<div class="truong"><label for="hoten">Họ và tên đầy đủ</label>' +
      '<input id="hoten" type="text" autocomplete="name" required minlength="2" placeholder="Ví dụ: Nguyễn Minh Anh"></div>' +
      '<button class="nut chinh to rong" style="margin-top:12px" type="submit">Vào làm bài</button>' +
      '<div class="thongbao info" style="margin-bottom:0">' + ICONS.tt + '<span>Nếu tên em đã có ở trên, hãy bấm chọn đúng tên đó để không bị tách thành 2 tài khoản nhé.</span></div>' +
      '</form><div id="slogan-slot"></div>';

    app.innerHTML = h;
    kichHoatMascot(app);
    renderSlogan(document.getElementById('slogan-slot'));

    if (coDs) {
      const box = $('#hs-picker');
      const veList = function (tk) {
        const qRaw = String(tk || '').trim().toLowerCase();
        const qKD = boDau(qRaw);
        const cacTu = qKD ? qKD.split(/\s+/).filter(Boolean) : [];
        const ds = cacTu.length ? hsList.filter(function (x) {
          const ten = String(x.ten || '');
          if (ten.toLowerCase().indexOf(qRaw) >= 0) return true;
          const tenKD = boDau(ten);
          if (tenKD.indexOf(qKD) >= 0) return true;
          return cacTu.every(function (tu) { return tenKD.indexOf(tu) >= 0; });
        }) : hsList;
        const dem = $('#hs-dem');
        if (!ds.length) {
          box.innerHTML = '<div class="phu" style="padding:10px;text-align:center;grid-column:1/-1">Không thấy tên phù hợp, em nhập tên mới ở khung bên dưới nhé.</div>';
          if (dem) dem.textContent = '';
          return;
        }
        box.innerHTML = ds.map(function (x) {
          return '<button type="button" role="listitem" class="hs-picker-item" data-chon-hs="' + esc(x.khoa) + '" data-ten-hs="' + esc(x.ten) + '" title="Chọn ' + esc(x.ten) + '">' +
            avatarHS(x.ten) + '<span class="hs-picker-ten">' + esc(x.ten) + '</span></button>';
        }).join('');
        if (dem) dem.textContent = cacTu.length ? ('Tìm thấy ' + ds.length + ' bạn') : (ds.length > 8 ? 'Cuộn xuống để xem thêm tên ↓' : '');
        box.querySelectorAll('[data-chon-hs]').forEach(function (btn) {
          btn.onclick = function () {
            hs = { khoa: btn.getAttribute('data-chon-hs'), ten: btn.getAttribute('data-ten-hs') };
            kho.dat(KHOA_HS, hs);
            manDanhSach();
          };
        });
      };
      veList('');
      $('#loc-hs').oninput = function () { veList(this.value); };
    }

    const f = $('#f-ten');
    f.onsubmit = function (ev) {
      ev.preventDefault();
      const ten = $('#hoten').value;
      const nut = f.querySelector('button[type="submit"]');
      nut.disabled = true; nut.textContent = 'Đang vào...';
      api('hsDangKy', ten).then(function (r) {
        hs = r; kho.dat(KHOA_HS, r);
        if (!hsList.some(function (x) { return x.khoa === r.khoa; })) {
          hsList.push(r);
          hsList.sort(function (a, b) { return a.ten.localeCompare(b.ten, 'vi'); });
        }
        manDanhSach();
      }).catch(function (e) {
        const m = baoLoi(e); if (typeof m === 'string') manNhapTen(m);
      });
    };
  }

  // ---------- 2. Danh sách đề ----------
  function manDanhSach() {
    thoatTamLamBai_();
    if (!hs || !hs.khoa) return manNhapTen('');
    manHienTai = 'danhSach';
    cuon();
    const khoaReq = hs.khoa;
    const cachedDS = docCacheUI('hs_ds_' + khoaReq);
    if (cachedDS && cachedDS.ten) {
      veDanhSach(cachedDS);
    } else {
      dangTai('Đang tải danh sách đề...');
    }
    api('hsDanhSach', khoaReq).then(function (r) {
      if (!hs || hs.khoa !== khoaReq) return;
      if (!r || !r.ten) {
        clearTimeout(henLuu); henLuu = null; lam = null;
        xoaCacheUI_('hs_ds_' + khoaReq);
        kho.xoa(KHOA_HS); kho.xoa(KHOA_NHAP); hs = null; dsDeCache = null;
        return manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
      }
      hs.ten = r.ten; kho.dat(KHOA_HS, hs);
      ghiCacheUI('hs_ds_' + khoaReq, r);
      dsDeCache = r;
      if (manHienTai === 'danhSach' && hs && hs.khoa === khoaReq) {
        veDanhSach(r);
      }
    }).catch(function (e) {
      if (!hs || hs.khoa !== khoaReq || manHienTai !== 'danhSach') return;
      if (cachedDS) return;
      const m = baoLoi(e);
      if (typeof m === 'string') {
        app.innerHTML = '<div class="thongbao loi">' + esc(m) + '</div><button class="nut chinh" type="button" id="thu-lai">Thử lại</button>';
        $('#thu-lai').onclick = manDanhSach;
      }
    });
  }

  function veNhanCauHinhDe_(d) {
    const ch = (d && d.cauHinh) || {};
    let s = '';
    if (ch.phutLam > 0) s += '<span class="chip tim">⏱️ ' + ch.phutLam + ' phút</span>';
    if (ch.soLanToiDa > 0) s += '<span class="chip' + (d.hetLuot && !d.hetHan ? ' loi' : '') + '">🎯 Tối đa ' + ch.soLanToiDa + ' lượt</span>';
    if (ch.thangDiemDS === 'luy_tien') s += '<span class="chip">Đ/S chuẩn Bộ GD</span>';
    if (ch.moDapAnNgay && !d.hetHan) s += '<span class="chip ok">Mở đáp án sau nộp</span>';
    return s;
  }

  function veBieuDoDiemSVG_(ls) {
    if (!ls || !ls.length) {
      return '<div class="phu" style="font-size:13px;padding:12px 0">Khi em hoàn thành các đề BTVN, biểu đồ đường tiến bộ điểm số sẽ tự động hiển thị tại đây.</div>';
    }
    const W = 360, H = 134, axisX = 28, pL = 54, pR = 18, pT = 28, pB = 24;
    const gW = W - pL - pR, gH = H - pT - pB;
    const n = ls.length;
    const pts = ls.map(function (it, idx) {
      const x = n === 1 ? (pL + gW / 2) : (pL + (idx / (n - 1)) * gW);
      const val = Math.max(0, Math.min(10, Number(it.diem) || 0));
      const y = pT + (1 - val / 10) * gH;
      return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, val: val, ten: it.ten || ('Đề ' + (idx + 1)) };
    });
    const poly = pts.map(p => p.x + ',' + p.y).join(' ');
    const area = pts.length > 1
      ? ('M ' + pts[0].x + ',' + (pT + gH) + ' L ' + pts.map(p => p.x + ',' + p.y).join(' L ') + ' L ' + pts[pts.length - 1].x + ',' + (pT + gH) + ' Z')
      : '';
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="Biểu đồ điểm số các đề gần đây">' +
      '<defs><linearGradient id="progGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9e1e4c" stop-opacity="0.28"/><stop offset="100%" stop-color="#9e1e4c" stop-opacity="0.0"/></linearGradient></defs>';
    [0, 5, 8, 10].forEach(function (m) {
      const gy = Math.round((pT + (1 - m / 10) * gH) * 10) / 10;
      svg += '<line x1="' + axisX + '" y1="' + gy + '" x2="' + (W - 10) + '" y2="' + gy + '" stroke="var(--vien)" stroke-dasharray="3 3" stroke-width="1"/>' +
        '<text x="' + (axisX - 6) + '" y="' + (gy + 3.5) + '" text-anchor="end" font-size="9.5" fill="var(--mo)">' + m + '</text>';
    });
    if (area) svg += '<path d="' + area + '" fill="url(#progGrad)"/>';
    if (pts.length > 1) svg += '<polyline fill="none" stroke="var(--do)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' + poly + '"/>';
    pts.forEach(function (p, i) {
      const lblY = Math.round((p.val >= 9.2 ? Math.min(p.y - 9, pT - 6) : (p.y - 8)) * 10) / 10;
      svg += '<g><title>' + esc(p.ten + ': ' + diem(p.val) + '/10') + '</title>' +
        '<circle cx="' + p.x + '" cy="' + p.y + '" r="4.2" fill="var(--the)" stroke="var(--do)" stroke-width="2.4"/>' +
        '<text x="' + p.x + '" y="' + lblY + '" text-anchor="middle" font-size="10" font-weight="800" fill="var(--chu)" style="paint-order:stroke;stroke:var(--the);stroke-width:3.5px;stroke-linejoin:round">' + diem(p.val) + '</text>' +
        '<text x="' + p.x + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9.5" fill="var(--mo)">#' + (i + 1) + '</text></g>';
    });
    svg += '</svg>';
    return svg;
  }

  function taoTenBaiMap_(mucLuc) {
    const m = {};
    (mucLuc || []).forEach(function (c) {
      m[c.id] = c.ten;
      (c.bai || []).forEach(function (b) { m[b.id] = b.ten; });
    });
    return m;
  }

  function hopBaiDe_(d, maBai, mucLuc) {
    if (!maBai) return true;
    const bIds = Array.isArray(d.baiIds) ? d.baiIds : [];
    const ten = String(d.ten || '');
    const tenKD = boDau(ten);
    if (/^C\d+$/.test(maBai)) {
      const ch = (mucLuc || []).find(c => c.id === maBai);
      if (!ch) return true;
      const setB = (ch.bai || []).map(b => b.id);
      if (bIds.length) return bIds.some(id => setB.indexOf(id) >= 0);
      const soCh = maBai.slice(1).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('chương\\s*0*' + soCh + '(?!\\d)', 'i').test(ten) ||
        new RegExp('chuong\\s*0*' + soCh + '(?!\\d)', 'i').test(tenKD);
    }
    if (bIds.length) return bIds.indexOf(maBai) >= 0;
    if (maBai.toUpperCase() === 'MD' && (/\bmở đầu\b/i.test(ten) || /\bmo dau\b/i.test(tenKD))) return true;
    const escMa = maBai.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const escMaKD = boDau(maBai).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp('bài\\s*0*' + escMa + '(?![0-9a-z])', 'i').test(ten) ||
      new RegExp('bai\\s*0*' + escMaKD + '(?![0-9a-z])', 'i').test(tenKD);
  }

  function nutLamDe_(d, lop, nhap) {
    const dangDo = nhap && nhap.de && nhap.de.id === d.id && hs && nhap.khoa === hs.khoa;
    if (!d.hetHan && d.hetLuot && !dangDo) {
      return '<button type="button" class="nut nho" disabled title="Đề này giới hạn số lượt làm bài">Đã hết lượt (' + d.soLan + '/' + d.cauHinh.soLanToiDa + ')</button>';
    }
    const chu = dangDo ? 'Làm tiếp bài dở' : (d.hetHan ? 'Luyện lại' : (d.soLan ? 'Làm lại' : 'Làm bài'));
    return '<button type="button" class="nut ' + lop + '" data-lam="' + esc(d.id) + '">' + chu + '</button>';
  }

  function veDeNoiBat_(r, homNay, nhap, laDeUrl) {
    if (!homNay) return '';
    const laHomNay = ms => new Date(ms).toDateString() === new Date(r.now).toDateString();
    const conGioHn = Math.max(0, Math.round((homNay.han - r.now) / 3600e3));
    const demNguocHn = conGioHn < 24 ? ('⏳ Còn ' + Math.max(1, conGioHn) + ' giờ') : ('⏳ Còn ' + Math.round(conGioHn / 24) + ' ngày');
    const dangDoHn = nhap && nhap.de && nhap.de.id === homNay.id && hs && nhap.khoa === hs.khoa;
    const hetLuotHn = !homNay.hetHan && homNay.hetLuot && !dangDoHn;
    const chuNutHn = dangDoHn ? 'Làm tiếp bài dở →' : (hetLuotHn ? ('Đã hết lượt (' + homNay.soLan + '/' + homNay.cauHinh.soLanToiDa + ')') : (homNay.soLan ? 'Làm lại để nâng điểm →' : 'Làm bài ngay →'));
    const nhanDau = laDeUrl
      ? '<span class="chip chinh">🎯 Đề em vừa chọn</span>'
      : (laHomNay(homNay.ngayMo) ? '<span class="chip chinh">★ Đề mới · ' + ngay(homNay.ngayMo) + '</span>' : '<span class="chip tim">★ Đề mới nhất</span>');
    return '<div class="the the-noi feat-banner" style="margin-bottom:10px">' +
      '<div class="feat-top">' +
        '<div class="feat-meta">' +
          nhanDau +
          '<span><b>' + homNay.soCau + '</b> câu</span><span class="dot"></span>' +
          '<span>Hạn <b>' + han(homNay.han) + '</b></span>' +
          veNhanCauHinhDe_(homNay) +
        '</div>' +
        '<span class="feat-countdown' + (conGioHn < 24 ? ' gap' : '') + '">' + demNguocHn + '</span>' +
      '</div>' +
      '<h2 class="feat-title">' + esc(homNay.ten) + '</h2>' +
      (!homNay.soLan && !dangDoHn ? '<div class="feat-nhac">⏰ Em chưa làm bài này — nhớ nộp trước hạn nhé!</div>' : '') +
      (dangDoHn ? '<div class="feat-nhac">✏️ Em đang làm dở bài này, bấm để làm tiếp.</div>' : '') +
      '<div class="feat-body">' +
        '<div class="kpi-strip kpi-slim" style="margin-bottom:0;flex:1 1 300px">' +
          '<div class="kpi-card xanh"><div><div class="n">Điểm cao nhất</div><div class="g">' + (homNay.soLan ? diem(homNay.best) : 'Chưa làm') + '</div></div><div class="kpi-ic">★</div></div>' +
          '<div class="kpi-card tim"><div><div class="n">Số lần làm đúng hạn</div><div class="g">' + homNay.soLan + (homNay.cauHinh && homNay.cauHinh.soLanToiDa ? ('/' + homNay.cauHinh.soLanToiDa) : '') + '</div></div><div class="kpi-ic">#</div></div>' +
        '</div>' +
        '<div class="hang-nut" style="align-items:stretch">' +
          (homNay.duocXemDapAn && homNay.coBaiLam ? '<button type="button" class="nut tim" data-xem-bai="' + esc(homNay.id) + '">Xem lại bài</button>' : '') +
          (homNay.duocXemDapAn ? '<button type="button" class="nut xanh" data-xem="' + esc(homNay.id) + '">Đáp án</button>' : '') +
          '<button type="button" class="nut ' + (hetLuotHn ? '' : 'chinh ') + 'to feat-cta"' + (hetLuotHn ? ' disabled' : ' data-lam="' + esc(homNay.id) + '"') + '>' + chuNutHn + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function veNoiDungDsDe_(r) {
    if (!r || !Array.isArray(r.de)) return '';
    if (!r.de.length) {
      return '<div class="the"><p class="phu" style="margin:0;text-align:center">Thầy chưa giao đề nào. Em quay lại sau nhé.</p></div>';
    }
    const nhap = kho.lay(KHOA_NHAP);
    const mucLuc = r.mucLuc || [];
    const tenBaiMap = taoTenBaiMap_(mucLuc);
    const tkRaw = locDe.tk.trim().toLowerCase();
    const tkKD = boDau(tkRaw);
    const tkTokens = tkKD ? tkKD.split(/\s+/).filter(Boolean) : [];

    const hopDeLoc = function (d) {
      if (locDe.bai && !hopBaiDe_(d, locDe.bai, mucLuc)) return false;
      if (tkTokens.length) {
        const bTxt = (Array.isArray(d.baiIds) ? d.baiIds : []).map(function (id) {
          return 'Bài ' + id + ' ' + (tenBaiMap[id] || '');
        }).join(' ');
        const gop = String(d.ten || '') + ' ' + bTxt;
        const gopKD = boDau(gop);
        if (gop.toLowerCase().indexOf(tkRaw) < 0 && !tkTokens.every(function (tu) { return gopKD.indexOf(tu) >= 0; })) {
          return false;
        }
      }
      if (locDe.tt === 'chua_lam') return !d.soLan;
      if (locDe.tt === 'da_lam') return d.soLan > 0;
      return true;
    };

    const dangLocDe = !!(locDe.bai || tkTokens.length || locDe.tt !== 'tat_ca');
    const mo = r.de.filter(d => !d.hetHan), het = r.de.filter(d => d.hetHan);
    const homNay = !dangLocDe ? mo[0] : null;
    const conLai = (homNay ? mo.slice(1) : mo).filter(hopDeLoc);
    const hetLoc = het.filter(hopDeLoc);

    let h = '';
    if (dangLocDe && !conLai.length && !hetLoc.length) {
      h += '<div class="the" style="text-align:center"><p class="phu" style="margin:0 0 8px">Không tìm thấy đề BTVN nào khớp bộ lọc hiện tại.</p><button type="button" class="nut nho chinh" id="xoa-het-loc-de">Hiện tất cả đề</button></div>';
      return h;
    }

    if (conLai.length) {
      h += '<div class="nhan-muc">' + (homNay ? 'Đang mở khác' : 'Đề đang mở') + ' (' + conLai.length + ')</div><div class="de-grid">';
      conLai.forEach(function (d) {
        h += '<div class="de-card' + (d.soLan ? ' xong' : '') + '">' +
          '<div style="flex:1 1 200px;min-width:0">' +
            '<div style="font-weight:700;font-size:15.5px;margin-bottom:6px">' + esc(d.ten) + '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
              '<span class="chip canh">Hạn ' + han(d.han) + '</span>' +
              '<span class="chip">' + d.soCau + ' câu</span>' +
              veNhanCauHinhDe_(d) +
              '<span class="chip ' + (d.soLan ? 'ok' : '') + '">' + (d.soLan ? '★ Cao nhất ' + diem(d.best) + ' (' + d.soLan + ' lần)' : 'Chưa làm') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="hang-nut">' +
            (d.duocXemDapAn && d.coBaiLam ? '<button type="button" class="nut nho tim" data-xem-bai="' + esc(d.id) + '">Xem lại bài</button>' : '') +
            (d.duocXemDapAn ? '<button type="button" class="nut nho xanh" data-xem="' + esc(d.id) + '">Đáp án</button>' : '') +
            nutLamDe_(d, 'vien', nhap) +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    }

    if (hetLoc.length) {
      h += '<div class="nhan-muc">Đã hết hạn (' + hetLoc.length + ')</div><div class="de-grid">';
      hetLoc.forEach(function (d) {
        h += '<div class="de-card ' + (d.soLan ? 'xong' : 'het') + '">' +
          '<div style="flex:1 1 200px;min-width:0">' +
            '<div style="font-weight:700;font-size:15px;margin-bottom:5px">' + esc(d.ten) + '</div>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
              '<span class="chip ' + (d.soLan ? 'ok' : '') + '">' + (d.soLan ? ('★ Cao nhất ' + diem(d.best) + '/10') : 'Chưa làm trong hạn') + '</span>' +
              (d.soLan ? '<span class="phu" style="font-size:12.5px">' + d.soLan + ' lần đúng hạn</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="hang-nut">' +
            (d.coBaiLam ? '<button type="button" class="nut nho tim" data-xem-bai="' + esc(d.id) + '">Xem lại bài</button>' : '') +
            '<button type="button" class="nut nho xanh" data-xem="' + esc(d.id) + '">Đáp án</button>' +
            '<button type="button" class="nut nho" data-lam="' + esc(d.id) + '">Luyện lại</button>' +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    }
    return h;
  }

  function ganSuKienNutDe_(scope) {
    if (!scope) return;
    scope.querySelectorAll('[data-lam]').forEach(b => { b.onclick = () => batDau(b.getAttribute('data-lam')); });
    scope.querySelectorAll('[data-xem]').forEach(b => { b.onclick = () => xemDapAn(b.getAttribute('data-xem')); });
    scope.querySelectorAll('[data-xem-bai]').forEach(b => { b.onclick = () => xemBaiCu(b.getAttribute('data-xem-bai')); });
    const xhld = scope.querySelector('#xoa-het-loc-de');
    if (xhld) {
      xhld.onclick = function () {
        locDe = { tk: '', tt: 'tat_ca', bai: '' };
        const inp = $('#loc-de-tk'); if (inp) inp.value = '';
        const bl = $('#bo-loc-bai'); if (bl) bl.remove();
        app.querySelectorAll('[data-ld-tt]').forEach(function (x) {
          x.classList.toggle('on', x.getAttribute('data-ld-tt') === 'tat_ca');
        });
        capNhatDsDeList_();
      };
    }
  }

  function capNhatDsDeList_() {
    const box = $('#ds-de-list');
    if (!box || !dsDeCache) return;
    const dangLocDe = !!(locDe.bai || locDe.tk.trim() || locDe.tt !== 'tat_ca');
    const feat = $('#ds-de-featured');
    if (feat) feat.classList.toggle('an', dangLocDe);
    box.innerHTML = veNoiDungDsDe_(dsDeCache);
    ganSuKienNutDe_(box);
  }

  function veDanhSach(r) {
    dsDeCache = r;
    // Nếu học sinh đang gõ trong ô tìm kiếm đề khi dữ liệu nền vừa tải xong, chỉ cập nhật #ds-de-list để không ngắt IME/bàn phím
    const ae = document.activeElement;
    if (manHienTai === 'danhSach' && ae && ae.id === 'loc-de-tk' && $('#ds-de-list')) {
      const nChuaBg = r.de.filter(d => !d.soLan).length;
      const nXongBg = r.de.filter(d => d.soLan > 0).length;
      const bAll = app.querySelector('[data-ld-tt="tat_ca"]'), bChua = app.querySelector('[data-ld-tt="chua_lam"]'), bXong = app.querySelector('[data-ld-tt="da_lam"]');
      if (bAll) bAll.textContent = 'Tất cả (' + r.de.length + ')';
      if (bChua) bChua.textContent = 'Chưa làm (' + nChuaBg + ')';
      if (bXong) bXong.textContent = 'Đã làm (' + nXongBg + ')';
      const tabCnt = app.querySelector('[data-ds-tab="btvn"] .h10-tab-cnt');
      if (tabCnt) tabCnt.textContent = String(r.de.length);
      capNhatDsDeList_();
      return;
    }

    const nhap = kho.lay(KHOA_NHAP);
    const mucLuc = r.mucLuc || [];
    const tenBaiMap = taoTenBaiMap_(mucLuc);
    const dangLocDe = !!(locDe.bai || locDe.tk.trim() || locDe.tt !== 'tat_ca');
    const mo = r.de.filter(d => !d.hetHan);
    const homNay = mo[0] || null;
    const daNopDe = r.de.filter(d => d.soLan > 0);
    const diemTBCao = daNopDe.length ? (Math.round(daNopDe.reduce((s, d) => s + Number(d.best || 0), 0) / daNopDe.length * 10) / 10) : null;
    const chuaLamMo = mo.filter(d => !d.soLan && !d.hetLuot);
    const cc = r.chuyenCan;
    const tb = r.tienBo || {};
    const lsDiem = Array.isArray(tb.lichSuDiem) ? tb.lichSuDiem : [];
    const baiHaySai = Array.isArray(tb.baiHaySai) ? tb.baiHaySai : [];
    const soCauOnTap = Number(tb.soCauOnTap) || 0;
    const deChonUrl = deTuUrl ? r.de.find(x => x.id === deTuUrl) : null;
    const deUrlLaHomNay = !!(deChonUrl && homNay && deChonUrl.id === homNay.id);

    // 1. Thanh thông tin học sinh gọn + badge nhắc gọn duy nhất (không lặp tên đề)
    let h = '<div class="hs-top-bar">' +
      '<div class="hs-top-id">' +
        avatarHS(hs.ten) +
        '<div style="min-width:0">' +
          '<h1>' + esc(hs.ten) + '</h1>' +
          '<div class="hs-top-meta">' +
            (chuaLamMo.length
              ? '<span class="chip canh">⏰ Còn ' + chuaLamMo.length + ' đề đang mở chưa làm</span>'
              : (mo.length ? '<span class="chip ok">✓ Đã làm đủ đề đang mở</span>' : '<span class="chip">Hóa học 10 · KNTT</span>')) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="hs-top-act">' +
        '<button type="button" class="nut nho" id="doi-ten">Đổi học sinh</button>' +
      '</div>' +
    '</div>';

    if (linkTrang && linkTrang.caiDatTrang && linkTrang.caiDatTrang.thongBao) {
      h += '<div class="thongbao info" style="margin:0 0 10px">' + ICONS.tt + '<div><b>📢 Thông báo từ Thầy Hoàng:</b><div style="margin-top:2px">' + md(linkTrang.caiDatTrang.thongBao) + '</div></div></div>';
    }

    // 2. Dải KPI mỏng: Tiến độ BTVN · Điểm TB · Chuyên cần
    if (r.de.length || cc) {
      const pct = r.de.length ? Math.round(daNopDe.length / r.de.length * 100) : 0;
      const circ = 150.8; // 2πr, r = 24
      const off = Math.round(circ * (1 - pct / 100) * 10) / 10;
      const ringSvg = '<div class="ring-wrap" role="img" aria-label="Đã làm ' + pct + '% số đề">' +
        '<svg class="ring-svg" viewBox="0 0 56 56" aria-hidden="true">' +
        '<circle class="ring-bg" cx="28" cy="28" r="24"></circle>' +
        '<circle class="ring-fg" cx="28" cy="28" r="24" stroke-dasharray="' + circ + '" stroke-dashoffset="' + off + '"></circle>' +
        '</svg><span class="ring-pct">' + pct + '%</span></div>';
      h += '<div class="kpi-strip kpi-slim">' +
        '<div class="kpi-card xanh"><div><div class="n">Tiến độ BTVN</div><div class="g">' + daNopDe.length + '<span style="font-size:12.5px;color:var(--mo)">/' + r.de.length + ' đề</span></div></div>' + ringSvg + '</div>' +
        '<div class="kpi-card tim"><div><div class="n">Điểm TB</div><div class="g">' + (diemTBCao !== null ? diem(diemTBCao) : '–') + '</div></div><div class="kpi-ic">★</div></div>' +
        (cc ? ('<div class="kpi-card' + (cc.kp ? ' canh' : '') + '"><div><div class="n">Chuyên cần</div><div class="g">' + cc.co + '<span style="font-size:12.5px;color:var(--mo)">/' + cc.tongBuoi + ' buổi</span></div></div><div class="kpi-ic">✓</div></div>') : '') +
      '</div>';
    }

    // 3. Thanh 2 Tab chuyển đổi (.h10-tabs)

    '</div>';

    // Tab 1: Bài tập của em (Đề mới nhất / cần làm lên đầu tiên, tiếp đến thanh tìm kiếm & danh sách đề)

            '<button type="button" data-ld-tt="chua_lam" class="' + (locDe.tt === 'chua_lam' ? 'on' : '') + '">Chưa làm (' + nChua + ')</button>' +
            '<button type="button" data-ld-tt="da_lam" class="' + (locDe.tt === 'da_lam' ? 'on' : '') + '">Đã làm (' + nXong + ')</button>' +
          '</div>' +

    h += '<div id="ds-de-list">' + veNoiDungDsDe_(r) + '</div>';

    // Tab 2: Tiến bộ & Tự luyện (Biểu đồ điểm + Chủ đề hay nhầm + Phòng Tự luyện ngẫu nhiên)
    h += '<div id="tab-panel-tien-bo"' + (dsTab === 'tien_bo' ? '' : ' class="an"') + '>';

        h += '<div class="thongbao canh" style="margin:0 0 12px">' + ICONS.tt + '<div><b>Lưu ý chuyên cần:</b> ' +

          '</div></div>';
      }
    }
    h += '<section class="prog-box">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<b style="font-size:15.5px">📈 Góc tiến bộ &amp; Phòng tự luyện thông minh</b>' +
        (soCauOnTap ? '<span class="chip ok">Ngân hàng ' + soCauOnTap + ' câu tự luyện</span>' : '') +
      '</div>' +
      '<div class="prog-grid">' +
        '<div class="prog-chart-card">' +
          '<div style="font-size:12.5px;font-weight:700;color:var(--mo)">Biểu đồ điểm cao nhất qua các đề gần đây</div>' +
          veBieuDoDiemSVG_(lsDiem) +
          (baiHaySai.length
            ? ('<div style="margin-top:4px"><div style="font-size:12px;font-weight:700;color:var(--mo);margin-bottom:5px">🎯 Chủ đề em hay nhầm (bấm để luyện riêng):</div>' +
                '<div style="display:flex;flex-wrap:wrap;gap:6px">' + baiHaySai.map(function (b) {
                  const tenGoc = String(b.ten || (b.bai === 'MD' ? 'Mở đầu' : ('Bài ' + b.bai))).trim();
                  const tenNgan = tenGoc.replace(/^Bài\s+\S+\s*[.:–-]\s*/i, '').trim();
                  const nhanBai = b.bai === 'MD' ? 'Mở đầu' : ('Bài ' + b.bai);
                  const soSai = b.soSai != null ? b.soSai : (b.sai != null ? b.sai : 0);
                  const hienTen = tenNgan && tenNgan.toLowerCase() !== nhanBai.toLowerCase()
                    ? (nhanBai + ': ' + (tenNgan.length > 26 ? tenNgan.slice(0, 24) + '…' : tenNgan))
                    : nhanBai;
                  return '<button type="button" class="weak-chip" data-luyen-bai="' + esc(b.bai) + '" title="' + esc(tenGoc) + '">⚡ ' + esc(hienTen) + ' (' + soSai + ' câu)</button>';

            : '<div class="phu" style="font-size:12px">Chưa phát hiện bài nào hay sai — phong độ rất tốt!</div>') +
        '</div>' +
        '<div class="prog-prac-card">' +
          '<div>' +
            '<b style="font-size:14.5px;color:var(--tim)">⚡ Tự luyện ngẫu nhiên (chấm ngay)</b>' +
            '<p class="phu" style="margin:4px 0 8px;font-size:12.5px">Rút ngẫu nhiên câu hỏi từ các đề đã hết hạn để ôn phản xạ trước kiểm tra, không ảnh hưởng điểm trên lớp.</p>' +
            '<div class="truong" style="margin-bottom:8px"><label for="tl-pham-vi" style="font-size:11.5px">Chọn phạm vi ôn tập</label>' +
              '<select id="tl-pham-vi">' +
                (baiHaySai.length ? '<option value="__HAY_SAI__">🔥 Ưu tiên các bài em hay sai</option>' : '') +
                '<option value="">📚 Tất cả đề đã hết hạn</option>' +
                mucLuc.map(c => '<option value="' + esc(c.id) + '">' + esc(c.ten) + '</option>').join('') +
              '</select></div>' +
            '<div class="truong"><label for="tl-so-cau" style="font-size:11.5px">Số lượng câu</label>' +
              '<select id="tl-so-cau"><option value="10">10 câu nhanh (~5 phút)</option><option value="15">15 câu chuẩn (~10 phút)</option><option value="20">20 câu tổng hợp</option></select></div>' +
          '</div>' +
          '<button type="button" class="nut chinh rong" id="btn-tu-luyen"' + (soCauOnTap ? '' : ' disabled') + '>' +
            (soCauOnTap ? '⚡ Bắt đầu tự luyện ngay →' : 'Chờ có đề hết hạn để mở kho luyện') +
          '</button>' +
        '</div>' +
      '</div>' +

    h += '</div>';

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));
    $('#doi-ten').onclick = function () {
      clearTimeout(henLuu); henLuu = null;
      lam = null;
      dungDongHo();
      kho.xoa(KHOA_HS);
      kho.xoa(KHOA_NHAP);
      dsDeCache = null;
      dsTab = 'btvn';
      hs = null;
      manNhapTen();
    };
    app.querySelectorAll('[data-ds-tab]').forEach(function (b) {
      b.onclick = function () {
        dsTab = b.getAttribute('data-ds-tab') === 'tien_bo' ? 'tien_bo' : 'btvn';
        app.querySelectorAll('[data-ds-tab]').forEach(function (x) {
          const on = x.getAttribute('data-ds-tab') === dsTab;
          x.classList.toggle('on', on);
          x.setAttribute('aria-selected', on ? 'true' : 'false');

        const p1 = $('#tab-panel-btvn'), p2 = $('#tab-panel-tien-bo');
        if (p1) p1.classList.toggle('an', dsTab !== 'btvn');
        if (p2) p2.classList.toggle('an', dsTab !== 'tien_bo');
      };
    });
    const ldtk = $('#loc-de-tk');
    if (ldtk) {
      ldtk.oninput = function () {
        locDe.tk = this.value;
        capNhatDsDeList_();
      };
    }
    const blb = $('#bo-loc-bai');
    if (blb) {
      blb.onclick = function () {
        locDe.bai = '';
        blb.remove();
        capNhatDsDeList_();
      };
    }
    const btnTuLuyen = $('#btn-tu-luyen');
    if (btnTuLuyen) {
      btnTuLuyen.onclick = function () {
        const pv = ($('#tl-pham-vi') && $('#tl-pham-vi').value) || '';
        const sc = Number(($('#tl-so-cau') && $('#tl-so-cau').value) || 10);
        if (pv === '__HAY_SAI__') {
          batDauTuLuyen({ soCau: sc, uuTienHaySai: true });
        } else {
          batDauTuLuyen({ soCau: sc, bai: pv });
        }
      };
    }
    app.querySelectorAll('[data-luyen-bai]').forEach(function (b) {
      b.onclick = function () { batDauTuLuyen({ soCau: 10, bai: b.getAttribute('data-luyen-bai') }); };
    });
    app.querySelectorAll('[data-ld-tt]').forEach(function (b) {
      b.onclick = function () {
        locDe.tt = b.getAttribute('data-ld-tt');
        app.querySelectorAll('[data-ld-tt]').forEach(function (x) {
          x.classList.toggle('on', x.getAttribute('data-ld-tt') === locDe.tt);
        });
        capNhatDsDeList_();
      };
    });
    ganSuKienNutDe_(app);
  }

  // ---------- 3. Làm bài ----------
  function batDau(deId) {
    if (!hs || !hs.khoa) return manNhapTen('');
    dangNop = false;
    manHienTai = 'lamBai';
    const khoaReq = hs.khoa;
    const nhap = kho.lay(KHOA_NHAP);
    if (nhap && nhap.de && nhap.de.id === deId && nhap.khoa === khoaReq) {
      const quaLau = !nhap.batDau || (Date.now() - nhap.batDau > 5.75 * 3600 * 1000);
      if (!quaLau) { lam = nhap; return veLamBai(); }
      const tlCu = nhap.traLoi || {};
      const coCu = nhap.co || {};
      dangTai('Đang làm mới phiên làm bài...');
      api('hsBatDau', khoaReq, deId).then(function (r) {
        if (!hs || hs.khoa !== khoaReq || manHienTai !== 'lamBai') return;
        const giu = {};
        r.cau.forEach(function (c) { if (tlCu[c.id] !== undefined && tlCu[c.id] !== '') giu[c.id] = tlCu[c.id]; });
        lam = { token: r.token, batDau: Date.now(), de: r.de, cau: r.cau, traLoi: giu, co: coCu, khoa: khoaReq };
        kho.dat(KHOA_NHAP, lam);
        veLamBai();
        if (Object.keys(giu).length) alertNho('Phiên cũ gần hết 6 tiếng nên hệ thống đã cấp phiên mới và giữ nguyên ' + Object.keys(giu).length + ' câu em đã làm.');
      }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
      return;
    }
    dangTai('Đang lấy đề...');
    api('hsBatDau', khoaReq, deId).then(function (r) {
      if (!hs || hs.khoa !== khoaReq || manHienTai !== 'lamBai') return;
      lam = { token: r.token, batDau: Date.now(), de: r.de, cau: r.cau, traLoi: {}, co: {}, khoa: khoaReq };
      kho.dat(KHOA_NHAP, lam);
      veLamBai();
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }
  function alertNho(m) {
    if (!m) return;
    app.querySelectorAll('.thongbao.alert-nho').forEach(function (el) { el.remove(); });
    const d = document.createElement('div');
    d.className = 'thongbao loi alert-nho';
    d.setAttribute('role', 'alert');
    d.textContent = m;
    app.prepend(d);
  }

  const TEN_LOAI = { tn: 'Nhiều lựa chọn', ds: 'Đúng / Sai', so: 'Trả lời ngắn', chu: 'Trả lời ngắn' };
  function nhomPhan(loai, thangDiemDS) {
    if (loai === 'tn') return { key: 'I', ten: 'Phần I. Câu trắc nghiệm nhiều lựa chọn', moTa: 'Chọn 1 đáp án đúng' };
    if (loai === 'ds') {
      const luyTien = thangDiemDS === 'luy_tien';
      return { key: 'II', ten: 'Phần II. Câu trắc nghiệm đúng sai', moTa: luyTien ? '1–2–3–4 ý đúng: 0,1 · 0,25 · 0,5 · 1,0 câu' : 'Mỗi ý đúng được 0,25 câu' };
    }
    return { key: 'III', ten: 'Phần III. Câu trắc nghiệm trả lời ngắn', moTa: 'Điền số hoặc công thức / từ ngắn' };
  }
  function cauDaXong(c) {
    const tl = lam.traLoi[c.id];
    if (c.loai === 'ds') return Array.isArray(tl) && tl.filter(v => v === true || v === false).length === 4;
    return tl !== undefined && tl !== null && tl !== '';
  }

  const SYM_NHANH = ['[Ar] ', '[Ne] ', '+', '-', '(', ')', '→', '⇌', '°C'];
  function veSymBarHtml_(idn) {
    return '<div class="sym-bar"><span class="phu" style="font-size:11.5px">Chèn nhanh:</span>' +
      SYM_NHANH.map(function (sy) {
        return '<button type="button" class="sym-btn" data-sym-for="' + esc(idn) + '" data-sym="' + esc(sy) + '">' + esc(sy.trim() || sy) + '</button>';
      }).join('') +
    '</div>';
  }
  function ganSuKienSymBar_(scope) {
    if (!scope) return;
    scope.querySelectorAll('[data-sym-for]').forEach(function (btn) {
      btn.onclick = function () {
        const inp = document.getElementById(btn.getAttribute('data-sym-for'));
        if (!inp || inp.disabled) return;
        const sy = btn.getAttribute('data-sym') || '';
        const st = typeof inp.selectionStart === 'number' ? inp.selectionStart : inp.value.length;
        const en = typeof inp.selectionEnd === 'number' ? inp.selectionEnd : inp.value.length;
        inp.value = inp.value.slice(0, st) + sy + inp.value.slice(en);
        inp.focus();
        try { inp.setSelectionRange(st + sy.length, st + sy.length); } catch (e) {}
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      };
    });
  }

  function datCauKbd_(cauIdx) {
    kbdCauIdx = cauIdx;
    app.querySelectorAll('.cau-hs').forEach(function (el) {
      el.classList.toggle('active-kbd', Number(el.getAttribute('data-cau-idx')) === cauIdx);
    });
  }

  function veLamBai() {
    manHienTai = 'lamBai';
    cuon();
    document.body.classList.add('dang-lam');
    if (!lam.co) lam.co = {};
    if (typeof lam.roiTab !== 'number') lam.roiTab = 0;
    kbdCauIdx = -1;
    locCauThi = 'tat_ca';
    const chDe = (lam.de && lam.de.cauHinh) || {};
    const phutLam = Number(chDe.phutLam) || 0;
    const luoiNutSo = lam.cau.map((c, i) => '<button type="button" class="o-so' + (lam.co[c.id] ? ' co-flag' : '') + '" data-den="' + i + '">' + (i + 1) + '</button>').join('');
    let h = '<div class="thanh-lam">' +
      '<div class="hang">' +
        '<button type="button" class="nut nho" id="quay" aria-label="Quay lại">←</button>' +
        '<span class="tieu-de" title="' + esc(lam.de.ten) + '">' + esc(lam.de.ten) + '</span>' +
        '<button type="button" class="nut nho" id="loc-chua-xong" title="Chỉ hiện câu chưa làm hoặc đang cắm cờ">🚩</button>' +
        '<button type="button" class="nut nho" id="toggle-muc" title="Chuyển nhanh câu hỏi">' + ICONS.grid + '</button>' +
        '<span class="dong-ho" id="gio">00:00</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mo);margin-top:6px"><span id="da-lam"></span><span>' +
        (phutLam > 0 ? ('⏱️ Giới hạn ' + phutLam + ' phút · ') : '') +
        (lam.de.hetHan ? 'Luyện tập (hết hạn)' : 'Hạn ' + han(lam.de.han)) +
      '</span></div>' +
      '<div class="vach"><div id="vach" style="width:0"></div></div>' +
      '<div class="lam-nav-drawer an" id="lam-drawer">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<span style="font-size:12px;font-weight:700;color:var(--mo)">Chuyển nhanh đến câu (chấm cam = cắm cờ)</span>' +
          '<button type="button" class="nut nho" id="dong-lam-drawer">Đóng</button>' +
        '</div>' +
        '<div class="luoi-so">' + luoiNutSo + '</div>' +
      '</div>' +
    '</div>';

    h += '<div class="exam-layout"><div class="exam-main">';
    let phanTruoc = '';
    lam.cau.forEach(function (c, i) {
      const p = nhomPhan(c.loai, chDe.thangDiemDS);
      if (p.key !== phanTruoc) {
        phanTruoc = p.key;
        h += '<div class="phan-head" data-phan="' + esc(p.key) + '"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
      }
      const tl = lam.traLoi[c.id];
      const daCo = !!lam.co[c.id];
      h += '<div class="the cau-hs' + (daCo ? ' co-flag' : '') + '" id="cau-' + i + '" data-cau-idx="' + i + '" data-phan="' + esc(p.key) + '" data-cid="' + esc(c.id) + '">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
          '<span class="chip chinh">Câu ' + (i + 1) + '</span>' +
          '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
          '<button type="button" class="nut-flag' + (daCo ? ' on' : '') + '" data-flag="' + esc(c.id) + '" title="Đánh dấu xem lại câu này (Phím F)">🚩 ' + (daCo ? 'Đã đánh dấu' : 'Xem lại') + '</button>' +
        '</div>' +
        '<div class="noi-dung">' + md(c.cauHoi) + '</div>';
      if (c.loai === 'tn') {
        const ngan = (c.luaChon || []).every(o => String(o.t || '').length <= 68);
        h += '<div class="lua-chon' + (ngan ? ' grid-2' : '') + '" role="group" aria-label="Các lựa chọn câu ' + (i + 1) + '">';
        c.luaChon.forEach(function (o, j) {
          h += '<button type="button" class="lc" data-q="' + esc(c.id) + '" data-k="' + o.k + '" aria-pressed="' + (tl === o.k ? 'true' : 'false') + '">' +
            '<span class="chu-cai">' + 'ABCD'.charAt(j) + '</span><span>' + md(o.t) + '</span></button>';
        });
        h += '</div>';
      } else if (c.loai === 'ds') {
        const arr = Array.isArray(tl) ? tl : [null, null, null, null];
        h += '<div class="ds-list" role="group" aria-label="Các mệnh đề câu ' + (i + 1) + '">';
        (c.luaChon || []).forEach(function (txt, j) {
          const v = arr[j];
          h += '<div class="ds-row">' +
            '<span class="ds-key">' + 'abcd'.charAt(j) + ')</span>' +
            '<span class="ds-txt">' + md(txt) + '</span>' +
            '<div class="ds-tog">' +
              '<button type="button" class="ds-btn" data-q="' + esc(c.id) + '" data-idx="' + j + '" data-v="1" aria-pressed="' + (v === true ? 'true' : 'false') + '">Đúng</button>' +
              '<button type="button" class="ds-btn" data-q="' + esc(c.id) + '" data-idx="' + j + '" data-v="0" aria-pressed="' + (v === false ? 'true' : 'false') + '">Sai</button>' +
            '</div></div>';
        });
        h += '</div>';
      } else {

  // Phím tắt Esc đóng modal/bản đồ câu & Phím tắt làm bài trên Máy tính (A/B/C/D hoặc 1–4 chọn đáp án, F cắm cờ, J/K hoặc ↓/↑ chuyển câu)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (document.getElementById('h10-ref-modal') || document.querySelector('.h10-img-zoom')) return;
      if ($('#hop-xn') && !$('#hop-xn').classList.contains('an')) {
        e.preventDefault();
        dongHopXn_();
        return;
      }
      if (dangMoDrawerCau_()) {
        e.preventDefault();
        dongDrawerCau_();
        return;
      }
      return;
    }
    if (!lam || manHienTai !== 'lamBai' || !document.body.classList.contains('dang-lam')) return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.isComposing || e.keyCode === 229) return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (document.getElementById('h10-ref-modal') || document.querySelector('.h10-img-zoom') || !$('#hop-xn').classList.contains('an') || dangMoDrawerCau_()) return;

    const cards = Array.prototype.slice.call(app.querySelectorAll('.cau-hs:not(.an)'));
    if (!cards.length) return;
    let curPos = cards.findIndex(function (el) { return Number(el.getAttribute('data-cau-idx')) === kbdCauIdx; });
    if (curPos < 0) {
      const mid = window.innerHeight * 0.36;
      let minDist = 1e9;
      cards.forEach(function (el, i) {
        const r = el.getBoundingClientRect();
        const d = Math.abs(r.top - mid);
        if (d < minDist) { minDist = d; curPos = i; }
      });
    }

    const k = e.key.toUpperCase();
    if (k === 'F') {
      const card = cards[curPos];
      if (!card) return;
      datCauKbd_(Number(card.getAttribute('data-cau-idx')));
      const fBtn = card.querySelector('[data-flag]');
      if (fBtn) { e.preventDefault(); fBtn.click(); }
      return;
    }
    if (k === 'J' || e.key === 'ArrowDown') {
      e.preventDefault();
      const nextPos = Math.min(cards.length - 1, curPos + 1);
      const nextCard = cards[nextPos];
      if (nextCard) {
        datCauKbd_(Number(nextCard.getAttribute('data-cau-idx')));
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }
    if (k === 'K' || e.key === 'ArrowUp') {
      e.preventDefault();
      const prevPos = Math.max(0, curPos - 1);
      const prevCard = cards[prevPos];
      if (prevCard) {
        datCauKbd_(Number(prevCard.getAttribute('data-cau-idx')));
        prevCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }
    const mapABCD = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, '1': 0, '2': 1, '3': 2, '4': 3 };
    if (mapABCD[k] !== undefined) {
      const card = cards[curPos];
      if (!card) return;
      datCauKbd_(Number(card.getAttribute('data-cau-idx')));
      const btns = card.querySelectorAll('.lc');
      if (btns && btns[mapABCD[k]]) {
        e.preventDefault();
        btns[mapABCD[k]].click();
      }
    }
  });

  function capNhatCacheSauNop_(deId, kq) {

  // ---------- 4. Kết quả ----------
  function chuanKeyDapAn_(html) {
    const mapSub = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
    const mapSup = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁺': '+', '⁻': '-' };
    return String(html || '')
      .replace(/<sub>([\s\S]*?)<\/sub>/gi, '_{$1}')
      .replace(/<sup>([\s\S]*?)<\/sup>/gi, '^{$1}')
      .replace(/[₀-₉]+/g, function (m) {
        return '_{' + m.split('').map(function (c) { return mapSub[c] || c; }).join('') + '}';
      })
      .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, function (m) {
        return '^{' + m.split('').map(function (c) { return mapSup[c] || c; }).join('') + '}';
      })
      .replace(/[−–]/g, '-')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function hienDapAn_(raw, loai) {
    const s = String(raw === null || raw === undefined ? '' : raw);
    if (loai === 'tn' || loai === 'ds' || s.indexOf(' / ') < 0) return md(s);
    const parts = s.split(/\s+\/\s+/);
    const seenHtml = {};
    const seenKey = {};
    const out = [];
    parts.forEach(function (p) {
      const t = p.trim();
      if (!t) return;
      const rendered = md(t);
      const key = chuanKeyDapAn_(rendered);
      if (seenHtml[rendered] || (key && seenKey[key])) return;
      seenHtml[rendered] = true;
      if (key) seenKey[key] = true;
      out.push(rendered);
    });
    return out.length ? out.join(' / ') : md(s);
  }

  function hienTraLoi(c, tl) {
    if (c.loai === 'ds') {
      if (!Array.isArray(tl) || !tl.some(v => v === true || v === false)) return '<em>(bỏ trống)</em>';
      return tl.slice(0, 4).map((v, j) => 'abcd'.charAt(j) + ') ' + (v === true ? 'Đúng' : (v === false ? 'Sai' : '–'))).join(' · ');
    }
    if (tl === undefined || tl === null || tl === '') return '<em>(bỏ trống)</em>';
    if (c.loai === 'tn') {
      const o = c.luaChon.find(x => x.k === Number(tl));
      return o ? md(o.t) : esc(tl);
    }
    return md(tl);
  }

  function veDsChiTiet(luaChon, tlArr, daArr) {
    let s = '<div class="ds-list">';
    (luaChon || []).forEach(function (txt, j) {
      const da = daArr ? daArr[j] : null;
      const chon = Array.isArray(tlArr) ? tlArr[j] : null;
      let cls = '', note = '';
      if (daArr) {
        const coChon = chon === true || chon === false;
        const dung = coChon && chon === da;
        if (tlArr !== undefined) {
          cls = dung ? ' dung' : ' sai';
          note = '<span class="ds-note" style="color:' + (dung ? 'var(--ok)' : 'var(--loi)') + '">' +
            (coChon ? ('Chọn: ' + (chon ? 'Đ' : 'S') + ' · ') : 'Bỏ trống · ') +
            'Đáp án: ' + (da ? 'Đúng' : 'Sai') + '</span>';
        } else {
          cls = da ? ' dung' : '';
          note = '<span class="ds-note" style="color:' + (da ? 'var(--ok)' : 'var(--mo)') + '">' + (da ? 'Đúng' : 'Sai') + '</span>';
        }
      }
      s += '<div class="ds-row' + cls + '"><span class="ds-key">' + 'abcd'.charAt(j) + ')</span><span class="ds-txt">' + md(txt) + '</span>' + note + '</div>';
    });
    return s + '</div>';
  }

            });

          if (p.key !== phanTruoc) {
            phanTruoc = p.key;
            h += '<div class="phan-head"><span>' + esc(p.ten) + '</span><small>' + esc(p.moTa) + '</small></div>';
          }
          const dCau = c.diemCau !== undefined ? Number(c.diemCau) : (c.dung ? 1 : 0);
          const laMotPhan = c.loai === 'ds' && dCau > 0 && dCau < 1;
          const borderCol = c.dung ? 'var(--ok)' : (laMotPhan ? 'var(--canh)' : 'var(--loi)');
          const chipCls = c.dung ? 'ok' : (laMotPhan ? 'canh' : 'loi');
          const chipTxt = c.dung ? ' · Đúng' : (laMotPhan ? (' · Đúng một phần (' + soDung(dCau) + ' câu)') : ' · Sai');
          h += '<div class="the" id="xbc-' + i + '" style="border-left:4px solid ' + borderCol + '">' +
            '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
              '<span class="chip ' + chipCls + '">Câu ' + (i + 1) + chipTxt + '</span>' +
              '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
            '</div>' +
            '<div class="noi-dung">' + md(c.cauHoi) + '</div>';

          if (c.loai === 'tn' && c.luaChon) {
            c.luaChon.forEach(function (t, j) {
              const laDung = j === c.dapAnIdx;
              const laChon = c.tl !== null && c.tl !== undefined && Number(c.tl) === j;
              const cls = laDung ? ' dung' : (laChon ? ' sai-chon' : '');
              h += '<div class="lc-xem' + cls + '">' + 'ABCD'.charAt(j) + '. ' + md(t) +
                (laDung ? ' ✓' : (laChon ? ' (em chọn)' : '')) + '</div>';
            });
          } else if (c.loai === 'ds' && c.luaChon) {
            h += veDsChiTiet(c.luaChon, c.tl, c.dapAnDs);
          } else {
            const tlHien = (c.tl === null || c.tl === undefined || c.tl === '') ? '<em>(bỏ trống)</em>' : md(c.tl);
            h += '<div class="phu" style="font-size:13.5px;margin-bottom:6px">Em trả lời: <b style="color:' + (c.dung ? 'var(--ok)' : 'var(--loi)') + '">' + tlHien + '</b></div>';
          }
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + hienDapAn_(c.dapAn, c.loai) + '</div>' + (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div></div>';
        });

        if (!demHien) h += '<div class="the" style="text-align:center"><p class="phu" style="margin:0">Không có câu hỏi nào trong mục lọc này.</p></div>';
        h += '<button type="button" class="nut chinh rong" style="margin-top:14px" id="ve2">Về danh sách</button>';
        h += '<div id="slogan-slot"></div>';
        app.innerHTML = h;
        renderSlogan(document.getElementById('slogan-slot'));
        $('#ve').onclick = manDanhSach; $('#ve2').onclick = manDanhSach;
        const cl = $('#chon-lan'); if (cl) cl.onchange = function () { xemBaiCu(deId, this.value); };
        app.querySelectorAll('[data-lx]').forEach(b => b.onclick = function () { locXem = b.getAttribute('data-lx'); ve(); });
        app.querySelectorAll('[data-jump-cu]').forEach(b => b.onclick = function () {
          if (locXem !== 'tat_ca') { locXem = 'tat_ca'; ve(); }
          const el = $('#xbc-' + b.getAttribute('data-jump-cu'));
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        const blsc = $('#btn-luyen-sai-cu');
        if (blsc) blsc.onclick = function () { veLuyenTap('Luyện lại câu chưa đúng · ' + r.ten, dsCauSai); };
      }
      ve();
    }).catch(function (e) { const m = baoLoi(e); if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 400); } });
  }

  // ---------- 6. Phòng Tự Luyện & Luyện Lại Câu Sai (chấm tức thì tại máy) ----------
  function tronMang_(arr) {
    const a = (arr || []).slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function chuanCauLuyenTap_(c) {
    const o = {
      id: c.id,
      loai: c.loai,
      bai: c.bai || '',
      cauHoi: c.cauHoi,
      dapAnHien: c.dapAnHien || c.dapAn || '',
      loiGiai: c.loiGiai || ''
    };
    if (c.loai === 'tn') {
      const goc = Array.isArray(c.luaChon) ? c.luaChon.map(function (it, idx) {
        return (it && typeof it === 'object' && 'k' in it) ? { k: Number(it.k), t: it.t } : { k: idx, t: String(it) };
      }) : [];
      o.luaChon = tronMang_(goc);
      o.dapAnK = c.dapAnK !== undefined && c.dapAnK !== null ? Number(c.dapAnK) : Number(c.dapAnIdx);
    } else if (c.loai === 'ds') {
      o.luaChon = Array.isArray(c.luaChon) ? c.luaChon.slice() : [];
      o.dapAnDs = Array.isArray(c.dapAnDs) ? c.dapAnDs.slice() : [false, false, false, false];
    } else if (c.loai === 'so') {
      o.dapAnSo = String(c.dapAnSo !== undefined && c.dapAnSo !== null ? c.dapAnSo : (c.dapAn || ''));
      o.saiSo = Math.abs(Number(c.saiSo) || 0);
    } else {
      o.chapNhan = Array.isArray(c.chapNhan) && c.chapNhan.length ? c.chapNhan : [String(c.dapAn || '')];
      o.phanBietHoa = !!c.phanBietHoa;
    }
    return o;
  }

  function chamCauLuyen_(c, tl) {
    if (tl === undefined || tl === null || String(tl).trim() === '') return 0;
    if (c.loai === 'tn') return Number(tl) === Number(c.dapAnK) ? 1 : 0;
    if (c.loai === 'ds') {
      if (!Array.isArray(tl)) return 0;
      let dungY = 0;
      for (let i = 0; i < 4; i++) {
        if ((tl[i] === true || tl[i] === false) && tl[i] === c.dapAnDs[i]) dungY++;
      }
      return dungY * 0.25;
    }
    if (c.loai === 'so') {
      const a = parseFloat(String(tl).trim().replace(/\s+/g, '').replace(',', '.'));
      const b = parseFloat(String(c.dapAnSo).trim().replace(/\s+/g, '').replace(',', '.'));
      if (isNaN(a) || isNaN(b)) return 0;
      const ss = c.saiSo > 0 ? c.saiSo : Math.max(1e-9, Math.abs(b) * 0.005);
      return Math.abs(a - b) <= ss + 1e-9 ? 1 : 0;
    }
    const chuan = function (s) {
      let x = String(s || '').trim().replace(/\s+/g, ' ').replace(/[−–]/g, '-');
      return c.phanBietHoa ? x : x.toLowerCase();
    };
    const u = chuan(tl);
    return (c.chapNhan || []).some(d => chuan(d) === u) ? 1 : 0;
  }

  function batDauTuLuyen(opts) {
    thoatTamLamBai_();
    if (!hs || !hs.khoa) return manNhapTen('');
    manHienTai = 'luyenTap';
    const khoaReq = hs.khoa;
    dangTai('Đang rút đề tự luyện ngẫu nhiên...');
    api('hsLayDeTuLuyen', khoaReq, opts || {}).then(function (r) {
      if (!hs || hs.khoa !== khoaReq || manHienTai !== 'luyenTap') return;
      if (!r || !Array.isArray(r.cau) || !r.cau.length) {
        manDanhSach();
        setTimeout(() => alertNho('Chưa có câu hỏi phù hợp trong các đề đã hết hạn để tạo bài tự luyện.'), 300);
        return;
      }
      veLuyenTap(r.ten || 'Phòng tự luyện Hóa 10', r.cau);
    }).catch(function (e) {
      const m = baoLoi(e);
      if (typeof m === 'string') { manDanhSach(); setTimeout(() => alertNho(m), 350); }
    });
  }

  function veLuyenTap(tieuDe, dsGoc) {
    thoatTamLamBai_();
    manHienTai = 'luyenTap';
    cuon();
    document.body.classList.add('dang-lam', 'dang-luyen');
    const dsCau = (dsGoc || []).map(chuanCauLuyenTap_);
    const tlMap = {};
    const daKiem = {};
    let daChamHet = false;

    function ve() {
      let tongDiem = 0;
      dsCau.forEach(c => { tongDiem += chamCauLuyen_(c, tlMap[c.id]); });
      const diem10 = dsCau.length ? Math.round((tongDiem / dsCau.length) * 100) / 10 : 0;

      let h = '<div class="hero-box art-atom">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<button type="button" class="nut nho" id="lt-ve">← Về danh sách</button>' +
          '<div class="hang-nut">' +
            '<button type="button" class="nut nho tim" id="lt-tron">🔀 Trộn làm lại</button>' +
          '</div>' +
        '</div>' +
        '<h1 style="margin-top:8px">' + esc(tieuDe) + '</h1>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">' +
          '<span class="chip tim">⚡ Chế độ tự luyện · Không giới hạn</span>' +
          '<span class="chip">' + dsCau.length + ' câu</span>' +
          (daChamHet ? ('<span class="chip ok">Kết quả: ' + diem(diem10) + '/10 (' + soDung(tongDiem) + '/' + dsCau.length + ' câu)</span>') : '') +
        '</div>' +
      '</div>';

      dsCau.forEach(function (c, i) {
        const tl = tlMap[c.id];
        const hienGiai = !!(daChamHet || daKiem[c.id]);
        const dCau = hienGiai ? chamCauLuyen_(c, tl) : null;
        const borderStyle = !hienGiai ? '' : ('border-left:4px solid ' + (dCau >= 1 - 1e-9 ? 'var(--ok)' : (dCau > 0 ? 'var(--canh)' : 'var(--loi)')));

        h += '<div class="the cau-hs" style="' + borderStyle + '">' +
          '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">' +
            '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
              '<span class="chip ' + (!hienGiai ? 'chinh' : (dCau >= 1 - 1e-9 ? 'ok' : (dCau > 0 ? 'canh' : 'loi'))) + '">Câu ' + (i + 1) + (!hienGiai ? '' : (dCau >= 1 - 1e-9 ? ' · Đúng ✓' : (dCau > 0 ? ' · Đúng ' + soDung(dCau) : ' · Chưa đúng'))) + '</span>' +
              '<span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span>' +
              (c.bai ? '<span class="chip tim">Bài ' + esc(c.bai) + '</span>' : '') +
            '</div>' +
            (!hienGiai ? '<button type="button" class="nut nho vien" data-kt-cau="' + esc(c.id) + '">Kiểm tra câu này</button>' : '') +
          '</div>' +
          '<div class="noi-dung">' + md(c.cauHoi) + '</div>';

        if (c.loai === 'tn') {
          const ngan = (c.luaChon || []).every(o => String(o.t || '').length <= 68);
          h += '<div class="lua-chon' + (ngan ? ' grid-2' : '') + '">';
          c.luaChon.forEach(function (o, j) {
            const dangChon = tl === o.k;
            let extraStyle = '';
            if (hienGiai) {
              if (o.k === c.dapAnK) extraStyle = 'border-color:var(--ok);background:var(--dung-n);';
              else if (dangChon) extraStyle = 'border-color:var(--loi);background:var(--sai-n);';
            }
            h += '<button type="button" class="lc" style="' + extraStyle + '" data-lt-q="' + esc(c.id) + '" data-k="' + o.k + '" aria-pressed="' + (dangChon ? 'true' : 'false') + '"' + (hienGiai ? ' disabled' : '') + '>' +
              '<span class="chu-cai">' + 'ABCD'.charAt(j) + '</span><span>' + md(o.t) + '</span></button>';
          });
          h += '</div>';
        } else if (c.loai === 'ds') {
          if (hienGiai) {
            h += veDsChiTiet(c.luaChon, tl, c.dapAnDs);
          } else {
            const arr = Array.isArray(tl) ? tl : [null, null, null, null];
            h += '<div class="ds-list">';
            (c.luaChon || []).forEach(function (txt, j) {
              const v = arr[j];
              h += '<div class="ds-row"><span class="ds-key">' + 'abcd'.charAt(j) + ')</span><span class="ds-txt">' + md(txt) + '</span>' +
                '<div class="ds-tog">' +
                  '<button type="button" class="ds-btn" data-lt-ds="' + esc(c.id) + '" data-idx="' + j + '" data-v="1" aria-pressed="' + (v === true ? 'true' : 'false') + '">Đúng</button>' +
                  '<button type="button" class="ds-btn" data-lt-ds="' + esc(c.id) + '" data-idx="' + j + '" data-v="0" aria-pressed="' + (v === false ? 'true' : 'false') + '">Sai</button>' +
                '</div></div>';
            });
            h += '</div>';
          }
        } else {
          const idn = 'lt-inp-' + i;
          h += '<div class="truong"><input id="' + idn + '" class="o-tra-loi" type="text" ' + (c.loai === 'so' ? 'inputmode="decimal" placeholder="Nhập con số..."' : 'placeholder="Nhập công thức / câu trả lời ngắn..."') + ' data-lt-inp="' + esc(c.id) + '" value="' + esc(tl || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false"' + (hienGiai ? ' disabled' : '') + '></div>' +
            (!hienGiai && c.loai !== 'so' ? veSymBarHtml_(idn) : '');
        }

        if (hienGiai) {
          h += '<div class="dap-an-box"><div class="d">Đáp án: ' + hienDapAn_(c.dapAnHien, c.loai) + '</div>' +
            (c.loiGiai ? '<div style="margin-top:4px">' + md(c.loiGiai) + '</div>' : '') + '</div>';
        }
        h += '</div>';
      });

      h += '<div class="hang-nut" style="margin-top:14px">' +
        (!daChamHet ? '<button type="button" class="nut chinh to" style="flex:2" id="lt-cham-het">✓ Chấm toàn bộ ' + dsCau.length + ' câu</button>' : '<button type="button" class="nut chinh to" style="flex:2" id="lt-lam-lai-2">🔁 Trộn &amp; Luyện lại lần nữa</button>') +
        '<button type="button" class="nut to" style="flex:1" id="lt-ve-2">Về danh sách</button>' +
      '</div><div id="slogan-slot"></div>';

      app.innerHTML = h;
      renderSlogan(document.getElementById('slogan-slot'));

      const thoat = function () { document.body.classList.remove('dang-lam', 'dang-luyen'); manDanhSach(); };
      $('#lt-ve').onclick = thoat;
      $('#lt-ve-2').onclick = thoat;
      const tronLai = function () { veLuyenTap(tieuDe, tronMang_(dsGoc)); };
      $('#lt-tron').onclick = tronLai;
      const ll2 = $('#lt-lam-lai-2'); if (ll2) ll2.onclick = tronLai;

      app.querySelectorAll('[data-lt-q]').forEach(function (b) {
        b.onclick = function () {
          const q = b.getAttribute('data-lt-q'), k = Number(b.getAttribute('data-k'));
          tlMap[q] = k;
          b.parentNode.querySelectorAll('.lc').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        };
      });
      app.querySelectorAll('[data-lt-ds]').forEach(function (b) {
        b.onclick = function () {
          const q = b.getAttribute('data-lt-ds'), idx = Number(b.getAttribute('data-idx')), val = b.getAttribute('data-v') === '1';
          if (!Array.isArray(tlMap[q])) tlMap[q] = [null, null, null, null];
          tlMap[q][idx] = val;
          b.parentNode.querySelectorAll('.ds-btn').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        };
      });
      app.querySelectorAll('[data-lt-inp]').forEach(function (inp) {
        inp.oninput = function () { tlMap[inp.getAttribute('data-lt-inp')] = inp.value; };
      });
      ganSuKienSymBar_(app);
      app.querySelectorAll('[data-kt-cau]').forEach(function (b) {
        b.onclick = function () {
          daKiem[b.getAttribute('data-kt-cau')] = true;
          const y = window.scrollY;
          ve();
          window.scrollTo(0, y);
        };
      });
      const chHet = $('#lt-cham-het');
      if (chHet) chHet.onclick = function () {
        daChamHet = true;
        cuon();
        ve();
        let td = 0; dsCau.forEach(c => { td += chamCauLuyen_(c, tlMap[c.id]); });
        if (dsCau.length && (td / dsCau.length) >= 0.8 && typeof phaoGiay === 'function') phaoGiay(90);
      };
    }
    ve();
  }

  // ---------- khởi động gộp 1 request (kèm Stale-While-Revalidate mở 0ms) ----------
  ganThanhDieuHuongHS('btvn', {});
  const khoaBoot = (hs && hs.khoa) ? hs.khoa : '';
  const cachedInit = docCacheUI('hs_init');
  const cachedDS0 = khoaBoot ? docCacheUI('hs_ds_' + khoaBoot) : null;
  if (cachedInit) {
    linkTrang = { webUrl: cachedInit.webUrl, trangChu: cachedInit.trangChu, caiDatTrang: cachedInit.caiDatTrang };
    hsList = cachedInit.hsList || [];
    veTopLinks();
    if (khoaBoot && cachedDS0 && cachedDS0.ten) {
      manHienTai = 'danhSach';
      veDanhSach(cachedDS0);
    } else if (!khoaBoot) {
      manNhapTen('');
    } else {
      manHienTai = 'danhSach';
      dangTai('Đang mở lớp Hóa 10...');
    }
  } else {
    manHienTai = khoaBoot ? 'danhSach' : 'chonHS';
    dangTai('Đang mở lớp Hóa 10...');
  }

  api('hsKhoiDong', khoaBoot).then(function (res) {
    linkTrang = { webUrl: res.webUrl, trangChu: res.trangChu, caiDatTrang: res.caiDatTrang };
    hsList = res.hsList || [];
    ghiCacheUI('hs_init', { webUrl: res.webUrl, trangChu: res.trangChu, caiDatTrang: res.caiDatTrang, hsList: hsList });
    veTopLinks();
    // Nếu trong lúc chờ mạng học sinh đã đổi sang tài khoản khác thì chỉ lưu cache cho tài khoản cũ rồi dừng
    const khoaHienTai = (hs && hs.khoa) ? hs.khoa : '';
    if (khoaHienTai !== khoaBoot) {
      if (khoaBoot && res.danhSach && res.danhSach.ten) ghiCacheUI('hs_ds_' + khoaBoot, res.danhSach);
      return;
    }
    if (khoaBoot && res.danhSach && res.danhSach.ten) {
      hs.ten = res.danhSach.ten; kho.dat(KHOA_HS, hs);
      ghiCacheUI('hs_ds_' + hs.khoa, res.danhSach);
      dsDeCache = res.danhSach;
      if (manHienTai === 'danhSach') {
        veDanhSach(res.danhSach);
      }
    } else {
      const coHsCu = !!hs;
      if (hs && hs.khoa) {
        clearTimeout(henLuu); henLuu = null; lam = null;
        xoaCacheUI_('hs_ds_' + hs.khoa);
        kho.xoa(KHOA_HS);
        kho.xoa(KHOA_NHAP);
        dsDeCache = null;
        hs = null;
      }
      if (coHsCu) {
        if (manHienTai === 'danhSach' || manHienTai === 'chonHS') {
          manNhapTen('Thầy đã cập nhật danh sách lớp. Em chọn hoặc nhập lại họ tên nhé.');
        }
      } else if (manHienTai === 'chonHS') {
        const dangGoTen = ($('#hoten') && $('#hoten').value) || ($('#loc-hs') && $('#loc-hs').value);
        if (!$('#f-ten') || !dangGoTen) manNhapTen('');
      }
    }
  }).catch(function (e) {
    if (manHienTai !== 'danhSach' && manHienTai !== 'chonHS') return;
    if (cachedInit && (cachedDS0 || !hs)) return;
    if (!laGAS) { linkTrang = { webUrl: '', trangChu: '', caiDatTrang: {} }; veTopLinks(); }
    const m = baoLoi(e);
    if (typeof m === 'string') {
      app.innerHTML = '<div class="thongbao loi">' + esc(m) + '</div><button class="nut chinh" type="button" onclick="location.reload()">Tải lại</button>';
    }
  });
})();
</script>
</body>
</html>
