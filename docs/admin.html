<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:site_name" content="Hóa 10 – Thầy Hoàng">
<meta property="og:title" content="Quản lý BTVN Hóa 10">
<meta property="og:description" content="Khu vực giáo viên.">
<meta property="og:url" content="https://hoangchu54.github.io/hoa10/admin.html">
<meta property="og:image" content="https://hoangchu54.github.io/hoa10/assets/icons/og-cover.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

</head>
<body>
<div id="goc"></div>

<!-- Modal xác nhận chung -->
<div id="hop" class="hopdn an" role="dialog" aria-modal="true" aria-labelledby="hop-chu">
  <div class="the">
    <p id="hop-chu" style="margin:0 0 14px;font-size:15px"></p>
    <div class="hang-nut" style="justify-content:flex-end">
      <button class="nut nho" id="hop-khong" type="button">Thôi</button>
      <button class="nut nho chinh" id="hop-co" type="button">Đồng ý</button>
    </div>
  </div>
</div>

<!-- Modal Cài đặt AI (Claude / Gateway ngoài) -->
<div id="cd-gem" class="hopdn an" role="dialog" aria-modal="true" aria-labelledby="cd-tieu">
  <div class="the vua" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="cd-tieu" style="margin:0;font-size:19px">Cài đặt AI (Claude / Gateway ngoài)</h2>
    <div class="truong">
      <label for="cd-format">Định dạng Gateway</label>
      <select id="cd-format">
        <option value="anthropic">Anthropic (/v1/messages · Mặc định cho Claude)</option>
        <option value="openai">OpenAI-compatible (/v1/chat/completions)</option>
      </select>
    </div>
    <div class="truong">
      <label for="cd-base">Base URL (Endpoint)</label>
      <div style="display:flex;gap:8px">
        <input id="cd-base" type="url" placeholder="https://api.anthropic.com" autocomplete="off" spellcheck="false" style="flex:1">
        <button type="button" class="nut nho" id="cd-base-mac" title="Đặt về api.anthropic.com">Mặc định</button>
      </div>
      <span class="phu" style="font-size:12px">Để mặc định <code>https://api.anthropic.com</code> hoặc dán Base URL gateway mua ngoài.</span>
    </div>
    <div class="truong">
      <label for="cd-key" id="cd-key-nhan">Khóa API</label>
      <input id="cd-key" type="password" autocomplete="off" placeholder="Dán API key (để trống = giữ khóa cũ)">
      <span class="phu" style="font-size:12px" id="cd-key-ghi">Dán khóa API từ Anthropic hoặc nhà cung cấp gateway.</span>
    </div>
    <div class="truong">
      <label for="cd-model">Mô hình</label>
      <div style="display:flex;gap:8px">
        <select id="cd-model" style="flex:1"><option>Đang tải danh sách...</option></select>
        <button type="button" class="nut nho" id="cd-tai" title="Tải lại danh sách model theo Base URL &amp; key">Tải lại</button>
      </div>
      <input id="cd-tu-go" type="text" class="an" placeholder="Gõ tên model, ví dụ claude-opus-4-6" autocomplete="off" spellcheck="false">
    </div>
    <div id="cd-tb" class="phu" role="status" style="min-height:20px;font-size:13px"></div>
    <div class="hang-nut" style="justify-content:flex-end">
      <button type="button" class="nut nho vien" id="cd-thu">Kiểm tra</button>
      <button type="button" class="nut nho" id="cd-dong">Đóng</button>
      <button type="button" class="nut nho chinh" id="cd-luu">Lưu</button>
    </div>
  </div>
</div>

<script src="assets/h10.js?v=f65a9f6233"></script>
<script>
(function () {
  const { esc, md, api: rawApi, laGAS, getLocation, linkTrang, skelCards, laDienThoai, ICONS, ganNutTheme, toast, ganNutLenDau, tenDep } = window.H10;
  ganNutLenDau();
  const $ = s => document.querySelector(s);

  let token = null;
  try { token = sessionStorage.getItem('btvn_gv'); } catch (e) {}

  function api(ten) {
    const args = Array.prototype.slice.call(arguments, 1);
    return rawApi.apply(null, [ten].concat(args)).catch(function (e) {
      const m = (e && e.message) ? e.message : String(e);
      if (m.indexOf('PHIEN_HET_HAN') >= 0) {
        token = null;
        try { sessionStorage.removeItem('btvn_gv'); } catch (x) {}
        veDangNhap('Phiên đăng nhập đã hết, vui lòng đăng nhập lại.');
        throw new Error('__REDIRECT__');
      }
      throw e;
    });
  }
  function apiGV(ten) {
    const a = Array.prototype.slice.call(arguments, 1);
    return api.apply(null, [ten, token].concat(a));
  }
  function bao(m, loi) {
    if (m === '__REDIRECT__') return;
    toast(m, loi);
  }
  function hoi(chu) {
    return new Promise(function (ok) {
      $('#hop-chu').textContent = chu;
      $('#hop').classList.remove('an');
      $('#hop-khong').focus();
      $('#hop-co').onclick = () => { $('#hop').classList.add('an'); ok(true); };
      $('#hop-khong').onclick = () => { $('#hop').classList.add('an'); ok(false); };
    });
  }

  const THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const pad = n => String(n).padStart(2, '0');
  function tg(ms) { if (!ms) return ''; const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · ' + THU[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }
  function dtl(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function docDtl(v) { return v ? new Date(v).getTime() : 0; }
  function diem(x) { if (x === null || x === undefined || x === '') return '–'; return (Math.round(Number(x) * 10) / 10).toString().replace('.', ','); }
  function phut(giay) { giay = Math.round(giay || 0); return pad(Math.floor(giay / 60)) + ':' + pad(giay % 60); }
  const TEN_LOAI = { tn: 'Nhiều lựa chọn', ds: 'Đúng / Sai', so: 'Trả lời ngắn', chu: 'Trả lời ngắn' };
  const TEN_NGUON = { goc: 'Câu gốc từ tài liệu', tuong_tu: 'Tương tự tài liệu', moi: 'AI tạo mới', xao_lai: 'Xào lại', doi_so_lieu: 'Đổi số liệu', goc_tu_giai: 'Câu gốc, chưa có đáp án', gv_them: 'Thầy tự thêm' };

  // ================= trạng thái =================
  let laFull = false;
  let info = null;
  let tab = 'tao';
  let baiChon = {};
  let files = [];
  let driveChon = {}, driveGoiY = [], driveTatCa = [], driveDangTai = false, driveBoQuaAuto = {}, driveTimer = null;
  let viecLam = null;
  let locDuyet = 'tat_ca'; // 'tat_ca' | 'cho_duyet' | 'da_duyet' | 'canh_bao' | 'trung'
  let dangSua = null, dangThemCau = false;
  let nhapGiaoDe = null;
  let kho = null, locKho = { loai: 'tat_ca', id: null }, chonBo = {}, chonDe = {}, dangSuaCfgDe = null;
  let thuVien = null, locTV = { thuMuc: '', tk: '' }, dangSuaTL = null, fileUpTL = null;
  let thDe = null, thData = null, thDataDeId = null, thLoc = { tk: '', sx: 'ten' };
  let lopData = null, lopSub = 'dd', ddForm = null, rpForm = null;
  let hsCache = null;
  const tenBai = {};
  const chuongCua = {};

  getLocation(function (loc) {
    laFull = !!(loc && loc.parameter && loc.parameter.full);
    if (info) veKhung();
  });

  // ================= đăng nhập =================
  function veDangNhap(loi) {
    $('#goc').innerHTML = '<div class="app"><header class="topbar"><div class="topbar-in">' +
      '<div class="brand"><div class="brand-mark">' + ICONS.binh + '</div><div class="brand-txt"><div class="nho">HÓA HỌC 10 · KNTT</div><div class="ten">Quản lý Giáo viên</div></div></div>' +
      '<div class="top-right"><button type="button" class="top-pill" id="btn-theme-dn"></button></div>' +
    '</div></header>' +
    '<main class="khung-hep" style="max-width:440px;padding-top:44px">' +
      '<form class="the" id="f-dn">' +
        '<h1 class="tieu-trang" style="margin-bottom:6px">Đăng nhập Giáo viên</h1>' +
        '<p class="phu" style="margin:0 0 14px">Quản lý đề BTVN, tạo câu hỏi AI, kho tài liệu và điểm lớp.</p>' +
        '<div class="truong"><label for="mk">Mật khẩu giáo viên</label><input id="mk" type="password" autocomplete="current-password" required></div>' +
        '<button class="nut chinh to rong" style="margin-top:14px" type="submit">Đăng nhập</button>' +
        (loi ? '<div class="thongbao canh" role="alert" style="margin-bottom:0">' + esc(loi) + '</div>' : '') +
      '</form>' +
    '</main></div>';
    ganNutTheme($('#btn-theme-dn'));
    $('#f-dn').onsubmit = function (ev) {
      ev.preventDefault();
      const n = this.querySelector('button[type="submit"]');
      n.disabled = true; n.textContent = 'Đang kiểm tra...';
      api('gvDangNhap', $('#mk').value).then(function (t) {
        token = t;
        try { sessionStorage.setItem('btvn_gv', t); } catch (e) {}
        khoiDong();
      }).catch(function (e) { veDangNhap(e.message); });
    };
    setTimeout(() => { const m = $('#mk'); if (m) m.focus(); }, 50);
  }

  function khoiDong() {
    $('#goc').innerHTML = '<div class="khung-hep" style="padding-top:40px">' + skelCards(3) + '</div>';
    apiGV('gvThongTin').then(function (r) {
      info = r;
      info.mucLuc.forEach(c => c.bai.forEach(b => { tenBai[b.id] = b.ten; chuongCua[b.id] = c.id; }));
      veKhung();
    }).catch(e => {
      if (e.message === '__REDIRECT__') return;
      $('#goc').innerHTML = '<div class="khung-hep"><div class="thongbao loi">' + esc(e.message) + '</div></div>';
    });
  }

  function veKhung() {
    const linkHS = esc(linkTrang('btvn', { webUrl: info.webUrl, laFull: true }).href);
    const linkFull = laGAS ? (laFull ? '<a class="top-pill" href="' + esc(info.trangChu) + '" target="_top">← Sites</a>' : '<a class="top-pill" href="' + esc(info.webUrl + '?page=admin&full=1') + '" target="' + (laDienThoai() ? '_top' : '_blank') + '" rel="noopener">Full</a>') : '';
    $('#goc').innerHTML = '<div class="app"><header class="topbar"><div class="topbar-in">' +
      '<div class="brand"><div class="brand-mark">' + ICONS.binh + '</div><div class="brand-txt"><div class="nho">HÓA 10 · GIÁO VIÊN</div><div class="ten">Quản lý BTVN &amp; Học liệu</div></div></div>' +
      '<nav class="nav-links" aria-label="Menu giáo viên">' +
        '<button type="button" data-tab="tao">Tạo câu AI</button>' +
        '<button type="button" data-tab="kho">Kho đề</button>' +
        '<button type="button" data-tab="tailieu">Kho tài liệu &amp; Sites</button>' +
        '<button type="button" data-tab="tong">Tổng hợp điểm</button>' +
        '<button type="button" data-tab="lop">Điểm danh &amp; Report</button>' +
        '<button type="button" data-tab="hs">Học sinh</button>' +
      '</nav>' +
      '<div class="top-right">' +
        '<button type="button" class="top-pill top-extra" id="nut-cai-dat">⚙️ Cài đặt AI</button>' +
        '<a class="top-pill top-extra" href="' + linkHS + '" target="_blank" rel="noopener">Trang HS</a>' +
        '<a class="top-pill top-extra" href="' + esc(info.sheetUrl) + '" target="_blank" rel="noopener">Sheet</a>' +
        '<a class="top-pill top-extra" href="' + esc(info.rootUrl) + '" target="_blank" rel="noopener">Drive</a>' +
        (linkFull ? '<span class="top-extra">' + linkFull + '</span>' : '') +
        '<div class="top-more-wrap">' +
          '<button type="button" class="top-pill" id="nut-more-top" aria-expanded="false" title="Tiện ích khác">⋯</button>' +
          '<div class="top-more-menu" id="menu-more-top">' +
            '<button type="button" class="top-pill" id="nut-cai-dat-m">⚙️ Cài đặt AI</button>' +
            '<a class="top-pill" href="' + linkHS + '" target="_blank" rel="noopener">🎓 Trang Học sinh</a>' +
            '<a class="top-pill" href="' + esc(info.sheetUrl) + '" target="_blank" rel="noopener">📊 Google Sheet</a>' +
            '<a class="top-pill" href="' + esc(info.rootUrl) + '" target="_blank" rel="noopener">📁 Google Drive</a>' +
            linkFull +
          '</div>' +
        '</div>' +
        '<button type="button" class="top-pill" id="btn-theme"></button>' +
      '</div>' +
    '</div></header><main class="khung-chinh" id="noi-dung"></main></div>';

    ganNutTheme($('#btn-theme'));
    document.querySelectorAll('.nav-links [data-tab]').forEach(b => b.onclick = () => doiTab(b.getAttribute('data-tab')));
    $('#nut-cai-dat').onclick = () => moCaiDat();
    const cdm = $('#nut-cai-dat-m');
    const moreBtn = $('#nut-more-top'), moreMenu = $('#menu-more-top');
    if (cdm) cdm.onclick = () => { if (moreMenu) moreMenu.classList.remove('mo'); moCaiDat(); };
    if (moreBtn && moreMenu) {
      moreBtn.onclick = function (e) {
        e.stopPropagation();
        const mo = moreMenu.classList.toggle('mo');
        moreBtn.setAttribute('aria-expanded', mo ? 'true' : 'false');
      };
      document.addEventListener('click', function () { moreMenu.classList.remove('mo'); moreBtn.setAttribute('aria-expanded', 'false'); });
    }
    doiTab(tab);
  }

  function doiTab(t) {
    tab = t;
    let nutCur = null;
    document.querySelectorAll('.nav-links [data-tab]').forEach(b => {
      if (b.getAttribute('data-tab') === t) { b.setAttribute('aria-current', 'page'); nutCur = b; }
      else b.removeAttribute('aria-current');
    });
    if (nutCur && nutCur.scrollIntoView) {
      try { nutCur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }
    if (t === 'tao') veTao();
    else if (t === 'kho') taiKho();
    else if (t === 'tailieu') taiThuVien();
    else if (t === 'tong') taiTongHop();
    else if (t === 'lop') taiLop();
    else taiHS();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  // ================= TAB 1: TẠO CÂU HỎI AI =================
  function tenAI() { return 'Claude'; }
  function veTao() {
    const m = $('#noi-dung');
    const aiTen = tenAI();
    let h = '<div class="hero-box art-atom has-right" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px">' +
      '<div><span class="chip chinh">SOẠN BÀI BẰNG AI</span><h1 style="margin-bottom:0">Tạo câu hỏi Hóa 10</h1></div>' +
      '<span class="chip ' + (info.coKey ? 'ok' : 'canh') + '">Đang dùng: ' + esc(aiTen + ' · ' + info.model) + '</span></div>';

    if (!info.coKey) {
      h += '<div class="thongbao canh">' + ICONS.tt + '<span>Chưa có khóa API cho <b>' + esc(aiTen) + '</b>. Bấm <b>Cài đặt AI</b> ở góc trên để dán API key.</span></div>';
    }

    h += '<section class="the"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px">' +
      '<h2 class="tieu-khoi"><span class="step-badge">1</span><span>Chọn bài SGK (chọn được nhiều bài, nhiều chương)</span></h2>' +
      '<button type="button" class="nut nho" id="bo-chon">Bỏ chọn hết</button></div><div class="luoi-chuong">';
    info.mucLuc.forEach(function (c) {
      const soChon = c.bai.filter(b => baiChon[b.id]).length;
      h += '<details class="chuong"' + (soChon ? ' open' : '') + '><summary>' + esc(c.ten) + '<span class="dem" id="dem-' + c.id + '">' + (soChon ? soChon + '/' + c.bai.length + ' bài' : '') + '</span></summary><div style="padding:0 0 8px 4px">';
      if (c.bai.length > 1) h += '<label class="chon" style="font-weight:700"><input type="checkbox" data-ca-chuong="' + c.id + '"' + (soChon === c.bai.length ? ' checked' : '') + '>Chọn cả chương</label>';
      c.bai.forEach(b => {
        const sc = (info.demCauBai && info.demCauBai[b.id]) || 0;
        h += '<label class="chon"><input type="checkbox" data-bai="' + b.id + '"' + (baiChon[b.id] ? ' checked' : '') + '><span style="flex:1">' + esc(b.ten) + '</span>' + (sc ? '<span class="chip" style="font-size:11px;padding:1px 7px">' + sc + ' câu</span>' : '') + '</label>';
      });
      h += '</div></details>';
    });
    h += '</div><div id="tom-tat"></div></section>';

    h += '<section class="the"><h2 class="tieu-khoi" style="margin-bottom:10px"><span class="step-badge">2</span><span>Tài liệu tham khảo (tự tìm theo bài trên Drive hoặc tải thêm)</span></h2>' +
      '<div class="tha" id="tha">' +
        '<div style="width:42px;height:42px;border-radius:12px;background:var(--the);border:1px solid var(--do-v);color:var(--do);display:grid;place-items:center;box-shadow:var(--shadow)">' + ICONS.doc + '</div>' +
        '<span style="font-weight:700;color:var(--do)">Kéo thả file từ máy vào đây hoặc bấm để chọn file</span>' +
        '<span class="phu" style="font-size:12.5px">PDF, Word (.docx), ảnh chụp đề · tối đa 15 MB tổng cộng</span>' +
        '<input type="file" id="o-file" multiple accept=".pdf,.doc,.docx,.txt,image/*" class="an">' +
      '</div>' +
      '<div id="drive-ref-box" class="drive-box"></div>' +
      '<div class="hang-nut" id="ds-chip" style="margin-top:10px"></div>' +
      '<fieldset id="cach" style="border:none;margin:10px 0 0;padding:0"><legend class="nhan-o" style="padding:0 0 6px">AI dùng tài liệu thế nào?</legend>' +
        '<label class="chon"><input type="radio" name="cach" value="tuong_tu" checked>Dựa vào tài liệu để tạo câu&nbsp;<b>tương tự, vừa sức</b>&nbsp;(đổi số liệu, đổi chất)</label>' +
        '<label class="chon"><input type="radio" name="cach" value="lay_nguyen">Lấy&nbsp;<b>nguyên câu hỏi</b>&nbsp;trong tài liệu, AI chỉ viết đáp án và lời giải</label>' +
        '<label class="chon"><input type="radio" name="cach" value="ket_hop">Kết hợp: lấy câu gốc và thêm câu tương tự</label>' +
      '</fieldset></section>';

    h += '<section class="the"><h2 class="tieu-khoi" style="margin-bottom:10px"><span class="step-badge">3</span><span>Số câu, ma trận từng phần &amp; kiểm tra chéo</span></h2>' +
      '<div class="hang" style="margin-bottom:10px">' +
        '<div class="truong" style="flex:0 1 115px"><label for="so-cau">Tổng số câu</label><input id="so-cau" type="number" min="1" max="40" value="20"></div>' +
        '<div class="truong" style="flex:1 1 230px"><label for="cau-truc-preset">Ma trận cấu trúc phần</label>' +
          '<select id="cau-truc-preset">' +
            '<option value="tu_dong">Tự động chia đều theo phần tích chọn</option>' +
            '<option value="12-2-4">BTVN chuẩn: 12 TN + 2 Đ/S + 4 TLN (18 câu)</option>' +
            '<option value="18-4-6">Đề chuẩn Bộ GD: 18 TN + 4 Đ/S + 6 TLN (28 câu)</option>' +
            '<option value="8-1-2">Kiểm tra 15p: 8 TN + 1 Đ/S + 2 TLN (11 câu)</option>' +
            '<option value="tu_nhap">Tự nhập số câu từng phần...</option>' +
          '</select></div>' +
        '<div class="truong" style="flex:1 1 200px"><label for="muc-do">Mức độ</label><select id="muc-do"><option value="tron">Trộn: biết, hiểu, vận dụng (cân bằng)</option><option value="biet">Nhận biết</option><option value="hieu">Thông hiểu</option><option value="vandung">Vận dụng</option><option value="cao">Vận dụng cao</option><option value="tailieu">Theo tài liệu tham khảo</option></select></div>' +
        '<div class="truong" style="flex:1.5 1 220px"><label for="ten-bo">Tên bộ câu hỏi (tùy chọn)</label><input id="ten-bo" type="text" placeholder="Tự đặt theo ngày và bài nếu để trống"></div>' +
      '</div>' +

  function napPdfJsAdmin_() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

  async function rutChuPdfClient_(b64) {
    try {
      const lib = await napPdfJsAdmin_();
      const bin = atob(b64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const pdf = await lib.getDocument({ data: u8 }).promise;
      const maxP = Math.min(pdf.numPages, 25);
      const out = [];
      for (let p = 1; p <= maxP; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        const txt = (tc.items || []).map(it => it.str || '').join(' ').replace(/\s+/g, ' ').trim();
        if (txt) out.push(txt);
      }
      return out.join('\n\n').slice(0, 48000);
    } catch (e) { return ''; }
  }

  function themFile(list) {
    const arr = Array.prototype.slice.call(list || []);
    let tong = files.reduce((s, f) => s + f.size, 0);
    arr.forEach(function (f) {
      if (tong + f.size > 15 * 1024 * 1024) { bao('File "' + f.name + '" làm vượt 15 MB, bỏ qua.', true); return; }
      tong += f.size;
      const r = new FileReader();
      r.onload = async function () {
        const b64 = String(r.result).split(',')[1];
        const mt = f.type || (/\.docx$/i.test(f.name) ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : (/\.pdf$/i.test(f.name) ? 'application/pdf' : ''));
        const item = { name: f.name, mimeType: mt, data: b64, size: f.size, extractedText: '' };
        files.push(item);
        veChip();
        if (mt === 'application/pdf' || /\.pdf$/i.test(f.name)) {
          const txt = await rutChuPdfClient_(b64);
          if (txt && txt.length >= 150) {
            item.extractedText = txt;
            veChip();
          }
        }
      };
      r.readAsDataURL(f);
    });
  }

  function taiBase64File(ten, mimeType, b64) {
    if (!b64) return false;
    try {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: mimeType || 'application/octet-stream' }));
      const a = document.createElement('a'); a.href = url; a.download = ten; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return true;
    } catch (e) { return false; }
  }

  function chiaKichThuocDot_(n, maxBuoc) {
    if (n <= 0) return [];
    const nDot = Math.ceil(n / (maxBuoc || 6));
    const kq = [];
    let con = n;
    for (let i = 0; i < nDot; i++) {
      const sz = Math.ceil(con / (nDot - i));
      kq.push(sz);
      con -= sz;
    }
    return kq;
  }

        });
      });
    } else {
      const sizes = chiaKichThuocDot_(soCau, soCau <= 6 ? soCau : 5);
      const coTN = loaiChon.indexOf('tn') >= 0;
      const coDS = loaiChon.indexOf('ds') >= 0;
      const coTL = loaiChon.indexOf('tl') >= 0;
      const kieu = [];
      if (coTN) kieu.push({ loai: ['tn'], nhan: 'chỉ tạo câu trắc nghiệm 4 lựa chọn (tn) phần khái niệm, cấu tạo và quy luật biến đổi (mức nhận biết – thông hiểu; không dùng từ "luôn/mọi" làm nhiễu)' });
      if (coTN && sizes.length >= 2) kieu.push({ loai: ['tn'], nhan: 'chỉ tạo câu trắc nghiệm 4 lựa chọn (tn) phần bài tập tính toán định lượng, phân tích hoặc vận dụng thực tế (dùng chất khác với nhóm 1)' });
      if (coDS) kieu.push({ loai: ['ds'], nhan: 'chỉ tạo câu Đúng/Sai 4 ý a, b, c, d (ds) về thí nghiệm, hợp chất đa dạng và trường hợp mở rộng (mệnh đề rõ trước/sau liên kết, không dùng từ tuyệt đối lộ liễu)' });
      if (coTL) kieu.push({ loai: ['tl'], nhan: 'chỉ tạo câu Trả lời ngắn (so hoặc chu) gồm cả bài tập tính số liệu vận dụng và điền công thức/từ khóa (câu hỏi không mơ hồ, rõ hỏi 1 nguyên tử hay cả phân tử)' });
      const gocNhin = [
        'ưu tiên câu nhận biết và khái niệm cơ bản với nhóm chất đại diện khác nhau',
        'ưu tiên câu thông hiểu, giải thích bản chất và so sánh các liên kết khác nhau',
        'ưu tiên câu bài tập tính toán định lượng và vận dụng',
        'ưu tiên câu vận dụng thực tế, thí nghiệm hoặc tổng hợp kiến thức không trùng chất với các nhóm trước'
      ];
      rawDots = sizes.map(function (sz, idx) {
        if (sizes.length > 1 && kieu.length > 1) {
          const pick = kieu[idx % kieu.length];
          return { soCauDot: sz, loai: pick.loai, nhan: pick.nhan };
        }
        return { soCauDot: sz, loai: loaiChon, nhan: gocNhin[idx % gocNhin.length] };
      });
    }

    return rawDots.map(function (d, idx) {
      let focus = d.nhan;
      if (dangPool.length) {
        const dangRieng = dangPool.filter(function (_, j) { return j % rawDots.length === idx; });
        const dangGan = dangRieng.length ? dangRieng : [dangPool[idx % dangPool.length]];
        focus += '; TẬP TRUNG VÀO DẠNG BÀI ĐƯỢC PHÂN CÔNG: ' + dangGan.join(' | ');
      }
      if (viDuPool.length) {
        const vdRieng = viDuPool.filter(function (_, j) { return j % rawDots.length === idx; });
        const vdGan = vdRieng.length ? vdRieng : [viDuPool[idx % viDuPool.length]];
        focus += '; ƯU TIÊN DÙNG CÁC CHẤT / VÍ DỤ RIÊNG CỦA NHÓM NÀY (để không đụng hàng với nhóm khác): ' + vdGan.join(', ');
      }
      if (baiIds.length > 1) {
        focus += '; ưu tiên bám theo bài "' + baiIds[idx % baiIds.length] + '"';
      }
      if (cach === 'lay_nguyen' && rawDots.length > 1) {
        focus += '; lấy các câu nằm ở phần ' + (idx + 1) + '/' + rawDots.length + ' của tài liệu';
      }
      return { soCauDot: d.soCauDot, loai: d.loai, focus: focus };
    });
  }

  async function taoCauHoi() {
    const baiIds = sapBaiIds_(Object.keys(baiChon));
    if (!baiIds.length) return bao('Chọn ít nhất 1 bài.', true);
    const presetVal = ($('#cau-truc-preset') && $('#cau-truc-preset').value) || 'tu_dong';
    let soCauPhan = null;
    if (presetVal !== 'tu_dong') {
      soCauPhan = {
        tn: Math.max(0, Number($('#so-tn').value) || 0),
        ds: Math.max(0, Number($('#so-ds').value) || 0),
        tl: Math.max(0, Number($('#so-tl').value) || 0)
      };
      if (soCauPhan.tn + soCauPhan.ds + soCauPhan.tl < 1) return bao('Tổng số câu của 3 phần phải ít nhất là 1.', true);
    }
    const loai = Array.prototype.slice.call(document.querySelectorAll('[data-loai]')).filter(i => i.checked).map(i => i.getAttribute('data-loai'));
    if (!loai.length) return bao('Chọn ít nhất 1 loại câu.', true);
    const soCau = Math.max(1, Math.min(40, Number($('#so-cau').value) || 10));
    const kiemTraSau = !!($('#kiem-tra') && $('#kiem-tra').checked);
    const opts = {
      baiIds: baiIds,
      files: files.map(f => f.extractedText ? ({ name: f.name, mimeType: f.mimeType, extractedText: f.extractedText }) : ({ name: f.name, mimeType: f.mimeType, data: f.data })),
      driveIds: Object.keys(driveChon),
      cach: (document.querySelector('input[name=cach]:checked') || {}).value, soCau: soCau, mucDo: $('#muc-do').value,
      loai: loai, tenBo: $('#ten-bo').value
    };
    const nut = $('#nut-tao'); nut.disabled = true;
    const aiTen = tenAI();
    const cho = $('#cho-tao');
    const t0 = Date.now();
    let msgHien = 'Đang rút chữ tài liệu, nạp quy chuẩn kiến thức và kiểm tra lịch sử câu trong chương...';
    const veCho = () => {
      if (!cho) return;
      const giay = Math.max(0, Math.round((Date.now() - t0) / 1000));
      cho.innerHTML = '<div class="thongbao info"><span class="cho"></span><span>' + esc(msgHien) + ' (' + giay + 's)</span></div>';
    };
    veCho();
    const timer = setInterval(veCho, 1000);
    let khoi = null;
    try {
      khoi = await apiGV('gvBatDauTaoBo', opts);
      kho = null;
      viecLam = { bo: khoi.bo, cau: [] }; dangSua = null; dangThemCau = false; nhapGiaoDe = null; locDuyet = 'tat_ca';
      const dots = buildDotSongSong_(khoi.soCau, loai, khoi.baiIds, khoi.cach, khoi.quyChuan, soCauPhan);
      const daCoLichSu = Array.isArray(khoi.daCoCu) ? khoi.daCoCu : [];
      let xongNhom = 0;
      msgHien = aiTen + ' đang soạn song song ' + dots.length + ' nhóm theo quy chuẩn (xong 0/' + dots.length + ')';
      veCho();
      const ketQuaNhom = new Array(dots.length);
      await Promise.all(dots.map(async function (d, idx) {
        const moi = await apiGV('gvTaoDotCauHoi', {
          boId: khoi.bo.id, baiIds: khoi.baiIds, loai: d.loai, soCauDot: d.soCauDot,
          mucDo: khoi.mucDo, cach: khoi.cach, refs: khoi.refs, daCo: daCoLichSu,
          dotSo: idx + 1, tongDot: dots.length, focus: d.focus
        });
        ketQuaNhom[idx] = moi || [];
        xongNhom++;
        viecLam.cau = [].concat.apply([], ketQuaNhom.filter(Boolean));
        msgHien = aiTen + ' đang soạn song song ' + dots.length + ' nhóm (xong ' + xongNhom + '/' + dots.length + ' · ' + viecLam.cau.length + '/' + khoi.soCau + ' câu)';
        veCho();
        veViecLam();
      }));
      if (!viecLam.cau.length) throw new Error(aiTen + ' không tạo được câu nào. Thử lại hoặc đổi tài liệu.');

      if (kiemTraSau) {
        const loKiem = chiaNhom_(viecLam.cau.map(c => c.id), 5);
        let xongKiem = 0;
        msgHien = aiTen + ' đang tự giải check chéo song song ' + loKiem.length + ' nhóm (xong 0/' + loKiem.length + ')';
        veCho();
        await Promise.all(loKiem.map(async function (idsLo) {
          const capNhat = await apiGV('gvKiemTraLai', idsLo);
          const map = {}; (capNhat || []).forEach(x => map[x.id] = x);
          viecLam.cau = viecLam.cau.map(x => map[x.id] || x);
          xongKiem++;
          msgHien = aiTen + ' đang tự giải check chéo song song (xong ' + xongKiem + '/' + loKiem.length + ')';
          veCho();
          veViecLam();
        }));
      }

      clearInterval(timer);
      files = []; veChip();
      if (cho) cho.innerHTML = '';
      nut.disabled = false;
      const giayTong = Math.max(1, Math.round((Date.now() - t0) / 1000));
      const r = viecLam;
      const nLap = r.cau.filter(c => c.laTrung).length;
      const nCanh = r.cau.filter(c => !!c.canhBao && !c.laTrung).length;
      bao('Đã tạo ' + r.cau.length + ' câu trong ' + giayTong + 's.' + (nCanh ? ' Có ' + nCanh + ' câu AI nghi lệch.' : '') + (nLap ? ' Có ' + nLap + ' câu trùng.' : ''));
      const v = $('#vung-lam'); if (v) v.scrollIntoView({ behavior: 'smooth' });
    } catch (e) {
      clearInterval(timer);
      nut.disabled = false;
      if (e.message !== '__REDIRECT__' && cho) cho.innerHTML = '<div class="thongbao loi" role="alert">' + esc(e.message) + '</div>';
      if (viecLam && viecLam.cau.length) veViecLam();
    }
  }

  // ----- Công cụ chèn Ảnh (Ctrl+V / File) & Bảng Markdown cho câu hỏi -----
  function chenTaiConTro_(ta, txt) {
    if (!ta) return;
    const st = ta.selectionStart || ta.value.length;
    const en = ta.selectionEnd || ta.value.length;
    ta.value = ta.value.slice(0, st) + txt + ta.value.slice(en);
    ta.focus();
    try { ta.setSelectionRange(st + txt.length, st + txt.length); } catch (e) {}
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function taiAnhLenCauHoi_(file, ta, nut) {
    if (!file || !ta) return;
    if (file.size > 6 * 1024 * 1024) return bao('Ảnh quá lớn (tối đa 6 MB).', true);
    const chuCu = nut ? nut.textContent : '';
    if (nut) { nut.disabled = true; nut.textContent = 'Đang tải ảnh...'; }
    bao('Đang tải ảnh minh họa lên Google Drive...');
    const r = new FileReader();
    r.onload = function () {
      apiGV('gvTaiAnhCauHoi', {
        name: file.name || 'anh_dan.png',
        mimeType: file.type || 'image/png',
        data: String(r.result).split(',')[1]
      }).then(function (kq) {
        if (nut) { nut.disabled = false; nut.textContent = chuCu; }
        chenTaiConTro_(ta, (ta.value && !/\n$/.test(ta.value) ? '\n' : '') + kq.markdown + '\n');
        bao('Đã chèn ảnh minh họa vào câu hỏi!');
      }).catch(function (e) {
        if (nut) { nut.disabled = false; nut.textContent = chuCu; }
        bao(e.message, true);
      });
    };
    r.readAsDataURL(file);
  }

  function ganCongCuSoanCau_(root) {
    if (!root) return;
    root.querySelectorAll('[data-img-ta]').forEach(function (ta) {
      ta.addEventListener('paste', function (e) {
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (let i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.indexOf('image/') === 0) {
            e.preventDefault();
            taiAnhLenCauHoi_(items[i].getAsFile(), ta, null);
            return;
          }
        }
      });
    });
    root.querySelectorAll('[data-ins-tbl]').forEach(function (btn) {
      btn.onclick = function () {
        const ta = document.getElementById(btn.getAttribute('data-ins-tbl'));
        chenTaiConTro_(ta, '\n| Đại lượng | Chất X | Chất Y | Chất Z |\n|---|---|---|---|\n| Giá trị | 10 | 20 | 30 |\n');
      };
    });
    root.querySelectorAll('[data-ins-img]').forEach(function (btn) {
      btn.onclick = function () {
        const taId = btn.getAttribute('data-ins-img');
        const inp = document.getElementById('file-' + taId);
        if (inp) inp.click();
      };
    });
    root.querySelectorAll('[data-file-img]').forEach(function (inp) {
      inp.onchange = function () {
        const f = this.files && this.files[0];
        this.value = '';
        if (!f) return;
        const taId = inp.getAttribute('data-file-img');
        const ta = document.getElementById(taId);
        const btn = root.querySelector('[data-ins-img="' + taId + '"]');
        taiAnhLenCauHoi_(f, ta, btn);
      };
    });
  }

    v.querySelectorAll('[data-xoa-trung]').forEach(b => b.onclick = () => doiTT([b.getAttribute('data-xoa-trung')], 'da_xoa'));
    v.querySelectorAll('[data-dung-gem]').forEach(b => b.onclick = () => {
      b.disabled = true;
      apiGV('gvDungDapAnGemini', b.getAttribute('data-dung-gem')).then(function (moi) {
        viecLam.cau = viecLam.cau.map(x => x.id === moi.id ? moi : x); veViecLam(); bao('Đã áp dụng bản sửa AI.');
      }).catch(function (e) { b.disabled = false; bao(e.message, true); });

    v.querySelectorAll('[data-bo-goi-y]').forEach(b => b.onclick = () => {
      b.disabled = true;
      apiGV('gvBoQuaGoiY', b.getAttribute('data-bo-goi-y')).then(function (moi) {
        viecLam.cau = viecLam.cau.map(x => x.id === moi.id ? moi : x); veViecLam(); bao('Đã giữ nguyên câu gốc.');
      }).catch(function (e) { b.disabled = false; bao(e.message, true); });

    const adh = $('#ap-dung-het');

  function moXemTruocA4() {
    if (!viecLam) return;
    const daDuyet = viecLam.cau.filter(c => c.trangThai === 'da_duyet');
    let chiDuyet = daDuyet.length > 0;
    let kemDapAn = true;

    const hop = document.createElement('div');
    hop.className = 'hopdn';
    hop.innerHTML = '<div class="the rong" style="padding:0;display:flex;flex-direction:column;max-height:92vh">' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--vien);position:sticky;top:0;background:var(--the);z-index:2">' +
        '<b style="font-size:15.5px;margin-right:auto">Xem trước bản in A4</b>' +
        '<label class="chon" style="min-height:auto"><input type="checkbox" data-x="duyet"' + (chiDuyet ? ' checked' : '') + '>Chỉ câu đã duyệt (' + daDuyet.length + ')</label>' +
        '<label class="chon" style="min-height:auto"><input type="checkbox" data-x="da" checked>Kèm đáp án</label>' +
        '<button type="button" class="nut nho chinh" data-x="in">In / Lưu PDF</button>' +
        '<button type="button" class="nut nho" data-x="dong">Đóng</button>' +
      '</div>' +
      '<div class="a4-wrap" data-x="wrap" style="overflow:auto"></div></div>';
    document.body.appendChild(hop);

    const veA4 = function () {
      const ds = chiDuyet ? daDuyet : viecLam.cau;
      let s = '<div class="a4-sheet" id="a4-print-area">' +
        '<div class="a4-head"><div class="a4-td">' + esc(viecLam.bo.ten) + '</div>' +
        '<div class="a4-sub">Hóa học 10 – Kết nối tri thức · ' + ds.length + ' câu</div></div>';
      if (!ds.length) {
        s += '<p>Chưa có câu nào phù hợp.</p>';
      } else {
        ds.forEach(function (c, i) {
          s += '<div class="a4-q"><b>Câu ' + (i + 1) + '.</b> ' + md(c.cauHoi);
          if (c.loai === 'tn') {
            s += '<div class="a4-lc-grid">' + c.luaChon.map((t, j) => '<div><b>' + 'ABCD'.charAt(j) + '.</b> ' + md(t) + '</div>').join('') + '</div>';
          } else if (c.loai === 'ds') {
            s += '<div style="margin:4px 0 0 14px">' + (c.luaChon || []).map((t, j) => '<div><b>' + 'abcd'.charAt(j) + ')</b> ' + md(t) + '</div>').join('') + '</div>';
          }
          s += '</div>';
        });
        if (kemDapAn) {
          s += '<hr style="margin:18px 0;border:0;border-top:1.5px solid #222"><div style="font-size:16px;font-weight:700;margin-bottom:8px">ĐÁP ÁN &amp; LỜI GIẢI</div>';
          ds.forEach(function (c, i) {
            let da;
            if (c.loai === 'tn') da = 'ABCD'.charAt(c.dapAn) + '. ' + (c.luaChon[c.dapAn] || '');
            else if (c.loai === 'ds') da = (c.dapAn || []).map((v, j) => 'abcd'.charAt(j) + ') ' + (v ? 'Đúng' : 'Sai')).join(' · ');
            else if (c.loai === 'so') da = c.dapAn;
            else da = (c.chapNhan || []).join(' / ');
            s += '<div style="margin-bottom:6px"><b>Câu ' + (i + 1) + ':</b> ' + md(da) + (c.loiGiai ? ' — <i>' + md(c.loiGiai) + '</i>' : '') + '</div>';
          });
        }
      }
      s += '</div>';
      hop.querySelector('[data-x="wrap"]').innerHTML = s;
    };
    veA4();

    const dong = () => { hop.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = e => { if (e.key === 'Escape') dong(); };
    document.addEventListener('keydown', onEsc);
    hop.onclick = e => { if (e.target === hop) dong(); };
    hop.querySelector('[data-x="dong"]').onclick = dong;
    hop.querySelector('[data-x="duyet"]').onchange = function () { chiDuyet = this.checked; veA4(); };
    hop.querySelector('[data-x="da"]').onchange = function () { kemDapAn = this.checked; veA4(); };
    hop.querySelector('[data-x="in"]').onclick = () => window.print();
  }

  async function kiemTraLai(ids, nut, yeuCau) {
    const chu = nut ? nut.textContent : '';
    if (nut) nut.disabled = true;
    const nhom = chiaNhom_(ids, 5);
    const t0 = Date.now();
    let xong = 0, tongDeXuat = 0, tongDaKiem = 0;
    const capNhatChu = () => {
      if (!nut) return;
      const s = Math.max(0, Math.round((Date.now() - t0) / 1000));
      nut.textContent = nhom.length > 1 ? ('Đang rà song song (' + xong + '/' + nhom.length + ') · ' + s + 's') : ('Đang rà & sửa... ' + s + 's');
    };
    capNhatChu();
    const timer = setInterval(capNhatChu, 1000);
    try {
      await Promise.all(nhom.map(async function (idsNhom) {
        const moi = await apiGV('gvKiemTraLai', idsNhom, yeuCau || '');
        const map = {}; (moi || []).forEach(x => map[x.id] = x);
        viecLam.cau = viecLam.cau.map(x => map[x.id] || x);
        tongDeXuat += (moi || []).filter(x => !!x.deXuatSua).length;
        tongDaKiem += (moi || []).length;
        xong++;
        capNhatChu();
      }));
      clearInterval(timer);
      veViecLam();
      const sTong = Math.max(1, Math.round((Date.now() - t0) / 1000));
      bao(tongDeXuat ? ('Có ' + tongDeXuat + ' câu AI đề xuất chỉnh sửa (' + sTong + 's), xem khung tím để duyệt áp dụng.') : (tongDaKiem > 1 ? 'AI rà xong ' + tongDaKiem + ' câu trong ' + sTong + 's, đều chuẩn.' : 'AI check: câu đã chuẩn.'), !!tongDeXuat);
    } catch (e) {
      clearInterval(timer);
      if (nut) { nut.disabled = false; nut.textContent = chu; }
      bao(e.message, true);
    }
  }

  function taiTongHop(epTai) {

  }

  function csvO_(v) {
    const s = String(v === null || v === undefined ? '' : v);
    return /[",\n\r]/.test(s) ? ('"' + s.replace(/"/g, '""') + '"') : s;
  }

  function xuatExcelTongHop_(r) {
    if (!r || !r.de) return;
    const header = ['STT', 'Họ và tên', 'Trạng thái', 'Điểm lần đầu', 'Điểm cao nhất', 'Số lần đúng hạn', 'Làm sau hạn', 'Rời tab tối đa', 'Thời gian đầu', 'Nộp lần cuối'];
    const lines = [header.map(csvO_).join(',')];
    let stt = 1;
    (r.dong || []).forEach(function (x) {
      lines.push([
        stt++, x.ten, 'Đúng hạn', diem(x.dau), diem(x.cao),
        x.soLan, x.soLanMuon || 0, x.roiTabMax || 0, phut(x.giayDau), tg(x.nopCuoi)
      ].map(csvO_).join(','));
    });
    const clCt = Array.isArray(r.chuaLamChiTiet) ? r.chuaLamChiTiet : (r.chuaLam || []).map(t => ({ ten: t, soLanMuon: 0 }));
    clCt.forEach(function (x) {
      lines.push([
        stt++, x.ten, x.soLanMuon ? ('Làm muộn (' + x.soLanMuon + ' lần)') : 'Chưa làm',
        '', '', 0, x.soLanMuon || 0, '', '', ''
      ].map(csvO_).join(','));
    });
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = ('Bang-diem-' + String(r.de.ten || 'BTVN').replace(/[\\/:*?"<>|]+/g, '-')).slice(0, 80) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    bao('Đã tải bảng điểm .csv (mở thẳng bằng Excel)!');
  }

  function copyVanBan(txt, okMsg) {
    if (!txt) return bao('Chưa có nội dung để copy.', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => bao(okMsg || 'Đã copy!')).catch(() => copyFallback(txt, okMsg));
    } else { copyFallback(txt, okMsg); }
  }
  function copyFallback(txt, okMsg) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); bao(okMsg || 'Đã copy!'); } catch (e) { bao('Không tự copy được, em bôi đen rồi copy thủ công nhé.', true); }
    ta.remove();

  function homNayYMD() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function ymdTuMs(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function ngayDepYMD(s) {
    const p = String(s || '').split('-');
    return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : (s || '');
  }
  function taoFormDD(src) {
    const hsList = (lopData && lopData.hs) || [];
    const ct = {};
    if (src && src.chiTiet) {
      Object.keys(src.chiTiet).forEach(k => { ct[k] = { tt: src.chiTiet[k].tt || 'co', gc: src.chiTiet[k].gc || '' }; });
    }
    hsList.forEach(x => { if (!ct[x.khoa]) ct[x.khoa] = { tt: 'co', gc: '' }; });
    const ng = (src && src.ngay) || homNayYMD();
    return {
      id: (src && src.id) || '',
      ngay: ng,
      buoi: (src && src.buoi) || ('Buổi ngày ' + ngayDepYMD(ng)),
      noiDung: (src && src.noiDung) || '',
      ghiChu: (src && src.ghiChu) || '',
      chiTiet: ct
    };
  }
  function taoFormRP() {
    const d = new Date();
    const den = homNayYMD();
    const d0 = new Date(d.getTime() - 7 * 86400e3);
    const tu = d0.getFullYear() + '-' + pad(d0.getMonth() + 1) + '-' + pad(d0.getDate());
    const deIds = {};
    if (lopData && lopData.dsDe && lopData.dsDe.length) deIds[lopData.dsDe[0].id] = true;
    return {
      id: '',
      tuNgay: tu,
      denNgay: den,
      deIds: deIds,
      ghiChuGV: '',
      tieuDe: '',
      noiDung: '',
      tinNhan: '',
      thongBaoWeb: (lopData && lopData.thongBaoHienTai) || '',
      vanPhongMau: (lopData && lopData.vanPhongMau) || '',
      hsDanhGia: {},
      hsLoc: '',
      moiHsMotTrang: true,
      kemTongKet: true,
      tk: null

  }

      '<div class="cal-grid">';

    for (let i = 0; i < soO; i++) {

      const ymd = cur.getFullYear() + '-' + pad(cur.getMonth() + 1) + '-' + pad(cur.getDate());
      const out = cur.getMonth() !== m;
      const isToday = ymd === homNay;
      let cls = 'cal-cell' + (out ? ' out' : '') + (isToday ? ' today' : '');
      if (mode === 'dd' && ddForm && ddForm.ngay === ymd) cls += ' sel';
      if (mode === 'rp' && tu && den && ymd >= tu && ymd <= den) {
        cls += (ymd === tu || ymd === den) ? ' range-edge' : ' in-range';
      } else if (mode === 'rp' && rpRangePick === ymd) {
        cls += ' range-edge';
      }

      const dds = ddTheoNgay[ymd] || [];
      const des = deTheoNgay[ymd] || [];
      h += '<div class="' + cls + '" data-cal-day="' + ymd + '">' +
        '<div class="cal-cell-top"><span class="cal-num">' + cur.getDate() + '</span>' +
        (mode === 'dd' ? '<span class="cal-plus" title="Điểm danh ngày này">+</span>' : '') +
        '</div><div class="cal-ev-list">';
      dds.slice(0, 2).forEach(b => {
        const tt = b.tomTat || {};
        const coVanDe = (tt.muon || 0) + (tt.cp || 0) + (tt.kp || 0) > 0;
        h += '<button type="button" class="cal-pill dd' + (coVanDe ? ' warn' : '') + '" data-cal-dd="' + esc(b.id) + '" title="' + esc(b.buoi) + ' · Có ' + (tt.co || 0) + '">' +
          esc(b.buoi.replace(/^Buổi ngày \d+\/\d+\/\d+\s*/, 'Điểm danh') || 'Điểm danh') + '</button>';
      });
      if (dds.length > 2) h += '<span class="phu" style="font-size:10.5px">+' + (dds.length - 2) + ' buổi</span>';
      des.slice(0, 2).forEach(d => {
        h += '<span class="cal-pill de" title="Hạn: ' + esc(d.ten) + '">Hạn: ' + esc(d.ten) + '</span>';
      });
      h += '</div></div>';
    }
    h += '</div></section>';
    return h;
  }

  function ganSuKienLich(mode) {
    const m = $('#noi-dung');
    $('#cal-prev').onclick = () => {
      calYM.m--; if (calYM.m < 0) { calYM.m = 11; calYM.y--; } veLop();
    };
    $('#cal-next').onclick = () => {
      calYM.m++; if (calYM.m > 11) { calYM.m = 0; calYM.y++; } veLop();
    };
    $('#cal-today').onclick = () => {
      const d = new Date(); calYM = { y: d.getFullYear(), m: d.getMonth() }; veLop();
    };
    if (mode === 'dd') {
      m.querySelectorAll('[data-cal-dd]').forEach(btn => btn.onclick = function (e) {
        e.stopPropagation();
        const obj = (lopData.dsDiemDanh || []).find(x => x.id === btn.getAttribute('data-cal-dd'));
        if (obj) {
          ddForm = taoFormDD(obj);
          veLop();
          const ed = $('#dd-editor'); if (ed) ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
      m.querySelectorAll('[data-cal-day]').forEach(cell => cell.onclick = function () {
        const ymd = cell.getAttribute('data-cal-day');
        const p = ymd.split('-');
        calYM = { y: Number(p[0]), m: Number(p[1]) - 1 };
        ddForm = taoFormDD({ ngay: ymd });
        veLop();
        const ed = $('#dd-editor'); if (ed) ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    } else {
      m.querySelectorAll('[data-cal-day]').forEach(cell => cell.onclick = function () {
        const ymd = cell.getAttribute('data-cal-day');
        const p = ymd.split('-');
        calYM = { y: Number(p[0]), m: Number(p[1]) - 1 };
        if (!rpRangePick) {
          rpRangePick = ymd;
          rpForm.tuNgay = ymd;
          rpForm.denNgay = ymd;
        } else {
          rpForm.tuNgay = rpRangePick <= ymd ? rpRangePick : ymd;
          rpForm.denNgay = rpRangePick <= ymd ? ymd : rpRangePick;
          rpRangePick = '';
        }
        veLop();
      });
      m.querySelectorAll('[data-rp-quick]').forEach(btn => btn.onclick = function () {
        const k = btn.getAttribute('data-rp-quick');
        const now = new Date();
        let d1, d2;
        if (k === '7d') {
          d2 = now; d1 = new Date(now.getTime() - 7 * 86400e3);
        } else if (k === 'tuan_nay') {
          const thu = (now.getDay() + 6) % 7;
          d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - thu);
          d2 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate() + 6);
        } else if (k === 'tuan_truoc') {
          const thu = (now.getDay() + 6) % 7;
          d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - thu - 1);
          d1 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate() - 6);
        } else if (k === 'thang_nay') {
          d1 = new Date(now.getFullYear(), now.getMonth(), 1);
          d2 = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        } else {
          d1 = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          d2 = new Date(now.getFullYear(), now.getMonth(), 0);
        }
        rpRangePick = '';
        rpForm.tuNgay = ymdTuMs(d1.getTime());
        rpForm.denNgay = ymdTuMs(d2.getTime());
        calYM = { y: d1.getFullYear(), m: d1.getMonth() };
        veLop();
      });
    }
  }

  function ganSuKienRP() {
    const m = $('#noi-dung');
    const layDeChon = () => Object.keys(rpForm.deIds).filter(k => rpForm.deIds[k]);
    const hsListHienTai = () => (rpForm.tk && rpForm.tk.hsTongHop) ? rpForm.tk.hsTongHop
      : (lopData.hs || []).map(x => ({ khoa: x.khoa, ten: x.ten, dd: { tong: 0, co: 0, muon: 0, cp: 0, kp: 0, chiTiet: [] }, btvn: { tongDe: 0, daLam: 0, thieu: [], tbDau: null, tbCao: null, diemList: [] } }));

    $('#rp-tu').onchange = function () { rpForm.tuNgay = this.value; rpRangePick = ''; veLop(); };
    $('#rp-den').onchange = function () { rpForm.denNgay = this.value; rpRangePick = ''; veLop(); };
    $('#rp-gc').oninput = function () { rpForm.ghiChuGV = this.value; };
    $('#rp-td').oninput = function () { rpForm.tieuDe = this.value; };
    $('#rp-nd').oninput = function () { rpForm.noiDung = this.value; };
    $('#rp-msg').oninput = function () { rpForm.tinNhan = this.value; };
    $('#rp-web').oninput = function () { rpForm.thongBaoWeb = this.value; };
    const vp = $('#rp-vp'); if (vp) vp.oninput = function () { rpForm.vanPhongMau = this.value; };
    const lvp = $('#rp-luu-vp');
    if (lvp) lvp.onclick = function () {
      const btn = this; btn.disabled = true;
      apiGV('gvLuuVanPhongMau', rpForm.vanPhongMau).then(val => {
        btn.disabled = false; rpForm.vanPhongMau = val; lopData.vanPhongMau = val;
        bao('Đã lưu văn phong mẫu của thầy.');
      }).catch(e => { btn.disabled = false; bao(e.message, true); });
    };
    const ot = $('#rp-opt-trang'); if (ot) ot.onchange = function () { rpForm.moiHsMotTrang = this.checked; };
    const oc = $('#rp-opt-chung'); if (oc) oc.onchange = function () { rpForm.kemTongKet = this.checked; };
    const locInp = $('#rp-hs-loc');
    if (locInp) locInp.oninput = function () {
      rpForm.hsLoc = this.value;
      const p = this.selectionStart;
      veLop();
      const inp2 = $('#rp-hs-loc');
      if (inp2) { inp2.focus(); try { inp2.setSelectionRange(p, p); } catch (e) {} }
    };

    m.querySelectorAll('[data-rp-de]').forEach(cb => cb.onchange = function () {
      const id = cb.getAttribute('data-rp-de');
      if (cb.checked) rpForm.deIds[id] = true; else delete rpForm.deIds[id];
    });
    m.querySelectorAll('[data-hs-tag]').forEach(btn => btn.onclick = function () {
      const k = btn.getAttribute('data-hs-tag'), tag = btn.getAttribute('data-tag');
      const dg = rpForm.hsDanhGia[k] || (rpForm.hsDanhGia[k] = { tags: {}, ghiChu: '', nhanXet: '' });
      if (!dg.tags) dg.tags = {};
      if (dg.tags[tag]) delete dg.tags[tag]; else dg.tags[tag] = true;
      btn.setAttribute('aria-pressed', dg.tags[tag] ? 'true' : 'false');
    });
    m.querySelectorAll('[data-hs-gc]').forEach(inp => inp.oninput = function () {
      const k = inp.getAttribute('data-hs-gc');
      const dg = rpForm.hsDanhGia[k] || (rpForm.hsDanhGia[k] = { tags: {}, ghiChu: '', nhanXet: '' });
      dg.ghiChu = inp.value;
    });
    m.querySelectorAll('[data-hs-nx]').forEach(ta => ta.oninput = function () {
      const k = ta.getAttribute('data-hs-nx');
      const dg = rpForm.hsDanhGia[k] || (rpForm.hsDanhGia[k] = { tags: {}, ghiChu: '', nhanXet: '' });
      dg.nhanXet = ta.value;
    });

    const chiaDongCanvas_ = function (ctx, text, maxW) {
      const paragraphs = String(text || '').split(/\r?\n/);
      const lines = [];
      paragraphs.forEach(function (para) {
        const words = para.trim().split(/\s+/).filter(Boolean);
        if (!words.length) { lines.push(''); return; }
        let cur = words[0];
        for (let i = 1; i < words.length; i++) {
          const test = cur + ' ' + words[i];
          if (ctx.measureText(test).width <= maxW) cur = test;
          else { lines.push(cur); cur = words[i]; }
        }
        lines.push(cur);
      });
      return lines;
    };
    const boGocRect_ = function (ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    };
    const xuatPhieuAnhHS_ = function (hsObj) {
      const dg = rpForm.hsDanhGia[hsObj.khoa] || {};
      const khoang = ngayDepYMD(rpForm.tuNgay) + ' – ' + ngayDepYMD(rpForm.denNgay);
      const ccTxt = dongChuyenCanHS(hsObj);
      const btTxt = dongBtvnHS(hsObj);
      const nxTxt = String(dg.nhanXet || '').trim() || 'Em chú ý duy trì chuyên cần và hoàn thành đầy đủ bài tập về nhà đúng hạn nhé.';
      const tags = Object.keys(dg.tags || {}).filter(k => dg.tags[k]);

      const W = 820, padX = 38;
      const cvTmp = document.createElement('canvas');
      const ctxTmp = cvTmp.getContext('2d');
      const fontFamily = '"Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctxTmp.font = '500 17px ' + fontFamily;
      const ccLines = chiaDongCanvas_(ctxTmp, ccTxt, W - padX * 2 - 44);
      const btLines = chiaDongCanvas_(ctxTmp, btTxt, W - padX * 2 - 44);
      ctxTmp.font = '500 18px ' + fontFamily;
      const nxLines = chiaDongCanvas_(ctxTmp, nxTxt, W - padX * 2 - 44);

      const hHead = 132;
      const hCC = 48 + ccLines.length * 25;
      const hBT = 48 + btLines.length * 25;
      const hTags = tags.length ? 46 : 0;
      const hNX = 58 + nxLines.length * 28;
      const H = hHead + 26 + hCC + 14 + hBT + (hTags ? 14 + hTags : 0) + 16 + hNX + 64;

      const cv = document.createElement('canvas');
      cv.width = W * 2; cv.height = H * 2;
      const ctx = cv.getContext('2d');
      ctx.scale(2, 2);

      // Nền kem sang trọng
      ctx.fillStyle = '#FBF7F5';
      ctx.fillRect(0, 0, W, H);

      // Header Burgundy -> Purple
      const grad = ctx.createLinearGradient(0, 0, W, hHead);
      grad.addColorStop(0, '#7A1C3A');
      grad.addColorStop(0.58, '#5B1E6E');
      grad.addColorStop(1, '#1E3A5F');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, hHead);

      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.font = '700 13px ' + fontFamily;
      ctx.fillText('PHIẾU THEO DÕI HỌC TẬP · HÓA HỌC 10 (KNTT)', padX, 36);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 30px ' + fontFamily;
      ctx.fillText(hsObj.ten, padX, 76);

      ctx.fillStyle = '#FDE68A';
      ctx.font = '600 15px ' + fontFamily;
      ctx.fillText('📅 Kỳ tổng hợp: ' + khoang + '   ·   👨‍🏫 Thầy Hoàng Hóa 10', padX, 106);

      let curY = hHead + 24;

      // Hộp Chuyên cần
      boGocRect_(ctx, padX, curY, W - padX * 2, hCC, 14);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.strokeStyle = '#E5D6CE'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#0D7A5F'; ctx.font = '800 14px ' + fontFamily;
      ctx.fillText('✓ CHUYÊN CẦN TRÊN LỚP', padX + 20, curY + 26);
      ctx.fillStyle = '#2A1D24'; ctx.font = '500 17px ' + fontFamily;
      ccLines.forEach((ln, idx) => ctx.fillText(ln, padX + 20, curY + 52 + idx * 25));
      curY += hCC + 14;

      // Hộp BTVN
      boGocRect_(ctx, padX, curY, W - padX * 2, hBT, 14);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.strokeStyle = '#E5D6CE'; ctx.stroke();
      ctx.fillStyle = '#6D28D9'; ctx.font = '800 14px ' + fontFamily;
      ctx.fillText('📝 KẾT QUẢ BÀI TẬP VỀ NHÀ', padX + 20, curY + 26);
      ctx.fillStyle = '#2A1D24'; ctx.font = '500 17px ' + fontFamily;
      btLines.forEach((ln, idx) => ctx.fillText(ln, padX + 20, curY + 52 + idx * 25));
      curY += hBT;

      // Tags đánh giá nhanh (nếu có)
      if (tags.length) {
        curY += 14;
        ctx.font = '700 14px ' + fontFamily;
        let tx = padX;
        tags.slice(0, 6).forEach(function (tgName) {
          const tw = ctx.measureText(tgName).width + 24;
          if (tx + tw > W - padX) return;
          boGocRect_(ctx, tx, curY + 6, tw, 32, 16);
          ctx.fillStyle = '#F3E8FF'; ctx.fill();
          ctx.fillStyle = '#6D28D9';
          ctx.fillText(tgName, tx + 12, curY + 27);
          tx += tw + 8;
        });
        curY += hTags;
      }

      // Hộp Nhận xét của Thầy Hoàng
      curY += 16;
      boGocRect_(ctx, padX, curY, W - padX * 2, hNX, 14);
      ctx.fillStyle = '#FFF9F5'; ctx.fill();
      ctx.strokeStyle = '#9E1E4C'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#9E1E4C'; ctx.font = '800 15px ' + fontFamily;
      ctx.fillText('💬 NHẬN XÉT & DẶN DÒ CỦA THẦY HOÀNG', padX + 20, curY + 28);
      ctx.fillStyle = '#1F161B'; ctx.font = '500 18px ' + fontFamily;
      nxLines.forEach((ln, idx) => ctx.fillText(ln, padX + 20, curY + 58 + idx * 28));
      curY += hNX;

      // Footer
      ctx.fillStyle = '#7A6A72';
      ctx.font = '600 13px ' + fontFamily;
      ctx.fillText('Cổng học tập Hóa học 10 · hoangchu54.github.io/hoa10', padX, H - 22);

      cv.toBlob(function (blob) {
        if (!blob) return bao('Không tạo được ảnh PNG.', true);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = ('Phieu-Hoa-10-' + hsObj.ten.replace(/\s+/g, '-')).slice(0, 70) + '.png';

  function taiHS(epTai) {
    if (!epTai && hsCache) { veHS(hsCache); return; }

  }

  function boDauHS_(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase().replace(/\s+/g, ' ').trim();
  }

  function timCapTenTrung_(ds) {
    const out = [];
    const items = (ds || []).map(x => {
      const norm = boDauHS_(x.ten);
      return { goc: x, norm: norm, words: norm.split(' ').filter(Boolean) };
    });
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        if (!a.norm || !b.norm) continue;
        let ngan = a, dai = b;
        if (a.words.length > b.words.length || (a.words.length === b.words.length && a.goc.soLan > b.goc.soLan)) {
          ngan = b; dai = a;
        }
        if (a.norm === b.norm) {
          out.push({ tu: ngan.goc, sang: dai.goc, lyDo: 'Trùng tên không dấu' });
        } else if (ngan.words.length >= 2 && dai.words.length > ngan.words.length && (' ' + dai.norm).slice(-(' ' + ngan.norm).length) === (' ' + ngan.norm)) {
          out.push({ tu: ngan.goc, sang: dai.goc, lyDo: 'Cùng tên đệm & tên gọi' });
        }
      }
    }
    return out;
  }

          lopData = null; thData = null;
          taiHS(true);
        }).catch(e => { b.disabled = false; bao(e.message, true); });
      });
    });
    document.querySelectorAll('[data-sua-ten]').forEach(b => b.onclick = () => document.getElementById('sua-' + b.getAttribute('data-sua-ten')).classList.toggle('an'));
    document.querySelectorAll('[data-luu-ten]').forEach(b => b.onclick = () => { const i = Number(b.getAttribute('data-luu-ten')); apiGV('gvDoiTenHS', ds[i].khoa, document.getElementById('tm-' + i).value).then(r => { bao(r.gop ? 'Đã gộp vào học sinh trùng tên.' : 'Đã đổi tên.'); lopData = null; thData = null; taiHS(true); }).catch(e => bao(e.message, true)); });
    document.querySelectorAll('[data-xoa-hs]').forEach(b => b.onclick = () => { const x = ds[Number(b.getAttribute('data-xoa-hs'))]; hoi('Xóa ' + x.ten + ' khỏi danh sách? Bài làm cũ vẫn giữ trong Sheet.').then(ok => ok && apiGV('gvXoaHS', x.khoa).then(() => { bao('Đã xóa.'); lopData = null; thData = null; taiHS(true); }).catch(e => bao(e.message, true))); });
  }

  // ================= CÀI ĐẶT AI (CLAUDE / GATEWAY NGOÀI) =================
  let moCaiDat = function () {};
  (function () {
    const TU_GO = '__tu_go__';
    const BASE_MAC_DINH = 'https://api.anthropic.com';
    const CLAUDE_GOI_Y = [
      { id: 'claude-opus-4-6', ten: 'claude-opus-4-6 (Khuyên dùng - chuẩn Hóa nhất)' },
      { id: 'claude-sonnet-4-6', ten: 'claude-sonnet-4-6 (Nhanh & cân bằng)' },
      { id: 'claude-haiku-4-5-20251001', ten: 'claude-haiku-4-5-20251001 (Nhanh & rẻ)' }
    ];
    const el = id => document.getElementById(id);
    function goi(ten) { const a = Array.prototype.slice.call(arguments, 1); return apiGV.apply(null, [ten].concat(a)); }
    function baoCD(m, kieu) { const d = el('cd-tb'); d.textContent = m || ''; d.style.color = kieu === 'loi' ? 'var(--loi)' : (kieu === 'ok' ? 'var(--ok)' : ''); }
    let modelDangDung = '';
    function formatChon() { return el('cd-format').value === 'openai' ? 'openai' : 'anthropic'; }
    function baseChon() { return el('cd-base').value.trim() || BASE_MAC_DINH; }
    function modelChon() { return el('cd-model').value === TU_GO ? el('cd-tu-go').value.trim() : el('cd-model').value; }
    function veDanhSach(ds) {
      const s = el('cd-model'); s.innerHTML = '';
      const co = ds.some(m => m.id === modelDangDung);
      if (modelDangDung && !co) { const o = document.createElement('option'); o.value = modelDangDung; o.textContent = modelDangDung + ' (đang dùng)'; s.appendChild(o); }
      ds.forEach(function (m) { const o = document.createElement('option'); o.value = m.id; o.textContent = (m.ten && m.ten !== m.id ? m.id + ' · ' + m.ten : m.id) + (m.id === modelDangDung ? ' (đang dùng)' : ''); s.appendChild(o); });
      const o = document.createElement('option'); o.value = TU_GO; o.textContent = 'Tự gõ tên model khác...'; s.appendChild(o);
      s.value = modelDangDung || (ds[0] && ds[0].id) || TU_GO;
      el('cd-tu-go').classList.toggle('an', s.value !== TU_GO);
    }
    function taiDanhSach() {
      baoCD('Đang lấy danh sách model...');
      return goi('gvDanhSachModel', formatChon(), baseChon(), el('cd-key').value.trim()).then(function (ds) {
        veDanhSach(ds); baoCD(ds.length ? 'Có ' + ds.length + ' model từ gateway.' : 'Không thấy model nào, tự chọn hoặc gõ tên model.');
      }).catch(function (e) { veDanhSach(CLAUDE_GOI_Y); baoCD('Không lấy được danh sách tự động (' + e.message + '). Có thể chọn gợi ý hoặc tự gõ tên model.', 'loi'); });
    }
    function mo() {
      el('cd-gem').classList.remove('an'); el('cd-key').value = ''; baoCD('');
      goi('gvLayCaiDatAI').then(function (r) {
        el('cd-format').value = r.gatewayFormat || 'anthropic';
        el('cd-base').value = r.baseUrl || BASE_MAC_DINH;
        modelDangDung = r.model || 'claude-opus-4-6';
        if (r.coKey) {
          el('cd-key-ghi').textContent = 'Đang có khóa kết thúc bằng ...' + r.duoiKey + '. Để trống nếu không đổi.';
          veDanhSach(CLAUDE_GOI_Y);
        } else {
          el('cd-key-ghi').textContent = 'Chưa có khóa. Dán API key Anthropic hoặc key gateway mua ngoài.';
          veDanhSach(CLAUDE_GOI_Y);
        }
      }).catch(e => baoCD(e.message, 'loi'));
    }
    moCaiDat = mo;
    function dong() { el('cd-gem').classList.add('an'); }
    el('cd-base-mac').onclick = function () { el('cd-base').value = BASE_MAC_DINH; el('cd-format').value = 'anthropic'; baoCD(''); };
    el('cd-model').onchange = function () { el('cd-tu-go').classList.toggle('an', this.value !== TU_GO); if (this.value === TU_GO) el('cd-tu-go').focus(); baoCD(''); };
    el('cd-tai').onclick = taiDanhSach;
    el('cd-dong').onclick = dong;
    el('cd-gem').addEventListener('keydown', e => { if (e.key === 'Escape') dong(); });
    el('cd-thu').onclick = function () {
      const m = modelChon(); if (!m) return baoCD('Chọn hoặc gõ tên model.', 'loi');
      const n = this; n.disabled = true; baoCD('Đang gửi thử tới ' + m + '...');
      goi('gvKiemTraModel', formatChon(), baseChon(), m, el('cd-key').value.trim()).then(r => baoCD(r.thongBao, r.ok ? 'ok' : 'loi')).catch(e => baoCD(e.message, 'loi')).then(() => { n.disabled = false; });
    };
    el('cd-luu').onclick = function () {
      const m = modelChon(); if (!m) return baoCD('Chọn hoặc gõ tên model.', 'loi');
      const n = this; n.disabled = true;
      goi('gvLuuCaiDatAI', formatChon(), baseChon(), el('cd-key').value.trim(), m).then(function (r) {
        modelDangDung = r.model; el('cd-key').value = '';
        if (info) { info.provider = 'claude'; info.gatewayFormat = r.gatewayFormat; info.baseUrl = r.baseUrl; info.model = r.model; info.coKey = r.coKey; }
        if (lopData && lopData.ai) { lopData.ai.coKey = r.coKey; lopData.ai.model = r.model; }
        if (tab === 'tao') veTao();
        else if (tab === 'lop') veLop();
        baoCD('Đã lưu (' + r.model + ').', 'ok');
        setTimeout(dong, 1000);
      }).catch(e => baoCD(e.message, 'loi')).then(() => { n.disabled = false; });
    };
  })();

  if (token) khoiDong(); else veDangNhap();
})();
</script>
</body>
