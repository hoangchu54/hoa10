  function moXemTruocA4() {
    if (!viecLam) return;
    const daDuyet = viecLam.cau.filter(c => c.trangThai === 'da_duyet');
    let chiDuyet = daDuyet.length > 0;
    let kemDapAn = true;

    const hop = document.createElement('div');
    hop.className = 'hopdn';
    hop.innerHTML = '<div class="the rong" style="padding:0;display:flex;flex-direction:column;max-height:92vh">' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--vien);position:sticky;top:0;background:var(--the);z-index:2">' +
        '<b style="font-size:15.5px;margin-right:auto">Xem trước bản in A4</b>' +
        '<label class="chon" style="min-height:auto"><input type="checkbox" data-x="duyet"' + (chiDuyet ? ' checked' : '') + '>Chỉ câu đã duyệt (' + daDuyet.length + ')</label>' +
        '<label class="chon" style="min-height:auto"><input type="checkbox" data-x="da" checked>Kèm đáp án</label>' +
        '<button type="button" class="nut nho chinh" data-x="in">In / Lưu PDF</button>' +
        '<button type="button" class="nut nho" data-x="dong">Đóng</button>' +
      '</div>' +
      '<div class="a4-wrap" data-x="wrap" style="overflow:auto"></div></div>';
    document.body.appendChild(hop);

    const veA4 = function () {
      const ds = chiDuyet ? daDuyet : viecLam.cau;
      let s = '<div class="a4-sheet" id="a4-print-area">' +
        '<div class="a4-head"><div class="a4-td">' + esc(viecLam.bo.ten) + '</div>' +
        '<div class="a4-sub">Hóa học 10 – Kết nối tri thức · ' + ds.length + ' câu</div></div>';
      if (!ds.length) {
        s += '<p>Chưa có câu nào phù hợp.</p>';
      } else {
        ds.forEach(function (c, i) {
          s += '<div class="a4-q"><b>Câu ' + (i + 1) + '.</b> ' + md(c.cauHoi);
          if (c.loai === 'tn') {
            s += '<div class="a4-lc-grid">' + c.luaChon.map((t, j) => '<div><b>' + 'ABCD'.charAt(j) + '.</b> ' + md(t) + '</div>').join('') + '</div>';
          } else if (c.loai === 'ds') {
            s += '<div style="margin:4px 0 0 14px">' + (c.luaChon || []).map((t, j) => '<div><b>' + 'abcd'.charAt(j) + ')</b> ' + md(t) + '</div>').join('') + '</div>';
          }
          s += '</div>';
        });
        if (kemDapAn) {
          s += '<hr style="margin:18px 0;border:0;border-top:1.5px solid #222"><div style="font-size:16px;font-weight:700;margin-bottom:8px">ĐÁP ÁN &amp; LỜI GIẢI</div>';
          ds.forEach(function (c, i) {
            let da;
            if (c.loai === 'tn') da = 'ABCD'.charAt(c.dapAn) + '. ' + (c.luaChon[c.dapAn] || '');
            else if (c.loai === 'ds') da = (c.dapAn || []).map((v, j) => 'abcd'.charAt(j) + ') ' + (v ? 'Đúng' : 'Sai')).join(' · ');
            else if (c.loai === 'so') da = c.dapAn;
            else da = (c.chapNhan || []).join(' / ');
            s += '<div style="margin-bottom:6px"><b>Câu ' + (i + 1) + ':</b> ' + md(da) + (c.loiGiai ? ' — <i>' + md(c.loiGiai) + '</i>' : '') + '</div>';
          });
        }
      }
      s += '</div>';
      hop.querySelector('[data-x="wrap"]').innerHTML = s;
    };
    veA4();

    const dong = () => { hop.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = e => { if (e.key === 'Escape') dong(); };
    document.addEventListener('keydown', onEsc);
    hop.onclick = e => { if (e.target === hop) dong(); };
    hop.querySelector('[data-x="dong"]').onclick = dong;
    hop.querySelector('[data-x="duyet"]').onchange = function () { chiDuyet = this.checked; veA4(); };
    hop.querySelector('[data-x="da"]').onchange = function () { kemDapAn = this.checked; veA4(); };
    hop.querySelector('[data-x="in"]').onclick = () => window.print();
  }

  function moTaBai(cau) { const ids = []; cau.forEach(c => { if (ids.indexOf(c.bai) < 0) ids.push(c.bai); }); return ids.map(id => id === 'MD' ? 'Mở đầu' : 'Bài ' + id).join(', '); }
  function thuMucDuKien(cau) {
    const ds = cau.filter(c => c.trangThai === 'da_duyet'); const bai = {}; const ch = {};
    (ds.length ? ds : cau).forEach(c => { bai[c.bai] = 1; ch[chuongCua[c.bai]] = 1; });
    const cs = Object.keys(ch), bs = Object.keys(bai);
    if (cs.length !== 1) return 'Đề nhiều chương';
    const c = info.mucLuc.find(x => x.id === cs[0]);
    return bs.length === 1 ? c.ten + ' › ' + (tenBai[bs[0]] || '') : c.ten;
  }

  function veCau(c, i) {
    const lop = c.trangThai === 'da_duyet' ? ' duyet' : (c.canhBao ? ' canh' : '');
    const aiTen = tenAI();
    let h = '<article class="the-cau' + lop + '" id="c-' + esc(c.id) + '">' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">' +
        '<b>Câu ' + (i + 1) + '</b>' +
        '<span class="chip">' + TEN_LOAI[c.loai] + '</span>' +
        '<span class="chip">' + esc(c.bai === 'MD' ? 'Mở đầu' : 'Bài ' + c.bai) + '</span>' +
        (c.nguon && c.nguon !== 'moi' ? '<span class="chip chinh">' + esc(TEN_NGUON[c.nguon] || c.nguon) + '</span>' : '') +
        (c.trangThai === 'da_duyet' ? '<span class="chip ok">Đã duyệt</span>' : '<span class="chip canh">Chờ duyệt</span>') +
        (c.daKiemTra ? '<span class="chip ok">AI kiểm tra: ổn</span>' : '') +
        (c.trungGoc ? '<span class="chip ok">AI giải lại: trùng gốc</span>' : '') +
      '</div>' +
      '<div style="font-size:15px;line-height:1.55">' + md(c.cauHoi) + '</div>';
    if (c.loai === 'tn') {
      h += '<div class="lc4">' + c.luaChon.map((t, j) => '<span' + (j === c.dapAn ? ' class="dung"' : '') + '>' + 'ABCD'.charAt(j) + '. ' + md(t) + (j === c.dapAn ? ' ✓' : '') + '</span>').join('') + '</div>';
    } else if (c.loai === 'ds') {
      h += '<div class="ds-list">' + (c.luaChon || []).map((t, j) => {
        const dung = !!(c.dapAn && c.dapAn[j]);
        return '<div class="ds-row' + (dung ? ' dung' : '') + '"><span class="ds-key">' + 'abcd'.charAt(j) + ')</span><span class="ds-txt">' + md(t) + '</span><span class="chip ' + (dung ? 'ok' : 'loi') + '">' + (dung ? 'Đúng' : 'Sai') + '</span></div>';
      }).join('') + '</div>';
    } else if (c.loai === 'so') {
      h += '<div style="font-size:14px">Đáp số: <b style="color:var(--ok)">' + esc(c.dapAn) + '</b> · Sai số cho phép: ' + esc(c.saiSo) + '</div>';
    } else {
      h += '<div style="font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">Đáp án chấp nhận: ' + c.chapNhan.map(s => '<span class="chip ok">' + md(s) + '</span>').join('') + ' · ' + (c.phanBietHoa ? 'Phân biệt hoa' : 'Không phân biệt hoa') + '</div>';
    }
    if (c.loiGiai) h += '<div class="loi-giai"><b>Lời giải:</b> ' + md(c.loiGiai) + '</div>';
    if (c.canhBao) h += '<div class="thongbao canh" style="margin:0">' + esc(c.canhBao) + '</div>';
    h += '<div class="hang-nut">' +
      (c.trangThai === 'da_duyet' ? '<button type="button" class="nut nho" data-bo-duyet="' + esc(c.id) + '">Bỏ duyệt</button>' : '<button type="button" class="nut nho xanh" data-duyet="' + esc(c.id) + '">Duyệt</button>') +
      '<button type="button" class="nut nho" data-sua="' + esc(c.id) + '">Sửa</button>' +
      '<button type="button" class="nut nho vien" data-kt="' + esc(c.id) + '">' + aiTen + ' kiểm tra lại</button>' +
      (c.laTrung ? '<button type="button" class="nut nho xoa" data-xoa-trung="' + esc(c.id) + '">Xóa câu trùng</button>' : '') +
      (c.coDapAnGemini ? '<button type="button" class="nut nho tim" data-dung-gem="' + esc(c.id) + '">Dùng đáp án AI</button>' : '') +
      (c.laTrung ? '' : '<button type="button" class="nut nho xoa" data-xoa="' + esc(c.id) + '">Xóa</button>') +
    '</div></article>';
    return h;
  }

  function veSua(c, i) {
    const id = esc(c.id);
    let opt = ''; Object.keys(tenBai).forEach(b => { opt += '<option value="' + esc(b) + '"' + (b === c.bai ? ' selected' : '') + '>' + esc(tenBai[b]) + '</option>'; });
    let h = '<article class="the-cau" id="c-' + id + '" style="border:2px solid var(--do)">' +
      '<div style="display:flex;gap:8px;align-items:center"><b>Sửa câu ' + (i + 1) + '</b><span class="chip">' + (TEN_LOAI[c.loai] || c.loai) + '</span></div>' +
      '<div class="truong"><label for="bai-' + id + '">Bài</label><select id="bai-' + id + '">' + opt + '</select></div>' +
      '<div class="truong"><label for="nd-' + id + '">Câu hỏi (hỗ trợ _{chỉ số}, ^{số mũ}, **đậm**)</label><textarea id="nd-' + id + '" rows="3">' + esc(c.cauHoi) + '</textarea></div>';
    if (c.loai === 'tn') {
      h += '<div class="nhap-lc"><span class="nhan-o">Đúng</span><span class="nhan-o">Lựa chọn</span>';
      for (let j = 0; j < 4; j++) h += '<input type="radio" name="da-' + id + '" value="' + j + '"' + (j === c.dapAn ? ' checked' : '') + '><input type="text" id="lc-' + id + '-' + j + '" value="' + esc(c.luaChon[j] || '') + '">';
      h += '</div>';
    } else if (c.loai === 'ds') {
      h += '<div class="ds-list">';
      for (let j = 0; j < 4; j++) {
        const dung = !!(c.dapAn && c.dapAn[j]);
        h += '<div class="ds-row">' +
          '<span class="ds-key">' + 'abcd'.charAt(j) + ')</span>' +
          '<input type="text" id="ds-lc-' + id + '-' + j + '" value="' + esc((c.luaChon && c.luaChon[j]) || '') + '" style="flex:1 1 220px">' +
          '<select id="ds-da-' + id + '-' + j + '" style="width:96px"><option value="1"' + (dung ? ' selected' : '') + '>Đúng</option><option value="0"' + (!dung ? ' selected' : '') + '>Sai</option></select>' +
        '</div>';
      }
      h += '</div>';
    } else if (c.loai === 'so') {
      h += '<div class="hang"><div class="truong" style="flex:1 1 160px"><label for="so-' + id + '">Đáp số</label><input id="so-' + id + '" type="text" inputmode="decimal" value="' + esc(c.dapAn) + '"></div>' +
        '<div class="truong" style="flex:1 1 160px"><label for="ss-' + id + '">Sai số cho phép</label><input id="ss-' + id + '" type="text" inputmode="decimal" value="' + esc(c.saiSo) + '"></div></div>';
    } else {
      h += '<div class="truong"><label for="cn-' + id + '">Đáp án chấp nhận (mỗi dòng 1 cách viết)</label><textarea id="cn-' + id + '" rows="3">' + esc(c.chapNhan.join('\n')) + '</textarea></div>' +
        '<label class="chon"><input type="checkbox" id="hoa-' + id + '"' + (c.phanBietHoa ? ' checked' : '') + '>Phân biệt chữ hoa</label>';
    }
    h += '<div class="truong"><label for="lg-' + id + '">Lời giải</label><textarea id="lg-' + id + '" rows="2">' + esc(c.loiGiai) + '</textarea></div>' +
      '<div class="hang-nut"><button type="button" class="nut nho vien" data-luu-giu="' + id + '">Lưu</button><button type="button" class="nut nho chinh" data-luu="' + id + '">Lưu và duyệt</button><button type="button" class="nut nho" data-huy="' + id + '">Hủy</button></div></article>';
    return h;
  }

  function luuSua(id, duyet) {
    const c = viecLam.cau.find(x => x.id === id);
    const q = { id: id, bai: document.getElementById('bai-' + id).value, cauHoi: document.getElementById('nd-' + id).value, loiGiai: document.getElementById('lg-' + id).value };
    if (c.loai === 'tn') { q.luaChon = [0, 1, 2, 3].map(j => document.getElementById('lc-' + id + '-' + j).value); const r = document.querySelector('input[name="da-' + id + '"]:checked'); q.dapAn = r ? Number(r.value) : 0; if (q.luaChon.some(s => !s.trim())) return bao('Điền đủ 4 lựa chọn.', true); }
    else if (c.loai === 'ds') { q.luaChon = [0, 1, 2, 3].map(j => document.getElementById('ds-lc-' + id + '-' + j).value); q.dapAn = [0, 1, 2, 3].map(j => document.getElementById('ds-da-' + id + '-' + j).value === '1'); if (q.luaChon.some(s => !s.trim())) return bao('Điền đủ 4 mệnh đề a, b, c, d.', true); }
    else if (c.loai === 'so') { q.dapAn = document.getElementById('so-' + id).value; q.saiSo = document.getElementById('ss-' + id).value; }
    else { q.chapNhan = document.getElementById('cn-' + id).value.split('\n'); q.phanBietHoa = document.getElementById('hoa-' + id).checked; }
    apiGV('gvLuuCau', q).then(function (moi) {
      if (!duyet) { viecLam.cau = viecLam.cau.map(x => x.id === id ? moi : x); dangSua = null; veViecLam(); bao('Đã lưu câu.'); return; }
      return apiGV('gvDoiTrangThai', [id], 'da_duyet').then(function () { moi.trangThai = 'da_duyet'; viecLam.cau = viecLam.cau.map(x => x.id === id ? moi : x); dangSua = null; veViecLam(); bao('Đã lưu và duyệt.'); });
    }).catch(e => bao(e.message, true));
  }

  async function kiemTraLai(ids, nut) {
    const chu = nut.textContent; nut.disabled = true;
    const aiTen = tenAI();
    const nhom = chiaNhom_(ids, 8);
    let tongSai = 0, tongDaKiem = 0;
    try {
      for (let i = 0; i < nhom.length; i++) {
        nut.textContent = aiTen + ' đang giải (' + (i + 1) + '/' + nhom.length + ')...';
        const moi = await apiGV('gvKiemTraLai', nhom[i]);
        const map = {}; (moi || []).forEach(x => map[x.id] = x);
        viecLam.cau = viecLam.cau.map(x => map[x.id] || x);
        tongSai += (moi || []).filter(x => x.canhBao).length;
        tongDaKiem += (moi || []).length;
      }
      veViecLam();
      bao(tongSai ? tongSai + ' câu ' + aiTen + ' nghi sai, xem cảnh báo vàng.' : (tongDaKiem > 1 ? aiTen + ' kiểm tra xong, cả ' + tongDaKiem + ' câu đều ổn.' : aiTen + ' kiểm tra: ổn.'), !!tongSai);
    } catch (e) {
      nut.disabled = false; nut.textContent = chu; bao(e.message, true);
    }
  }

  function xuatWord() {
    const n = $('#xuat-word'); n.disabled = true; n.textContent = 'Đang xuất...';
    apiGV('gvXuatWord', viecLam.bo.id).then(function (r) {
      n.disabled = false; n.textContent = 'Xuất file Word';
      let taiDuoc = false;
      try {
        const bin = atob(r.data), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
        const a = document.createElement('a'); a.href = url; a.download = r.ten; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        taiDuoc = true;
      } catch (e) {}
      $('#kq-xuat').innerHTML = '<div class="thongbao ok" style="margin-top:10px">' + (taiDuoc ? 'Đã tải <b>' + esc(r.ten) + '</b>. ' : '') +
        'Drive: <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Mở file</a> · <a href="' + esc(r.thuMucUrl) + '" target="_blank" rel="noopener">Thư mục Xuất tạm</a></div>';
    }).catch(function (e) { n.disabled = false; n.textContent = 'Xuất file Word'; bao(e.message, true); });
  }

  function doiTT(ids, tt) {
    apiGV('gvDoiTrangThai', ids, tt).then(function () {
      if (tt === 'da_xoa') viecLam.cau = viecLam.cau.filter(c => ids.indexOf(c.id) < 0);
      else viecLam.cau.forEach(c => { if (ids.indexOf(c.id) >= 0) c.trangThai = tt; });
      veViecLam();
    }).catch(e => bao(e.message, true));
  }

  function luuDrive() {
    const n = $('#chi-luu'); n.disabled = true;
    apiGV('gvLuuBoDrive', viecLam.bo.id).then(function (r) {
      viecLam.bo.fileUrl = r.fileUrl; n.disabled = false;
      $('#kq-giao').innerHTML = '<div class="thongbao ok">Đã lưu vào thư mục <b>' + esc(r.thuMuc) + '</b>. <a href="' + esc(r.fileUrl) + '" target="_blank" rel="noopener">Mở file</a></div>';
    }).catch(e => { n.disabled = false; bao(e.message, true); });
  }

  function giaoDe() {
    const info2 = { boId: viecLam.bo.id, ten: $('#ten-de').value, ngayMo: docDtl($('#ngay-mo').value), han: docDtl($('#han-nop').value), soCau: Number($('#so-lay').value) || 0 };
    if (!info2.han || info2.han <= info2.ngayMo) return bao('Hạn nộp phải sau ngày mở.', true);
    const n = $('#giao'); n.disabled = true; n.textContent = 'Đang giao...';
    apiGV('gvGiaoDe', info2).then(function (r) {
      n.disabled = false; n.textContent = 'Lưu và giao đề';
      $('#kq-giao').innerHTML = '<div class="thongbao ok">Đã giao đề <b>' + esc(info2.ten) + '</b> (' + r.soCau + ' câu). HS thấy từ ' + esc(tg(info2.ngayMo)) + '. <a href="' + esc(r.fileUrl) + '" target="_blank" rel="noopener">Mở file đề</a></div>';
      bao('Đã giao đề.');
    }).catch(e => { n.disabled = false; n.textContent = 'Lưu và giao đề'; bao(e.message, true); });
  }

  // ================= TAB 2: KHO ĐỀ (thêm Xóa bộ / Xóa đề) =================
  function taiKho() {
    $('#noi-dung').innerHTML = '<h1 class="tieu-trang">Kho đề trên Drive</h1>' + skelCards(3);
    apiGV('gvKho').then(r => { kho = r; veKho(); }).catch(e => { if (e.message !== '__REDIRECT__') $('#noi-dung').innerHTML = '<div class="thongbao loi">' + esc(e.message) + '</div>'; });
  }

  function hopLoc(baiList) {
    if (locKho.loai === 'tat_ca') return true;
    const ch = {}; baiList.forEach(b => ch[chuongCua[b]] = 1);
    if (locKho.loai === 'nhieu') return Object.keys(ch).length > 1;
    if (locKho.loai === 'chuong') return !!ch[locKho.id];
    return baiList.indexOf(locKho.id) >= 0;
  }

  function veKho() {
    const m = $('#noi-dung');
    let duongDan = 'Drive › Hóa 10 BTVN';
    if (locKho.loai === 'chuong') duongDan += ' › ' + esc(info.mucLuc.find(c => c.id === locKho.id).ten);
    if (locKho.loai === 'bai') duongDan += ' › ' + esc(info.mucLuc.find(c => c.id === chuongCua[locKho.id]).ten) + ' › <b>' + esc(tenBai[locKho.id]) + '</b>';
    if (locKho.loai === 'nhieu') duongDan += ' › <b>Đề nhiều chương</b>';

    let h = '<div class="hero-box" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div><span class="chip tim">KHO ĐỀ &amp; BỘ CÂU HỎI</span><h1 style="margin-bottom:2px">Kho đề trên Drive</h1><p class="phu" style="margin:0">' + duongDan + '</p></div>' +
      '<a class="nut nho" href="' + esc(kho.rootUrl) + '" target="_blank" rel="noopener">Mở thư mục Drive</a></div><div class="kho-grid">';

    h += '<div class="cay-tm" role="group" aria-label="Thư mục"><button type="button" class="c" data-loc="tat_ca" aria-pressed="' + (locKho.loai === 'tat_ca') + '">Tất cả</button>';
    kho.mucLuc.forEach(function (c) {
      const tong = c.bai.reduce((s, b) => s + (kho.demBai[b.id] || 0), 0);
      h += '<button type="button" class="c" data-loc="chuong" data-id="' + c.id + '" aria-pressed="' + (locKho.loai === 'chuong' && locKho.id === c.id) + '">' + esc(c.ten) + '<span class="chip">' + tong + '</span></button>';
      const moRa = (locKho.loai === 'chuong' && locKho.id === c.id) || (locKho.loai === 'bai' && chuongCua[locKho.id] === c.id);
      if (moRa) c.bai.forEach(b => { h += '<button type="button" class="b" data-loc="bai" data-id="' + b.id + '" aria-pressed="' + (locKho.loai === 'bai' && locKho.id === b.id) + '">' + esc(b.ten.replace(/^Bài (\d+)\.\s*/, 'Bài $1 · ')) + '<span class="phu">' + (kho.demBai[b.id] || 0) + '</span></button>'; });
    });
    h += '<button type="button" class="c" data-loc="nhieu" aria-pressed="' + (locKho.loai === 'nhieu') + '" style="border-top:1px solid var(--vien);margin-top:4px;padding-top:8px">Đề nhiều chương</button></div>';

    const bos = kho.bo.filter(b => hopLoc(b.bai)), des = kho.de.filter(d => hopLoc(d.bai));
    h += '<div><div class="nhan-muc" style="margin-top:0">Bộ câu hỏi (' + bos.length + ')</div>';
    if (!bos.length) h += '<div class="the"><p class="phu" style="margin:0">Chưa có bộ câu hỏi nào ở đây.</p></div>';
    bos.forEach(function (b) {
      h += '<div class="file-row"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--do)" data-chon-bo="' + esc(b.id) + '"' + (chonBo[b.id] ? ' checked' : '') + '>' +
        '<div class="tt"><b>' + esc(b.ten) + '</b><span class="phu" style="font-size:12.5px">' + b.tong + ' câu · ' + [b.tn && b.tn + ' TN', b.so && b.so + ' số', b.chu && b.chu + ' chữ'].filter(Boolean).join(', ') + ' · đã duyệt ' + b.duyet + '</span></div>' +
        '<div class="hang-nut">' +
          '<button type="button" class="nut nho chinh" data-mo-bo="' + esc(b.id) + '">Duyệt / giao</button>' +
          (b.fileUrl ? '<a class="nut nho" href="' + esc(b.fileUrl) + '" target="_blank" rel="noopener">Drive</a>' : '') +
          '<button type="button" class="nut nho xoa" data-xoa-bo="' + esc(b.id) + '">Xóa bộ</button>' +
        '</div></div>';
    });

    h += '<div class="nhan-muc">Đề đã giao (' + des.length + ')</div>';
    if (!des.length) h += '<div class="the"><p class="phu" style="margin:0">Chưa có đề nào ở đây.</p></div>';
    const now = Date.now();
    des.forEach(function (d) {
      const trangThai = d.an ? 'Đang ẩn' : (d.han < now ? 'Hết hạn' : (d.ngayMo > now ? 'Chưa mở' : 'Đang mở'));
      const clsTT = trangThai === 'Đang mở' ? 'ok' : (trangThai === 'Đang ẩn' ? 'canh' : '');
      h += '<div class="file-row" id="de-' + esc(d.id) + '"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--do)" data-chon-de="' + esc(d.id) + '"' + (chonDe[d.id] ? ' checked' : '') + '>' +
        '<div class="tt"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>' + esc(d.ten) + '</b><span class="chip ' + clsTT + '">' + trangThai + '</span></div>' +
        '<span class="phu" style="font-size:12.5px">' + d.soCau + ' câu · hạn ' + esc(tg(d.han)) + ' · ' + d.soHS + ' HS làm' + (d.tbDau !== null ? ' · TB đầu ' + diem(d.tbDau) : '') + '</span></div>' +
        '<div class="hang-nut">' +
          '<button type="button" class="nut nho" data-doi-han="' + esc(d.id) + '">Đổi hạn</button>' +
          '<button type="button" class="nut nho" data-an="' + esc(d.id) + '" data-gt="' + (d.an ? 0 : 1) + '">' + (d.an ? 'Hiện' : 'Ẩn') + '</button>' +
          (d.fileUrl ? '<a class="nut nho" href="' + esc(d.fileUrl) + '" target="_blank" rel="noopener">Drive</a>' : '') +
          '<button type="button" class="nut nho xoa" data-xoa-de="' + esc(d.id) + '">Xóa đề</button>' +
        '</div>' +
        '<div class="hang an" id="han-' + esc(d.id) + '" style="width:100%;align-items:flex-end;margin-top:6px"><div class="truong" style="flex:0 1 240px"><label for="hm-' + esc(d.id) + '">Hạn nộp mới</label><input type="datetime-local" id="hm-' + esc(d.id) + '" value="' + dtl(d.han) + '"></div><button type="button" class="nut nho chinh" data-luu-han="' + esc(d.id) + '">Lưu hạn</button></div></div>';
    });

    const nBo = Object.keys(chonBo).length, nDe = Object.keys(chonDe).length;
    h += '<div class="the the-noi" style="margin-top:14px"><h2 class="tieu-khoi" style="margin-bottom:6px">Xào lại thành đề mới</h2>' +
      '<p class="phu" style="margin:0 0 10px">Đang chọn <b>' + (nBo + nDe) + ' mục</b> (' + nBo + ' bộ, ' + nDe + ' đề). Chỉ lấy câu đã duyệt.</p>' +
      '<div class="hang" style="align-items:flex-end;margin-bottom:10px"><div class="truong" style="flex:0 1 140px"><label for="xl-so">Số câu cần lấy</label><input id="xl-so" type="number" min="1" value="15"></div>' +
      '<div style="flex:1 1 260px"><label class="chon"><input type="checkbox" id="xl-uu" checked>Ưu tiên câu ít dùng ở đề trước</label><label class="chon"><input type="checkbox" id="xl-doi">Nhờ ' + tenAI() + ' đổi số liệu câu điền số</label></div></div>' +
      '<div class="hang-nut"><button type="button" class="nut chinh" id="xao"' + (nBo + nDe ? '' : ' disabled') + '>Xào lại</button>' + (nBo + nDe ? '<button type="button" class="nut nho" id="bo-chon-kho">Bỏ chọn</button>' : '') + '</div><div id="cho-xao" style="margin-top:8px"></div></div>';

    h += '</div></div>';
    m.innerHTML = h;

    m.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { locKho = { loai: b.getAttribute('data-loc'), id: b.getAttribute('data-id') }; veKho(); });
    m.querySelectorAll('[data-chon-bo]').forEach(i => i.onchange = () => { const id = i.getAttribute('data-chon-bo'); if (i.checked) chonBo[id] = 1; else delete chonBo[id]; veKho(); });
    m.querySelectorAll('[data-chon-de]').forEach(i => i.onchange = () => { const id = i.getAttribute('data-chon-de'); if (i.checked) chonDe[id] = 1; else delete chonDe[id]; veKho(); });
    m.querySelectorAll('[data-mo-bo]').forEach(b => b.onclick = () => moBo(b.getAttribute('data-mo-bo')));
    m.querySelectorAll('[data-doi-han]').forEach(b => b.onclick = () => document.getElementById('han-' + b.getAttribute('data-doi-han')).classList.toggle('an'));
    m.querySelectorAll('[data-luu-han]').forEach(b => b.onclick = () => { const id = b.getAttribute('data-luu-han'); const v = docDtl(document.getElementById('hm-' + id).value); if (!v) return; apiGV('gvSuaDe', id, { han: v }).then(() => { bao('Đã đổi hạn nộp.'); taiKho(); }).catch(e => bao(e.message, true)); });
    m.querySelectorAll('[data-an]').forEach(b => b.onclick = () => apiGV('gvSuaDe', b.getAttribute('data-an'), { an: b.getAttribute('data-gt') === '1' }).then(() => { bao(b.getAttribute('data-gt') === '1' ? 'Đã ẩn đề.' : 'Đã hiện lại đề.'); taiKho(); }).catch(e => bao(e.message, true)));

    m.querySelectorAll('[data-xoa-bo]').forEach(b => b.onclick = () => {
      const id = b.getAttribute('data-xoa-bo');
      const obj = kho.bo.find(x => x.id === id);
      hoi('Xóa bộ "' + (obj ? obj.ten : id) + '"? Các câu chưa nằm trong đề nào sẽ bị ẩn, câu đã giao vẫn giữ nguyên.').then(function (ok) {
        if (!ok) return;
        apiGV('gvXoaBo', id).then(r => { bao('Đã xóa bộ (ẩn ' + r.soCauAn + ' câu chưa dùng, giữ ' + r.soCauGiu + ' câu đã giao).'); taiKho(); }).catch(e => bao(e.message, true));
      });
    });

    m.querySelectorAll('[data-xoa-de]').forEach(b => b.onclick = () => {
      const id = b.getAttribute('data-xoa-de');
      const obj = kho.de.find(x => x.id === id);
      hoi('Xóa đề "' + (obj ? obj.ten : id) + '" khỏi danh sách?').then(function (ok) {
        if (!ok) return;
        apiGV('gvXoaDe', id, false).then(() => { bao('Đã xóa đề.'); taiKho(); }).catch(function (e) {
          if (e.message.indexOf('CO_BAI_LAM:') === 0) {
            const so = e.message.split(':')[1];
            hoi('Đề này đã có ' + so + ' lượt làm của học sinh! Vẫn chắc chắn xóa đề? (lịch sử LanLam vẫn còn trong Sheet)').then(function (ok2) {
              if (!ok2) return;
              apiGV('gvXoaDe', id, true).then(() => { bao('Đã xóa đề.'); taiKho(); }).catch(err => bao(err.message, true));
            });
          } else { bao(e.message, true); }
        });
      });
    });

    const bc = $('#bo-chon-kho'); if (bc) bc.onclick = () => { chonBo = {}; chonDe = {}; veKho(); };
    const x = $('#xao'); if (x) x.onclick = xaoLai;
  }

  function moBo(boId) {
    $('#noi-dung').innerHTML = skelCards(2);
    apiGV('gvLayBo', boId).then(r => { viecLam = r; dangSua = null; nhapGiaoDe = null; locDuyet = 'tat_ca'; doiTab('tao'); setTimeout(() => { const v = $('#vung-lam'); if (v) v.scrollIntoView(); }, 50); }).catch(e => bao(e.message, true));
  }

  function xaoLai() {
    const opts = { boIds: Object.keys(chonBo), deIds: Object.keys(chonDe), soCau: Number($('#xl-so').value) || 15, uuTienChuaDung: $('#xl-uu').checked, doiSoLieu: $('#xl-doi').checked };

  function copyVanBan(txt, okMsg) {
    if (!txt) return bao('Chưa có nội dung để copy.', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => bao(okMsg || 'Đã copy!')).catch(() => copyFallback(txt, okMsg));
    } else { copyFallback(txt, okMsg); }
  }
  function copyFallback(txt, okMsg) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); bao(okMsg || 'Đã copy!'); } catch (e) { bao('Không tự copy được, em bôi đen rồi copy thủ công nhé.', true); }
    ta.remove();
  }

  // ================= TAB: ĐIỂM DANH, REPORT & THÔNG BÁO =================
  function homNayYMD() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function ngayDepYMD(s) {
    const p = String(s || '').split('-');
    return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : (s || '');
  }
  function taoFormDD(src) {
    const hsList = (lopData && lopData.hs) || [];
    const ct = {};
    if (src && src.chiTiet) {
      Object.keys(src.chiTiet).forEach(k => { ct[k] = { tt: src.chiTiet[k].tt || 'co', gc: src.chiTiet[k].gc || '' }; });
    }
    hsList.forEach(x => { if (!ct[x.khoa]) ct[x.khoa] = { tt: 'co', gc: '' }; });
    const ng = (src && src.ngay) || homNayYMD();
    return {
      id: (src && src.id) || '',
      ngay: ng,
      buoi: (src && src.buoi) || ('Buổi ngày ' + ngayDepYMD(ng)),
      noiDung: (src && src.noiDung) || '',
      ghiChu: (src && src.ghiChu) || '',
      chiTiet: ct
    };
  }
  function taoFormRP() {
    const d = new Date();
    const den = homNayYMD();
    const d0 = new Date(d.getTime() - 7 * 86400e3);
    const tu = d0.getFullYear() + '-' + pad(d0.getMonth() + 1) + '-' + pad(d0.getDate());
    const deIds = {};
    if (lopData && lopData.dsDe && lopData.dsDe.length) deIds[lopData.dsDe[0].id] = true;
    return {
      id: '',
      tuNgay: tu,
      denNgay: den,
      deIds: deIds,
      ghiChuGV: '',
      tieuDe: '',
      noiDung: '',
      tinNhan: '',
      thongBaoWeb: (lopData && lopData.thongBaoHienTai) || '',
      tk: null
    };
  }

    const m = $('#noi-dung');

      (lopData.hs || []).forEach(x => { const tt = (ddForm.chiTiet[x.khoa] && ddForm.chiTiet[x.khoa].tt) || 'co'; dem[tt] = (dem[tt] || 0) + 1; });
      $('#dd-dem-co').textContent = dem.co;
      $('#dd-dem-muon').textContent = dem.muon;
      $('#dd-dem-cp').textContent = dem.vang_cp;
      $('#dd-dem-kp').textContent = dem.vang_kp;
    };
    $('#dd-ngay').onchange = function () { ddForm.ngay = this.value; };
    $('#dd-buoi').oninput = function () { ddForm.buoi = this.value; };
    $('#dd-nd').oninput = function () { ddForm.noiDung = this.value; };
    $('#dd-gc').oninput = function () { ddForm.ghiChu = this.value; };
    m.querySelectorAll('[data-dd-k]').forEach(btn => btn.onclick = function () {
      const k = btn.getAttribute('data-dd-k'), tt = btn.getAttribute('data-tt');
      if (!ddForm.chiTiet[k]) ddForm.chiTiet[k] = { tt: 'co', gc: '' };
      ddForm.chiTiet[k].tt = tt;
      btn.parentNode.querySelectorAll('.dd-p').forEach(x => x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'));
      capNhatDem();
    });
    m.querySelectorAll('[data-dd-gc]').forEach(inp => inp.oninput = function () {
      const k = inp.getAttribute('data-dd-gc');
      if (!ddForm.chiTiet[k]) ddForm.chiTiet[k] = { tt: 'co', gc: '' };
      ddForm.chiTiet[k].gc = inp.value;
    });

      (lopData.hs || []).forEach(x => {
        if (!ddForm.chiTiet[x.khoa]) ddForm.chiTiet[x.khoa] = { tt: 'co', gc: '' };
        ddForm.chiTiet[x.khoa].tt = 'co';

      '<h2 class="tieu-khoi" style="margin-bottom:10px">2. Soạn &amp; Lưu Report quản lý lớp</h2>' +

      '<div class="truong" style="margin-bottom:10px"><label for="rp-nd">Nội dung Report (lưu vào Google Sheet BaoCao)</label><textarea id="rp-nd" rows="7" placeholder="Bấm Tổng hợp số liệu ở trên để tự điền hoặc tự viết...">' + esc(rpForm.noiDung) + '</textarea></div>' +
      '<div class="hang-nut" style="justify-content:flex-end;margin-bottom:14px">' +
        (rpForm.id ? '<button type="button" class="nut nho" id="rp-moi">+ Report mới</button>' : '') +
        '<button type="button" class="nut chinh" id="rp-luu">💾 Lưu Report vào Sheet</button>' +
      '</div>' +
      '<div style="border-top:1px solid var(--vien2);padding-top:12px;margin-top:8px">' +
        '<h3 class="tieu-khoi" style="font-size:15px;margin-bottom:8px">3. Tin nhắn &amp; Thông báo bài tập / điểm số</h3>' +
        '<div class="truong" style="margin-bottom:10px"><label for="rp-msg">Tin nhắn gửi nhóm Zalo lớp / phụ huynh</label><textarea id="rp-msg" rows="4" placeholder="Nội dung nhắc nộp bài tập, tuyên dương & điểm số...">' + esc(rpForm.tinNhan) + '</textarea></div>' +
        '<div class="hang-nut" style="margin-bottom:12px"><button type="button" class="nut nho vien" id="rp-copy-msg">📋 Copy tin nhắn Zalo</button></div>' +
        '<div class="truong" style="margin-bottom:10px"><label for="rp-web">Thông báo ghim lên Trang chủ &amp; Trang BTVN học sinh</label><textarea id="rp-web" rows="3" placeholder="Để trống nếu muốn gỡ thông báo trên web học sinh">' + esc(rpForm.thongBaoWeb) + '</textarea></div>' +
        '<div class="hang-nut"><button type="button" class="nut nho tim" id="rp-dang-web">📢 Đăng thông báo lên Web HS</button><button type="button" class="nut nho xoa" id="rp-go-web">Gỡ thông báo</button></div>' +
      '</div>' +
    '</section>';

    h += '<div class="nhan-muc">Lịch sử Report đã lưu (' + bcs.length + ')</div>';
    if (!bcs.length) {
      h += '<div class="the"><p class="phu" style="margin:0">Chưa lưu bản Report nào.</p></div>';
    } else {
      bcs.forEach(function (bc) {
        h += '<div class="file-row"><div class="tt">' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><b>' + esc(bc.tieuDe) + '</b>' +
          (bc.tuNgay || bc.denNgay ? '<span class="chip">' + esc(ngayDepYMD(bc.tuNgay) + ' – ' + ngayDepYMD(bc.denNgay)) + '</span>' : '') +
          '</div><span class="phu" style="font-size:12.5px">Lưu lúc ' + esc(tg(bc.ngayTao)) + '</span></div>' +
          '<div class="hang-nut">' +
            '<button type="button" class="nut nho" data-bc-mo="' + esc(bc.id) + '">Mở / Sửa</button>' +
            (bc.tinNhan ? '<button type="button" class="nut nho vien" data-bc-copy="' + esc(bc.id) + '">Copy Zalo</button>' : '') +
            '<button type="button" class="nut nho xoa" data-bc-xoa="' + esc(bc.id) + '">Xóa</button>' +
          '</div></div>';
      });
    }
    return h;
  }

  function ganSuKienRP() {
    const m = $('#noi-dung');
    const layDeChon = () => Object.keys(rpForm.deIds).filter(k => rpForm.deIds[k]);
    $('#rp-tu').onchange = function () { rpForm.tuNgay = this.value; };
    $('#rp-den').onchange = function () { rpForm.denNgay = this.value; };
    $('#rp-gc').oninput = function () { rpForm.ghiChuGV = this.value; };
    $('#rp-td').oninput = function () { rpForm.tieuDe = this.value; };
    $('#rp-nd').oninput = function () { rpForm.noiDung = this.value; };
    $('#rp-msg').oninput = function () { rpForm.tinNhan = this.value; };
    $('#rp-web').oninput = function () { rpForm.thongBaoWeb = this.value; };
    m.querySelectorAll('[data-rp-de]').forEach(cb => cb.onchange = function () {
      const id = cb.getAttribute('data-rp-de');
      if (cb.checked) rpForm.deIds[id] = true; else delete rpForm.deIds[id];
    });
    $('#rp-tong').onclick = function () {
      const btn = this; btn.disabled = true; btn.textContent = 'Đang tổng hợp...';
      apiGV('gvThongKeKhoang', { tuNgay: rpForm.tuNgay, denNgay: rpForm.denNgay, deIds: layDeChon() }).then(function (tk) {
        rpForm.tk = tk;
        rpForm.tieuDe = tk.tieuDeMau;
        rpForm.noiDung = tk.baoCaoMau;
        rpForm.tinNhan = tk.tinNhanMau;
        if (tk.thongBaoWebMau) rpForm.thongBaoWeb = tk.thongBaoWebMau;
        veLop();
        bao('Đã tổng hợp số liệu và tạo nháp Report.');
      }).catch(e => { btn.disabled = false; btn.textContent = '📊 Tổng hợp số liệu & Tạo nháp'; bao(e.message, true); });
    };
    $('#rp-ai').onclick = function () {
      const btn = this; btn.disabled = true; btn.textContent = 'AI đang viết...';
      apiGV('gvNhapReportAI', { tuNgay: rpForm.tuNgay, denNgay: rpForm.denNgay, deIds: layDeChon(), ghiChuGV: rpForm.ghiChuGV }).then(function (kq) {
        rpForm.tieuDe = kq.tieuDe;
        rpForm.noiDung = kq.baoCao;
        rpForm.tinNhan = kq.tinNhan;
        rpForm.thongBaoWeb = kq.thongBaoWeb;
        veLop();
        bao('AI đã soạn xong bản nháp Report & Thông báo.');
      }).catch(e => { btn.disabled = false; btn.textContent = '✨ Nhờ AI viết mượt hơn'; bao(e.message, true); });
    };
    const rm = $('#rp-moi');
    if (rm) rm.onclick = function () { rpForm = taoFormRP(); veLop(); };
    $('#rp-luu').onclick = function () {
      const btn = this; btn.disabled = true; btn.textContent = 'Đang lưu...';
      apiGV('gvLuuBaoCao', {
        id: rpForm.id, tieuDe: rpForm.tieuDe, tuNgay: rpForm.tuNgay, denNgay: rpForm.denNgay,
        deIds: layDeChon(), noiDung: rpForm.noiDung, tinNhan: rpForm.tinNhan
      }).then(function () {
        bao('Đã lưu Report vào Google Sheet.');
        rpForm.id = '';
        taiLop(true);
      }).catch(e => { btn.disabled = false; btn.textContent = '💾 Lưu Report vào Sheet'; bao(e.message, true); });
    };
    $('#rp-copy-msg').onclick = () => copyVanBan(rpForm.tinNhan, 'Đã copy tin nhắn Zalo.');
    $('#rp-dang-web').onclick = function () {
      const btn = this; btn.disabled = true;
      apiGV('gvDangThongBao', rpForm.thongBaoWeb).then(txt => {
        btn.disabled = false; lopData.thongBaoHienTai = txt;
        bao(txt ? 'Đã đăng thông báo lên Trang chủ & BTVN học sinh.' : 'Đã gỡ thông báo trên web học sinh.');
      }).catch(e => { btn.disabled = false; bao(e.message, true); });
    };
    $('#rp-go-web').onclick = function () {
      rpForm.thongBaoWeb = ''; $('#rp-web').value = '';
      apiGV('gvDangThongBao', '').then(() => { lopData.thongBaoHienTai = ''; bao('Đã gỡ thông báo trên web học sinh.'); }).catch(e => bao(e.message, true));
    };
    m.querySelectorAll('[data-bc-mo]').forEach(b => b.onclick = function () {
      const bc = (lopData.dsBaoCao || []).find(x => x.id === b.getAttribute('data-bc-mo'));
      if (!bc) return;
      rpForm.id = bc.id; rpForm.tieuDe = bc.tieuDe; rpForm.tuNgay = bc.tuNgay; rpForm.denNgay = bc.denNgay;
      rpForm.noiDung = bc.noiDung; rpForm.tinNhan = bc.tinNhan; rpForm.deIds = {};
      (bc.deIds || []).forEach(id => { rpForm.deIds[id] = true; });
      veLop(); window.scrollTo(0, 0);
    });
    m.querySelectorAll('[data-bc-copy]').forEach(b => b.onclick = function () {
      const bc = (lopData.dsBaoCao || []).find(x => x.id === b.getAttribute('data-bc-copy'));
      if (bc) copyVanBan(bc.tinNhan, 'Đã copy tin nhắn Zalo.');
    });
    m.querySelectorAll('[data-bc-xoa]').forEach(b => b.onclick = function () {
      const id = b.getAttribute('data-bc-xoa');
      hoi('Xóa bản Report này khỏi lịch sử?').then(ok => {
        if (!ok) return;
        apiGV('gvXoaBaoCao', id).then(() => { bao('Đã xóa Report.'); taiLop(true); }).catch(e => bao(e.message, true));
      });
    });
  }

  // ================= TAB 5: HỌC SINH (+ Thêm danh sách lớp) =================
  function taiHS() {
    $('#noi-dung').innerHTML = '<h1 class="tieu-trang">Danh sách học sinh</h1>' + skelCards(2);
    apiGV('gvHocSinh').then(veHS).catch(e => { if (e.message !== '__REDIRECT__') $('#noi-dung').innerHTML = '<div class="thongbao loi">' + esc(e.message) + '</div>'; });
  }

  function veHS(ds) {
    let h = '<div class="hero-box" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div><span class="chip ok">QUẢN LÝ LỚP</span><h1 style="margin-bottom:2px">Danh sách học sinh (' + ds.length + ')</h1>' +
      '<p class="phu" style="margin:0">Nếu một bạn gõ tên 2 kiểu, đổi tên dòng sai thành đúng tên còn lại để tự gộp bài làm.</p></div>' +
      '<button type="button" class="nut chinh" id="btn-mo-them-hs">+ Thêm nhanh danh sách lớp</button></div>';

    h += '<section class="the an" id="khung-them-hs" style="margin-bottom:14px">' +
      '<h2 class="tieu-khoi" style="margin-bottom:6px">Dán danh sách họ và tên (mỗi dòng 1 học sinh)</h2>' +
      '<p class="phu" style="margin:0 0 8px">Có thể copy thẳng cột tên từ Excel/Google Sheet (hệ thống tự bỏ số thứ tự đầu dòng nếu có và bỏ qua tên đã tồn tại).</p>' +
      '<textarea id="txt-ds-hs" rows="5" placeholder="Nguyễn Minh Anh&#10;Trần Gia Bảo&#10;Lê Thu Hà"></textarea>' +
      '<div class="hang-nut" style="margin-top:10px"><button type="button" class="nut chinh" id="btn-luu-ds-hs">Lưu danh sách</button><button type="button" class="nut" id="btn-dong-ds-hs">Đóng</button></div></section>';

    h += '<div class="hop-bang"><table><thead><tr><th>Họ và tên</th><th class="so">Số lần làm</th><th>Ngày vào</th><th></th></tr></thead><tbody>';
    if (!ds.length) h += '<tr><td colspan="4" class="phu">Chưa có học sinh nào.</td></tr>';
    ds.forEach(function (x, i) {
      h += '<tr><td><span id="ten-' + i + '" style="font-weight:600">' + esc(x.ten) + '</span>' +
        '<div class="hang an" id="sua-' + i + '" style="gap:8px;align-items:center;margin-top:6px"><input type="text" id="tm-' + i + '" value="' + esc(x.ten) + '" style="flex:1 1 160px;max-width:260px"><button type="button" class="nut nho chinh" data-luu-ten="' + i + '">Lưu</button></div></td>' +
        '<td class="so">' + x.soLan + '</td><td>' + esc(tg(x.ngay)) + '</td>' +
        '<td><div class="hang-nut" style="justify-content:flex-end"><button type="button" class="nut nho" data-sua-ten="' + i + '">Đổi tên</button><button type="button" class="nut nho xoa" data-xoa-hs="' + i + '">Xóa</button></div></td></tr>';
    });
    h += '</tbody></table></div>';
    $('#noi-dung').innerHTML = h;

    $('#btn-mo-them-hs').onclick = () => $('#khung-them-hs').classList.toggle('an');
    $('#btn-dong-ds-hs').onclick = () => $('#khung-them-hs').classList.add('an');
    $('#btn-luu-ds-hs').onclick = function () {
      const btn = this; btn.disabled = true; btn.textContent = 'Đang lưu...';
      apiGV('gvThemNhieuHS', $('#txt-ds-hs').value).then(r => {
        bao('Đã thêm ' + r.them + ' học sinh mới' + (r.boQua ? ' (bỏ qua ' + r.boQua + ' tên trùng)' : '') + '.');
        taiHS();
      }).catch(e => { btn.disabled = false; btn.textContent = 'Lưu danh sách'; bao(e.message, true); });
    };
    document.querySelectorAll('[data-sua-ten]').forEach(b => b.onclick = () => document.getElementById('sua-' + b.getAttribute('data-sua-ten')).classList.toggle('an'));
    document.querySelectorAll('[data-luu-ten]').forEach(b => b.onclick = () => { const i = Number(b.getAttribute('data-luu-ten')); apiGV('gvDoiTenHS', ds[i].khoa, document.getElementById('tm-' + i).value).then(r => { bao(r.gop ? 'Đã gộp vào học sinh trùng tên.' : 'Đã đổi tên.'); taiHS(); }).catch(e => bao(e.message, true)); });
    document.querySelectorAll('[data-xoa-hs]').forEach(b => b.onclick = () => { const x = ds[Number(b.getAttribute('data-xoa-hs'))]; hoi('Xóa ' + x.ten + ' khỏi danh sách? Bài làm cũ vẫn giữ trong Sheet.').then(ok => ok && apiGV('gvXoaHS', x.khoa).then(() => { bao('Đã xóa.'); taiHS(); }).catch(e => bao(e.message, true))); });
  }

  // ================= CÀI ĐẶT AI (CLAUDE & GEMINI) =================
  let moCaiDat = function () {};
  (function () {
    const TU_GO = '__tu_go__';
    const CLAUDE_GOI_Y = [
      { id: 'claude-opus-4-6', ten: 'claude-opus-4-6 (Khuyên dùng - chuẩn Hóa nhất)' },
      { id: 'claude-sonnet-4-6', ten: 'claude-sonnet-4-6 (Nhanh & cân bằng)' },
      { id: 'claude-haiku-4-5-20251001', ten: 'claude-haiku-4-5-20251001 (Nhanh & rẻ)' }
    ];
    const el = id => document.getElementById(id);
    function goi(ten) { const a = Array.prototype.slice.call(arguments, 1); return apiGV.apply(null, [ten].concat(a)); }
    function baoCD(m, kieu) { const d = el('cd-tb'); d.textContent = m || ''; d.style.color = kieu === 'loi' ? 'var(--loi)' : (kieu === 'ok' ? 'var(--ok)' : ''); }
    let aiState = null, modelDangDung = '';
    function providerChon() { return el('cd-provider').value === 'gemini' ? 'gemini' : 'claude'; }
    function modelChon() { return el('cd-model').value === TU_GO ? el('cd-tu-go').value.trim() : el('cd-model').value; }
    function veDanhSach(ds) {
      const s = el('cd-model'); s.innerHTML = '';
      const co = ds.some(m => m.id === modelDangDung);
      if (modelDangDung && !co) { const o = document.createElement('option'); o.value = modelDangDung; o.textContent = modelDangDung + ' (đang dùng)'; s.appendChild(o); }
      ds.forEach(function (m) { const o = document.createElement('option'); o.value = m.id; o.textContent = (m.ten && m.ten !== m.id ? m.id + ' · ' + m.ten : m.id) + (m.id === modelDangDung ? ' (đang dùng)' : ''); s.appendChild(o); });
      const o = document.createElement('option'); o.value = TU_GO; o.textContent = 'Tự gõ tên model khác...'; s.appendChild(o);
      s.value = modelDangDung || (ds[0] && ds[0].id) || TU_GO;
      el('cd-tu-go').classList.toggle('an', s.value !== TU_GO);
    }
    function capNhatUIProvider() {
      const pv = providerChon(), st = aiState ? aiState[pv] : null;
      modelDangDung = (st && st.model) || (pv === 'claude' ? 'claude-opus-4-6' : 'gemini-flash-latest');
      el('cd-key').value = '';
      el('cd-key-nhan').textContent = pv === 'claude' ? 'Khóa API Claude' : 'Khóa API Gemini';
      el('cd-tu-go').placeholder = pv === 'claude' ? 'Gõ tên model, ví dụ claude-opus-4-6' : 'Gõ tên model, ví dụ gemini-flash-latest';
      if (st && st.coKey) {
        el('cd-key-ghi').textContent = 'Đang có khóa kết thúc bằng ...' + st.duoiKey + '. Để trống nếu không đổi.';
        taiDanhSach();
      } else {
        el('cd-key-ghi').textContent = pv === 'claude' ? 'Chưa có khóa. Lấy khóa tại console.anthropic.com.' : 'Chưa có khóa. Lấy khóa tại aistudio.google.com.';
        veDanhSach(pv === 'claude' ? CLAUDE_GOI_Y : []);
      }
    }
    function taiDanhSach() {
      const pv = providerChon(); baoCD('Đang lấy danh sách model...');
      return goi('gvDanhSachModel', pv, el('cd-key').value.trim()).then(function (ds) {
        veDanhSach(ds); baoCD(ds.length ? 'Có ' + ds.length + ' model dùng được với key này.' : 'Không thấy model nào, thử tự gõ tên.');
      }).catch(function (e) { veDanhSach(pv === 'claude' ? CLAUDE_GOI_Y : []); baoCD(e.message, 'loi'); });
    }
    function mo() {
      el('cd-gem').classList.remove('an'); el('cd-key').value = ''; baoCD('');
      goi('gvLayCaiDatAI').then(function (r) { aiState = r; el('cd-provider').value = r.provider || 'claude'; capNhatUIProvider(); }).catch(e => baoCD(e.message, 'loi'));
    }
    moCaiDat = mo;
    function dong() { el('cd-gem').classList.add('an'); }
    el('cd-provider').onchange = function () { baoCD(''); capNhatUIProvider(); };
    el('cd-model').onchange = function () { el('cd-tu-go').classList.toggle('an', this.value !== TU_GO); if (this.value === TU_GO) el('cd-tu-go').focus(); baoCD(''); };
    el('cd-tai').onclick = taiDanhSach;
    el('cd-dong').onclick = dong;
    el('cd-gem').addEventListener('keydown', e => { if (e.key === 'Escape') dong(); });
    el('cd-thu').onclick = function () {
      const pv = providerChon(), m = modelChon(); if (!m) return baoCD('Chọn hoặc gõ tên model.', 'loi');
      const n = this; n.disabled = true; baoCD('Đang gửi thử tới ' + m + '...');
      goi('gvKiemTraModel', pv, m, el('cd-key').value.trim()).then(r => baoCD(r.thongBao, r.ok ? 'ok' : 'loi')).catch(e => baoCD(e.message, 'loi')).then(() => { n.disabled = false; });
    };
    el('cd-luu').onclick = function () {
      const pv = providerChon(), m = modelChon(); if (!m) return baoCD('Chọn hoặc gõ tên model.', 'loi');
      const n = this; n.disabled = true;
      goi('gvLuuCaiDatAI', pv, el('cd-key').value.trim(), m).then(function (r) {
        aiState = r; modelDangDung = r.model; el('cd-key').value = '';
        if (info) { info.provider = r.provider; info.model = r.model; info.coKey = r.coKey; }
        if (tab === 'tao') veTao();
        baoCD('Đã lưu. Dùng ' + (r.provider === 'claude' ? 'Claude' : 'Gemini') + ' (' + r.model + ').', 'ok');
        setTimeout(dong, 1200);
      }).catch(e => baoCD(e.message, 'loi')).then(() => { n.disabled = false; });
    };
  })();

  if (token) khoiDong(); else veDangNhap();
})();
</script>
