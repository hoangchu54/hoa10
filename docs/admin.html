                    : '<div class="phu" style="font-size:12.5px">Nhập đúng kí hiệu nguyên tố viết hoa chữ cái đầu (ví dụ: <code>Na2CO3</code>, <code>Fe(OH)3</code>).</div>') +
                '</div>' +
              '</div>' +

              '<div class="mm-card">' +
                '<b style="font-size:13.8px;color:var(--tim)">⚡ Đổi nhanh Mol (n) ⇄ Khối lượng (m) ⇄ Thể tích khí đkc (24,79 L)</b>' +
                '<div class="hang" style="gap:8px">' +
                  '<div class="truong" style="flex:1 1 105px"><label style="font-size:11.5px">Số mol n (mol)</label><input id="cv-n" type="text" inputmode="decimal" placeholder="VD: 0,2"></div>' +
                  '<div class="truong" style="flex:1 1 115px"><label style="font-size:11.5px">Khối lượng m (g)</label><input id="cv-m" type="text" inputmode="decimal" placeholder="m = n × M"></div>' +
                  '<div class="truong" style="flex:1 1 115px"><label style="font-size:11.5px">V khí đkc (L)</label><input id="cv-v" type="text" inputmode="decimal" placeholder="V = n × 24,79"></div>' +
                '</div>' +
                '<span class="phu" style="font-size:11.5px">Gõ vào 1 trong 3 ô trên, 2 ô còn lại sẽ tự nhảy theo M(' + md(casioFormula) + ') = <b>' + (kqM ? String(kqM.M).replace('.', ',') : '–') + '</b> và <b>24,79 L/mol</b>.</span>' +
              '</div>' +
            '</div>' +
          '</div>';

        const capNhatLCD = function () {
          const eEl = vung.querySelector('#cs-exp'), rEl = vung.querySelector('#cs-res');
          if (eEl) eEl.textContent = casioExp || '0';
          if (rEl) rEl.textContent = casioVal !== null ? dinhDangSoCasio(casioVal) : (casioExp ? '…' : '0');
        };
        const bamCasio = function (tok) {
          if (casioVal !== null && /^[0-9.(√]/.test(tok)) {
            casioExp = '';
          } else if (casioVal !== null && /^[+−×÷*/^]/.test(tok)) {
            casioExp = 'Ans';
          }
          casioVal = null;
          casioExp += tok;
          const thu = tinhBieuThucCasio(casioExp);
          const rEl = vung.querySelector('#cs-res'), eEl = vung.querySelector('#cs-exp');
          if (eEl) eEl.textContent = casioExp;
          if (rEl) rEl.textContent = (!isNaN(thu) && isFinite(thu)) ? ('= ' + dinhDangSoCasio(thu)) : '…';
        };
        vung.querySelectorAll('[data-ck]').forEach(function (b) {
          b.onclick = function () { bamCasio(b.getAttribute('data-ck')); };
        });
        vung.querySelectorAll('[data-act]').forEach(function (b) {
          b.onclick = function () {
            const act = b.getAttribute('data-act');
            if (act === 'ac') { casioExp = ''; casioVal = null; capNhatLCD(); }
            else if (act === 'del') { casioExp = casioExp.slice(0, -1); casioVal = null; capNhatLCD(); }
            else if (act === 'eq') {
              const kq = tinhBieuThucCasio(casioExp);
              casioVal = kq;
              if (!isNaN(kq) && isFinite(kq)) casioAns = kq;
              capNhatLCD();
            } else if (act === 'copy') {
              const v = casioVal !== null ? casioVal : tinhBieuThucCasio(casioExp);
              if (!isNaN(v) && isFinite(v)) {
                const str = dinhDangSoCasio(v);
                try { navigator.clipboard.writeText(str); } catch (e) {}
                toast('Đã copy kết quả: ' + str);
              }
            }
          };
        });
        vung.querySelectorAll('[data-rnd]').forEach(function (b) {
          b.onclick = function () {
            const soLe = Number(b.getAttribute('data-rnd'));
            const v = casioVal !== null ? casioVal : tinhBieuThucCasio(casioExp);
            if (!isNaN(v) && isFinite(v)) {
              const rEl = vung.querySelector('#cs-res');
              if (rEl) rEl.textContent = dinhDangSoCasio(v, soLe);
            }
          };
        });
        const useM = vung.querySelector('#cs-use-m');
        if (useM) useM.onclick = function () {
          const mObj = tinhPhanTuKhoi(casioFormula);
          if (mObj) bamCasio(String(mObj.M));
        };
        const toCasio = vung.querySelector('#mm-to-casio');
        if (toCasio) toCasio.onclick = function () {
          const mObj = tinhPhanTuKhoi(casioFormula);
          if (mObj) bamCasio(String(mObj.M));
        };
        const mmInp = vung.querySelector('#mm-inp');
        if (mmInp) {
          mmInp.oninput = function () {
            casioFormula = this.value;
            const pos = this.selectionStart;
            veNoiDung();
            const inp2 = hop.querySelector('#mm-inp');
            if (inp2) { inp2.focus(); try { inp2.setSelectionRange(pos, pos); } catch (e) {} }
          };
        }
        vung.querySelectorAll('[data-f]').forEach(function (b) {
          b.onclick = function () { casioFormula = b.getAttribute('data-f'); veNoiDung(); };
        });

        // Đổi nhanh n - m - V
        const inpN = vung.querySelector('#cv-n'), inpM = vung.querySelector('#cv-m'), inpV = vung.querySelector('#cv-v');
        const docSo = function (s) { return parseFloat(String(s || '').replace(',', '.')); };
        if (inpN && inpM && inpV) {
          inpN.oninput = function () {
            const n = docSo(this.value);
            const mObj = tinhPhanTuKhoi(casioFormula);
            if (isNaN(n)) { inpM.value = ''; inpV.value = ''; return; }
            inpV.value = dinhDangSoCasio(n * 24.79, 3);
            if (mObj) inpM.value = dinhDangSoCasio(n * mObj.M, 3);
          };
          inpM.oninput = function () {
            const m = docSo(this.value);
            const mObj = tinhPhanTuKhoi(casioFormula);
            if (isNaN(m) || !mObj || !mObj.M) { inpN.value = ''; inpV.value = ''; return; }
            const n = m / mObj.M;
            inpN.value = dinhDangSoCasio(n, 4);
            inpV.value = dinhDangSoCasio(n * 24.79, 3);
          };
          inpV.oninput = function () {
            const v = docSo(this.value);
            const mObj = tinhPhanTuKhoi(casioFormula);
            if (isNaN(v)) { inpN.value = ''; inpM.value = ''; return; }
            const n = v / 24.79;
            inpN.value = dinhDangSoCasio(n, 4);
            if (mObj) inpM.value = dinhDangSoCasio(n * mObj.M, 3);
          };
        }
      } else if (tabRef === 'nt') {
        const q = qRef.trim().toLowerCase();
        const ds = BANG_NT_SGK.filter(function (e) {
          if (loaiRef && e.loai !== loaiRef) return false;
          if (!q) return true;
          return (e.kh.toLowerCase() === q) || (String(e.z) === q) ||
            ((e.kh + ' ' + e.ten + ' ' + e.m + ' ' + e.nhom).toLowerCase().indexOf(q) >= 0);
        });
        vung.innerHTML =
          '<div class="hang" style="margin-bottom:10px;align-items:center">' +
            '<input id="ref-q" type="search" placeholder="Gõ kí hiệu, số hiệu Z, tên hoặc M (VD: Fe, 26, 35,5, Cl)..." value="' + esc(qRef) + '" style="flex:2 1 220px">' +
            '<div class="seg">' +
              '<button type="button" data-rl="" class="' + (!loaiRef ? 'on' : '') + '">Tất cả (' + BANG_NT_SGK.length + ')</button>' +
              '<button type="button" data-rl="kl" class="' + (loaiRef === 'kl' ? 'on' : '') + '">Kim loại</button>' +
              '<button type="button" data-rl="pk" class="' + (loaiRef === 'pk' ? 'on' : '') + '">Phi kim</button>' +
              '<button type="button" data-rl="kh" class="' + (loaiRef === 'kh' ? 'on' : '') + '">Khí hiếm</button>' +
            '</div>' +
          '</div>' +
          '<div class="ref-grid">' + (ds.length ? ds.map(function (e) {
            return '<div class="ref-el ' + e.loai + '">' +
              '<div class="ref-el-top"><span class="ref-el-kh">' + esc(e.kh) + '</span><span class="ref-el-z">Z = ' + e.z + '</span></div>' +
              '<div class="ref-el-ten">' + esc(e.ten) + '</div>' +
              '<div class="ref-el-m">M = ' + esc(e.m) + ' <span class="phu" style="font-weight:500;font-size:11px">· χ = ' + esc(e.chi) + '</span></div>' +
              '<div class="ref-el-cfg">' + esc(e.cfg) + '</div>' +
              '<div class="phu" style="font-size:10.8px">CK ' + e.ck + ' · Nhóm ' + esc(e.nhom) + '</div>' +
            '</div>';
          }).join('') : '<div class="phu" style="grid-column:1/-1;text-align:center;padding:18px">Không tìm thấy nguyên tố khớp từ khóa.</div>') +
          '</div>';
        const inp = vung.querySelector('#ref-q');
        if (inp) {
          inp.oninput = function () {
            qRef = this.value;
            const pos = this.selectionStart;
            veNoiDung();
            const inp2 = hop.querySelector('#ref-q');
            if (inp2) { inp2.focus(); try { inp2.setSelectionRange(pos, pos); } catch (e) {} }
          };
        }
        vung.querySelectorAll('[data-rl]').forEach(function (b) {
          b.onclick = function () { loaiRef = b.getAttribute('data-rl'); veNoiDung(); };
        });
      } else {
        vung.innerHTML =
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;max-height:420px;overflow-y:auto">' +
            '<div class="lab-sec"><h3>⚗️ Hằng số &amp; Công thức Mol (Chuẩn KNTT)</h3>' +
              '<div style="font-size:13px;line-height:1.6">' +
                '• <b>Điều kiện chuẩn (đkc: 25 °C, 1 bar):</b><br>  <b>V = n × 24,79</b> (L) ⇒ <b>n = V / 24,79</b> (mol)<br>' +
                '• <b>Khối lượng &amp; Nồng độ:</b><br>  <b>n = m / M</b> · <b>C<sub>M</sub> = n / V<sub>dd(L)</sub></b> · <b>C% = (m<sub>ct</sub> / m<sub>dd</sub>) × 100%</b><br>' +
                '• <b>Số Avogadro:</b> N<sub>A</sub> ≈ 6,022 × 10²³ hạt/mol<br>' +
                '• <b>Hạt cơ bản:</b> Z = số p = số e · Số khối <b>A = Z + N</b>' +
              '</div></div>' +
            '<div class="lab-sec"><h3>🔗 Hiệu độ âm điện &amp; Liên kết (Pauling)</h3>' +
              '<div style="font-size:13px;line-height:1.6">' +
                '• <b>0 ≤ Δχ &lt; 0,4:</b> Cộng hóa trị không phân cực<br>' +
                '• <b>0,4 ≤ Δχ &lt; 1,7:</b> Cộng hóa trị phân cực<br>' +
                '• <b>Δχ ≥ 1,7:</b> Liên kết ion (điển hình: KL mạnh + PK mạnh)<br>' +
                '• <b>Liên kết Hydrogen:</b> H gắn trực tiếp với <b>F, O, N</b> hút cặp e riêng của F, O, N khác (làm tăng nhiệt độ sôi &amp; độ tan trong nước).' +
              '</div></div>' +
            '<div class="lab-sec"><h3>🔥 Biến thiên Enthalpy (Chương 5)</h3>' +
              '<div style="font-size:13px;line-height:1.6">' +
                '• <b>Δ<sub>r</sub>H°<sub>298</sub> &lt; 0:</b> Phản ứng <b>TỎA NHIỆT</b> (thuận lợi)<br>' +
                '• <b>Δ<sub>r</sub>H°<sub>298</sub> &gt; 0:</b> Phản ứng <b>THU NHIỆT</b><br>' +
                '• <b>Theo nhiệt tạo thành (Δ<sub>f</sub>H°):</b><br>  Δ<sub>r</sub>H°<sub>298</sub> = ∑Δ<sub>f</sub>H°<sub>298</sub>(sản phẩm) − ∑Δ<sub>f</sub>H°<sub>298</sub>(chất đầu)<br>' +
                '• <b>Theo năng lượng liên kết (E<sub>b</sub>):</b><br>  Δ<sub>r</sub>H°<sub>298</sub> = ∑E<sub>b</sub>(chất đầu) − ∑E<sub>b</sub>(sản phẩm)' +
              '</div></div>' +
            '<div class="lab-sec"><h3>🧪 Tốc độ phản ứng &amp; Nhận biết Halogen</h3>' +
              '<div style="font-size:13px;line-height:1.6">' +
                '• <b>Hệ số nhiệt độ Van’t Hoff:</b> v<sub>2</sub> / v<sub>1</sub> = γ<sup>(T<sub>2</sub> − T<sub>1</sub>)/10</sup><br>' +
                '• <b>Nhận biết ion Halide bằng AgNO<sub>3</sub>:</b><br>  <b>F⁻</b> (không ↓) · <b>Cl⁻</b> (AgCl↓ trắng) · <b>Br⁻</b> (AgBr↓ vàng nhạt) · <b>I⁻</b> (AgI↓ vàng đậm)<br>' +
                '• <b>Dãy hoạt động KL:</b> K, Ba, Ca, Na, Mg, Al, Zn, Fe, Ni, Sn, Pb, (H), Cu, Hg, Ag, Pt, Au.' +
              '</div></div>' +
          '</div>';
      }
    }

    hop.innerHTML = '<div class="the rong" style="max-width:820px;display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<b style="font-size:16.5px">⚛️ Casio &amp; Sổ tay Hóa 10</b>' +
          '<div class="seg">' +
            '<button type="button" data-rt="casio" class="' + (tabRef === 'casio' ? 'on' : '') + '">🧮 Máy tính Casio &amp; M</button>' +
            '<button type="button" data-rt="nt" class="' + (tabRef === 'nt' ? 'on' : '') + '">⚛️ Bảng Nguyên tố</button>' +
            '<button type="button" data-rt="ct" class="' + (tabRef === 'ct' ? 'on' : '') + '">📐 Công thức SGK</button>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="nut nho chinh" data-x="dong">Đóng (Esc)</button>' +
      '</div>' +
      '<div data-x="body"></div>' +
    '</div>';

    document.body.appendChild(hop);
    veNoiDung();

    const dong = function () { hop.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = function (e) { if (e.key === 'Escape') dong(); };
    document.addEventListener('keydown', onEsc);
    hop.onclick = function (e) { if (e.target === hop) dong(); };
    hop.querySelector('[data-x="dong"]').onclick = dong;
    hop.querySelectorAll('[data-rt]').forEach(function (b) {
      b.onclick = function () {
        tabRef = b.getAttribute('data-rt');
        hop.querySelectorAll('[data-rt]').forEach(function (x) { x.classList.toggle('on', x === b); });
        veNoiDung();
      };
    });
  }

  // ---- Thanh Dock dưới đáy cho Điện thoại + Nút Tra cứu ⚛️ trên Topbar ----
  function ganThanhDieuHuongHS(activePage, opts) {
    opts = opts || {};
    prefetchPages();
    document.body.classList.add('has-mob-dock');

    // Thêm nút "⚛️ Tra cứu" vào .top-right nếu chưa có
    const tr = document.querySelector('.topbar .top-right');
    if (tr && !document.getElementById('btn-quick-ref')) {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = 'btn-quick-ref';
      b.className = 'top-pill';
      b.title = 'Mở Máy tính Casio Hóa học, Bảng nguyên tử khối & Công thức (Phím tắt: Alt + P)';
      b.innerHTML = '🧮 <span>Casio &amp; Tra cứu</span>';
      b.onclick = function () { moBangTraCuu('casio'); };
      const themeBtn = document.getElementById('btn-theme');
      if (themeBtn) tr.insertBefore(b, themeBtn);
      else tr.appendChild(b);
    }

    // Gắn class .top-nav-link cho các nút chuyển trang trên topbar để tự ẩn ở <=640px (nhường chỗ cho Bottom Dock)
    ['btn-home', 'btn-btvn', 'btn-tailieu', 'btn-lab', 'btn-game'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('top-nav-link');
    });
    if (tr) {
      tr.querySelectorAll('.top-pill.on').forEach(function (el) { el.classList.add('top-nav-link'); });
    }

    // Tạo hoặc cập nhật Mobile Bottom Dock
    let dock = document.getElementById('h10-mob-dock');
    if (!dock) {
      dock = document.createElement('nav');
      dock.id = 'h10-mob-dock';
      dock.className = 'mob-dock';
      dock.setAttribute('aria-label', 'Điều hướng nhanh');
      document.body.appendChild(dock);
    }
    const items = [
      { id: 'home', ic: '🏠', ten: 'Trang chủ' },
      { id: 'btvn', ic: '📝', ten: 'Làm BTVN' },
      { id: 'tailieu', ic: '📚', ten: 'Tài liệu' },
      { id: 'thinghiem', ic: '🔬', ten: 'Thí nghiệm' },
      { id: 'trochoi', ic: '🎮', ten: 'Trò chơi' }
    ];
    dock.innerHTML = items.map(function (it) {
      const l = linkTrang(it.id, opts);
      const isCur = it.id === activePage;
      return '<a href="' + esc(l.href) + '" target="' + l.target + '" class="' + (isCur ? 'on' : '') + '"' + (isCur ? ' aria-current="page"' : '') + '>' +
        '<i aria-hidden="true">' + it.ic + '</i><span>' + esc(it.ten) + '</span></a>';
    }).join('');
  }

  // Phím tắt toàn cục trên Máy tính: Alt + P mở Bảng tra cứu Hóa 10
  document.addEventListener('keydown', function (e) {
    if (e.altKey && (e.key === 'p' || e.key === 'P')) {
      e.preventDefault();
      moBangTraCuu();
    }
  });

  try {
    if (window.top !== window.self) document.documentElement.classList.add('in-iframe');
  } catch (e) {
    document.documentElement.classList.add('in-iframe');
  }
  apTheme(layTheme());

  return {
    esc: esc,
    md: md,
    dinhDangCongThuc: dinhDangCongThuc,
    tenDep: tenDep,
    phaoGiay: phaoGiay,
    laGAS: laGAS,
    GAS_EXEC_URL: GAS_EXEC_URL,
    layTheme: layTheme,
    apTheme: apTheme,
    ganNutTheme: ganNutTheme,
    api: api,
    getLocation: getLocation,
    linkTrang: linkTrang,
    toast: toast,
    skelCards: skelCards,
    laDienThoai: laDienThoai,
    renderSlogan: renderSlogan,
    renderGalleryHoa10: renderGalleryHoa10,
    GALLERY_HOA10: GALLERY_HOA10,
    moBangTraCuu: moBangTraCuu,
    ganThanhDieuHuongHS: ganThanhDieuHuongHS,
    docCacheUI: docCacheUI,
    ghiCacheUI: ghiCacheUI,
    ganBungCoVu: ganBungCoVu,
    ganNutLenDau: ganNutLenDau,
    ICONS: ICONS
  };
})();
</script>

<script>
(function () {
  const { esc, md, api: rawApi, laGAS, getLocation, linkTrang, skelCards, laDienThoai, ICONS, ganNutTheme, toast, ganNutLenDau, tenDep } = window.H10;
  ganNutLenDau();
  const $ = s => document.querySelector(s);

  let token = null;
  try { token = sessionStorage.getItem('btvn_gv'); } catch (e) {}

  function api(ten) {
    const args = Array.prototype.slice.call(arguments, 1);
    return rawApi.apply(null, [ten].concat(args)).catch(function (e) {
      const m = (e && e.message) ? e.message : String(e);
      if (m.indexOf('PHIEN_HET_HAN') >= 0) {
        token = null;
        try { sessionStorage.removeItem('btvn_gv'); } catch (x) {}
        veDangNhap('Phiên đăng nhập đã hết, vui lòng đăng nhập lại.');
        throw new Error('__REDIRECT__');
      }
      throw e;
    });
  }
  function apiGV(ten) {
    const a = Array.prototype.slice.call(arguments, 1);
    return api.apply(null, [ten, token].concat(a));
  }
  function bao(m, loi) {
    if (m === '__REDIRECT__') return;
    toast(m, loi);
  }
  function hoi(chu) {
    return new Promise(function (ok) {
      $('#hop-chu').textContent = chu;
      $('#hop').classList.remove('an');
      $('#hop-khong').focus();
      $('#hop-co').onclick = () => { $('#hop').classList.add('an'); ok(true); };
      $('#hop-khong').onclick = () => { $('#hop').classList.add('an'); ok(false); };
    });
  }

  const THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const pad = n => String(n).padStart(2, '0');
  function tg(ms) { if (!ms) return ''; const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' · ' + THU[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }
  function dtl(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function docDtl(v) { return v ? new Date(v).getTime() : 0; }
  function diem(x) { if (x === null || x === undefined || x === '') return '–'; return (Math.round(Number(x) * 10) / 10).toString().replace('.', ','); }
  function phut(giay) { giay = Math.round(giay || 0); return pad(Math.floor(giay / 60)) + ':' + pad(giay % 60); }
  const TEN_LOAI = { tn: 'Nhiều lựa chọn', ds: 'Đúng / Sai', so: 'Trả lời ngắn', chu: 'Trả lời ngắn' };
  const TEN_NGUON = { goc: 'Câu gốc từ tài liệu', tuong_tu: 'Tương tự tài liệu', moi: 'AI tạo mới', xao_lai: 'Xào lại', doi_so_lieu: 'Đổi số liệu', goc_tu_giai: 'Câu gốc, chưa có đáp án' };

  // ================= trạng thái =================
  let laFull = false;
  let info = null;
  let tab = 'tao';

  function sizeDep_(bytes) {
    if (!bytes) return '';
    if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',') + ' MB';
  }

  function taiTaiLieuTheoBai(ids) {
    clearTimeout(driveTimer);
    if (!ids.length) { driveGoiY = []; veDriveBox(); return; }
    driveTimer = setTimeout(function () {
      driveDangTai = true;
      veDriveBox();
      apiGV('gvTaiLieuTheoBai', ids).then(function (r) {
        driveDangTai = false;
        driveGoiY = (r && r.goiY) || [];
        driveTatCa = (r && r.tatCa) || [];
        let autoDem = 0;
        driveGoiY.forEach(function (x) {
          if (x.khopBai && !driveChon[x.fileId] && !driveBoQuaAuto[x.fileId] && autoDem < 2 && (!x.size || x.size <= 15 * 1024 * 1024)) {
            driveChon[x.fileId] = x;
            autoDem++;
          }
        });
        veDriveBox();
        veChip();
      }).catch(function () {
        driveDangTai = false;
        veDriveBox();
      });
    }, 220);
  }

  function veDriveBox() {
    const box = $('#drive-ref-box'); if (!box) return;
    const ids = Object.keys(baiChon);
    const chonList = Object.keys(driveChon).map(k => driveChon[k]);
    let h = '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<b style="font-size:13.5px">Tài liệu tương ứng trên Google Drive</b>' +

        '<span class="phu" style="font-size:12px">' + (chonList.length ? 'Đang chọn ' + chonList.length + ' file Drive' : (ids.length ? 'Chọn thêm file nếu muốn AI bám theo' : 'Chọn bài ở bước 1 để tự gợi ý')) + '</span>') +
    '</div>';

    if (driveGoiY.length) {
      h += '<div class="drive-list">';
      driveGoiY.forEach(function (x) {
        const chk = !!driveChon[x.fileId];
        h += '<label class="drive-item">' +
          '<input type="checkbox" data-drv="' + esc(x.fileId) + '"' + (chk ? ' checked' : '') + '>' +
          '<span class="d-ten" title="' + esc(x.ten) + '">' + esc(x.ten) + '</span>' +
          '<span class="chip">' + esc(x.loai) + '</span>' +
          (x.size ? '<span class="phu" style="font-size:11.5px">' + sizeDep_(x.size) + '</span>' : '') +
        '</label>';
      });
      h += '</div>';
    } else if (ids.length && !driveDangTai) {
      h += '<div class="phu" style="font-size:12.5px;margin-top:6px">Chưa thấy file gắn đúng bài này trong Kho tài liệu. Có thể chọn file khác hoặc dán link Drive ở dưới.</div>';
    }

    const themKhac = driveTatCa.filter(x => !driveGoiY.some(g => g.fileId === x.fileId));
    h += '<div class="hang" style="margin-top:8px;align-items:flex-end">';
    if (themKhac.length) {
      h += '<div class="truong" style="flex:1 1 200px"><label for="drv-sel" style="font-size:12px">Thêm file khác từ Kho Drive</label>' +
        '<select id="drv-sel"><option value="">-- Chọn file --</option>' +
        themKhac.map(x => '<option value="' + esc(x.fileId) + '">' + esc(x.thuMuc + ' › ' + x.ten) + '</option>').join('') +
        '</select></div>';
    }
    h += '<div class="truong" style="flex:1 1 220px"><label for="drv-url" style="font-size:12px">Hoặc dán link / ID file Google Drive bất kỳ</label>' +
      '<div style="display:flex;gap:6px"><input id="drv-url" type="text" placeholder="https://drive.google.com/file/d/..."><button type="button" class="nut nho" id="drv-add">Thêm</button></div></div></div>';

    box.innerHTML = h;

    box.querySelectorAll('[data-drv]').forEach(cb => cb.onchange = () => {
      const fid = cb.getAttribute('data-drv');
      if (cb.checked) {
        const item = driveGoiY.find(x => x.fileId === fid) || driveTatCa.find(x => x.fileId === fid) || { fileId: fid, ten: fid };
        driveChon[fid] = item;
        delete driveBoQuaAuto[fid];
      } else {
        delete driveChon[fid];
        driveBoQuaAuto[fid] = true;
      }
      veChip();
      veDriveBox();
    });
    const sel = $('#drv-sel');
    if (sel) sel.onchange = function () {
      const fid = this.value; if (!fid) return;
      const item = driveTatCa.find(x => x.fileId === fid);
      if (item) { driveChon[fid] = item; delete driveBoQuaAuto[fid]; veDriveBox(); veChip(); }
    };
    const btnAdd = $('#drv-add');
    if (btnAdd) btnAdd.onclick = () => {
      const raw = ($('#drv-url').value || '').trim();
      const m = raw.match(/[-\w]{25,}/);
      if (!m) return bao('Chưa thấy ID file Google Drive hợp lệ.', true);
      const fid = m[0];
      driveChon[fid] = { fileId: fid, ten: 'Link Drive (' + fid.slice(0, 8) + '...)', loai: 'Drive' };
      delete driveBoQuaAuto[fid];
      veDriveBox(); veChip();
    };
  }

  var qcMo = false;
  function sapBaiIds_(ids) {
    return (ids || []).slice().sort(function (a, b) {
      const na = a === 'MD' ? 0 : (Number(a) || 999);
      const nb = b === 'MD' ? 0 : (Number(b) || 999);
      return na - nb;
    });
  }
  function capNhatChon() {
    const ids = sapBaiIds_(Object.keys(baiChon));
    const t = $('#tom-tat');
    if (t) {
      if (!ids.length) {
        t.innerHTML = '<div class="thongbao info" style="margin-bottom:0">Chưa chọn bài nào. Hãy tích chọn ít nhất 1 bài ở trên để xem quy chuẩn kiến thức &amp; dạng bài chuẩn Thông tư 32.</div>';
      } else {
        const qcMap = info.quyChuanBai || {};
        const demMap = info.demCauBai || {};
        const dangList = [];
        const viDuList = [];
        const camList = [];
        const seenVd = {};
        let soCauCu = 0;
        ids.forEach(function (id) {
          soCauCu += Number(demMap[id] || 0);
          const q = qcMap[id];
          if (!q) return;
          const nhan = id === 'MD' ? 'Mở đầu' : 'Bài ' + id;
          if (q.cam) camList.push(nhan + ': ' + q.cam);
          (q.dang || []).forEach(function (d) {
            dangList.push({ bai: nhan, txt: d });

  function themFile(list) {
    const arr = Array.prototype.slice.call(list || []);
    let tong = files.reduce((s, f) => s + f.size, 0);
    arr.forEach(function (f) {
      if (tong + f.size > 15 * 1024 * 1024) { bao('File "' + f.name + '" làm vượt 15 MB, bỏ qua.', true); return; }
      tong += f.size;
      const r = new FileReader();
      r.onload = function () { files.push({ name: f.name, mimeType: f.type || (/\.docx$/i.test(f.name) ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : ''), data: String(r.result).split(',')[1], size: f.size }); veChip(); };
      r.readAsDataURL(f);
    });
  }
  function veChip() {
    const d = $('#ds-chip'); if (!d) return;
    const drvChips = Object.keys(driveChon).map(fid => {

    });
    const upChips = files.map((f, i) => '<span class="chip">' + esc(f.name) + ' (' + Math.max(1, Math.round(f.size / 1024)) + ' KB) <button type="button" style="border:0;background:none;cursor:pointer;display:grid;place-items:center" aria-label="Bỏ" data-bo-file="' + i + '">' + ICONS.x + '</button></span>');

    d.querySelectorAll('[data-bo-drv]').forEach(b => b.onclick = () => {

    const coTL = files.length > 0 || Object.keys(driveChon).length > 0;
    const cach = $('#cach'); if (cach) { cach.disabled = !coTL; cach.style.opacity = coTL ? 1 : .5; }
  }
  function chiaNhom_(arr, size) { const kq = []; for (let i = 0; i < arr.length; i += size) kq.push(arr.slice(i, i + size)); return kq; }

  function taiBase64File(ten, mimeType, b64) {
    if (!b64) return false;
    try {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: mimeType || 'application/octet-stream' }));
      const a = document.createElement('a'); a.href = url; a.download = ten; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return true;
    } catch (e) { return false; }
  }

  function buildDotSongSong_(soCau, loaiChon, baiIds, cach, quyChuan) {
    const buoc = soCau <= 6 ? soCau : 5;
    const nDot = Math.ceil(soCau / buoc);
    const sizes = [];
    let con = soCau;
    for (let i = 0; i < nDot; i++) {
      const sz = Math.ceil(con / (nDot - i));
      sizes.push(sz);
      con -= sz;
    }
    const coTN = loaiChon.indexOf('tn') >= 0;
    const coDS = loaiChon.indexOf('ds') >= 0;
    const coTL = loaiChon.indexOf('tl') >= 0;
    const kieu = [];
    if (coTN) kieu.push({ loai: ['tn'], nhan: 'chỉ tạo câu trắc nghiệm 4 lựa chọn (tn) phần khái niệm, cấu tạo và quy luật biến đổi (mức nhận biết – thông hiểu; không dùng từ "luôn/mọi" làm nhiễu)' });
    if (coTN && sizes.length >= 2) kieu.push({ loai: ['tn'], nhan: 'chỉ tạo câu trắc nghiệm 4 lựa chọn (tn) phần bài tập tính toán định lượng, phân tích hoặc vận dụng thực tế (dùng chất khác với nhóm 1)' });
    if (coDS) kieu.push({ loai: ['ds'], nhan: 'chỉ tạo câu Đúng/Sai 4 ý a, b, c, d (ds) về thí nghiệm, hợp chất đa dạng và trường hợp mở rộng (mệnh đề rõ trước/sau liên kết, không dùng từ tuyệt đối lộ liễu)' });
    if (coTL) kieu.push({ loai: ['tl'], nhan: 'chỉ tạo câu Trả lời ngắn (so hoặc chu) gồm cả bài tập tính số liệu vận dụng và điền công thức/từ khóa (câu hỏi không mơ hồ, rõ hỏi 1 nguyên tử hay cả phân tử)' });

    const gocNhin = [
      'ưu tiên câu nhận biết và khái niệm cơ bản với nhóm chất đại diện khác nhau',
      'ưu tiên câu thông hiểu, giải thích bản chất và so sánh các liên kết khác nhau',
      'ưu tiên câu bài tập tính toán định lượng và vận dụng',
      'ưu tiên câu vận dụng thực tế, thí nghiệm hoặc tổng hợp kiến thức không trùng chất với các nhóm trước'
    ];
    const dangPool = (quyChuan && Array.isArray(quyChuan.dang)) ? quyChuan.dang : [];
    const viDuPool = (quyChuan && Array.isArray(quyChuan.viDu)) ? quyChuan.viDu : [];

    return sizes.map(function (sz, idx) {
      let nhomLoai = loaiChon;
      let focus = gocNhin[idx % gocNhin.length];
      if (sizes.length > 1 && kieu.length > 1) {
        const pick = kieu[idx % kieu.length];
        nhomLoai = pick.loai;
        focus = pick.nhan;
      }
      if (dangPool.length) {
        const dangRieng = dangPool.filter(function (_, j) { return j % sizes.length === idx; });
        const dangGan = dangRieng.length ? dangRieng : [dangPool[idx % dangPool.length]];
        focus += '; TẬP TRUNG VÀO DẠNG BÀI ĐƯỢC PHÂN CÔNG: ' + dangGan.join(' | ');
      }
      if (viDuPool.length) {
        const vdRieng = viDuPool.filter(function (_, j) { return j % sizes.length === idx; });
        const vdGan = vdRieng.length ? vdRieng : [viDuPool[idx % viDuPool.length]];
        focus += '; ƯU TIÊN DÙNG CÁC CHẤT / VÍ DỤ RIÊNG CỦA NHÓM NÀY (để không đụng hàng với nhóm khác): ' + vdGan.join(', ');
      }
      if (baiIds.length > 1) {
        focus += '; ưu tiên bám theo bài "' + baiIds[idx % baiIds.length] + '"';
      }
      if (cach === 'lay_nguyen' && sizes.length > 1) {
        focus += '; lấy các câu nằm ở phần ' + (idx + 1) + '/' + sizes.length + ' của tài liệu';
      }
      return { soCauDot: sz, loai: nhomLoai, focus: focus };
    });
  }

  function moXemTruocA4() {
    if (!viecLam) return;
    const daDuyet = viecLam.cau.filter(c => c.trangThai === 'da_duyet');
    let chiDuyet = daDuyet.length > 0;
    let kemDapAn = true;

    const hop = document.createElement('div');
    hop.className = 'hopdn';
    hop.innerHTML = '<div class="the rong" style="padding:0;display:flex;flex-direction:column;max-height:92vh">' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--vien);position:sticky;top:0;background:var(--the);z-index:2">' +
        '<b style="font-size:15.5px;margin-right:auto">Xem trước bản in A4</b>' +
        '<label class="chon" style="min-height:auto"><input type="checkbox" data-x="duyet"' + (chiDuyet ? ' checked' : '') + '>Chỉ câu đã duyệt (' + daDuyet.length + ')</label>' +
        '<label class="chon" style="min-height:auto"><input type="checkbox" data-x="da" checked>Kèm đáp án</label>' +
        '<button type="button" class="nut nho chinh" data-x="in">In / Lưu PDF</button>' +
        '<button type="button" class="nut nho" data-x="dong">Đóng</button>' +
      '</div>' +
      '<div class="a4-wrap" data-x="wrap" style="overflow:auto"></div></div>';
    document.body.appendChild(hop);

    const veA4 = function () {
      const ds = chiDuyet ? daDuyet : viecLam.cau;
      let s = '<div class="a4-sheet" id="a4-print-area">' +
        '<div class="a4-head"><div class="a4-td">' + esc(viecLam.bo.ten) + '</div>' +
        '<div class="a4-sub">Hóa học 10 – Kết nối tri thức · ' + ds.length + ' câu</div></div>';
      if (!ds.length) {
        s += '<p>Chưa có câu nào phù hợp.</p>';
      } else {
        ds.forEach(function (c, i) {
          s += '<div class="a4-q"><b>Câu ' + (i + 1) + '.</b> ' + md(c.cauHoi);
          if (c.loai === 'tn') {
            s += '<div class="a4-lc-grid">' + c.luaChon.map((t, j) => '<div><b>' + 'ABCD'.charAt(j) + '.</b> ' + md(t) + '</div>').join('') + '</div>';
          } else if (c.loai === 'ds') {
            s += '<div style="margin:4px 0 0 14px">' + (c.luaChon || []).map((t, j) => '<div><b>' + 'abcd'.charAt(j) + ')</b> ' + md(t) + '</div>').join('') + '</div>';
          }
          s += '</div>';
        });
        if (kemDapAn) {
          s += '<hr style="margin:18px 0;border:0;border-top:1.5px solid #222"><div style="font-size:16px;font-weight:700;margin-bottom:8px">ĐÁP ÁN &amp; LỜI GIẢI</div>';
          ds.forEach(function (c, i) {
            let da;
            if (c.loai === 'tn') da = 'ABCD'.charAt(c.dapAn) + '. ' + (c.luaChon[c.dapAn] || '');
            else if (c.loai === 'ds') da = (c.dapAn || []).map((v, j) => 'abcd'.charAt(j) + ') ' + (v ? 'Đúng' : 'Sai')).join(' · ');
            else if (c.loai === 'so') da = c.dapAn;
            else da = (c.chapNhan || []).join(' / ');
            s += '<div style="margin-bottom:6px"><b>Câu ' + (i + 1) + ':</b> ' + md(da) + (c.loiGiai ? ' — <i>' + md(c.loiGiai) + '</i>' : '') + '</div>';
          });
        }
      }
      s += '</div>';
      hop.querySelector('[data-x="wrap"]').innerHTML = s;
    };
    veA4();

    const dong = () => { hop.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = e => { if (e.key === 'Escape') dong(); };
    document.addEventListener('keydown', onEsc);
    hop.onclick = e => { if (e.target === hop) dong(); };
    hop.querySelector('[data-x="dong"]').onclick = dong;
    hop.querySelector('[data-x="duyet"]').onchange = function () { chiDuyet = this.checked; veA4(); };
    hop.querySelector('[data-x="da"]').onchange = function () { kemDapAn = this.checked; veA4(); };
    hop.querySelector('[data-x="in"]').onclick = () => window.print();
  }

  function moTaBai(cau) { const ids = []; cau.forEach(c => { if (ids.indexOf(c.bai) < 0) ids.push(c.bai); }); return sapBaiIds_(ids).map(id => id === 'MD' ? 'Mở đầu' : 'Bài ' + id).join(', '); }
  function thuMucDuKien(cau) {
    const ds = cau.filter(c => c.trangThai === 'da_duyet'); const bai = {}; const ch = {};

  }

  function luuSua(id, duyet) {
    const c = viecLam.cau.find(x => x.id === id);
    const q = { id: id, bai: document.getElementById('bai-' + id).value, cauHoi: document.getElementById('nd-' + id).value, loiGiai: document.getElementById('lg-' + id).value };
    if (c.loai === 'tn') { q.luaChon = [0, 1, 2, 3].map(j => document.getElementById('lc-' + id + '-' + j).value); const r = document.querySelector('input[name="da-' + id + '"]:checked'); q.dapAn = r ? Number(r.value) : 0; if (q.luaChon.some(s => !s.trim())) return bao('Điền đủ 4 lựa chọn.', true); }
    else if (c.loai === 'ds') { q.luaChon = [0, 1, 2, 3].map(j => document.getElementById('ds-lc-' + id + '-' + j).value); q.dapAn = [0, 1, 2, 3].map(j => document.getElementById('ds-da-' + id + '-' + j).value === '1'); if (q.luaChon.some(s => !s.trim())) return bao('Điền đủ 4 mệnh đề a, b, c, d.', true); }
    else {
      const kieu = document.getElementById('tl-kieu-' + id).value;
      q.loai = kieu;
      if (kieu === 'so') { q.dapAn = document.getElementById('so-' + id).value; q.saiSo = document.getElementById('ss-' + id).value; }
      else {
        q.phanBietHoa = document.getElementById('hoa-' + id).checked;
        const seenCn = {};
        q.chapNhan = document.getElementById('cn-' + id).value.split('\n').map(s => s.trim()).filter(s => {
          if (!s) return false;
          const k = q.phanBietHoa ? s : s.toLowerCase();
          if (seenCn[k]) return false;
          seenCn[k] = true;
          return true;
        });
      }
    }
    apiGV('gvLuuCau', q).then(function (moi) {
      kho = null;
      if (!duyet) { viecLam.cau = viecLam.cau.map(x => x.id === id ? moi : x); dangSua = null; veViecLam(); bao('Đã lưu câu.'); return; }
      return apiGV('gvDoiTrangThai', [id], 'da_duyet').then(function () { moi.trangThai = 'da_duyet'; viecLam.cau = viecLam.cau.map(x => x.id === id ? moi : x); dangSua = null; veViecLam(); bao('Đã lưu và duyệt.'); });
    }).catch(e => bao(e.message, true));
  }

  async function kiemTraLai(ids, nut, yeuCau) {
    const chu = nut ? nut.textContent : '';
    if (nut) nut.disabled = true;
    const nhom = chiaNhom_(ids, 5);
    const t0 = Date.now();
    let xong = 0, tongDeXuat = 0, tongDaKiem = 0;
    const capNhatChu = () => {
      if (!nut) return;
      const s = Math.max(0, Math.round((Date.now() - t0) / 1000));
      nut.textContent = nhom.length > 1 ? ('Đang rà song song (' + xong + '/' + nhom.length + ') · ' + s + 's') : ('Đang rà & sửa... ' + s + 's');
    };
    capNhatChu();
    const timer = setInterval(capNhatChu, 1000);
    try {
      await Promise.all(nhom.map(async function (idsNhom) {
        const moi = await apiGV('gvKiemTraLai', idsNhom, yeuCau || '');
        const map = {}; (moi || []).forEach(x => map[x.id] = x);
        viecLam.cau = viecLam.cau.map(x => map[x.id] || x);
        tongDeXuat += (moi || []).filter(x => !!x.deXuatSua).length;
        tongDaKiem += (moi || []).length;
        xong++;
        capNhatChu();
      }));
      clearInterval(timer);
      veViecLam();
      const sTong = Math.max(1, Math.round((Date.now() - t0) / 1000));
      bao(tongDeXuat ? ('Có ' + tongDeXuat + ' câu AI đề xuất chỉnh sửa (' + sTong + 's), xem khung tím để duyệt áp dụng.') : (tongDaKiem > 1 ? 'AI rà xong ' + tongDaKiem + ' câu trong ' + sTong + 's, đều chuẩn.' : 'AI check: câu đã chuẩn.'), !!tongDeXuat);
    } catch (e) {
      clearInterval(timer);
      if (nut) { nut.disabled = false; nut.textContent = chu; }
      bao(e.message, true);
    }
  }

    $('#noi-dung').innerHTML = '<h1 class="tieu-trang">Kho tài liệu &amp; Trang chủ Google Sites</h1>' + skelCards(3);
    apiGV('gvThuVien').then(r => { thuVien = r; veThuVien(); }).catch(e => { if (e.message !== '__REDIRECT__') $('#noi-dung').innerHTML = '<div class="thongbao loi">' + esc(e.message) + '</div>'; });
  }

    const m = $('#noi-dung');
    const cfg = thuVien.caiDatTrang || {};

      return true;
    });

    const ghBase = 'https://hoangchu54.github.io/hoa10/';
    const embedHome = '<iframe src="' + ghBase + 'index.html" width="100%" height="640" frameborder="0" style="border:0;border-radius:12px;"></iframe>';
    const embedTaiLieu = '<iframe src="' + ghBase + 'tailieu.html" width="100%" height="760" frameborder="0" style="border:0;border-radius:12px;"></iframe>';
    const embedThiNghiem = '<iframe src="' + ghBase + 'thinghiem.html" width="100%" height="760" frameborder="0" style="border:0;border-radius:12px;"></iframe>';
    const embedTroChoi = '<iframe src="' + ghBase + 'trochoi.html" width="100%" height="640" frameborder="0" style="border:0;border-radius:12px;"></iframe>';

    let h = '<div class="hero-box art-benzene has-right" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div><span class="chip tim">HỌC LIỆU &amp; SITES</span><h1 style="margin-bottom:2px">Kho tài liệu &amp; Cài đặt Trang chủ</h1><p class="phu" style="margin:0">Quản lý file hiển thị cho học sinh và các liên kết trên Google Sites.</p></div>' +
      '<div class="hang-nut">' +
        '<button type="button" class="nut nho tim" id="btn-sync-drive">🔄 Đồng bộ lại từ Drive</button>' +
        '<a class="nut nho" href="' + esc(linkTrang('tailieu', { webUrl: info.webUrl, laFull: true }).href) + '" target="_blank" rel="noopener">Mở trang Kho tài liệu</a>' +
        '<a class="nut nho" href="' + esc(linkTrang('home', { webUrl: info.webUrl, laFull: true }).href) + '" target="_blank" rel="noopener">Xem trước Trang chủ</a>' +
        '<a class="nut nho" href="' + esc(thuVien.thuMucUrl) + '" target="_blank" rel="noopener">Mở Drive Kho</a>' +
      '</div></div>';

    // 1. Upload tài liệu
    h += '<section class="the"><h2 class="tieu-khoi" style="margin-bottom:10px">1. Đăng tài liệu mới lên Kho</h2>' +
      '<div class="tha" id="tha-tl" style="padding:16px;margin-bottom:10px">' +
        '<div style="width:38px;height:38px;border-radius:11px;background:var(--the);border:1px solid var(--do-v);color:var(--do);display:grid;place-items:center;box-shadow:var(--shadow)">' + ICONS.doc + '</div>' +
        '<span style="font-weight:700;color:var(--do)" id="tha-tl-txt">' + (fileUpTL ? ('Đã chọn: ' + esc(fileUpTL.name)) : 'Kéo thả file tài liệu vào đây hoặc bấm để chọn tệp') + '</span>' +
        '<span class="phu" style="font-size:12px">PDF, Word, PowerPoint, ảnh · tối đa 15 MB</span>' +
        '<input id="up-file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,image/*" class="an">' +
      '</div>' +
      '<div class="hang" style="margin-bottom:10px">' +
        '<div class="truong" style="flex:2 1 220px"><label for="up-ten">Tên hiển thị</label><input id="up-ten" type="text" placeholder="Tự lấy theo tên file nếu để trống"></div>' +
      '</div>' +
      '<div class="hang" style="margin-bottom:10px;align-items:flex-end">' +
        '<div class="truong" style="flex:1 1 180px"><label for="up-tm">Buổi / Thư mục có sẵn</label><select id="up-tm"><option value="">Thư mục gốc (Chung)</option>' +
          (thuVien.thuMuc || []).map(tm => '<option value="' + esc(tm.id) + '">' + esc(tm.ten) + '</option>').join('') +
        '</select></div>' +
        '<div class="truong" style="flex:1 1 180px"><label for="up-tm-moi">Hoặc tạo thư mục mới</label><input id="up-tm-moi" type="text" placeholder="Ví dụ: Buổi 8 (15/11/26)"></div>' +
        '<div class="truong" style="flex:1 1 190px"><label for="up-bai">Gắn Bài SGK</label><select id="up-bai">' + optBaiHtml('') + '</select></div>' +
        '<div class="truong" style="flex:1 1 160px"><label for="up-loai">Loại tài liệu</label><select id="up-loai">' + LOAI_TL.map(l => '<option value="' + esc(l) + '">' + esc(l) + '</option>').join('') + '</select></div>' +
      '</div>' +
      '<div class="hang" style="align-items:flex-end">' +
        '<div class="truong" style="flex:1 1 260px"><label for="up-gc">Ghi chú ngắn (không bắt buộc)</label><input id="up-gc" type="text" placeholder="Ví dụ: Tài liệu ôn tập kiểm tra 15 phút"></div>' +
        '<button type="button" class="nut chinh" id="btn-up-tl">Tải lên Kho</button>' +
      '</div></section>';

    // 2. Danh sách tài liệu
    h += '<section class="the"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px">' +
      '<h2 class="tieu-khoi">2. Tài liệu trong Kho (' + ds.length + '/' + items.length + ')</h2>' +
      '<div class="hang" style="flex:1 1 320px;justify-content:flex-end">' +
        '<input id="gv-tl-tk" type="search" placeholder="Tìm tài liệu..." value="' + esc(locTV.tk) + '" style="max-width:220px">' +
        '<select id="gv-tl-tm" style="max-width:190px"><option value="">Tất cả thư mục</option>' +
          (thuVien.thuMuc || []).map(tm => '<option value="' + esc(tm.ten) + '"' + (locTV.thuMuc === tm.ten ? ' selected' : '') + '>' + esc(tm.ten) + '</option>').join('') +
        '</select>' +
      '</div></div>';

    if (!ds.length) {
      h += '<p class="phu" style="margin:0">Chưa có tài liệu nào khớp bộ lọc.</p>';
    } else {
      ds.forEach(function (x) {
        if (dangSuaTL === x.fileId) {
          h += '<div class="the-cau" style="border:2px solid var(--do);margin-bottom:10px">' +
            '<div class="hang" style="align-items:flex-end">' +
              '<div class="truong" style="flex:2 1 240px"><label>Tên hiển thị</label><input id="st-ten" type="text" value="' + esc(x.ten) + '"></div>' +
              '<div class="truong" style="flex:1 1 160px"><label>Thư mục</label><input id="st-tm" type="text" value="' + esc(x.thuMuc) + '"></div>' +
              '<div class="truong" style="flex:1 1 180px"><label>Bài SGK</label><select id="st-bai">' + optBaiHtml(x.bai) + '</select></div>' +
              '<div class="truong" style="flex:1 1 150px"><label>Loại</label><select id="st-loai">' + LOAI_TL.map(l => '<option value="' + esc(l) + '"' + (x.loai === l ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></div>' +
            '</div>' +
            '<div class="hang" style="align-items:center">' +
              '<div class="truong" style="flex:1 1 240px"><label>Ghi chú</label><input id="st-gc" type="text" value="' + esc(x.ghiChu) + '"></div>' +
              '<label class="chon"><input id="st-an" type="checkbox"' + (x.an ? ' checked' : '') + '>Ẩn khỏi học sinh</label>' +
            '</div>' +
            '<div class="hang-nut"><button type="button" class="nut nho chinh" id="st-luu">Lưu nhãn</button><button type="button" class="nut nho" id="st-huy">Hủy</button></div>' +
          '</div>';
        } else {
          const tenHien = tenDep(x.ten);
          h += '<div class="file-row"><div class="tt">' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">' +
              '<b>' + esc(tenHien) + '</b>' +
              '<span class="chip">' + esc(x.loai) + '</span>' +
              (x.thuMuc ? '<span class="chip tim">' + esc(x.thuMuc) + '</span>' : '') +
              (x.bai ? '<span class="chip ok">' + esc(x.bai === 'MD' ? 'Mở đầu' : (/^C\d$/.test(x.bai) ? 'Chương ' + x.bai.slice(1) : 'Bài ' + x.bai)) + '</span>' : '') +
              (x.an ? '<span class="chip canh">Đang ẩn</span>' : '') +
            '</div>' +
            (tenHien !== x.ten ? '<span class="tl-goc">' + esc(x.ten) + '</span>' : '') +
            (x.ghiChu ? '<span class="phu" style="font-size:12.5px">' + esc(x.ghiChu) + '</span>' : '') +
          '</div>' +
          '<div class="hang-nut">' +
            '<button type="button" class="nut nho" data-sua-tl="' + esc(x.fileId) + '">Sửa nhãn</button>' +
            '<a class="nut nho" href="' + esc(x.link) + '" target="_blank" rel="noopener">Drive</a>' +
            '<button type="button" class="nut nho xoa" data-xoa-tl="' + esc(x.fileId) + '">Xóa</button>' +
          '</div></div>';
        }
      });
    }
    h += '</section>';

    // 3. Cấu hình Trang chủ Google Sites & Mã nhúng
    h += '<section class="the"><h2 class="tieu-khoi" style="margin-bottom:10px">3. Cấu hình Trang chủ Google Sites &amp; Link Trò chơi</h2>' +
      '<div class="hang" style="margin-bottom:10px;align-items:flex-end">' +
        '<div class="truong" style="flex:1 1 250px"><label for="st-td">Tiêu đề chính</label><input id="st-td" type="text" value="' + esc(cfg.tieuDeTrang || '') + '"></div>' +
        '<div class="truong" style="flex:2 1 300px"><label for="st-pd">Phụ đề</label><input id="st-pd" type="text" value="' + esc(cfg.phuDeTrang || '') + '"></div>' +
      '</div>' +
      '<div class="truong" style="margin-bottom:10px"><label for="st-tb">Thông báo ngắn cho học sinh (hiện ở cả Trang chủ &amp; trang BTVN, để trống nếu không cần)</label><input id="st-tb" type="text" value="' + esc(cfg.thongBao || '') + '" placeholder="Ví dụ: Tuần này ôn tập Chương 3, hạn nộp BTVN vào 22h Chủ nhật."></div>' +
      '<div class="hang" style="margin-bottom:10px;align-items:flex-end">' +
        '<div class="truong" style="flex:1 1 250px"><label for="st-game">Link Trò chơi ngoài (trống = tích hợp)</label><input id="st-game" type="url" value="' + esc(cfg.linkTroChoi || '') + '" placeholder="Mặc định dùng Gaming Center tích hợp"></div>' +
        '<div class="truong" style="flex:1 1 250px"><label for="st-lab">Link Thí nghiệm ngoài (trống = tích hợp)</label><input id="st-lab" type="url" value="' + esc(cfg.linkThiNghiem || '') + '" placeholder="Mặc định dùng Thí nghiệm ảo tích hợp"></div>' +
        '<div class="truong" style="flex:1 1 250px"><label for="st-tn-folder">Link Thư mục Drive thí nghiệm</label><input id="st-tn-folder" type="url" value="' + esc(cfg.linkThuMucThiNghiem || '') + '" placeholder="Để trống nếu chưa có thư mục riêng"></div>' +
      '</div>' +
      '<div class="hang" style="margin-bottom:12px;align-items:flex-end">' +
        '<div class="truong" style="flex:1 1 250px"><label for="st-home-url">Link Trang chủ Google Sites</label><input id="st-home-url" type="url" value="' + esc(cfg.trangChuSites || '') + '"></div>' +
        '<div class="truong" style="flex:1 1 250px"><label for="st-btvn-url">Link trang BÀI TẬP VỀ NHÀ trên Sites</label><input id="st-btvn-url" type="url" value="' + esc(cfg.trangBtvnSites || '') + '"></div>' +
        '<div class="truong" style="flex:1 1 200px"><label for="st-fid">Folder ID Kho tài liệu</label><input id="st-fid" type="text" value="' + esc(cfg.folderTaiLieuId || '') + '"></div>' +
      '</div>' +
      '<div class="hang-nut" style="margin-bottom:14px"><button type="button" class="nut chinh" id="btn-luu-sites">Lưu cấu hình Trang chủ</button></div>' +
      '<details class="chuong"><summary>Mã nhúng (Embed code) để dán lên Google Sites</summary><div style="padding:8px 0 12px;display:flex;flex-direction:column;gap:10px">' +
        '<div class="truong"><label>1) Khối Hub Trang chủ (?page=home)</label><textarea readonly rows="2" onclick="this.select()">' + esc(embedHome) + '</textarea></div>' +
        '<div class="truong"><label>2) Khối Kho tài liệu (?page=tailieu)</label><textarea readonly rows="2" onclick="this.select()">' + esc(embedTaiLieu) + '</textarea></div>' +
        '<div class="truong"><label>3) Khối Thí nghiệm ảo (?page=thinghiem)</label><textarea readonly rows="2" onclick="this.select()">' + esc(embedThiNghiem) + '</textarea></div>' +
        '<div class="truong"><label>4) Khối Trò chơi Gaming Center (?page=trochoi)</label><textarea readonly rows="2" onclick="this.select()">' + esc(embedTroChoi) + '</textarea></div>' +
      '</div></details></section>';

    m.innerHTML = h;

    const btnSync = $('#btn-sync-drive');
    if (btnSync) btnSync.onclick = function () {
      btnSync.disabled = true; btnSync.textContent = 'Đang quét Drive...';
      apiGV('gvThuVien').then(r => {
        thuVien = r;
        veThuVien();
        bao('Đã đồng bộ ' + (r.thuMuc || []).length + ' thư mục & ' + (r.items || []).length + ' tài liệu từ Google Drive.');
      }).catch(e => { btnSync.disabled = false; btnSync.textContent = '🔄 Đồng bộ lại từ Drive'; bao(e.message, true); });
    };

    const upInp = $('#up-file'), thaTl = $('#tha-tl');
    const napFileTL = function (f) {
      if (!f) { fileUpTL = null; return; }
      if (f.size > 15 * 1024 * 1024) { bao('File vượt quá 15 MB.', true); upInp.value = ''; fileUpTL = null; return; }
      const r = new FileReader();
      r.onload = function () {
        fileUpTL = { name: f.name, mimeType: f.type, data: String(r.result).split(',')[1] };
        const txt = $('#tha-tl-txt'); if (txt) txt.textContent = 'Đã chọn: ' + f.name + ' (' + sizeDep_(f.size) + ')';
        if (!$('#up-ten').value) $('#up-ten').value = tenDep(f.name);
      };
      r.readAsDataURL(f);
    };
    if (thaTl && upInp) {
      thaTl.onclick = () => upInp.click();
      upInp.onchange = function () { napFileTL(this.files && this.files[0]); };
      ['dragenter', 'dragover'].forEach(ev => thaTl.addEventListener(ev, e => { e.preventDefault(); thaTl.classList.add('tren'); }));
      ['dragleave', 'drop'].forEach(ev => thaTl.addEventListener(ev, e => { e.preventDefault(); thaTl.classList.remove('tren'); }));
      thaTl.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) napFileTL(e.dataTransfer.files[0]); });
    }

    $('#btn-up-tl').onclick = function () {
      if (!fileUpTL) return bao('Chọn file trước khi tải lên.', true);
      const btn = this; btn.disabled = true; btn.textContent = 'Đang tải lên...';
      apiGV('gvTaiLenTaiLieu', {
        name: fileUpTL.name,
        mimeType: fileUpTL.mimeType,
        data: fileUpTL.data,
        tenHienThi: $('#up-ten').value.trim(),
        folderId: $('#up-tm').value,
        folderNameMoi: $('#up-tm-moi').value.trim(),
        bai: $('#up-bai').value,
        loai: $('#up-loai').value,
        ghiChu: $('#up-gc').value.trim()
      }).then(function () {
        fileUpTL = null;
        bao('Đã tải tài liệu lên Drive và cập nhật Kho.');
        taiThuVien(true);
      }).catch(e => { btn.disabled = false; btn.textContent = 'Tải lên Kho'; bao(e.message, true); });
    };

    $('#gv-tl-tk').oninput = function () { locTV.tk = this.value; veThuVien(); $('#gv-tl-tk').focus(); const l = $('#gv-tl-tk').value.length; $('#gv-tl-tk').setSelectionRange(l, l); };
    $('#gv-tl-tm').onchange = function () { locTV.thuMuc = this.value; veThuVien(); };
    m.querySelectorAll('[data-sua-tl]').forEach(b => b.onclick = () => { dangSuaTL = b.getAttribute('data-sua-tl'); veThuVien(); });
    if ($('#st-huy')) $('#st-huy').onclick = () => { dangSuaTL = null; veThuVien(); };
    if ($('#st-luu')) $('#st-luu').onclick = () => {
      apiGV('gvCapNhatTaiLieu', {
        fileId: dangSuaTL,
        ten: $('#st-ten').value,
        thuMuc: $('#st-tm').value,
        bai: $('#st-bai').value,
        loai: $('#st-loai').value,
        ghiChu: $('#st-gc').value,
        an: $('#st-an').checked
      }).then(() => { dangSuaTL = null; bao('Đã cập nhật thông tin tài liệu.'); taiThuVien(true); }).catch(e => bao(e.message, true));
    };

    m.querySelectorAll('[data-xoa-tl]').forEach(b => b.onclick = () => {
      const fid = b.getAttribute('data-xoa-tl');
      hoi('Xóa file này khỏi Kho và đưa file vào thùng rác Google Drive?').then(ok => {
        if (!ok) return;
        apiGV('gvXoaTaiLieu', fid, true).then(() => { bao('Đã xóa tài liệu.'); taiThuVien(true); }).catch(e => bao(e.message, true));
      });
    });

    $('#btn-luu-sites').onclick = function () {
      const btn = this; btn.disabled = true;
      apiGV('gvLuuCaiDatTrang', {
        tieuDeTrang: $('#st-td').value,
        phuDeTrang: $('#st-pd').value,
        thongBao: $('#st-tb').value,
        linkTroChoi: $('#st-game').value,
        linkThiNghiem: $('#st-lab').value,
        linkThuMucThiNghiem: $('#st-tn-folder').value,
        trangChuSites: $('#st-home-url').value,
        trangBtvnSites: $('#st-btvn-url').value,
        folderTaiLieuId: $('#st-fid').value
      }).then(res => {
        btn.disabled = false;
        thuVien.caiDatTrang = res;
        bao('Đã lưu cấu hình Trang chủ Google Sites.');
      }).catch(e => { btn.disabled = false; bao(e.message, true); });
    };
  }

  // ================= TAB 4: TỔNG HỢP ĐIỂM =================
  function taiTongHop(epTai) {
    if (!epTai && thData && (!thDe || thDataDeId === thDe)) { veTongHop(thData); return; }
    $('#noi-dung').innerHTML = '<h1 class="tieu-trang">Tổng hợp điểm</h1>' + skelCards(3);
    apiGV('gvTongHop', thDe).then(r => { thData = r; thDataDeId = r && r.de ? r.de.id : null; veTongHop(r); }).catch(e => { if (e.message !== '__REDIRECT__') $('#noi-dung').innerHTML = '<div class="thongbao loi">' + esc(e.message) + '</div>'; });
  }

    const m = $('#noi-dung');
    if (!r.de) { m.innerHTML = '<h1 class="tieu-trang">Tổng hợp điểm</h1><p class="phu">Chưa giao đề nào.</p>'; return; }
    thDe = r.de.id;
    let h = '<div class="hero-box art-flask has-right" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between">' +
      '<div><span class="chip chinh">THỐNG KÊ ĐIỂM</span><h1 style="margin-bottom:0">Tổng hợp điểm</h1></div>' +
      '<div style="display:flex;gap:8px;align-items:flex-end;flex:1 1 260px;max-width:480px">' +
        '<div class="truong" style="flex:1;min-width:0"><label for="chon-de">Chọn đề</label><select id="chon-de">' + r.dsDe.map(d => '<option value="' + esc(d.id) + '"' + (d.id === r.de.id ? ' selected' : '') + '>' + esc(d.ten) + '</option>').join('') + '</select></div>' +
        '<button type="button" class="nut nho" id="th-lam-moi" style="min-height:40px" title="Tải lại điểm mới nhất">🔄</button>' +
      '</div></div>';

    h += '<div class="kpi-strip">' +
      '<div class="kpi-card"><div class="n">Đã làm</div><div class="g">' + r.dong.length + '<span style="font-size:14px;color:var(--mo)">/' + r.soHS + ' em</span></div></div>' +
      '<div class="kpi-card tim"><div class="n">TB lần đầu</div><div class="g">' + diem(r.tbDau) + '</div></div>' +
      '<div class="kpi-card xanh"><div class="n">TB cao nhất</div><div class="g">' + diem(r.tbCao) + '</div></div>' +
      '<div class="kpi-card canh"><div class="n">Hạn nộp</div><div class="g" style="font-size:15px">' + esc(tg(r.de.han)) + '</div></div>' +
    '</div>';

    h += '<div class="hang-nut" style="margin-bottom:12px">' +
      '<button type="button" class="nut nho chinh" id="th-copy-zalo">📋 Copy nhắc nộp Zalo</button>' +
      '<button type="button" class="nut nho vien" id="th-pin-web">📌 Ghim nhắc lên Web HS</button>' +
      '<button type="button" class="nut nho vien" id="th-sang-rp">📝 Lập Report chi tiết</button>' +
    '</div>';

    if (!r.dong.length) {
      h += '<div class="the" style="text-align:center;padding:24px 16px">' +
        '<div style="font-size:28px;line-height:1;margin-bottom:8px">📭</div>' +
        '<b style="font-size:15.5px">Chưa em nào làm đề này</b>' +
        '<p class="phu" style="margin:4px 0 12px">Cả lớp (' + r.chuaLam.length + ' học sinh) chưa nộp bài. Thầy có thể bấm <b>Copy nhắc nộp Zalo</b> hoặc <b>Ghim nhắc lên Web HS</b> ở trên.</p>' +
        (r.chuaLam.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">' + r.chuaLam.map(t => '<span class="chip">' + esc(t) + '</span>').join('') + '</div>' : '') +
      '</div>';
    } else {
      h += '<div class="hop-bang th-bang-pc"><table><thead><tr><th>Học sinh</th><th class="so">Lần đầu</th><th class="so">Cao nhất</th><th class="so">Số lần</th><th class="so">Thời gian đầu</th><th>Nộp lần cuối</th></tr></thead><tbody>';
      r.dong.forEach(function (x) {
        const cay = x.cao - x.dau >= 3 && x.soLan >= 3;
        h += '<tr' + (cay ? ' class="cay"' : '') + '><td style="font-weight:600">' + esc(x.ten) + '</td><td class="so"' + (cay ? ' style="color:var(--loi);font-weight:700"' : '') + '>' + diem(x.dau) + '</td><td class="so" style="font-weight:700">' + diem(x.cao) + '</td><td class="so">' + x.soLan + '</td><td class="so">' + phut(x.giayDau) + '</td><td>' + esc(tg(x.nopCuoi)) + '</td></tr>';
      });
      r.chuaLam.forEach(t => { h += '<tr><td style="font-weight:600;background:var(--nen2)">' + esc(t) + '</td><td colspan="5" style="color:var(--loi);font-weight:600;background:var(--nen2)">Chưa làm</td></tr>'; });
      h += '</tbody></table></div>';

      h += '<div class="th-cards">';
      r.dong.forEach(function (x) {
        const cay = x.cao - x.dau >= 3 && x.soLan >= 3;
        h += '<div class="th-card' + (cay ? ' cay' : '') + '">' +
          '<div class="th-card-top"><b>' + esc(x.ten) + '</b><span class="chip ok">Cao nhất: ' + diem(x.cao) + '</span></div>' +
          '<div class="th-card-meta">' +
            '<span>Lần đầu: <b style="' + (cay ? 'color:var(--loi)' : 'color:var(--chu)') + '">' + diem(x.dau) + '</b></span>' +
            '<span>· ' + x.soLan + ' lần</span>' +
            '<span>· ' + phut(x.giayDau) + '</span>' +
            '<span>· ' + esc(tg(x.nopCuoi)) + '</span>' +
          '</div></div>';
      });
      r.chuaLam.forEach(function (t) {
        h += '<div class="th-card chua"><div class="th-card-top"><b>' + esc(t) + '</b><span class="chip loi">Chưa làm</span></div></div>';
      });
      h += '</div>';
      h += '<p class="phu" style="font-size:12.5px;margin-top:8px">Dòng tô vàng: điểm lần đầu thấp hơn điểm cao nhất ≥ 3 điểm sau ≥ 3 lần làm. Dữ liệu được ghi sang tab <b>TongHop</b> trong <a href="' + esc(r.sheetUrl) + '" target="_blank" rel="noopener">Google Sheet</a>.</p>';
    }

    if (r.saiNhieu.length) {
      h += '<section class="the" style="margin-top:14px"><h2 class="tieu-khoi">Câu sai nhiều nhất (lần làm đầu)</h2>';
      r.saiNhieu.forEach(s => { h += '<div style="border-top:1px solid var(--vien2);padding-top:10px;margin-top:10px"><div>' + md(s.cauHoi) + '</div><span class="phu" style="font-size:13px">' + s.soSai + '/' + r.dong.length + ' em sai · Đáp án: <b style="color:var(--ok)">' + md(s.dapAn) + '</b></span></div>'; });
      h += '</section>';
    }
    m.innerHTML = h;
    $('#chon-de').onchange = function () { thDe = this.value; taiTongHop(true); };
    const tlm = $('#th-lam-moi'); if (tlm) tlm.onclick = () => taiTongHop(true);
    $('#th-copy-zalo').onclick = function () {
      const top = r.dong.slice().sort((a, b) => b.cao - a.cao).filter(x => x.cao >= 8).slice(0, 6).map(x => x.ten + ' (' + diem(x.cao) + ')');
      const lines = [
        '📢 NHẮC BÀI TẬP HÓA 10: ' + r.de.ten,
        '⏰ Hạn nộp: ' + tg(r.de.han),
        '📊 Tiến độ: ' + r.dong.length + '/' + r.soHS + ' bạn đã nộp' + (r.tbCao !== null ? (' · Điểm TB cao nhất: ' + diem(r.tbCao)) : ''),
        r.chuaLam.length ? ('⚠️ Chưa làm (' + r.chuaLam.length + '): ' + r.chuaLam.join(', ') + ' — các em tranh thủ hoàn thành nhé!') : '✅ Cả lớp đã hoàn thành đủ!',
        top.length ? ('🌟 Tuyên dương (>=8): ' + top.join(', ')) : ''
      ].filter(Boolean);
      copyVanBan(lines.join('\n'), 'Đã copy tin nhắn nhắc nộp vào bộ nhớ tạm.');
    };
    $('#th-pin-web').onclick = function () {
      const msg = r.de.ten + ': ' + r.dong.length + '/' + r.soHS + ' bạn đã nộp (hạn ' + tg(r.de.han) + ')' +
        (r.chuaLam.length ? ('. Chưa làm (' + r.chuaLam.length + '): ' + r.chuaLam.slice(0, 6).join(', ') + (r.chuaLam.length > 6 ? '...' : '')) : ' — cả lớp đã hoàn thành!');
      const btn = this; btn.disabled = true;
      apiGV('gvDangThongBao', msg).then(() => { btn.disabled = false; bao('Đã ghim thông báo lên Trang chủ & BTVN học sinh.'); }).catch(e => { btn.disabled = false; bao(e.message, true); });
    };
    $('#th-sang-rp').onclick = function () {
      lopSub = 'rp';
      if (!rpForm) rpForm = {};
      rpForm.deIds = {}; rpForm.deIds[r.de.id] = true;
      rpForm.tk = null;
      doiTab('lop');
    };
  }

  function copyVanBan(txt, okMsg) {
    if (!txt) return bao('Chưa có nội dung để copy.', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => bao(okMsg || 'Đã copy!')).catch(() => copyFallback(txt, okMsg));
    } else { copyFallback(txt, okMsg); }
  }
  function copyFallback(txt, okMsg) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); bao(okMsg || 'Đã copy!'); } catch (e) { bao('Không tự copy được, em bôi đen rồi copy thủ công nhé.', true); }
    ta.remove();
  }

  // ================= TAB: ĐIỂM DANH, REPORT & THÔNG BÁO =================
  let calYM = (function () { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
  let rpRangePick = '';

  function homNayYMD() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function ymdTuMs(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function ngayDepYMD(s) {
    const p = String(s || '').split('-');
    return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : (s || '');
  }
  function taoFormDD(src) {
    const hsList = (lopData && lopData.hs) || [];
    const ct = {};
    if (src && src.chiTiet) {
      Object.keys(src.chiTiet).forEach(k => { ct[k] = { tt: src.chiTiet[k].tt || 'co', gc: src.chiTiet[k].gc || '' }; });
    }
    hsList.forEach(x => { if (!ct[x.khoa]) ct[x.khoa] = { tt: 'co', gc: '' }; });
    const ng = (src && src.ngay) || homNayYMD();
    return {
      id: (src && src.id) || '',
      ngay: ng,
      buoi: (src && src.buoi) || ('Buổi ngày ' + ngayDepYMD(ng)),
      noiDung: (src && src.noiDung) || '',
      ghiChu: (src && src.ghiChu) || '',
      chiTiet: ct
    };
  }
  function taoFormRP() {
    const d = new Date();
    const den = homNayYMD();
    const d0 = new Date(d.getTime() - 7 * 86400e3);
    const tu = d0.getFullYear() + '-' + pad(d0.getMonth() + 1) + '-' + pad(d0.getDate());
    const deIds = {};
    if (lopData && lopData.dsDe && lopData.dsDe.length) deIds[lopData.dsDe[0].id] = true;
    return {
      id: '',
      tuNgay: tu,
      denNgay: den,
      deIds: deIds,
      ghiChuGV: '',
      tieuDe: '',
      noiDung: '',
      tinNhan: '',
      thongBaoWeb: (lopData && lopData.thongBaoHienTai) || '',
      vanPhongMau: (lopData && lopData.vanPhongMau) || '',
      hsDanhGia: {},
      hsLoc: '',
      moiHsMotTrang: true,
      kemTongKet: true,
      tk: null
    };
  }

  function taiLop(giuSub, epTai) {
    if (!epTai && lopData) {
      if (!giuSub || !ddForm) ddForm = taoFormDD(null);
      if (!rpForm) rpForm = taoFormRP();
      veLop();
      return;
    }
    $('#noi-dung').innerHTML = '<h1 class="tieu-trang">Điểm danh, Report &amp; Thông báo</h1>' + skelCards(3);
    apiGV('gvQuanLyLop').then(function (r) {
      lopData = r;
      if (!giuSub || !ddForm) ddForm = taoFormDD(null);
      if (!rpForm) rpForm = taoFormRP();
      else {
        if (!rpForm.thongBaoWeb && r.thongBaoHienTai) rpForm.thongBaoWeb = r.thongBaoHienTai;
        if (!rpForm.vanPhongMau && r.vanPhongMau) rpForm.vanPhongMau = r.vanPhongMau;
      }
      veLop();
    }).catch(e => { if (e.message !== '__REDIRECT__') $('#noi-dung').innerHTML = '<div class="thongbao loi">' + esc(e.message) + '</div>'; });
  }

  function veLichGrid(mode) {
    const y = calYM.y, m = calYM.m;
    const homNay = homNayYMD();
    const dauThang = new Date(y, m, 1);
    const thuDau = (dauThang.getDay() + 6) % 7; // 0 = T2 ... 6 = CN
    const batDau = new Date(y, m, 1 - thuDau);
    const soNgayThang = new Date(y, m + 1, 0).getDate();
    const soO = Math.ceil((thuDau + soNgayThang) / 7) * 7;

    const ddTheoNgay = {};
    (lopData.dsDiemDanh || []).forEach(b => {
      if (!b.ngay) return;
      (ddTheoNgay[b.ngay] = ddTheoNgay[b.ngay] || []).push(b);
    });
    const deTheoNgay = {};
    (lopData.dsDe || []).forEach(d => {
      const ng = ymdTuMs(d.han);
      if (!ng) return;
      (deTheoNgay[ng] = deTheoNgay[ng] || []).push(d);
    });

    const tu = (rpForm && rpForm.tuNgay) || '';
    const den = (rpForm && rpForm.denNgay) || '';

    let h = '<section class="cal-box">' +
      '<div class="cal-head">' +
        '<div class="cal-nav">' +
          '<button type="button" class="nut nho" id="cal-prev" title="Tháng trước">◀</button>' +
          '<div class="cal-title">Tháng ' + (m + 1) + ' / ' + y + '</div>' +
          '<button type="button" class="nut nho" id="cal-next" title="Tháng sau">▶</button>' +
          '<button type="button" class="nut nho vien" id="cal-today">Hôm nay</button>' +
        '</div>' +
        '<div class="cal-legend">' +
          '<span><i class="cal-dot" style="background:var(--ok)"></i> Điểm danh đủ</span>' +
          '<span><i class="cal-dot" style="background:var(--canh)"></i> Có muộn / vắng</span>' +
          '<span><i class="cal-dot" style="background:var(--tim)"></i> Hạn nộp BTVN</span>' +
          '<span class="phu">' + (mode === 'dd' ? 'Bấm buổi để sửa · Bấm ngày để điểm danh' : (rpRangePick ? 'Đang chọn từ ' + ngayDepYMD(rpRangePick) + ' · bấm ngày kết thúc' : 'Bấm 2 ngày trên lịch để chọn khoảng Report')) + '</span>' +
        '</div>' +
      '</div>';

    if (mode === 'rp') {
      h += '<div class="hang-nut" style="margin-bottom:10px">' +
        '<button type="button" class="nut nho" data-rp-quick="7d">7 ngày qua</button>' +
        '<button type="button" class="nut nho" data-rp-quick="tuan_nay">Tuần này</button>' +
        '<button type="button" class="nut nho" data-rp-quick="tuan_truoc">Tuần trước</button>' +
        '<button type="button" class="nut nho" data-rp-quick="thang_nay">Tháng này</button>' +
        '<button type="button" class="nut nho" data-rp-quick="thang_truoc">Tháng trước</button>' +
      '</div>';
    }

    h += '<div class="cal-dow"><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div></div>' +
      '<div class="cal-grid">';

    for (let i = 0; i < soO; i++) {
      const cur = new Date(batDau.getFullYear(), batDau.getMonth(), batDau.getDate() + i);
      const ymd = cur.getFullYear() + '-' + pad(cur.getMonth() + 1) + '-' + pad(cur.getDate());
      const out = cur.getMonth() !== m;
      const isToday = ymd === homNay;
      let cls = 'cal-cell' + (out ? ' out' : '') + (isToday ? ' today' : '');
      if (mode === 'dd' && ddForm && ddForm.ngay === ymd) cls += ' sel';
      if (mode === 'rp' && tu && den && ymd >= tu && ymd <= den) {
        cls += (ymd === tu || ymd === den) ? ' range-edge' : ' in-range';
      } else if (mode === 'rp' && rpRangePick === ymd) {
        cls += ' range-edge';
      }

      const dds = ddTheoNgay[ymd] || [];
      const des = deTheoNgay[ymd] || [];
      h += '<div class="' + cls + '" data-cal-day="' + ymd + '">' +
        '<div class="cal-cell-top"><span class="cal-num">' + cur.getDate() + '</span>' +
        (mode === 'dd' ? '<span class="cal-plus" title="Điểm danh ngày này">+</span>' : '') +
        '</div><div class="cal-ev-list">';
      dds.slice(0, 2).forEach(b => {
        const tt = b.tomTat || {};
        const coVanDe = (tt.muon || 0) + (tt.cp || 0) + (tt.kp || 0) > 0;
        h += '<button type="button" class="cal-pill dd' + (coVanDe ? ' warn' : '') + '" data-cal-dd="' + esc(b.id) + '" title="' + esc(b.buoi) + ' · Có ' + (tt.co || 0) + '">' +
          esc(b.buoi.replace(/^Buổi ngày \d+\/\d+\/\d+\s*/, 'Điểm danh') || 'Điểm danh') + '</button>';
      });
      if (dds.length > 2) h += '<span class="phu" style="font-size:10.5px">+' + (dds.length - 2) + ' buổi</span>';
      des.slice(0, 2).forEach(d => {
        h += '<span class="cal-pill de" title="Hạn: ' + esc(d.ten) + '">Hạn: ' + esc(d.ten) + '</span>';
      });
      h += '</div></div>';
    }
    h += '</div></section>';
    return h;
  }

  function ganSuKienLich(mode) {
    const m = $('#noi-dung');
    $('#cal-prev').onclick = () => {
      calYM.m--; if (calYM.m < 0) { calYM.m = 11; calYM.y--; } veLop();
    };
    $('#cal-next').onclick = () => {
      calYM.m++; if (calYM.m > 11) { calYM.m = 0; calYM.y++; } veLop();
    };
    $('#cal-today').onclick = () => {
      const d = new Date(); calYM = { y: d.getFullYear(), m: d.getMonth() }; veLop();
    };
    if (mode === 'dd') {
      m.querySelectorAll('[data-cal-dd]').forEach(btn => btn.onclick = function (e) {
        e.stopPropagation();
        const obj = (lopData.dsDiemDanh || []).find(x => x.id === btn.getAttribute('data-cal-dd'));
        if (obj) {
          ddForm = taoFormDD(obj);
          veLop();
          const ed = $('#dd-editor'); if (ed) ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
      m.querySelectorAll('[data-cal-day]').forEach(cell => cell.onclick = function () {
        const ymd = cell.getAttribute('data-cal-day');
        const p = ymd.split('-');
        calYM = { y: Number(p[0]), m: Number(p[1]) - 1 };
        ddForm = taoFormDD({ ngay: ymd });
        veLop();
        const ed = $('#dd-editor'); if (ed) ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    } else {
      m.querySelectorAll('[data-cal-day]').forEach(cell => cell.onclick = function () {
        const ymd = cell.getAttribute('data-cal-day');
        const p = ymd.split('-');
        calYM = { y: Number(p[0]), m: Number(p[1]) - 1 };
        if (!rpRangePick) {
          rpRangePick = ymd;
          rpForm.tuNgay = ymd;
          rpForm.denNgay = ymd;
        } else {
          rpForm.tuNgay = rpRangePick <= ymd ? rpRangePick : ymd;
          rpForm.denNgay = rpRangePick <= ymd ? ymd : rpRangePick;
          rpRangePick = '';
        }
        veLop();
      });
      m.querySelectorAll('[data-rp-quick]').forEach(btn => btn.onclick = function () {
        const k = btn.getAttribute('data-rp-quick');
        const now = new Date();
        let d1, d2;
        if (k === '7d') {
          d2 = now; d1 = new Date(now.getTime() - 7 * 86400e3);
        } else if (k === 'tuan_nay') {
          const thu = (now.getDay() + 6) % 7;
          d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - thu);
          d2 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate() + 6);
        } else if (k === 'tuan_truoc') {
          const thu = (now.getDay() + 6) % 7;
          d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - thu - 1);
          d1 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate() - 6);
        } else if (k === 'thang_nay') {
          d1 = new Date(now.getFullYear(), now.getMonth(), 1);
          d2 = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        } else {
          d1 = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          d2 = new Date(now.getFullYear(), now.getMonth(), 0);
        }
        rpRangePick = '';
        rpForm.tuNgay = ymdTuMs(d1.getTime());
        rpForm.denNgay = ymdTuMs(d2.getTime());
        calYM = { y: d1.getFullYear(), m: d1.getMonth() };
        veLop();
      });
    }
  }

  function veLop() {
    const m = $('#noi-dung');
    const r = lopData;
    let h = '<div class="hero-box art-crystal" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div><span class="chip chinh">QUẢN LÝ LỚP HÓA 10</span><h1 style="margin-bottom:2px">Điểm danh, Report &amp; Thông báo</h1>' +
      '<p class="phu" style="margin:0">Lịch học trực quan, điểm danh theo buổi và viết nhận xét cá nhân hóa cho cả lớp.</p></div>' +
      '<div class="seg" role="tablist">' +
        '<button type="button" data-lsub="dd" class="' + (lopSub === 'dd' ? 'on' : '') + '">📋 Điểm danh (' + r.dsDiemDanh.length + ')</button>' +
        '<button type="button" data-lsub="rp" class="' + (lopSub === 'rp' ? 'on' : '') + '">📝 Report &amp; Nhận xét (' + r.dsBaoCao.length + ')</button>' +
      '</div></div>';

    h += lopSub === 'dd' ? veDiemDanhSub() : veReportSub();
    m.innerHTML = h;

    m.querySelectorAll('[data-lsub]').forEach(b => b.onclick = () => {
      lopSub = b.getAttribute('data-lsub');
      veLop();
    });
    ganSuKienLich(lopSub);
    if (lopSub === 'dd') ganSuKienDD();
    else ganSuKienRP();
  }

  function veDiemDanhSub() {
    const hs = lopData.hs || [];
    const dsDD = lopData.dsDiemDanh || [];
    const TT = [
      { k: 'co', ten: 'Có mặt' },
      { k: 'muon', ten: 'Muộn' },
      { k: 'vang_cp', ten: 'Nghỉ CP' },
      { k: 'vang_kp', ten: 'Nghỉ KP' }
    ];
    let dem = { co: 0, muon: 0, vang_cp: 0, vang_kp: 0 };
    hs.forEach(x => { const tt = (ddForm.chiTiet[x.khoa] && ddForm.chiTiet[x.khoa].tt) || 'co'; dem[tt] = (dem[tt] || 0) + 1; });

    let h = veLichGrid('dd');
    h += '<section class="the" id="dd-editor">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">' +
        '<h2 class="tieu-khoi">' + (ddForm.id ? 'Sửa buổi điểm danh' : 'Điểm danh buổi học (' + ngayDepYMD(ddForm.ngay) + ')') + '</h2>' +
        '<div class="hang-nut">' +
          '<button type="button" class="nut nho xanh" id="dd-all-co">✓ Tất cả có mặt</button>' +
          (ddForm.id ? '<button type="button" class="nut nho" id="dd-tao-moi">+ Buổi mới</button>' : '') +
        '</div>' +
      '</div>' +

  function dongChuyenCanHS(h) {
    if (!h || !h.dd || !h.dd.tong) return 'Chưa có buổi điểm danh trong kỳ';
    const d = h.dd;
    const p = ['Có mặt ' + d.co + '/' + d.tong + ' buổi'];
    if (d.muon) p.push('muộn ' + d.muon);
    if (d.cp) p.push('nghỉ CP ' + d.cp);
    if (d.kp) p.push('nghỉ KP ' + d.kp);
    if (d.chiTiet && d.chiTiet.length) p.push('[' + d.chiTiet.join('; ') + ']');
    return p.join(', ');
  }
  function dongBtvnHS(h) {
    if (!h || !h.btvn || !h.btvn.tongDe) return 'Chưa chọn đề BTVN trong kỳ';
    const b = h.btvn;

    if (b.tbCao !== null) p.push('TB ' + diem(b.tbCao) + ' (lần đầu TB ' + diem(b.tbDau) + ')');
    if (b.thieu && b.thieu.length) p.push('thiếu: ' + b.thieu.join(', '));
    return p.join(' · ');

    h += '<div class="hop-bang"><table><thead><tr><th>Họ và tên</th><th class="so">Số lần làm</th><th>Ngày vào</th><th></th></tr></thead><tbody>';
