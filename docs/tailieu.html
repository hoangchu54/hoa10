<script src="assets/h10.js?v=6afa2b5922"></script>
<script>
(function () {
  const { esc, md, api, laGAS, getLocation, linkTrang, skelCards, ICONS, ganNutTheme, toast, renderSlogan, ganThanhDieuHuongHS, docCacheUI, ghiCacheUI, ganNutLenDau, tenDep } = window.H10;
  let moLocChiTiet = false; // điện thoại: bộ lọc chi tiết gập/mở
  document.getElementById('brand-ic').innerHTML = ICONS.doc;
  ganNutTheme(document.getElementById('btn-theme'));
  ganNutLenDau();

  const $ = s => document.querySelector(s);
  const app = $('#app');
  const SAO_KEY = 'h10_tl_sao';
  let data = null;
  let laFull = false;
  let xemTuUrl = '';
  let daMoXemTuUrl = false;
  let loc = { thuMuc: '', bai: '', loai: '', tk: '', sao: false };
  const tenBaiMap = {};

  function docSao() {
    try { return JSON.parse(localStorage.getItem(SAO_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function batTatSao(fid) {
    const m = docSao();
    if (m[fid]) delete m[fid]; else m[fid] = 1;
    try { localStorage.setItem(SAO_KEY, JSON.stringify(m)); } catch (e) {}
    return !!m[fid];
  }

  getLocation(function (l) {
    laFull = !!(l && l.parameter && l.parameter.full);
    if (l && l.parameter && l.parameter.bai) {
      loc.bai = String(l.parameter.bai);
    }
    if (l && l.parameter && l.parameter.xem) {
      xemTuUrl = String(l.parameter.xem);
    }
    if (data) {
      veTrang();
      thuMoXemTuUrl_();
    }
    veTopLinks();
  });

  function thuMoXemTuUrl_() {
    if (!xemTuUrl || daMoXemTuUrl || !data || !Array.isArray(data.items)) return;
    const it = data.items.find(function (x) { return x.fileId === xemTuUrl; });
    if (it) {
      daMoXemTuUrl = true;
      moXemTaiLieu(it);
    }
  }

  function veTopLinks() {
    const cfg = (data && data.caiDatTrang) || {};
    const opt = { cfg: cfg, webUrl: (data && data.webUrl) || '', laFull: laFull };
    ganThanhDieuHuongHS('tailieu', opt);
    if (!data) return;
    const hm = $('#btn-home');
    if (hm) { const l = linkTrang('home', opt); hm.href = l.href; hm.target = l.target; hm.classList.remove('an'); }
    const lb = $('#btn-lab');
    if (lb) { const l = linkTrang('thinghiem', opt); lb.href = l.href; lb.target = l.target; lb.classList.remove('an'); }
    const gm = $('#btn-game');
    if (gm) { const l = linkTrang('trochoi', opt); gm.href = l.href; gm.target = l.target; gm.classList.remove('an'); }
    const btvn = $('#btn-btvn');
    if (btvn) { const l = linkTrang('btvn', opt); btvn.href = l.href; btvn.target = l.target; btvn.classList.remove('an'); }
    const bf = $('#btn-full');
    if (bf) {
      if (!laGAS || laFull) { bf.classList.add('an'); }
      else {
        bf.classList.remove('an');
        bf.href = data.webUrl + '?page=tailieu&full=1';
        bf.target = '_top';
        bf.innerHTML = ICONS.full + '<span>Toàn màn hình</span>';
      }
    }
  }

  function dinhDangSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',') + ' MB';
  }

  function ngayDep(ms) {
    if (!ms) return '';
    const d = new Date(ms);
    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
  }

  const b64U8 = function (b64) {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  };

  function napPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise(function (ok, loi) {
      const s = document.createElement('script');
      const cdn = 'https://' + 'cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
      s.src = cdn + 'pdf.min.js';
      s.onload = function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = cdn + 'pdf.worker.min.js';
        ok(window.pdfjsLib);
      };
      s.onerror = function () { loi(new Error('Không tải được thư viện xem PDF')); };
      document.head.appendChild(s);
    });
  }

  async function moXemTaiLieu(item) {
    const hop = document.createElement('div');
    hop.className = 'hopdn';
    hop.innerHTML = '<div class="the rong" style="padding:0;display:flex;flex-direction:column;max-height:92vh">' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--vien);position:sticky;top:0;background:var(--the);z-index:2">' +
        '<b style="font-size:15.5px;margin-right:auto;overflow-wrap:anywhere">' + esc(tenDep(item.ten)) + '</b>' +
        '<span class="chip" data-x="meta">Đang mở...</span>' +
        '<div class="hang-nut an" data-x="zoom-box" style="gap:4px">' +
          '<button type="button" class="nut nho" data-x="z-out" title="Thu nhỏ">−</button>' +
          '<button type="button" class="nut nho" data-x="z-txt" title="Đặt về 100%">100%</button>' +
          '<button type="button" class="nut nho" data-x="z-in" title="Phóng to">+</button>' +
        '</div>' +
        '<a class="nut nho" data-x="tai" href="https://drive.google.com/uc?export=download&id=' + esc(item.fileId) + '" target="_blank" rel="noopener">Tải về</a>' +
        '<button type="button" class="nut nho chinh" data-x="dong">Đóng</button>' +
      '</div>' +
      '<div data-x="vung" style="background:var(--nen2);padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;min-height:260px">' +
        '<div class="phu"><span class="cho"></span> Đang chuẩn bị bản xem trước...</div>' +
      '</div></div>';
    document.body.appendChild(hop);

    const dong = function () { hop.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = function (e) { if (e.key === 'Escape') dong(); };
    document.addEventListener('keydown', onEsc);
    hop.onclick = function (e) { if (e.target === hop) dong(); };
    hop.querySelector('[data-x="dong"]').onclick = dong;

    const vung = hop.querySelector('[data-x="vung"]');
    const meta = hop.querySelector('[data-x="meta"]');
    try {
      const f = await api('tlTaiFilePdf', item.fileId);
      if (f.quaLon) {
        meta.textContent = 'File lớn';
        vung.innerHTML = '<div class="thongbao canh">File quá lớn để hiển thị trực tiếp trong trang. Em bấm <b>Mở trên Drive</b> hoặc <b>Tải về</b> nhé.</div>' +
          '<a class="nut chinh" href="' + esc(f.viewUrl) + '" target="_blank" rel="noopener">Mở trên Google Drive</a>';
        return;
      }
      if (f.khongPhaiPdf) {
        meta.textContent = item.loai;
        vung.style.padding = '0';
        vung.innerHTML = '<iframe src="' + esc(f.previewUrl) + '" style="width:100%;height:74vh;border:0;background:#fff" allow="autoplay"></iframe>';
        return;
      }
      const u8 = b64U8(f.base64);
      const taiNut = hop.querySelector('[data-x="tai"]');
      taiNut.removeAttribute('href');
      taiNut.onclick = function (ev) {
        ev.preventDefault();
        const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
        const a = document.createElement('a'); a.href = url; a.download = f.ten || (item.ten + '.pdf');
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      };

      const lib = await napPdfJs();
      const pdf = await lib.getDocument({ data: u8.slice() }).promise;
      vung.innerHTML = '';
      const rongGoc = Math.min(820, Math.max(260, vung.clientWidth - 28));
      let zoomPct = 100;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const daVe = {};

      const trang1 = await pdf.getPage(1);
      const vp1 = trang1.getViewport({ scale: 1 });
      const tiLeCao = vp1.height / vp1.width;

      const veTrangPdf = async function (soTrang, slot) {
        if (daVe[soTrang]) return;
        daVe[soTrang] = true;
        const trang = await pdf.getPage(soTrang);
        const vp0 = trang.getViewport({ scale: 1 });
        const rongRender = Math.round(rongGoc * 1.45);
        const tl = rongRender / vp0.width;
        const vp = trang.getViewport({ scale: tl * dpr });
        const cv = document.createElement('canvas');
        cv.width = vp.width; cv.height = vp.height;
        cv.style.width = '100%';
        cv.style.height = 'auto';
        cv.style.display = 'block';
        slot.innerHTML = '';
        slot.style.minHeight = '0';
        slot.appendChild(cv);
        await trang.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      };

      const obs = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            const p = Number(en.target.getAttribute('data-pdf-p'));
            obs.unobserve(en.target);
            veTrangPdf(p, en.target);
          }
        });
      }, { root: vung, rootMargin: '420px 0px' }) : null;

      for (let i = 1; i <= pdf.numPages; i++) {
        const slot = document.createElement('div');
        slot.setAttribute('data-pdf-p', String(i));
        slot.style.width = rongGoc + 'px';
        slot.style.maxWidth = '100%';
        slot.style.minHeight = Math.round(rongGoc * tiLeCao) + 'px';
        slot.style.background = '#fff';
        slot.style.borderRadius = '6px';
        slot.style.boxShadow = '0 2px 10px rgba(0,0,0,.14)';
        slot.style.display = 'grid';
        slot.style.placeItems = 'center';
        slot.innerHTML = '<span class="phu" style="font-size:12px">Trang ' + i + '/' + pdf.numPages + '</span>';
        vung.appendChild(slot);
        if (i <= 2 || !obs) {
          await veTrangPdf(i, slot);
        } else {
          obs.observe(slot);
        }
      }
      meta.textContent = pdf.numPages + ' trang';

      const zoomBox = hop.querySelector('[data-x="zoom-box"]');
      const zTxt = hop.querySelector('[data-x="z-txt"]');
      const apZoom = function (pct) {
        zoomPct = Math.max(75, Math.min(200, pct));
        if (zTxt) zTxt.textContent = zoomPct + '%';
        const w = Math.round(rongGoc * zoomPct / 100);
        vung.style.alignItems = zoomPct > 100 ? 'flex-start' : 'center';
        vung.querySelectorAll('[data-pdf-p]').forEach(function (sl) {
          sl.style.width = w + 'px';
          sl.style.maxWidth = zoomPct > 100 ? 'none' : '100%';
        });
      };
      if (zoomBox) {
        zoomBox.classList.remove('an');
        hop.querySelector('[data-x="z-in"]').onclick = function () { apZoom(zoomPct + 25); };
        hop.querySelector('[data-x="z-out"]').onclick = function () { apZoom(zoomPct - 25); };
        zTxt.onclick = function () { apZoom(100); };
      }
    } catch (e) {
      meta.textContent = 'Lỗi xem trước';
      vung.innerHTML = '<div class="thongbao loi">' + esc(e.message || e) + '</div>' +
        '<a class="nut chinh" href="' + esc(item.link) + '" target="_blank" rel="noopener">Mở trực tiếp trên Google Drive</a>';
    }
  }

  function hopLocBai(baiItem, chon) {
    if (!chon) return true;
    if (!baiItem) return false;
    if (baiItem === chon) return true;
    if (/^C\d$/.test(chon)) {
      const ch = data.mucLuc.find(c => c.id === chon);
      if (ch && ch.bai.some(b => b.id === baiItem)) return true;
    }
    return false;
  }

  function veTrang() {
    const items = data.items || [];
    const loaiSet = {};
    items.forEach(x => { if (x.loai) loaiSet[x.loai] = true; });
    const loais = Object.keys(loaiSet);
    // Chỉ hiện các buổi/thư mục đang có tài liệu (ẩn thư mục trống trên Drive)
    const demTm = {};
    items.forEach(x => { if (x.thuMuc) demTm[x.thuMuc] = (demTm[x.thuMuc] || 0) + 1; });
    const dsThuMuc = (data.thuMuc || []).filter(tm => demTm[tm.ten]);

    const saoMap = docSao();
    const soSao = items.filter(x => saoMap[x.fileId]).length;
    const tk = loc.tk.trim().toLowerCase();
    const locDs = items.filter(function (x) {
      if (loc.sao && !saoMap[x.fileId]) return false;
      if (loc.thuMuc && x.thuMuc !== loc.thuMuc) return false;
      if (loc.loai && x.loai !== loc.loai) return false;
      if (loc.bai && !hopLocBai(x.bai, loc.bai)) return false;
      if (tk && (x.ten + ' ' + tenDep(x.ten) + ' ' + x.ghiChu + ' ' + x.thuMuc + ' ' + x.loai).toLowerCase().indexOf(tk) < 0) return false;
      return true;
    });

    let h = '<div class="hero-box art-crystal">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">' +
        '<div><span class="chip tim">KHO HỌC LIỆU HÓA 10</span>' +
        '<h1>Tài liệu học tập &amp; Slide bài giảng</h1>' +
        '<p class="phu" style="margin:0">Xem trực tiếp PDF, slide, phiếu bài tập và đề ôn tập theo từng buổi học.</p></div>' +
        '<div class="hang-nut">' +
          '<span class="chip chinh">' + items.length + ' tài liệu</span>' +
          '<button type="button" class="nut nho" id="tl-lam-moi" title="Quét lại thư mục mới nhất từ Google Drive">🔄 Làm mới Drive</button>' +
        '</div>' +
      '</div></div>';

    // Bộ lọc (điện thoại: chỉ hiện ô tìm + nút "Bộ lọc", các ô chọn gập lại)
    const soLocChiTiet = (loc.thuMuc ? 1 : 0) + (loc.bai ? 1 : 0) + (loc.loai ? 1 : 0);
    h += '<section class="the" style="margin-bottom:14px">' +
      '<div class="hang" style="align-items:flex-end">' +
        '<div class="truong" style="flex:2 1 220px"><label for="tl-tk">Tìm kiếm tài liệu</label>' +
          '<div style="display:flex;gap:8px"><input id="tl-tk" type="search" placeholder="Gõ tên bài, phiếu, đề..." value="' + esc(loc.tk) + '" style="flex:1;min-width:0">' +
          '<button type="button" class="nut nho tl-loc-nut' + (moLocChiTiet ? ' chinh' : '') + '" id="tl-loc-nut" aria-expanded="' + moLocChiTiet + '" aria-controls="tl-loc-ct">Bộ lọc' + (soLocChiTiet ? ' (' + soLocChiTiet + ')' : '') + ' ' + (moLocChiTiet ? '▴' : '▾') + '</button></div></div>' +
        '<div class="hang tl-loc-chi-tiet' + (moLocChiTiet ? ' mo' : '') + '" id="tl-loc-ct" style="flex:3 1 520px;align-items:flex-end;margin:0">' +
        '<div class="truong" style="flex:1 1 170px"><label for="tl-tm">Buổi học / Thư mục</label>' +
          '<select id="tl-tm"><option value="">Tất cả (' + dsThuMuc.length + ' buổi)</option>' +
          dsThuMuc.map(tm => '<option value="' + esc(tm.ten) + '"' + (loc.thuMuc === tm.ten ? ' selected' : '') + '>' + esc(tm.ten) + ' · ' + demTm[tm.ten] + '</option>').join('') +
          '</select></div>' +
        '<div class="truong" style="flex:1 1 190px"><label for="tl-bai">Chương / Bài SGK</label>' +
          '<select id="tl-bai"><option value="">Tất cả bài</option>';
    (data.mucLuc || []).forEach(function (c) {
      h += '<option value="' + esc(c.id) + '"' + (loc.bai === c.id ? ' selected' : '') + '>' + esc(c.ten) + '</option>';
      c.bai.forEach(function (b) {
        h += '<option value="' + esc(b.id) + '"' + (loc.bai === b.id ? ' selected' : '') + '>  ↳ ' + esc(b.ten) + '</option>';
      });
    });
    h += '</select></div>' +
        '<div class="truong" style="flex:1 1 160px"><label for="tl-loai">Loại tài liệu</label>' +
          '<select id="tl-loai"><option value="">Tất cả</option>' +
          loais.map(l => '<option value="' + esc(l) + '"' + (loc.loai === l ? ' selected' : '') + '>' + esc(l) + '</option>').join('') +
          '</select></div>' +
        '</div>' +
      '</div>';

    const dangLoc = !!(loc.thuMuc || loc.loai || loc.bai || tk || loc.sao);
    if (dsThuMuc.length || dangLoc || soSao > 0) {
      h += '<div class="chip-scroll" style="margin-top:10px">' +
        '<button type="button" class="nut nho ' + (!loc.thuMuc && !loc.sao ? 'chinh' : '') + '" data-tm="">Tất cả</button>' +
        '<button type="button" class="nut nho ' + (loc.sao ? 'chinh' : '') + '" id="tl-loc-sao">⭐ Đã lưu' + (soSao ? ' (' + soSao + ')' : '') + '</button>' +
        dsThuMuc.map(tm => '<button type="button" class="nut nho ' + (loc.thuMuc === tm.ten && !loc.sao ? 'chinh' : '') + '" data-tm="' + esc(tm.ten) + '">' + esc(tm.ten) + '</button>').join('') +
        (dangLoc ? '<button type="button" class="nut nho xoa" id="tl-xoa-loc">Xóa lọc</button>' : '') +
      '</div>';
    }
    h += '</section>';

    // Danh sách
    if (!locDs.length) {
      h += '<div class="the"><p class="phu" style="margin:0;text-align:center">' +
        (loc.sao ? 'Em chưa đánh dấu ⭐ tài liệu nào. Bấm nút ☆ trên thẻ tài liệu để lưu nhanh các file hay xem nhé!' : 'Không tìm thấy tài liệu phù hợp bộ lọc. Bấm chọn "Tất cả" để xem lại toàn bộ nhé.') +
      '</p></div>';
    } else {
      h += '<div class="nhan-muc">Tìm thấy ' + locDs.length + ' tài liệu</div>';
      const hienKhungGhim = !loc.thuMuc;
      const dsGhim = hienKhungGhim ? locDs.filter(function (x) { return !!x.ghim; }) : [];
      const dsThuong = hienKhungGhim ? locDs.filter(function (x) { return !x.ghim; }) : locDs;

      if (dsGhim.length) {
        h += '<section class="the" style="margin-bottom:16px;border-color:rgba(158,30,76,.35)">' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
            '<b style="font-size:15.5px;color:var(--do)">📌 Tài liệu trọng tâm được Thầy ghim</b>' +
            '<span class="chip chinh">' + dsGhim.length + ' tài liệu</span>' +
          '</div><div class="tl-grid">';
        dsGhim.forEach(veTheTL);
        h += '</div></section>';
      }

      // Gom theo buổi/thư mục (danh sách đã được backend sắp Buổi mới → cũ)
      const nhom = [];
      const viTri = {};
      dsThuong.forEach(function (x) {
        const k = x.thuMuc || 'Chung';
        if (viTri[k] === undefined) { viTri[k] = nhom.length; nhom.push({ ten: k, ds: [] }); }
        nhom[viTri[k]].ds.push(x);
      });
      nhom.forEach(function (g) {
        const mTen = String(g.ten).match(/^(.*?)\s*\(([^)]+)\)\s*$/);
        const tieuDe = mTen ? mTen[1] : g.ten;
        const ngayBuoi = mTen ? mTen[2] : '';
        h += '<section class="tl-buoi"><div class="tl-buoi-head"><h2>' + esc(tieuDe) + '</h2>' +
          (ngayBuoi ? '<span class="chip tim">' + esc(ngayBuoi) + '</span>' : '') +
          '<span class="phu">' + g.ds.length + ' tài liệu</span></div><div class="tl-grid">';
        g.ds.forEach(veTheTL);
        h += '</div></section>';
      });
    }

    function veTheTL(x) {
        const tenHien = tenDep(x.ten);
        const daSao = !!saoMap[x.fileId];
        const badgeTen = x.dinhDang === 'pdf' ? 'PDF' : (x.dinhDang === 'ppt' ? 'SLIDE' : (x.dinhDang === 'doc' ? 'WORD' : 'FILE'));
        const baiTen = x.bai ? (tenBaiMap[x.bai] || (x.bai === 'MD' ? 'Mở đầu' : (/^C\d$/.test(x.bai) ? 'Chương ' + x.bai.slice(1) : 'Bài ' + x.bai))) : '';
        h += '<div class="tl-card ' + esc(x.dinhDang) + (x.ghim ? ' ghim' : '') + '">' +
          '<div class="tl-body">' +
          '<div class="tl-ic ' + esc(x.dinhDang) + '" aria-hidden="true">' + badgeTen + '</div>' +
          '<div style="min-width:0;flex:1">' +
            '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px">' +
              (x.ghim ? '<span class="chip chinh">📌 Ghim</span>' : '') +
              '<span class="chip">' + esc(x.loai) + '</span>' +
              (baiTen ? '<span class="chip ok">' + esc(baiTen) + '</span>' : '') +
              (x.ghim && x.thuMuc ? '<span class="chip tim">' + esc(x.thuMuc) + '</span>' : '') +
            '</div>' +
            '<div style="font-weight:700;font-size:15px;overflow-wrap:anywhere" title="' + esc(x.ten) + '">' + esc(tenHien) + '</div>' +
            (tenHien !== x.ten ? '<div class="tl-goc" title="Tên file gốc trên Drive">' + esc(x.ten) + '</div>' : '') +
            (x.ghiChu ? '<div class="phu" style="font-size:13px;margin-top:4px">' + md(x.ghiChu) + '</div>' : '') +
            '<div class="phu" style="font-size:12px;margin-top:5px">' + [dinhDangSize(x.size), x.ngay ? 'Cập nhật ' + ngayDep(x.ngay) : ''].filter(Boolean).join(' · ') + '</div>' +
          '</div>' +
          '<button type="button" class="nut-sao' + (daSao ? ' on' : '') + '" data-sao="' + esc(x.fileId) + '" title="' + (daSao ? 'Bỏ lưu tài liệu này' : 'Đánh dấu ⭐ lưu tài liệu hay xem') + '" aria-label="Lưu tài liệu">' + (daSao ? '★' : '☆') + '</button>' +
          '</div>' +
          '<div class="hang-nut tl-act">' +
            '<button type="button" class="nut nho chinh" data-xem="' + esc(x.fileId) + '">Xem ngay</button>' +
            '<a class="nut nho" href="https://drive.google.com/uc?export=download&id=' + esc(x.fileId) + '" target="_blank" rel="noopener">Tải về</a>' +
          '</div>' +
        '</div>';
    }

    h += '<div id="slogan-slot"></div>';
    app.innerHTML = h;
    renderSlogan(document.getElementById('slogan-slot'));

    $('#tl-tk').oninput = function () { loc.tk = this.value; veTrang(); $('#tl-tk').focus(); const l = $('#tl-tk').value.length; $('#tl-tk').setSelectionRange(l, l); };
    $('#tl-tm').onchange = function () { loc.thuMuc = this.value; veTrang(); };
    $('#tl-bai').onchange = function () { loc.bai = this.value; veTrang(); };
    $('#tl-loai').onchange = function () { loc.loai = this.value; veTrang(); };
    const ls = $('#tl-loc-sao'); if (ls) ls.onclick = function () { loc.sao = !loc.sao; veTrang(); };
    const xl = $('#tl-xoa-loc'); if (xl) xl.onclick = function () { loc = { thuMuc: '', bai: '', loai: '', tk: '', sao: false }; veTrang(); };
    const ln = $('#tl-loc-nut'); if (ln) ln.onclick = function () { moLocChiTiet = !moLocChiTiet; veTrang(); };
    const lm = $('#tl-lam-moi');
    if (lm) lm.onclick = function () {
      lm.disabled = true; lm.textContent = 'Đang quét Drive...';
      api('tlKhoiDong', true).then(function (r) {
        data = r;
        veTopLinks();
        veTrang();
        toast('Đã cập nhật danh sách thư mục & tài liệu mới nhất từ Drive.');
      }).catch(function (e) { lm.disabled = false; lm.textContent = '🔄 Làm mới Drive'; toast(e.message, true); });
    };
    app.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => { loc.sao = false; loc.thuMuc = b.getAttribute('data-tm'); veTrang(); });
    app.querySelectorAll('[data-sao]').forEach(b => b.onclick = () => {
      const bat = batTatSao(b.getAttribute('data-sao'));
      toast(bat ? 'Đã lưu vào mục ⭐ Đã lưu!' : 'Đã bỏ đánh dấu ⭐');
      veTrang();
    });
    app.querySelectorAll('[data-xem]').forEach(b => b.onclick = () => {
      const fid = b.getAttribute('data-xem');
      const item = (data.items || []).find(x => x.fileId === fid);
      if (item) moXemTaiLieu(item);
    });
  }

  function napDuLieuTL(r) {
    data = r;
    (r.mucLuc || []).forEach(c => {
      tenBaiMap[c.id] = c.ten;
      c.bai.forEach(b => { tenBaiMap[b.id] = b.ten; });
    });
    veTopLinks();
    veTrang();
    thuMoXemTuUrl_();
  }

  ganThanhDieuHuongHS('tailieu', {});
  const cachedTL = docCacheUI('tailieu');
  if (cachedTL) {
    napDuLieuTL(cachedTL);
  } else {
    app.innerHTML = '<div class="phu" style="margin:6px 2px 10px"><span class="cho"></span> Đang tải kho tài liệu...</div>' + skelCards(4);
  }

  api('tlKhoiDong').then(function (r) {
    ghiCacheUI('tailieu', r);
    napDuLieuTL(r);
  }).catch(function (e) {
    if (cachedTL) return;
    if (!laGAS) { data = { caiDatTrang: {}, webUrl: '' }; veTopLinks(); }
    toast(e.message, true);
    app.innerHTML = '<div class="thongbao loi">' + esc(e.message) + '</div><button class="nut chinh" type="button" onclick="location.reload()">Tải lại</button>';
  });
})();
</script>
</body>
</html>
