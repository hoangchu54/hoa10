<script src="assets/h10.js?v=f65a9f6233"></script>
<script>
(function () {
  const { esc, md, api, getLocation, linkTrang, skelCards, ICONS, ganNutTheme, renderSlogan, renderGalleryHoa10, ganThanhDieuHuongHS, docCacheUI, ghiCacheUI, ganBungCoVu, veMascot, kichHoatMascot, tenDep } = window.H10;
  const CHUONG_POSTERS = [
    { id: 'C1', so: 'Chương 1', ten: 'Cấu tạo nguyên tử', sub: 'Bài 1 – 4 · Hạt nhân & Orbital', ic: '⚛️', cls: 'ch-c1' },
    { id: 'C2', so: 'Chương 2', ten: 'Bảng tuần hoàn', sub: 'Bài 5 – 9 · Chu kì & Quy luật', ic: '🧭', cls: 'ch-c2' },
    { id: 'C3', so: 'Chương 3', ten: 'Liên kết hóa học', sub: 'Bài 10 – 14 · Ion, CHT & Hydrogen', ic: '🔗', cls: 'ch-c3' },
    { id: 'C4', so: 'Chương 4', ten: 'Phản ứng Oxi hóa – Khử', sub: 'Bài 15 – 16 · Số oxi hóa & Cân bằng e', ic: '⚡', cls: 'ch-c4' },
    { id: 'C5', so: 'Chương 5', ten: 'Năng lượng hóa học', sub: 'Bài 17 – 18 · Enthalpy ΔrH°298', ic: '🔥', cls: 'ch-c5' },
    { id: 'C6', so: 'Chương 6', ten: 'Tốc độ phản ứng', sub: 'Bài 19 – 20 · Các yếu tố ảnh hưởng', ic: '⏱️', cls: 'ch-c6' },
    { id: 'C7', so: 'Chương 7', ten: 'Nguyên tố nhóm Halogen', sub: 'Bài 21 – 23 · F₂, Cl₂, Br₂, I₂ & HX', ic: '🧪', cls: 'ch-c7' }
  ];
  const FLASHCARDS = [
    { cd: 'Chương 1 · Cấu hình e', q: 'Vì sao cấu hình electron của Cr (Z = 24) là [Ar] 3d^{5} 4s^{1} chứ không phải 3d^{4} 4s^{2}?', a: 'Do hiệu ứng bán bão hòa phân lớp 3d^{5} bền vững hơn nên 1 electron từ 4s chuyển sang 3d (tương tự Cu Z = 29 là [Ar] 3d^{10} 4s^{1} bão hòa).' },
    { cd: 'Chương 2 · Bảng tuần hoàn', q: 'Trong một chu kì (từ trái sang phải), bán kính nguyên tử và độ âm điện biến đổi thế nào?', a: 'Điện tích hạt nhân tăng nhưng số lớp e không đổi → lực hút tăng → Bán kính nguyên tử GIẢM dần và Độ âm điện TĂNG dần.' },
    { cd: 'Chương 3 · Liên kết Hydrogen', q: 'Vì sao H2O có nhiệt độ sôi (100 °C) cao vượt trội so với H2S (-60 °C) dù cùng nhóm VIA?', a: 'Vì giữa các phân tử H2O có liên kết hydrogen liên phân tử bền vững (do O có độ âm điện lớn 3,44), còn H2S không tạo được liên kết hydrogen.' },
    { cd: 'Chương 4 · Oxi hóa – Khử', q: 'Mẹo nhớ nhanh vai trò Chất khử và Chất oxi hóa trong 3 giây?', a: '“Khử cho – O nhận”: Chất khử là chất NHƯỜNG electron (số oxi hóa TĂNG sau phản ứng); Chất oxi hóa là chất NHẬN electron (số oxi hóa GIẢM).' },
    { cd: 'Chương 5 · Enthalpy', q: 'Phản ứng có Δ_{r}H°_{298} = -890 kJ là phản ứng tỏa nhiệt hay thu nhiệt?', a: 'Δ_{r}H°_{298} < 0 (dấu âm) là phản ứng TỎA NHIỆT (hệ giải phóng nhiệt ra môi trường làm bình nóng lên; thường diễn ra thuận lợi).' },
    { cd: 'Chương 6 · Tốc độ phản ứng', q: 'Khi tăng nhiệt độ thêm 20 °C với hệ số nhiệt độ γ = 3 thì tốc độ phản ứng tăng bao nhiêu lần?', a: 'Áp dụng công thức Van’t Hoff: v2 / v1 = γ^{(T2 - T1)/10} = 3^{20/10} = 3^{2} = 9 lần.' },
    { cd: 'Chương 7 · Nhóm Halogen', q: 'Dung dịch acid nào không thể chứa trong bình thủy tinh vì ăn mòn được SiO2?', a: 'Dung dịch Hydrofluoric acid (HF), do xảy ra phản ứng: SiO2 + 4HF -> SiF4↑ + 2H2O (dùng để khắc chữ lên thủy tinh).' },
    { cd: 'Chương 7 · Muối Halide', q: 'Dùng thuốc thử nào để nhận biết nhanh 4 dung dịch NaF, NaCl, NaBr, NaI?', a: 'Dùng dung dịch AgNO3: NaF không kết tủa; NaCl tạo AgCl↓ trắng; NaBr tạo AgBr↓ vàng nhạt; NaI tạo AgI↓ vàng đậm.' }
  ];
  const THU = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  function hanNgan(ms) {
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + THU[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
  }
  function conLai(ms) {
    const gio = Math.max(0, Math.round((ms - Date.now()) / 3600e3));
    return gio < 24 ? { txt: 'Còn ' + Math.max(1, gio) + ' giờ', gap: true } : { txt: 'Còn ' + Math.round(gio / 24) + ' ngày', gap: false };
  }
  document.getElementById('brand-ic').innerHTML = ICONS.binh;
  ganNutTheme(document.getElementById('btn-theme'));

  const app = document.getElementById('app');
  app.innerHTML = skelCards(2);

  let laFull = false;
  getLocation(function (l) { laFull = !!(l && l.parameter && l.parameter.full); });

  const SVG_BINH_LINH_VAT =
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
      '<circle cx="52" cy="48" r="5" fill="#FFD166" opacity=".75"/>' +
      '<circle cx="148" cy="42" r="4" fill="#A78BFA" opacity=".8"/>' +
      '<circle cx="158" cy="70" r="3" fill="#8FE3FF" opacity=".8"/>' +
      '<g class="hm-hop">' +
        '<path class="hm-armL" d="M62 120 L28 92" stroke="#fff" stroke-width="9" stroke-linecap="round"/>' +
        '<path class="hm-armR" d="M138 120 L172 92" stroke="#fff" stroke-width="9" stroke-linecap="round"/>' +
        '<path d="M84 40v42l-42 72a12 12 0 0 0 10 18h96a12 12 0 0 0 10-18l-42-72V40" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>' +
        '<path class="hm-liq" d="M63 120h74l25 40a8 8 0 0 1-7 12H45a8 8 0 0 1-7-12z" fill="#FF5A7A"/>' +
        '<rect x="78" y="32" width="44" height="12" rx="5" fill="#FFD166"/>' +
        '<circle cx="86" cy="140" r="5" fill="#2A0716"/><circle cx="114" cy="140" r="5" fill="#2A0716"/>' +
        '<circle cx="88" cy="138" r="1.6" fill="#fff"/><circle cx="116" cy="138" r="1.6" fill="#fff"/>' +
        '<path d="M90 152 Q100 162 110 152" stroke="#2A0716" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
        '<circle cx="76" cy="150" r="5" fill="#FF9FB2" opacity=".8"/><circle cx="124" cy="150" r="5" fill="#FF9FB2" opacity=".8"/>' +
      '</g>' +
    '</svg>';

  const SVG_NGUYEN_TU =
    '<svg viewBox="0 0 200 200" aria-hidden="true">' +
      '<g transform="translate(100 100)">' +
        '<g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>' +
          '<g><ellipse rx="72" ry="24" fill="none" stroke="#FFD0DA" stroke-width="4"/><circle r="6" fill="#FFD0DA"><animateMotion dur="2.2s" repeatCount="indefinite" path="M72,0 A72,24 0 1,1 -72,0 A72,24 0 1,1 72,0"/></circle></g>' +
          '<g transform="rotate(60)"><ellipse rx="72" ry="24" fill="none" stroke="#C7A6FF" stroke-width="4"/><circle r="6" fill="#C7A6FF"><animateMotion dur="2.8s" repeatCount="indefinite" path="M72,0 A72,24 0 1,1 -72,0 A72,24 0 1,1 72,0"/></circle></g>' +
          '<g transform="rotate(120)"><ellipse rx="72" ry="24" fill="none" stroke="#8FE3FF" stroke-width="4"/><circle r="6" fill="#8FE3FF"><animateMotion dur="3.4s" repeatCount="indefinite" path="M72,0 A72,24 0 1,1 -72,0 A72,24 0 1,1 72,0"/></circle></g>' +
        '</g>' +
        '<circle r="15" fill="#FFD166"><animate attributeName="r" values="13;17;13" dur="1.8s" repeatCount="indefinite"/></circle>' +
      '</g>' +
    '</svg>';

  function veHome(r) {
    const cfg = r.caiDatTrang || {};
    document.getElementById('site-title').textContent = 'Hóa học 10 · Thầy Hoàng';

    const opt = { cfg: cfg, webUrl: r.webUrl, laFull: laFull };
    ganThanhDieuHuongHS('home', opt);
    const lBtvn = linkTrang('btvn', opt);
    const lTailieu = linkTrang('tailieu', opt);
    const lGame = linkTrang('trochoi', opt);
    const lLab = linkTrang('thinghiem', opt);
    const lAdmin = linkTrang('admin', opt);
    [
      ['btn-btvn', lBtvn],
      ['btn-tailieu', lTailieu],
      ['btn-lab', lLab],
      ['btn-game', lGame]
    ].forEach(function (cap) {
      const el = document.getElementById(cap[0]);
      if (el) { el.href = cap[1].href; el.target = cap[1].target; el.classList.remove('an'); }
    });

    let h = '<div class="hero-mascot" id="hero-mascot" title="Chạm vào Thầy Hoàng để đổi câu nhắc &amp; nhận cổ vũ!">' +
      '<div class="hm-side l">' + veMascot({ cls: 'hm-mascot-img', alt: 'Thầy Hoàng CaFe Hóa 10' }) + '</div>' +
      '<div class="hm-mid">' +
        '<div class="hm-kicker"><span class="hm-star">✦ </span>KẾT NỐI TRI THỨC · HÓA HỌC 10<span class="hm-star"> ✦</span></div>' +
        '<h1>' + esc(cfg.tieuDeTrang || 'Học tốt – Thi tốt – Hóa thật giỏi!') + '</h1>' +
        '<p class="hm-sub">' + esc(cfg.phuDeTrang || 'Cố lên nào! Cùng Thầy Hoàng chinh phục Hóa 10') + '</p>' +
        '<div class="hm-quote" id="hm-quote-txt"><b>☕ CaFe Hóa 10:</b> <span>Ca (Z=20) + Fe (Z=26) = CaFe nạp năng lượng học Hóa!</span></div>' +
        '<div class="hm-tags">' +
          '<span class="hm-hint">✨ Chạm vào thầy để đổi mẹo Hóa 10</span>' +
          '<span class="hm-hint">⚗️ 7 Chương · 23 Bài SGK</span>' +
        '</div>' +
      '</div>' +
      '<div class="hm-side r">' + SVG_NGUYEN_TU + '</div>' +
    '</div>';

    if (cfg.thongBao) {
      h += '<div class="thongbao info" style="margin:0 0 14px">' + ICONS.tt + '<div><b>📢 Thông báo từ Thầy Hoàng:</b><div style="margin-top:2px">' + md(cfg.thongBao) + '</div></div></div>';
    }

    h += '<div class="hub-grid">' +
      '<a class="hub-card" href="' + esc(lBtvn.href) + '" target="' + lBtvn.target + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<div class="hub-ic do">' + ICONS.binh + '</div>' +
          '<span class="chip chinh">' + (r.soDeDangMo ? r.soDeDangMo + ' đề đang mở' : 'Luyện tập') + '</span>' +
        '</div>' +
        '<b style="font-size:17px">Bài tập về nhà</b>' +
        '<span class="phu" style="font-size:13px">Làm bài trắc nghiệm, đúng/sai, trả lời ngắn, tự luyện câu sai &amp; xem tiến bộ.</span>' +
        '<span class="hub-go" style="color:var(--do)">Vào làm bài →</span>' +
      '</a>' +

      '<a class="hub-card" href="' + esc(lTailieu.href) + '" target="' + lTailieu.target + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<div class="hub-ic tim">' + ICONS.doc + '</div>' +
          '<span class="chip tim">' + (r.soTaiLieu != null ? r.soTaiLieu + ' tài liệu' : 'Slide · Phiếu · Đề') + '</span>' +
        '</div>' +
        '<b style="font-size:17px">Kho tài liệu Hóa 10</b>' +
        '<span class="phu" style="font-size:13px">Slide bài giảng, phiếu bài tập, đề ôn tập và đáp án chi tiết theo từng buổi.</span>' +
        '<span class="hub-go" style="color:var(--tim)">Mở kho tài liệu →</span>' +
      '</a>' +

      '<a class="hub-card" href="' + esc(lGame.href) + '" target="' + lGame.target + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<div class="hub-ic xanh">' + ICONS.game + '</div>' +
          '<span class="chip ok">3 Game Hóa 10</span>' +
        '</div>' +
        '<b style="font-size:17px">Trò chơi Hóa 10</b>' +
        '<span class="phu" style="font-size:13px">Flappy Hóa học, Xây tháp 118 nguyên tố &amp; Đấu trường Danh pháp 60s.</span>' +
        '<span class="hub-go" style="color:var(--ok)">Vào trò chơi →</span>' +
      '</a>' +

      '<a class="hub-card" href="' + esc(lLab.href) + '" target="' + lLab.target + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<div class="hub-ic sky">' + ICONS.lab + '</div>' +
          '<span class="chip sky">Theo bài SGK</span>' +
        '</div>' +
        '<b style="font-size:17px">Thí nghiệm mô phỏng</b>' +
        '<span class="phu" style="font-size:13px">Phòng thí nghiệm ảo theo từng bài SGK &amp; 10 kho mô phỏng Hóa học hay.</span>' +
        '<span class="hub-go" style="color:var(--sky)">Mở thí nghiệm ảo →</span>' +
      '</a>' +
    '</div>';

    // Bảng tin: đề đang mở + tài liệu mới nhất (deep-link thẳng vào đề / file cụ thể)
    const deMo = Array.isArray(r.deMo) ? r.deMo : [];
    const tlMoi = Array.isArray(r.taiLieuMoi) ? r.taiLieuMoi : [];
    if (r._tam) {
      // Lần đầu (chưa có cache): giữ chỗ bảng tin trong lúc chờ API, phần còn lại của trang đã hiện ngay
      h += '<div class="home-news">' + skelCards(2) + '</div>';
    } else if (deMo.length || tlMoi.length) {
      h += '<div class="home-news">';
      h += '<section class="the" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<h2 class="tieu-khoi" style="margin:0">📝 Đề đang mở</h2>' +
          '<a class="hub-go" style="color:var(--do);margin:0" href="' + esc(lBtvn.href) + '" target="' + lBtvn.target + '">Tất cả →</a></div>';
      if (deMo.length) {
        h += '<div class="news-list">' + deMo.map(function (d) {
          const cl = conLai(d.han);
          const lDe = d.id ? linkTrang('btvn', { cfg: cfg, webUrl: r.webUrl, laFull: laFull, query: '?de=' + encodeURIComponent(d.id) }) : lBtvn;
          return '<a class="news-item" href="' + esc(lDe.href) + '" target="' + lDe.target + '">' +
            '<div class="hub-ic do" style="width:34px;height:34px;border-radius:10px">' + ICONS.binh + '</div>' +
            '<div style="min-width:0;flex:1"><b>' + esc(d.ten) + '</b><span class="phu">' + (d.soCau ? d.soCau + ' câu · ' : '') + 'Hạn ' + hanNgan(d.han) + '</span></div>' +
            '<span class="news-han' + (cl.gap ? ' gap' : '') + '">' + cl.txt + '</span></a>';
        }).join('') + '</div>';
      } else {
        h += '<p class="phu" style="margin:10px 0 0;font-size:13px">Hiện chưa có đề nào đang mở. Em vào luyện lại đề cũ nhé!</p>';
      }
      h += '</section>';
      h += '<section class="the" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<h2 class="tieu-khoi" style="margin:0">📚 Tài liệu mới</h2>' +
          '<a class="hub-go" style="color:var(--tim);margin:0" href="' + esc(lTailieu.href) + '" target="' + lTailieu.target + '">Kho tài liệu →</a></div>';
      if (tlMoi.length) {
        h += '<div class="news-list">' + tlMoi.map(function (x) {
          const dd = x.dinhDang === 'pdf' ? 'PDF' : (x.dinhDang === 'ppt' ? 'SLIDE' : (x.dinhDang === 'doc' ? 'WORD' : 'FILE'));
          const lFile = x.fileId ? linkTrang('tailieu', { cfg: cfg, webUrl: r.webUrl, laFull: laFull, query: '?xem=' + encodeURIComponent(x.fileId) }) : lTailieu;
          return '<a class="news-item" href="' + esc(lFile.href) + '" target="' + lFile.target + '" title="' + esc(x.ten) + '">' +
            '<div class="tl-ic ' + esc(x.dinhDang) + '" aria-hidden="true">' + dd + '</div>' +
            '<div style="min-width:0;flex:1"><b>' + esc(tenDep(x.ten)) + '</b><span class="phu">' + esc([x.loai, x.thuMuc].filter(Boolean).join(' · ')) + '</span></div></a>';
        }).join('') + '</div>';
      } else {
        h += '<p class="phu" style="margin:10px 0 0;font-size:13px">Chưa có tài liệu nào.</p>';
      }
      h += '</section></div>';
    }

    // Dải Poster 7 Chương SGK Hóa 10 + Flashcard Lật 3D
    h += '<div class="sec-head">' +
      '<h2>🗺️ Khám phá 7 Chương Hóa học 10</h2>' +
      '<span class="phu">Bấm vào chương để mở thẳng học liệu của chương đó</span>' +
    '</div><div class="ch-strip">';
    CHUONG_POSTERS.forEach(function (c) {
      const lCh = linkTrang('tailieu', { cfg: cfg, webUrl: r.webUrl, laFull: laFull, query: '?bai=' + c.id });
      h += '<a class="ch-card ' + c.cls + '" href="' + esc(lCh.href) + '" target="' + lCh.target + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center"><span class="ch-num">' + esc(c.so) + '</span><span class="ch-ic" aria-hidden="true">' + c.ic + '</span></div>' +
        '<b>' + esc(c.ten) + '</b>' +
        '<span class="ch-sub">' + esc(c.sub) + ' →</span>' +
      '</a>';
    });
    h += '</div>';

    // Flashcard lật 3D
    h += '<div id="fc-slot" style="margin-top:16px"></div>';
    // Gallery Sắc màu Hóa học 10
    h += '<div id="gallery-slot"></div>';

    h += '<div id="slogan-slot"></div>';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px">' +
      '<span class="phu" style="font-size:12px">💡 Mẹo: Bấm <b>🧮 Casio</b> (hoặc Alt+P trên máy tính) để mở nhanh Casio Hóa học, Danh pháp IUPAC &amp; Công thức.</span>' +
      '<a class="top-pill" href="' + esc(lAdmin.href) + '" target="' + lAdmin.target + '" rel="noopener">Khu vực giáo viên →</a>' +
    '</div>';

    app.innerHTML = h;
    ganBungCoVu(document.getElementById('hero-mascot'));
    kichHoatMascot(app);
    renderGalleryHoa10(document.getElementById('gallery-slot'));
    renderSlogan(document.getElementById('slogan-slot'));

    // Khởi tạo Flashcard 3D
    (function () {
      const slot = document.getElementById('fc-slot');
      if (!slot) return;
      let fIdx = Math.floor(Math.random() * FLASHCARDS.length);
      let daLat = false;
      function veFC() {
        const f = FLASHCARDS[fIdx];
        slot.innerHTML = '<div class="fc-wrap"><div class="fc-box' + (daLat ? ' lat' : '') + '" id="fc-card" role="button" tabindex="0" aria-expanded="' + daLat + '">' +
          '<div class="fc-top">' +
            '<span class="chip tim">⚡ Flashcard 10 giây · ' + esc(f.cd) + '</span>' +
            '<span class="chip ' + (daLat ? 'ok' : 'chinh') + '">' + (daLat ? '✓ Đáp án & Bản chất' : '👆 Chạm để lật xem đáp án') + '</span>' +
          '</div>' +
          '<div class="fc-q">❓ ' + md(f.q) + '</div>' +
          '<div class="fc-a">💡 ' + md(f.a) + '</div>' +
          '<div class="fc-foot">' +
            '<span>Thẻ ' + (fIdx + 1) + '/' + FLASHCARDS.length + ' · Ôn nhanh kiến thức trọng tâm</span>' +
            '<button type="button" class="nut nho" id="fc-next">Câu tiếp theo ↻</button>' +
          '</div>' +
        '</div></div>';
        const card = document.getElementById('fc-card');
        const next = document.getElementById('fc-next');
        if (card) card.onclick = function (e) {
          if (e.target && e.target.id === 'fc-next') return;
          daLat = !daLat;
          veFC();
        };
        if (next) next.onclick = function (e) {
          e.stopPropagation();
          fIdx = (fIdx + 1) % FLASHCARDS.length;
          daLat = false;
          veFC();
        };
      }
      veFC();
    })();
  }

  // Hiển thị tức thì 0ms từ cache nếu đã có, hoặc vẽ khung mặc định ngay lập tức
  ganThanhDieuHuongHS('home', {});
  const cachedHome = docCacheUI('home');
  // Có cache → vẽ bản cũ ngay; chưa có → vẽ ngay phần cố định (hero, 4 thẻ, 7 chương, flashcard), chỉ bảng tin chờ API
  veHome(cachedHome || { _tam: true, webUrl: window.H10.GAS_EXEC_URL });

  api('homeKhoiDong').then(function (r) {
    ghiCacheUI('home', r);
    veHome(r);
  }).catch(function (e) {
    if (cachedHome) return;
    const tin = app.querySelector('.home-news');
    const loi = '<div class="thongbao loi" style="grid-column:1/-1">Chưa tải được đề &amp; tài liệu mới: ' + esc(e.message) + '</div>';
    if (tin) tin.innerHTML = loi; else app.insertAdjacentHTML('afterbegin', loi);
  });
})();
</script>
</body>
</html>
